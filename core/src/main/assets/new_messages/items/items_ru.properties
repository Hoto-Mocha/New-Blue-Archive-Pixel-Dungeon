items.quest.darkgold.desc=Цианит для некоторых является действительно ценным ресурсом, но, по крайней мере, на данный момент он, похоже, бесполезен.

items.artifacts.masterthievesarmband.desc_cursed=Проклятый браслет привязан к вашему запястью, и, похоже, он медленно, но верно уменьшает ваш кредитный баланс тем или иным способом...

items.spells.alchemize.desc=Это заклинание обладает преобразующей силой, подобной той, что содержится в Алхимическом котле. Каждый раз, когда используется заклинание, пользователь может преобразовать один предмет (или несколько одинаковых предметов) в кредиты или алхимическую энергию.\n\nАлхимические заклинания можно приобрести в магазинах или изготовить с помощью алхимии. Несколько алхимических заклинаний можно создать, используя Арканный катализатор, который изготавливается путем смешивания случайного свитка с рунным камнем или семенем.

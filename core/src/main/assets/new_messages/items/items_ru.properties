items.armor.mikaarmor.name=미카의 드레스
items.armor.mikaarmor.desc=미카의 드레스입니다. 이 드레스를 입은 미카는 _특별한 능력_을 사용할 수 있게 됩니다.

items.armor.mariarmor.name=마리의 수녀복

items.artifacts.scrunchie.name=헤어슈슈
items.artifacts.scrunchie.desc=나기사가 미카에게 선물해 준 소중한 헤어밴드. 헤어밴드를 보고 있으면 알 수 없는 힘이 생겨나 벽을 파괴하거나 적을 강하게 타격하고 밀쳐낼 수 있게 된다.
items.artifacts.scrunchie.ac_use=사용한다
items.artifacts.scrunchie.cursed=저주받은 헤어슈슈를 사용할 수 없다.
items.artifacts.scrunchie.no_charge=헤어슈슈의 에너지가 다 떨어졌다.
items.artifacts.scrunchie.invalid_target=그 대상은 선택할 수 없다.
items.artifacts.scrunchie.not_adjacent=근접한 위치만 선택할 수 있다.
items.artifacts.scrunchie.cannot_break=이 벽은 부술 수 없을 것 같다.
items.artifacts.scrunchie.prompt=사용할 위치를 선택하세요
items.artifacts.scrunchie.levelup=헤어슈슈가 더 강해졌다!

items.food.rollcake.name=롤케이크
items.food.rollcake.desc=미카가 디저트로 가져온 매우 부드럽고 달콤한 초코 롤케이크. 빠르게 먹을 수 있으며 먹으면 약간의 허기와 체력을 회복할 수 있다. 던지면 먹을 수 없게 되니 주의.

items.quest.escapecrystal.leaving_kit=_이 총기에 부착된 컨버전 키트가 거울에 묶여 당신과 같이 돌아갈 수 없을 것 같습니다._ 총기에 부착된 컨버전 키트는 제거될 것입니다. 이는 총기의 강화 수치를 1만큼 낮추지만, 부여된 마법은 제거되지 않습니다.

items.quest.escapecrystal.name=탈출용 무전기
items.quest.escapecrystal.ac_use=사용한다
items.quest.escapecrystal.prompt=아이템을 선택하세요
items.quest.escapecrystal.desc=아키라에게 연락할 수 있는 무전기입니다. 사용하면 언제든 금고를 나갈 수 있지만, 일찍 나가면 모든 보상을 받지 못합니다!
items.quest.escapecrystal.discover_hint=이 아이템은 특정한 퀘스트에서 등장합니다.
items.quest.escapecrystal.injure_warning_1=무전기에서 아키라의 목소리가 들립니다:\n\n"저기, 꽤나 다치신 것 같은데, 괜찮으신가요? 조각상이 갖고 싶긴 하지만... 그래도 무리하진 마세요."
items.quest.escapecrystal.injure_warning_2="곤란한 상황에 처하면 _처음 방에 있던 순간이동 아이템_을 사용해도 돼요. 거기로 되돌아가서 다시 시도해도 된답니다."
items.quest.escapecrystal.injure_warning_3="정말로 위험하다면, _제가 드린 탈출용 무전기를 사용하세요._ 금방 구출해 드릴게요. 약속드린 보상을 전부 드릴 순 없지만, 그 안에서 쓰러지는 것보단 당신의 안전이 우선이니까요."
items.quest.escapecrystal.leaving_start=무전기에서 아키라의 목소리가 들립니다:\n\n"으음, 불안하신 건 알겠는데, 그래도 첫 방은 나가 주세요."\n\n"맡겨 두신 장비는 걱정하지 마세요. 제가 비록 예술품을 훔치는 사람이지만, 사람의 신뢰까지 저버리지는 않거든요. 돌아올 때까지 기다리고 있을게요. 그리고 진짜 위험한 상황에서 사용하는 건 뭐라 하지 않겠습니다."
items.quest.escapecrystal.leaving_early=무전기에서 아키라의 목소리가 들립니다:\n\n"벌써 탈출하신다고요...? 거기서 벌써 곤란한 일이 생긴 건가요?"\n\n"저기, 정 급한 상황이면 탈출시켜 드리겠지만, 거기서 뭘 가져올 생각은 마세요. 꽤나 실망스럽네요..."
items.quest.escapecrystal.leaving_partly_explored=무전기에서 아키라의 목소리가 들립니다:\n\n"벌써 떠나야 하나요? 음... 거길 정리해 주신 것만 해도 감사하긴 해요."\n\n"그래도, 약간 실망스럽긴 하네요. 물론 당신이 필요하다면야 탈출시켜드리겠지만, 물약이나 주문서 정도만 가져 오도록 해요."
items.quest.escapecrystal.leaving_fully_explored=무전기에서 아키라의 목소리가 들립니다:\n\n"떠나야 하나요? 그래도 많이 탐험하긴 했네요. 당신이 조각상 훔치기에 좀 더 재능이 있을 거라고 믿었는데. 그래도 이제 금고가 어떻게 돌아가는지는 더 알게 되었으니까요."\n\n"거기 있는 물건 가져오는 건 되지만, 강화된 건 안 됩니다!"
items.quest.escapecrystal.leaving_partial_victory=무전기에서 아키라의 목소리가 들립니다:\n\n"당신이 조각상을 획득하길 바랐지만, 그래도 금고 대부분을 청소하고 탐색까지 해 주신 건 훌륭하다 생각해요."\n\n"음, +1 보다 많이 강화되지 않은 것에 한해서 아이템 하나는 당신이 가져도 돼요. 그리고 전 저 밑으로 내려가서 상점을 차려 둘게요. 어차피 다음 계획을 세우는 데 시간이 좀 필요하거든요."
items.quest.escapecrystal.leaving_victory=무전기에서 아키라의 목소리가 들립니다:\n\n"훌륭해요! 떠날 준비 되셨나요? 당신이 돌아올 때 조각상은 제가 챙기겠습니다."\n\n"약속한 대로 전 저 아래쪽에 가서 상점을 차려 둘게요. 그리고 거기 있는 물건들 중 뭐든지 하나 가지고 나오게 해 드리죠! 나머지 물건들은 금고에 두고 나오게 될 겁니다."
items.quest.escapecrystal.leaving_item=갖고 오고 싶은 물건이 그게 확실한가요?

items.artifacts.crossnecklace.name=십자가 목걸이
items.artifacts.crossnecklace.ac_cast=시전
items.artifacts.crossnecklace.no_spell=지금은 기적을 시전할 수 없다.
items.artifacts.crossnecklace.cursed=당신은 저주받은 십자가 목걸이를 사용할 수 없다.
items.artifacts.crossnecklace.levelup=당신의 십자가 목걸이가 더욱 강해졌다!
items.artifacts.crossnecklace.desc=마리는 십자가 목걸이를 매개로 기적을 시전할 수 있습니다. 십자가 목걸이를 사용하면 여러 가지 기적을 시전할 수 있습니다.\n\n마리가 십자가 목걸이를 사용할수록 더욱 강력해집니다. 최대 충전 수가 증가하며 충전 속도가 더 빨라집니다.

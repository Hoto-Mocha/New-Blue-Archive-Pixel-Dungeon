items.brokenseal.name=Эмблема тысячелетия
items.brokenseal.ac_affix=Прикрепите эмблему
items.brokenseal.prompt=Пожалуйста, выберите школьную форму, которую нужно прикрепить.
items.brokenseal.unknown_armor=Для начала нужно проверить, не проклята ли школьная форма.
items.brokenseal.cursed_armor=Эмблему невозможно прикрепить к проклятой школьной форме.
items.brokenseal.affix=Я прикрепил эмблему к школьной форме!
items.brokenseal.desc=Это драгоценная эмблема Тысячелетия Арис.\n\nЭта эмблема, сокровище Арис, повышает её выносливость. Прикрепив эмблему, вы получаете дополнительный щит, пропорциональный качеству униформы, в дополнение к вашему максимальному запасу здоровья.\n\nЭту эмблему можно прикрепить к униформе и перенести на несколько униформ. Кроме того, её можно улучшить один раз, и броня с прикрепленной улучшенной эмблемой получает 1 уровень улучшения.
items.brokenseal.choose_title=Выберите иероглиф
items.brokenseal.choose_desc=Иероглифы написаны как на форме, так и на эмблеме. Пожалуйста, выберите иероглифы, которые вы хотите сохранить.\n\nЕсли вы сохраните иероглифы, присвоенные форме, эти иероглифы не будут перенесены при последующем перемещении эмблемы.
items.brokenseal$warriorshield.name=Барьер Ариса
items.brokenseal$warriorshield.desc_active=Эмблема Тысячелетия Ариса повышает выносливость, предоставляя дополнительный щит в дополнение к текущему запасу здоровья. После истощения щита наступает время перезарядки.\n\nЭтот щит не исчезает постепенно, а пропадает через несколько ходов, если поблизости нет врагов. Неиспользованные щиты сокращают время перезарядки до 50%%.\n\nОставшийся щит: %1$d.\n\nТекущее время перезарядки: %2$d.
items.brokenseal$warriorshield.desc_cooldown=Вы недавно получили щит от Эмблемы Тысячелетия и должны подождать, прежде чем использовать его снова.\n\nОсталось ходов: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Время восстановления щита Ариса теперь стало отрицательным, и при активации щита время восстановления уменьшается на эту величину. Время восстановления щита может быть уменьшено до -150 ходов; в этом случае следующий щит будет готов сразу после активации.\n\nТекущее время восстановления: %d.

items.tengusmask.name=Тактическая подготовка BD
items.tengusmask.ac_use=Использовать
items.tengusmask.used=Срок действия тренировочного BD-файла тактики, передавшего вам все EX-способности, подошел к концу.
items.tengusmask.desc=Этот диск содержит данные, способные передавать пользователю более мощные способности.\n\nИспользование этого диска передаёт ученику огромную силу, позволяя ему выбрать EX-способность.\n\nКакую EX-способность вы бы хотели выбрать?

items.quest.darkgold.name=Сине-зеленый камень
items.quest.darkgold.you_now_have=У меня сейчас%d есть собачий синий пироксен.
items.quest.darkgold.desc=Цианит для некоторых является действительно ценным ресурсом, но, по крайней мере, на данный момент он, похоже, бесполезен.

items.artifacts.masterthievesarmband.desc_cursed=Проклятый браслет привязан к вашему запястью, и, похоже, он медленно, но верно уменьшает ваш кредитный баланс тем или иным способом...

items.spells.alchemize.desc=Это заклинание обладает преобразующей силой, подобной той, что содержится в Алхимическом котле. Каждый раз, когда используется заклинание, пользователь может преобразовать один предмет (или несколько одинаковых предметов) в кредиты или алхимическую энергию.\n\nАлхимические заклинания можно приобрести в магазинах или изготовить с помощью алхимии. Несколько алхимических заклинаний можно создать, используя Арканный катализатор, который изготавливается путем смешивания случайного свитка с рунным камнем или семенем.
items.spells.alchemize$wndalchemizeitem.sell=%dКонвертировать в кредит
items.spells.alchemize$wndalchemizeitem.sell_1=Конвертировать %dодин в кредит
items.spells.alchemize$wndalchemizeitem.sell_all=Конвертировать %d все в кредит


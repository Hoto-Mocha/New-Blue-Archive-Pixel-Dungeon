items.heap.remains=Студенческое бюро находок
items.heap.remains_desc=Вещи, оставленные студентом, ранее покинувшим это подземелье. Кажется, стоит поискать, нет ли там чего-нибудь полезного.

###gun items
items.gunsmithingtool.name=Инструменты для модификации оружия
items.gunsmithingtool.desc=Это набор инструментов, позволяющих модифицировать огнестрельное оружие различными способами. Они исчезают после однократного использования, но вы можете выполнять разнообразные модификации, используя несколько наборов инструментов.
items.gunsmithingtool.inv_title=Выберите оружие, которое хотите модифицировать.
items.gunsmithingtool.ac_use=Использовать
items.gunsmithingtool.mod_select=Выберите, что нужно изменить в оружии.
items.gunsmithingtool.cancel=Отмена
items.gunsmithingtool.barrel=Модификация ствола
items.gunsmithingtool$wndmod.normal_barrel=Удаление модификации ствола
items.gunsmithingtool$wndmod.short_barrel=Короткий ствол
items.gunsmithingtool$wndmod.long_barrel=Длинный ствол
items.gunsmithingtool.barrel_desc=Модификации ствола — это изменения, которые регулируют точность стрельбы путем изменения длины ствола.\n\nКороткий ствол:\n- Точность на дальних дистанциях · x0.5\n- Точность на ближних дистанциях · x1.5\nДлинный ствол:\n\n- Точность на дальних дистанциях · x1.25\n- Точность на ближних дистанциях · x0.75
items.gunsmithingtool.magazine=Модификация магазина
items.gunsmithingtool$wndmod.normal_magazine=Удаление модификации магазина
items.gunsmithingtool$wndmod.large_magazine=Магазин большой емкости
items.gunsmithingtool$wndmod.quick_magazine=Магазин для быстрой стрельбы
items.gunsmithingtool.magazine_desc=Модификации магазина — это изменения, которые регулируют максимальную вместимость и время перезарядки за счет изменения размера магазина.\n\nМагазин большой емкости:\n- Максимальная вместимость 1,5 патрона\n- Время перезарядки +1 ход\n\nМагазин для быстрой перезарядки:\n- Максимальная вместимость 0,5 патрона\n- Время перезарядки -1 ход
items.gunsmithingtool.bullet=Модификация пули
items.gunsmithingtool$wndmod.normal_bullet=Удалить модификацию пули
items.gunsmithingtool$wndmod.hp_bullet=Полые пули
items.gunsmithingtool$wndmod.ap_bullet=Бронебойные пули
items.gunsmithingtool.bullet_desc=Модификация боеприпасов — это модификация, которая изменяет урон и бронепробиваемость пули за счет изменения типа используемых боеприпасов.\n\nБронезные патроны:\n- Урон от пули 0,85-\n Бронепробиваемость 0\n\nПолые патроны:\n- Урон от пули 1,3\n- Бронепробиваемость 2
items.gunsmithingtool.weight=Изменение веса
items.gunsmithingtool$wndmod.normal_weight=Отмена корректировки веса
items.gunsmithingtool$wndmod.light_weight=Облегчение веса
items.gunsmithingtool$wndmod.heavy_weight=Увеличение веса
items.gunsmithingtool.weight_desc=Модификации веса — это изменения, которые корректируют уровень оружия, полностью меняя его характеристики.\n\nЛегкий вес: -1 уровень\n\nВес: +1 уровень
items.gunsmithingtool.attach=Изменение вложения
items.gunsmithingtool$wndmod.normal_attach=Снятие креплений
items.gunsmithingtool$wndmod.laser_attach=Лазерный прицел
items.gunsmithingtool$wndmod.flash_attach=Фонарик
items.gunsmithingtool.attach_desc=Модификации — это приспособления, которые позволяют устанавливать оптические прицелы на огнестрельное оружие для получения особых эффектов.\n\nЛазерный прицел:\n- Точность попадания 1,25*\n- Шанс обнаружения +1\n\nФонарик:\n- При попадании, 50%-10%*(расстояние до цели)_ шанс кратковременного ослепления противника\n- Шанс обнаружения +2
items.gunsmithingtool.enchant=Магическая модификация
items.gunsmithingtool$wndmod.normal_enchant=Удалить магические модификации
items.gunsmithingtool$wndmod.amp_enchant=Волшебное усиление
items.gunsmithingtool$wndmod.sup_enchant=Магическое подавление
items.gunsmithingtool.enchant_desc=_Магическая модификация_ — это модификация, изменяющая механизм применения магии в огнестрельном оружии для регулирования _урона_ пули_ и _магических характеристик_, применяемых к пуле.\n\n_Усиление магии_:\n- Урон от пули _x0.85_\n- Магические характеристики _x2_\n\n_Подавление магии_:\n- Урон от пули _x1.1_\n- Магические характеристики _x0.5_

items.weapon.melee.gun.gun.ondeath=Вас отбросило в сторону, и вы погибли при взрыве...
items.weapon.melee.gun.gun.ac_shoot=Огонь
items.weapon.melee.gun.gun.ac_reload=Нагрузка
items.weapon.melee.gun.gun.ability_name=Быстрая загрузка
items.weapon.melee.gun.gun.ability_desc=Дуэлянты, владеющие огнестрельным оружием, могут использовать «Быструю перезарядку». Эта способность мгновенно перезаряжает экипированное оружие, не расходуя ходы или боеприпасы, и если используется, когда текущий запас боеприпасов в оружии больше или равен максимальному, она перезаряжает вдвое больше максимального количества боеприпасов. Эта способность стоит 2 заряда.
items.weapon.melee.gun.gun.overloaded=Я уже зарядил дополнительный магазин.
items.weapon.melee.gun.gun.not_equipped=Для использования огнестрельного оружия необходимо быть им экипированным.
items.weapon.melee.gun.gun.switched=%sОно было оборудовано.
items.weapon.melee.gun.gun.already_loaded=Все боеприпасы уже заряжены.
items.weapon.melee.gun.gun.reload=Вы зарядили пистолет.
items.weapon.melee.gun.gun.gun_desc=Этот пистолет выпускает _%1$s_ пуль за выстрел, и каждая пуля наносит _%2$s_-_%3$s_ урона.\nВ данный момент заряжено _%4$s_/_%5$s_ пуль. Если пули израсходованы, перезарядка займет _%6$s_ ходов.
items.weapon.melee.gun.gun.gun_typical_desc=Этот пистолет выпускает _%1$s_ пуль за выстрел, и каждая пуля обычно наносит _%2$s_-_%3$s_ урона.\nВ данный момент заряжено _%4$s_/_%5$s_ пуль. Если пули использованы, вы можете перезарядить оружие, потратив _%6$s_ ходов.
items.weapon.melee.gun.gun.modded_start=В настоящее время это оружие _
items.weapon.melee.gun.gun.modded_end=Он был изменен.
items.weapon.melee.gun.gun.inscribed=Гравированная пуля
items.weapon.melee.gun.gun.overheat=Ствол перегрелся и не может быть использован для стрельбы.
items.weapon.melee.gun.gun.overheat_reload=Ствол перегрелся и не подлежит перезарядке.
items.weapon.melee.gun.gun.detach_kit=Комплект для переоборудования был снят с оружия.
items.weapon.melee.gun.gun.kit_attached=Оружие оснащено комплектом для переоборудования, увеличивающим максимальную емкость магазина на 1 патрон и сокращающим время перезарядки на 1 оборот.
items.weapon.melee.gun.gun.ac_detach=Извлечь комплект


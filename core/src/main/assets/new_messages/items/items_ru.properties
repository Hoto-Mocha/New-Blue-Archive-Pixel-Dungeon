items.scrolls.exotic.scrolloftalentreset.name=Сброс атрибутов прокрутки
items.scrolls.exotic.scrolloftalentreset.desc=В тот момент, когда вы прочтете эту книгу заклинаний, она активизирует вашу память и обнулит все полученные вами очки характеристик.
items.scrolls.exotic.scrolloftalentreset.reset=Ваши очки характеристик сброшены!

items.weapon.melee.supernova.name=Меч Света: Сверхновая
items.weapon.melee.supernova.desc=Огромная рельсовая пушка, переданная Арису из инженерного отдела.\n\nИз-за её огромного веса и мощности обычному студенту трудно даже её нести.\n\nКогда Арис стреляет из этой сверхмощной рельсовой пушки, она наносит _%1$d-%2$d_ урона всем целям в зоне поражения.
items.weapon.melee.supernova.ac_shoot=Коллапс равновесия
items.weapon.melee.supernova$supernovacooldown.name=Зарядка: анализ баланса
items.weapon.melee.supernova$supernovacooldown.desc=Зарядка навыка! Не волнуйтесь, скоро всё будет готово.\n\nОсталось ходов: _%s_.

items.rings.ringofsharpshooting.stats=При надевании этого кольца урон от вашего огнестрельного и метательного оружия увеличивается, как если бы оно было улучшено с помощью _%1$d_, а также повышается его прочность на _%2$s%%_.
items.rings.ringofsharpshooting.typical_stats=При надевании этого кольца урон от вашего огнестрельного и метательного оружия, как если бы вы улучшили его на _%1$d_, увеличивается, а также повышается его прочность на _%2$s%%_.
items.rings.ringofsharpshooting.combined_stats=Эффекты установленных колец в совокупности повышают характеристики вашего огнестрельного и метательного оружия на _+%1$d_ и прочность на _%2$s%%_.
items.rings.ringofsharpshooting.upgrade_stat_name_1=Увеличение уровня урона от огнестрельного и метательного оружия


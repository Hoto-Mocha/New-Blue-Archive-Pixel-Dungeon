items.armor.armor.ac_detach=Удалите эмблему
items.armor.armor.detach_seal=의상에서 엠블럼을 떼어냈다.
items.armor.armor.equip_cursed=의상이 당신을 고통스럽게 옥죄입니다.
items.armor.armor.identify=당신은 현재 입고 있는 의상이 무엇인지 알 만큼 충분히 익숙해졌습니다.
items.armor.armor.incompatible=서로 다른 마법의 상호 작용으로 인해 이 의상에 적힌 상형 문자가 사라졌다!
items.armor.armor.curr_absorb=이 _%1$d티어_ 의상은 _피해를 %2$d-%3$d까지 흡수_할 수 있으며 제대로 다루기 위해 _%4$d 이상의 힘_이 필요합니다.
items.armor.armor.avg_absorb=보통 이 _%1$d티어_ 의상은 _피해를 %2$d-%3$d까지 흡수_할 수 있으며 제대로 다루기 위해 _%4$d 이상의 힘_이 필요합니다.
items.armor.armor.too_heavy=이 의상을 입기 위한 힘이 부족하기 때문에 당신의 이동 속도, 회피 능력, 그리고 방어력이 저하될 것입니다.
items.armor.armor.probably_too_heavy=아마도 이 의상은 당신에게 너무 무거울 것입니다.
items.armor.armor.excess_str=힘이 더 강한 덕분에, 이 의상을 입었을 때 _추가 회피_를 얻습니다.
items.armor.armor.evasion=이 의상의 _회피_를 증강했습니다.
items.armor.armor.defense=이 의상의 _방어력_을 증강했습니다.
items.armor.armor.inscribed=_%s_ выгравировано.
items.armor.armor.glyph_hardened=이 의상은 _경화_되었습니다.
items.armor.armor.hardened_no_glyph=이 의상은 _경화_된 상태지만, 현재 상형문자가 부여되어 있지는 않습니다.
items.armor.armor.cursed_worn=이 의상은 저주받았기 때문에, 당신은 이 의상을 벗을 수 없습니다.
items.armor.armor.cursed=당신은 악의로 가득 찬 마법이 이 의상에 깃든 것을 느낍니다.
items.armor.armor.weak_cursed=Несмотря на проклятие, вам удалось снять доспехи.
items.armor.armor.not_cursed=이 의상에는 악의적인 마법이 없습니다.
items.armor.armor.seal_attached=밀레니엄 엠블럼이 이 의상에 붙어 있으며, 아리스의 체력이 절반 이하로 떨어질 시 _%d의 방어막_을 제공합니다.
items.armor.armor.seal_transfer=밀레니엄 엠블럼은 현재 착용 중인 의상에 붙어 있어야만 효과를 발휘합니다. 의상을 교체할 때 자동으로 엠블럼을 바꿔 다시겠습니까?

items.armor.armor.hardened_no_glyph=Эта школьная форма находится в _затвердевшем_ состоянии, но в настоящее время на ней не изображены никакие иероглифы.
items.armor.armor.cursed_worn=Эта школьная форма проклята, и вы не сможете её снять.
items.armor.armor.cursed=Вы чувствуете, что в этой школьной форме пустила корни магия, полная злобы.
items.armor.armor.weak_cursed=Несмотря на проклятие, вам удалось снять доспехи.

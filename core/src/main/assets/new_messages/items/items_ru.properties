items.active.console.continueconsole.desc=При использовании эта функция открывает экран управления активной консоли и исчезает.
items.active.console.continueconsole.ac_use=Использовать
items.active.console.fighterconsole.name=Консоль истребителя
items.active.console.fighterconsole.desc=Если вы его используете, вы получите 10 жетонов для консоли бойца и откроете экран управления консолью бойца.
items.active.console.fighterconsole.ac_use=Использовать
items.active.console.fantasyconsole.name=Фантастическая консоль
items.active.console.fantasyconsole.desc=Если вы его используете, вы получите 10 жетонов Fantasy Console и откроете экран управления Fantasy Console.

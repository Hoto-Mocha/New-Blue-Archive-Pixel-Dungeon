items.weapon.melee.quick.assassinskunai.name=Кунай-убийца
items.weapon.melee.quick.assassinskunai.desc=Кунай Изуны, способный наносить высокий урон, пропорциональный максимальному здоровью противника, незаметно приближаясь к нему и устраивая засаду на его жизненно важные точки. Его можно использовать для атаки врагов, даже не имея при себе экипировки. _Победа над врагом внезапной атакой с использованием куная убийцы восстанавливает определённое количество заряда плаща ниндзя._\n\nСильные враги будут сопротивляться дополнительному урону при засаде.

items.artifacts.ninjacape.name=Плащ ниндзя
items.artifacts.ninjacape.ac_stealth=Скрытность
items.artifacts.ninjacape.cooldown=Для перезарядки плаща ниндзя потребуется еще несколько %dходов.
items.artifacts.ninjacape.cursed=Вы не можете использовать проклятый плащ.
items.artifacts.ninjacape.no_charge=Плащ ниндзя нельзя использовать, потому что он ещё не полностью заряжен.
items.artifacts.ninjacape.desc=Плащ, используемый Изуной для идеальной маскировки во время выполнения заданий ниндзя. Изуна может моргнуть на небольшое расстояние, прежде чем стать невидимой, а также может стать невидимой без моргания, если использует плащ в нужном ей месте.\n\nПлащ ниндзя имеет медленную скорость зарядки, но победа над врагом с помощью куная убийства может быстро восстановить заряд плаща.\n\nПлащ усиливается по мере расхода зарядов, и по мере усиления плаща увеличивается максимальный заряд и скорость зарядки.
items.artifacts.ninjacape.prompt=Выберите место мигания
items.artifacts.ninjacape.discover_hint=Один конкретный ученик начинает с этого предмета.
items.artifacts.ninjacape$capestealth.no_charge=Энергия плаща иссякла.
items.artifacts.ninjacape$capestealth.levelup=Плащ стал ещё прочнее!
items.artifacts.ninjacape$capestealth.name=Скрытность
items.artifacts.ninjacape$capestealth.desc=Когда Изуна надевает плащ ниндзя, она становится невидимой. Эффект невидимости длится до тех пор, пока он не будет прерван или пока не закончится энергия плаща.\n\nВ невидимом состоянии враги не могут преследовать вас или атаковать. Однако физические атаки или магические эффекты (например, волшебные палочки или свитки заклинаний) немедленно прерывают невидимость.\n\nКоличество ходов до исчерпания энергии:%d
items.artifacts.ninjacape$foxdoll.name=Кукла лисы
items.artifacts.ninjacape$foxdoll.desc=Мягкая игрушка ручной работы, сделанная Изуной. Похоже, враги думают, что это настоящая Изуна!
items.artifacts.ninjacape$foxdoll.discover_hint=Этот персонаж появляется в результате применения определённой EX-способности.


items.item.rankings_desc=%sПавший
items.weapon.weapon$enchantment.rankings_desc=Побежден с помощью магии оружия.
items.weapon.enchantments.vampiric.elestrike_desc=Заклинание «Высвобождение стихий», наполненное магией вампиризма, восстанавливает 2,5 единицы здоровья ученику за каждого врага в пределах досягаемости.
items.weapon.enchantments.blocking.elestrike_desc=Зачарование «Высвобождение стихий» на защиту даёт ученику 6 дополнительных щитов за каждого врага в пределах досягаемости.
items.weapon.curses.sacrificial.elestrike_desc=Применение заклинания «Высвобождение стихий» в сочетании с «Проклятием жертвоприношения» наносит 12 единиц кровотечения всем врагам и ученикам в пределах досягаемости.
items.trinkets.vialofblood.typical_stats_desc=Как правило, этот аксессуар увеличивает общее количество восстанавливаемого здоровья при употреблении лечебных зелий, кожаных кувшинов и колодцев восстановления на _%1$s%%_. Однако эффект восстановления действует медленнее, восстанавливая максимум _%2$s_ здоровья за ход. (Максимальное восстановление здоровья за ход пропорционально уровню ученика.)
items.trinkets.vialofblood.stats_desc=Этот аксессуар увеличивает общее количество HP, которое вы получаете при употреблении лечебных зелий, кожаных кувшинов и колодцев восстановления, на _%1$s%%_ на вашем текущем уровне улучшения. Однако эти восстановительные эффекты действуют медленнее, восстанавливая максимум _%2$s_ HP за ход. (Максимальное восстановление HP за ход пропорционально уровню ученика.)
items.trinkets.ratskull.typical_stats_desc=Как правило, этот амулет увеличивает частоту появления редких врагов вдвое_ %d, но на появление Кристальных Мимиков и Статуй в школьной форме он оказывает лишь половину своего эффекта.
items.trinkets.ratskull.stats_desc=Этот аксессуар заставляет редких врагов _%d появляться вдвое чаще, чем при текущих уровнях улучшения, но оказывает лишь половинное воздействие на появление Кристальных Мимиков и Статуй в школьной форме.
items.stones.stoneofenchantment.armor=Твоя школьная форма сияла в темноте!
items.stones.stoneofaugmentation.desc=Этот рунный камень улучшает снаряжение, усиливая один параметр и ослабляя другой.\n\nЕго можно использовать на оружии для повышения скорости или силы атаки. Кроме того, для метательного оружия прочность увеличивается или уменьшается пропорционально скорости атаки.\n\nЕго можно использовать на униформе для повышения уклонения или защиты.
items.scrolls.exotic.scrollofmetamorphosis.desc=Этот свиток содержит мощное заклинание трансформации, которое применяется к заклинателю, а не к предмету. Магия этого свитка позволяет вам изменить одну из выбранных вами характеристик на одну из пяти характеристик того же уровня для другого класса!\n\nЭтот эффект можно использовать только для изменения характеристик класса; он не может изменять второстепенные характеристики класса или характеристики единообразия. Кроме того, характеристики, которые вы не можете использовать, не будут предоставлены.
items.scrolls.exotic.scrollofenchantment.armor=Выбор иероглифов для нанесения на школьную форму
items.scrolls.exotic.scrollofenchantment.desc=Этот свиток заклинания позволяет вложить мощную магическую энергию в оружие или униформу. Он также позволяет заклинателю в некоторой степени определять, какую именно магию он хочет наделить.
items.scrolls.exotic.scrollofantimagic.desc=Магия этого свитка окружает вас магической аурой, которая на короткое время блокирует все полезные или вредные магические эффекты. Она предотвращает активацию эффектов от магических жезлов, свитков, колец, реликвий, магии оружия и проклятий. Однако способность Ученика достаточно сильна, чтобы игнорировать этот эффект, поэтому его всё ещё можно использовать.
items.rings.ringofenergy.stats=Ношение этого кольца увеличивает скорость зарядки волшебной палочки, артефакта и школьной формы владельца на _%s%%_.
items.rings.ringofenergy.typical_stats=Обычно ношение этого кольца увеличивает скорость зарядки волшебных палочек, реликвий и школьной формы на _%s%%_.
items.potions.exotic.potionofmastery.armor_easier=Школьную форму носить проще!
items.bombs.bomb.rankings_desc=Потерял сознание от взрыва
items.artifacts.driedrose$wndghosthero.armor_prompt=Пожалуйста, выберите школьную форму, которую нужно прикрепить.
items.armor.roguearmor.name=Студенческая одежда
items.armor.clericarmor.name=Церемониальная форма студента
items.armor.clericarmor.desc=Священник, одетый в этот обтянутый тканью латный доспех, может использовать особые способности.
items.armor.classarmor.no_ability=На данный момент ваша школьная форма не обладает никакими способностями. Выберите одну!
items.armor.classarmor.not_equipped=Чтобы активировать способность этой формы, вы должны сначала её надеть!
items.armor.classarmor.low_charge=Недостаточно заряда для активации особой способности школьной формы!
items.armor.classarmor.transfer_complete=Студенческие доспехи передаются из поколения в поколение!
items.armor.classarmor.discover_hint=Этот предмет появляется после победы над боссом на 20-м этаже, если вы используете определённого ученика.
items.armor.glyphs.viscosity$defereddamage.ondeath=Обрушение произошло из-за отложенного повреждения...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Обрушение произошло из-за отложенного повреждения.
items.armor.glyphs.stone.desc=Этот глиф окружает форму тяжелыми магическими камнями, делая уклонение невозможным, но уменьшая получаемый урон пропорционально уклонению.
items.armor.glyphs.antimagic.desc=Эта форма, пронизанная мощными глифами, защищает владельца как от физических, так и от магических атак. Магическая защита не зависит от уровня формы.
items.armor.curses.overgrowth.desc=Форма Overgrowth покрыта различными цветущими растениями. Хотя этот эффект выглядит интересно, он никак не помогает в защите, и эти растения активируются случайным образом в бою!
items.armor.curses.multiplicity.desc=Школьная форма, проклятая Проклятием Множественности, зачарована очень опасным заклинанием копирования. Создавая зеркальное отражение владельца, она иногда копирует и нападающего!
items.armor.curses.corrosion.desc=Коррозионная среда может лопнуть, выпустив едкую жидкость, и покрыть пораженный участок липкой кислой слизью.
items.armor.curses.bulk.desc=Неуклюжая форма больше и внушительнее, но на самом деле она не повышает уровень защиты. Напротив, увеличенный объем доспехов затрудняет проход через дверные проемы.

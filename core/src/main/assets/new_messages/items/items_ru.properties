items.teleporter.ac_test=Тест
items.teleporter.desc=*Это тестовый образец.*\n\nЭто странное устройство, способное перемещаться вверх и вниз по этажам или призывать врагов.\n\nТестовая кнопка используется во время разработки и может измениться без истории обновлений.
items.teleporter.getitem_title=Создание предмета
items.teleporter.help_title=Помощь
items.teleporter.help_desc=Синтаксис создания предмета состоит из 4 строк.\n\n- 1-я строка: _точное название_ целевого предмета. В качестве примера вводится "Свиток оценки".\n- 2-я строка: _количество_ целевого предмета. Эта строка может содержать только числа, но возникнут проблемы, если в ней будут символы, отличные от текста по умолчанию. Если количество не указано или если предмет нельзя сложить в стопку, оно будет установлено на _1_.\n- 3-я строка: _уровень улучшения_ целевого предмета. Эта строка может содержать только числа, но возникнут проблемы, если в ней будут символы, отличные от текста по умолчанию. Если уровень улучшения не указан или если предмет нельзя улучшить, он будет установлен на _0_.\n- 4-я строка: _статус оценки_. Если вы хотите оценить предмет, введите _true_ после текста по умолчанию или без какого-либо другого текста. В противном случае все будет считаться не оцененным.\n\nПример:\nРезультат оценки "Униформа номерного знака"\n0\n5\nистина\n\nРезультат: Вы получаете "Униформа номерного знака" +5.
items.teleporter.list_title=Список элементов, которые можно создать
items.teleporter.getitem_desc=Напишите, какой предмет вы хотите получить!\nВведите _help_, чтобы увидеть руководство по написанию.\nВведите _list_, чтобы увидеть список предметов, которые вы можете создать.

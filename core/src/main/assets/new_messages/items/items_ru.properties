items.scrolls.emptyscroll.name=Бланк заказа
items.scrolls.emptyscroll.desc=Это чистый лист бумаги, на котором ничего не написано. Если вы посмотрите на имеющийся у вас свиток заклинаний и скопируете его содержимое, вы получите ту же силу, что и у этого свитка.\n\nПохоже, что этот лист бумаги не может воспроизвести мощную силу Свитка усиления или Таинственного свитка.
items.scrolls.emptyscroll.inv_title=Пожалуйста, выберите бланк заказа для копирования.

items.active.trashbin.name=Устройство нарушения
items.active.trashbin.desc=Это мусорный бак, настолько органично вписывающийся в окружающую среду, что никто не догадается, кто внутри, войдя внутрь.\n\nПри использовании он снимает эффект слежения со всех врагов, отслеживающих Мию, заставляя их переместиться в другое место.\n\nЕсли Мию всё ещё находится в поле зрения врагов, её могут снова обнаружить те враги, с которых был снят эффект слежения.\n\nПосле использования действует 20-ходовая перезарядка.
items.active.trashbin.ac_use=Использовать
items.active.trashbin$trashbincooldown.name=Перезарядка: Разрушитель
items.active.trashbin$trashbincooldown.desc=Необходимо время, пока устройство отключения не сможет быть использовано снова.\n\nОсталось оборотов:%s .
items.active.trashbin$evasionbuff.name=Туманность
items.active.trashbin$evasionbuff.desc=...В данный момент я нахожусь в режиме невидимости, поэтому даже если враг нападёт на меня, он не сможет меня поразить\n.\nВам гарантировано уклонение от атак в течение следующего _%sхода_, но эффект исчезнет после того, как вы совершите одно уклонение.

items.food.hardtack.name=Сухарь
items.food.hardtack.desc=Это сухой крекер на основе муки. Крекер можно съесть быстро, и во время еды вы перегруппируете своё снаряжение, чтобы мгновенно перезарядить экипированное оружие и зарядить 4 дополнительных патрона. Эффекты не активируются при перезарядке.


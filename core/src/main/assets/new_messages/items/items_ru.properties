items.armor.armor.curr_absorb=Эта форма _%1$dуровня_ способна выдерживать урон до%2$d -%3$dи требует _больше, чем _ для надлежащего использования _%4$dсилы.
items.armor.armor.avg_absorb=Как правило, этот униформа _%1$dуровня_ может поглощать _урон_ до %2$d-%3$d и требует _или более высокой мощности_%4$d для надлежащего использования.
items.armor.armor.too_heavy=Ваша скорость передвижения, способность к уклонению и защита будут снижены, поскольку вам не хватит сил носить эту форму.
items.armor.armor.probably_too_heavy=Эта школьная форма, вероятно, будет для вас слишком тяжелой.
items.armor.armor.excess_str=Благодаря повышенной силе, вы получаете _дополнительное уклонение_ при ношении этой формы.

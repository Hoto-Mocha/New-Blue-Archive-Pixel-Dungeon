items.conversionkit.name=Комплект для переоборудования
items.conversionkit.desc=Деталь, которую Ной прикрепляет к огнестрельному оружию. Просто прикрепив её к оружию, вы можете легко модифицировать его, улучшив его характеристики.\n\nКомплекты для модернизации можно прикреплять к огнестрельному оружию и переносить на несколько видов оружия. Если вы улучшаете оружие, когда к нему прикреплен комплект для модернизации, вы можете улучшить его до одного раза, и оружие с улучшенным комплектом получает дополнительное значение улучшения в 1 единицу.
items.conversionkit.unknown_gun=Сначала нужно проверить, не проклято ли это оружие.
items.conversionkit.cursed_gun=Комплект для переоборудования нельзя установить на проклятое оружие.
items.conversionkit.affix=Я установил на пистолет комплект для переоборудования!
items.conversionkit.prompt=Выберите оружие для прикрепления.
items.conversionkit.ac_affix=Прикреплять

items.weapon.melee.gun.ar.ar_t1.name=AR 1- го уровня
items.weapon.melee.gun.ar.ar_t1.desc=Дополненная реальность с уровнем производительности 1. Обладает лишь базовыми функциями.
items.weapon.melee.gun.ar.ar_t2.name=AR 2-го уровня
items.weapon.melee.gun.ar.ar_t2.desc=Дополненная реальность AR с характеристиками 2-го уровня. Производительность слабая, но не плохая.
items.weapon.melee.gun.ar.ar_t3.name=AR 3-го уровня
items.weapon.melee.gun.ar.ar_t3.desc=Дополненная графика AR с 3-ступенчатой ​​регулировкой. Обладает неплохими характеристиками.
items.weapon.melee.gun.ar.ar_t4.name=AR 4-го уровня
items.weapon.melee.gun.ar.ar_t4.desc=Уровень производительности AR 4 высокая производительность.
items.weapon.melee.gun.ar.ar_t5.name=AR 5-го уровня
items.weapon.melee.gun.ar.ar_t5.desc=Дополненная реальность с 5-м уровнем производительности. Обладает потрясающей производительностью.
items.weapon.melee.gun.ar.uniqueidea.name=Уникальная идея
items.weapon.melee.gun.ar.uniqueidea.desc=Винтовка, которой пользуется Момои.\n\nК ней прикреплен аксессуар, который она получила от своей любимой младшей сестры, и, кажется, всякий раз, когда она прикасается к ней в беде, ей внезапно приходит в голову блестящая идея.
items.weapon.melee.gun.ar.uniqueidea.stats_desc=Это оружие обладает очень низким начальным уроном, но очень высокой эффективностью усиления.
items.weapon.melee.gun.ar.uniqueidea.discover_hint=Это оружие можно получить с помощью алхимии, используя _AR_.
items.weapon.melee.gun.ar.tacticaltherapy.name=Тактическая терапия
items.weapon.melee.gun.ar.tacticaltherapy.desc=Спецназная штурмовая винтовка Серины.\n\nНажатие на курок не приводит к выстрелу из шприца.
items.weapon.melee.gun.ar.tacticaltherapy.stats_desc=Это оружие лишь незначительно лечит союзников, а не наносит им урон при попадании.
items.weapon.melee.gun.ar.tacticaltherapy.discover_hint=Это оружие можно получить с помощью алхимии, используя _AR_.

items.weapon.melee.gun.gl.gl_t1.name=Уровень 1 GL
items.weapon.melee.gun.gl.gl_t1.desc=Уровень GL соответствует 1 уровню производительности. Он обладает лишь базовыми характеристиками.
items.weapon.melee.gun.gl.gl_t2.name=Зенитный корабль 2-го уровня
items.weapon.melee.gun.gl.gl_t2.desc=GL 2-го уровня, регулировкой производительности. Характеристики слабые, но не плохие.
items.weapon.melee.gun.gl.gl_t3.name=Зенитный корабль 3-го уровня
items.weapon.melee.gun.gl.gl_t3.desc=GL с 3-ступенчатой ​​регулировкой производительности. Обладает неплохими характеристиками.
items.weapon.melee.gun.gl.gl_t4.name=Зенитный корабль 4-го уровня
items.weapon.melee.gun.gl.gl_t4.desc=GL с 4-уровневой производительностью. Обладает высокой производительностью.
items.weapon.melee.gun.gl.gl_t5.name=Зенитный корабль 5-го уровня
items.weapon.melee.gun.gl.gl_t5.desc=GL с уровнем производительности 5. Обладает потрясающей производительностью.
items.weapon.melee.gun.gl.funnyfirework.name=Забавные фейерверки
items.weapon.melee.gun.gl.funnyfirework.desc=Сигнальный пистолет, который Каэдэ всегда носит с собой.\n\nВ буквальном смысле это предмет, используемый для подачи сигнала о том, что что-то обнаружено; Каэдэ обычно стреляет из него, когда замечает нарушителя спокойствия, устраивающего инцидент, или когда находит редкую карту Мушикуин.
items.weapon.melee.gun.gl.funnyfirework.stats_desc=Это оружие на короткое время ослепляет пораженных врагов и освещает окрестности.
items.weapon.melee.gun.gl.funnyfirework.discover_hint=Это оружие можно получить с помощью алхимии, используя _GL_.
items.weapon.melee.gun.gl.springpunch.name=Весенний пунш
items.weapon.melee.gun.gl.springpunch.desc=Многозарядный гранатомет, который Шигуре всегда носит с собой.\n\nПротивник, попавший под действие этой гранаты, теряет сознание, как и следует из её названия.
items.weapon.melee.gun.gl.springpunch.stats_desc=Это оружие не наносит себе урона и поражает цели вблизи точки попадания.\nЭто оружие наносит больший урон оглушенным противникам.
items.weapon.melee.gun.gl.springpunch.discover_hint=Это оружие можно получить с помощью алхимии, используя _GL_.

items.weapon.melee.gun.hg.hg_t1.name=Уровень 1 HG
items.weapon.melee.gun.hg.hg_t1.desc=HG с уровнем производительности 1. Обладает только базовыми характеристиками.
items.weapon.melee.gun.hg.hg_t2.name=Уровень 2 HG
items.weapon.melee.gun.hg.hg_t2.desc=HG 2-го уровня с двухступенчатой ​​регулировкой мощности. Он слабый, но демонстрирует неплохие характеристики.
items.weapon.melee.gun.hg.hg_t3.name=Уровень 3 HG
items.weapon.melee.gun.hg.hg_t3.desc=HG 3-го уровня с 3-ступенчатой ​​регулировкой мощности. Обладает неплохими характеристиками.
items.weapon.melee.gun.hg.hg_t4.name=Уровень 4 HG
items.weapon.melee.gun.hg.hg_t4.desc=HG с 4-ступенчатой ​​регулировкой производительности. Обладает высокой производительностью.
items.weapon.melee.gun.hg.hg_t5.name=Уровень 5 HG
items.weapon.melee.gun.hg.hg_t5.desc=HG 5-го уровня с 5-ступенчатой ​​регулировкой характеристик. Обладает потрясающей производительностью.
items.weapon.melee.gun.hg.piety.name=Благочестие
items.weapon.melee.gun.hg.piety.desc=Пистолет, который Мари носит с собой.\n\nХотя она всегда носит его с собой, почти никто никогда не видел, чтобы она из него стреляла.
items.weapon.melee.gun.hg.piety.stats_desc=Это оружие всегда наносит максимальный урон демонам и нежити.
items.weapon.melee.gun.hg.piety.discover_hint=Это оружие можно получить с помощью алхимии, используя _HG_.
items.weapon.melee.gun.hg.chistka.name=Чистка
items.weapon.melee.gun.hg.chistka.desc=Пистолет, который Черино использует для «чистки».\n\nНе нужно нажимать на курок, достаточно просто навести оружие и крикнуть «Чистка!», и человек будет «чист».
items.weapon.melee.gun.hg.chistka.stats_desc=Это оружие имеет низкую вероятность уничтожения врагов и заставляет их куда-то исчезнуть.
items.weapon.melee.gun.hg.chistka.discover_hint=Это оружие можно получить с помощью алхимии, используя _HG_.
items.weapon.melee.gun.hg.chistka.purge=Удалять!

items.weapon.melee.gun.mg.mg_t1.name=Пулемет 1-го уровня
items.weapon.melee.gun.mg.mg_t1.desc=MG с уровнем производительности 1. Обладает только базовыми характеристиками.
items.weapon.melee.gun.mg.mg_t2.name=Пулемет 2-го уровня
items.weapon.melee.gun.mg.mg_t2.desc=MG с 2 ​​регулировкой мощности. Он слабый, но обладает неплохими характеристиками.
items.weapon.melee.gun.mg.mg_t3.name=Пулемет 3-го уровня
items.weapon.melee.gun.mg.mg_t3.desc=MG с 3-ступенчатой ​​регулировкой мощности. Обладает неплохими характеристиками.
items.weapon.melee.gun.mg.mg_t4.name=Пулемет 4-го уровня
items.weapon.melee.gun.mg.mg_t4.desc=MG с 4-ступенчатой ​​регулировкой мощности. Обладает высокими эксплуатационными характеристиками.
items.weapon.melee.gun.mg.mg_t5.name=Пулемет 5-го уровня
items.weapon.melee.gun.mg.mg_t5.desc=MG с 5-ступенчатой ​​регулировкой характеристик. Обладает потрясающими характеристиками.
items.weapon.melee.gun.mg.mg_sp.name=Мини №.5
items.weapon.melee.gun.mg.mg_sp.desc=Пулемет, которым пользовалась Нономи.\n\nВопреки своему названию, <Мини №.5>, он отнюдь не лёгкий.
items.weapon.melee.gun.mg.mg_sp.stats_desc=Характеристики этого оружия улучшаются при достижении 20-го уровня.
items.weapon.melee.gun.mg.mg_sp.discover_hint=Это оружие можно получить, если у ученика есть определённая способность.
items.weapon.melee.gun.mg.mulligan.name=Маллиган
items.weapon.melee.gun.mg.mulligan.desc=Пулемет, переживший вместе с Коюки всевозможные унижения.\n\nОн даже падал в морскую воду, и во время ремонта его цвет изменился. Несмотря на свои характеристики, он прочный, как и Коюки, которой наплевать на мелочи.
items.weapon.melee.gun.mg.mulligan.stats_desc=При попадании из этого оружия срабатывает случайный эффект. По мере улучшения вероятность срабатывания нейтрального или положительного эффекта возрастает.
items.weapon.melee.gun.mg.mulligan.discover_hint=Это оружие можно получить с помощью алхимии, используя _MG_.
items.weapon.melee.gun.mg.trickortrick.name=Трюк или обман?
items.weapon.melee.gun.mg.trickortrick.desc=Многоцелевой пулемет, который носит с собой Муцуки.\n\nМуцуки говорит, что огневая мощь важна для веселых розыгрышей.
items.weapon.melee.gun.mg.trickortrick.stats_desc=Этот пистолет очень тяжёлый.
items.weapon.melee.gun.mg.trickortrick.discover_hint=Это оружие можно получить с помощью алхимии, используя _MG_.

items.weapon.melee.gun.sg.sg_t1.name=Уровень 1 SG
items.weapon.melee.gun.sg.sg_t1.desc=SG с уровнем производительности 1. Обладает только базовыми характеристиками.
items.weapon.melee.gun.sg.sg_t2.name=Уровень 2 SG
items.weapon.melee.gun.sg.sg_t2.desc=SG с 2-двухступенчатой ​​регулировкой мощности. Характеристики слабые, но не плохие.
items.weapon.melee.gun.sg.sg_t3.name=SG 3-го уровня
items.weapon.melee.gun.sg.sg_t3.desc=SG с 3-ступенчатой ​​регулировкой мощности. Обладает неплохими характеристиками.
items.weapon.melee.gun.sg.sg_t4.name=4-й уровень SG
items.weapon.melee.gun.sg.sg_t4.desc=SG с 4-ступенчатой ​​регулировкой производительности. Обладает высокими эксплуатационными характеристиками.
items.weapon.melee.gun.sg.sg_t5.name=5-й уровень SG
items.weapon.melee.gun.sg.sg_t5.desc=SG с 5-ступенчатой ​​регулировкой характеристик. Обладает потрясающими характеристиками.
items.weapon.melee.gun.sg.shootingstar.name=Падающая звезда
items.weapon.melee.gun.sg.shootingstar.desc=Драгоценное ружье Рейсы.\n\nТщательно модифицированный ствол, несомненно, принадлежит Рейсе. Несмотря на свой симпатичный вид, оно хранит в себе опыт сражений на огромном количестве полей боя.
items.weapon.melee.gun.sg.shootingstar.stats_desc=У этого оружия относительно низкий урон.\nПри выстреле это оружие собирает врагов по всему этажу.\nПри попадании это оружие накладывает на врагов эффект "Безумие".
items.weapon.melee.gun.sg.shootingstar.discover_hint=Это оружие можно получить с помощью алхимии, используя _SG_.
items.weapon.melee.gun.sg.mtet.name=Многоцелевой инструмент тактической реализации
items.weapon.melee.gun.sg.mtet.desc=Прочное ружье, которое предпочитает Эми.\n\nКак и следует из названия, оно используется для самых разных целей, от взлома дверей до борьбы со сверхъестественными явлениями.
items.weapon.melee.gun.sg.mtet.stats_desc=У этого оружия относительно низкий урон.\nЭто оружие поджигает врагов при попадании и наносит дополнительный урон горящим врагам.
items.weapon.melee.gun.sg.mtet.discover_hint=Это оружие можно получить с помощью алхимии, используя _SG_.

items.weapon.melee.gun.smg.smg_t1.name=Пистолет-пулемет 1-го уровня
items.weapon.melee.gun.smg.smg_t1.desc=Пистолет-пулемет 1-го уровня. Обладает лишь базовыми характеристиками.
items.weapon.melee.gun.smg.smg_t2.name=Пистолет-пулемет 2-го уровня
items.weapon.melee.gun.smg.smg_t2.desc=Пистолет-пулемет 2-го уровня. Он слабый, но обладает неплохими характеристиками.
items.weapon.melee.gun.smg.smg_t3.name=Пистолет-пулемет 3-го уровня
items.weapon.melee.gun.smg.smg_t3.desc=Пистолет-пулемет 3-го уровня. Обладает неплохими характеристиками.
items.weapon.melee.gun.smg.smg_t4.name=Пистолет-пулемет 4-го уровня
items.weapon.melee.gun.smg.smg_t4.desc=Пистолет-пулемет с 4-го уровня с ступенчатой ​​регулировкой характеристик. Обладает высокой производительностью.
items.weapon.melee.gun.smg.smg_t5.name=Пистолет-пулемет 5-го уровня
items.weapon.melee.gun.smg.smg_t5.desc=Пистолет-пулемет 5-го уровня. Обладает потрясающими характеристиками.
items.weapon.melee.gun.smg.twindragon.name=Двойной Дракон
items.weapon.melee.gun.smg.twindragon.desc=Два пистолета-пулемета, которыми пользовался Неру.\n\nОба пистолета-пулемета украшены замысловатой гравировкой с изображением золотых драконов.
items.weapon.melee.gun.smg.twindragon.stats_desc=Это оружие обладает очень низкой точностью, но стреляет в 2 больше патронов.
items.weapon.melee.gun.smg.twindragon.discover_hint=Это оружие можно получить с помощью алхимии, используя пистолет-пулемет.
items.weapon.melee.gun.smg.beyondthelumination.name=За пределами свечения
items.weapon.melee.gun.smg.beyondthelumination.desc=Пистолет-пулемет Нацу.\n\nЭто инструмент, который Нацу, любящий созерцание, использует только в крайнем случае.
items.weapon.melee.gun.smg.beyondthelumination.stats_desc=Это оружие может блокировать _0-%1$d_ урона.\nЭто оружие обладает относительно низкой точностью.\nЭто оружие обладает высокой точностью на ближней дистанции.\nВосстанавливает 1 единицу здоровья каждый раз, когда _%2$d_ урон блокируется этим оружием.
items.weapon.melee.gun.smg.beyondthelumination.typical_stats_desc=Это оружие обычно блокирует _0-%1$d_ урона.\nЭто оружие обладает относительно низкой точностью.\nЭто оружие обладает высокой точностью на ближней дистанции.\nВосстанавливает 1 единицу здоровья каждый раз, когда _%2$d_ урон блокируется этим оружием.
items.weapon.melee.gun.smg.beyondthelumination.discover_hint=Это оружие можно получить с помощью алхимии, используя пистолет-пулемет.

items.weapon.melee.gun.sr.sr_t1.name=Уровень 1 SR
items.weapon.melee.gun.sr.sr_t1.desc=SR с уровнем производительности 1. Обладает только базовыми характеристиками.
items.weapon.melee.gun.sr.sr_t2.name=Уровень 2 SR
items.weapon.melee.gun.sr.sr_t2.desc=SR 2-го уровня с двухступенчатой ​​регулировкой характеристик. Характеристики слабые, но не плохие.
items.weapon.melee.gun.sr.sr_t3.name=3-й уровень SR
items.weapon.melee.gun.sr.sr_t3.desc=SR 3-го уровня с 3-ступенчатой ​​регулировкой производительности. Обладает достойными характеристиками.
items.weapon.melee.gun.sr.sr_t4.name=4-й уровень SR
items.weapon.melee.gun.sr.sr_t4.desc=SR 4-го уровня с 4-ступенчатой ​​регулировкой характеристик. Обладает высокой производительностью.
items.weapon.melee.gun.sr.sr_t5.name=5-й уровень SR
items.weapon.melee.gun.sr.sr_t5.desc=SR 5-го уровня с 5-ступенчатой ​​регулировкой характеристик. Обладает потрясающей производительностью.
items.weapon.melee.gun.sr.sr_sp.name=Противотанковый SR
items.weapon.melee.gun.sr.sr_sp.desc=Метательное оружие SR с уровнем характеристик 6. Обладает разрушительной силой. Настолько тяжелое, что кажется невозможным его бросить.
items.weapon.melee.gun.sr.sr_sp.stats_desc=Это оружие способно пробивать стены толщиной в один блок и разрушает их.\nЕсли пуля не разрушает стену, она отбрасывает противника назад.\nПри снятии этого оружия или попытке перезарядки использование прекращается, и вы переключаетесь обратно на своё первоначальное оружие.
items.weapon.melee.gun.sr.sr_sp.discover_hint=Это оружие можно получить, если у ученика есть определённая способность.
items.weapon.melee.gun.sr.justiceincarnate.name=Проявление справедливости
items.weapon.melee.gun.sr.justiceincarnate.desc=Снайперская винтовка, которую Маширо использует, работая на Клуб Реализации Справедливости.\n\nХотя она несколько громоздка для переноски, это не представляет проблемы, учитывая убежденность Маширо в необходимости справедливости.
items.weapon.melee.gun.sr.justiceincarnate.stats_desc=У этого оружия относительно низкий урон.\nПри попадании это оружие наносит противнику тот же урон ещё раз с определённой вероятностью.
items.weapon.melee.gun.sr.justiceincarnate.discover_hint=Это оружие можно получить с помощью алхимии, используя _SR_.
items.weapon.melee.gun.sr.wineredadmire.name=Красное вино ・Восхищение
items.weapon.melee.gun.sr.wineredadmire.desc=Полуавтоматическая снайперская винтовка в старинном стиле, которую Ару очень ценит.\n\nДаже просто держа её в руках, она производит впечатление крутого парня.
items.weapon.melee.gun.sr.wineredadmire.stats_desc=У этого оружия относительно низкий урон.\nПри попадании пули в цель с определённой вероятностью происходит взрыв в окружающей местности.
items.weapon.melee.gun.sr.wineredadmire.discover_hint=Это оружие можно получить с помощью алхимии, используя _SR_.

items.weapon.melee.gun.mt.fancylight.name=Причудливый свет
items.weapon.melee.gun.mt.fancylight.desc=Миномет, предпочитаемый Хибики.\n\nОн также иногда используется в экспериментах, стреляя различными снарядами в дополнение к обычным снарядам.
items.weapon.melee.gun.mt.fancylight.stats_desc=Это оружие можно использовать даже без экипировки.\nВ неэкипированном состоянии у этого оружия низкая скорострельность.\nПули этого оружия пробивают стены.\nОчень сложно поразить врагов в пределах прямой видимости этим оружием.\nЭто оружие перезаряжается за счёт заряжания бомбы, и может стрелять с заряженной бомбой до следующей перезарядки.
items.weapon.melee.gun.mt.fancylight.discover_hint=Это оружие можно получить с помощью алхимии, используя _GL_.
items.weapon.melee.gun.mt.fancylight.bomb=В данный момент он заряжен и взорвется на месте при ударе, причинив ущерб%s.
items.weapon.melee.gun.mt.fancylight.ac_bomb=Загрузка бомб
items.weapon.melee.gun.mt.fancylight.inv_prompt=Выберите бомбу для загрузки.

###grenade items
items.active.grenade.ac_lightthrow=Бросьте гранату!

items.active.claymore.name=Малый Клеймор
items.active.claymore.desc=Небольшой двуручный меч, который носит Мияко. При активации он наносит значительный урон по большой площади и замедляет скорость передвижения пораженных целей.\n\nС повышением уровня увеличивается вероятность нанесения урона и наложения дебаффов.
items.active.claymore.throw_desc=Урон: _%1$d-%2$d_\nОставшиеся выстрелы: %3$d_/_%4$d\nШанс восстановления после убийства врага: _%5$s%%_
items.active.claymore.ac_lightthrow=Взорваться
items.active.claymore.no_left=Бойцов "Клеймор" больше не осталось.

items.active.handgrenade.name=Граната
items.active.handgrenade.desc=Граната, принесённая Мияко. При броске вызывает мгновенный взрыв в месте попадания. Будьте осторожны, так как вы сами можете получить урон.\n\nМаксимальное количество гранат, которое вы можете нести, увеличивается с повышением вашего уровня.
items.active.handgrenade.throw_desc=Урон: _%1$d-%2$d_\nОставшиеся броски: _%3$d/%4$d_\nШанс исцеления при убийстве врага: _%5$s%%_
items.active.handgrenade.ac_lightthrow=Бросьте гранату!
items.active.handgrenade.no_left=Гранат больше не осталось.

items.active.ironhorus.name=Щит для подавления беспорядков «Железный Гор»
items.active.ironhorus.desc=Складной щит, который носит Хосино. Его можно развернуть во время боя, чтобы получить дополнительную защиту _%1$d-%2$d_ до начала движения.\n\nПри использовании HG в качестве основного оружия, вы можете двигаться, держа в руках облегченную версию щита с половинной защитой.\n\nС повышением уровня увеличивается и предоставляемая защита при использовании.
items.active.ironhorus.ac_use=Использовать
items.active.ironhorus$tacticalshieldbuff.name=Примените щиты для подавления беспорядков!
items.active.ironhorus$tacticalshieldbuff.desc=А? Вы спрашиваете, что это?\n\nЭто щит, который служит надёжным укрытием, если его установить перед боем. Мой драгоценный товарищ. Он не блокирует 100%%% вражеских атак, но должен блокировать примерно _%1$d-%2$d_ единиц урона.\n\nМне приходится складывать его обратно, когда противостояние заканчивается, потому что мне нужно двигаться. Чтобы снова его использовать, требуется некоторое время, поэтому, вероятно, лучше не использовать его, когда нужно быстро переместиться.
items.active.ironhorus$lighttacticalshieldbuff.name=Примените щиты для подавления беспорядков!
items.active.ironhorus$lighttacticalshieldbuff.desc=А? Вы спрашиваете, что это?\n\nЭто щит, который служит надёжным укрытием, когда вы держите его в руках. Мой драгоценный товарищ. Он не так эффективен, как если бы вы установили его прямо на месте, но всё же может блокировать примерно _%1$d-%2$d_ урона, пока вы двигаетесь.\n\nЕго нужно сложить обратно, потому что он мешает, если вы хотите перезарядить оружие или сменить его. Повторное использование занимает некоторое время, поэтому, вероятно, лучше не использовать его, когда ожидаются частые бои.
items.active.ironhorus$tacticalshieldcooldown.name=Время восстановления: Щит от беспорядков
items.active.ironhorus$tacticalshieldcooldown.desc=Уф~ Дайте мне немного времени, чтобы привести это в порядок. Мне нужно, чтобы всё было аккуратно организовано, чтобы я могла быстро им воспользоваться, когда это потребуется.\n\nДолжно быть готово примерно через _%s_ ходов.
items.active.ironhorus$shieldbashbuff.action_name=Заряд щита

items.active.bicycle.name=Велосипед
items.active.bicycle.desc=Синий велосипед, на котором ездит Сирокко. Каждый раз, когда вы двигаетесь, не спешившись, вы можете проехать большее расстояние в следующий раз, а езда на нём позволяет двигаться быстро. Однако будьте осторожны, так как во время езды на велосипеде становится трудно поразить цель атаками.
items.active.bicycle.ac_use=Использовать
items.active.bicycle$bicyclebuff.name=Верховая езда
items.active.bicycle$bicyclebuff.action_name=Профессиональная верховая езда
items.active.bicycle$bicyclebuff.desc_1=Хм... вы имеете в виду это? Как видите, это велосипед, но...
items.active.bicycle$bicyclebuff.desc_acc=Езда на велосипеде позволяет быстро передвигаться, но атаковать, находясь на нём, сложно. То есть, становится труднее наносить удары. Спешиться на мгновение несложно, поэтому лучше всего слезть с велосипеда во время боя, если это возможно.
items.active.bicycle$bicyclebuff.desc_2=Езда на велосипеде нерегулярно и быстро в таком месте быстро утомляет, поэтому необходимы периодические перерывы. Короткие расстояния легко преодолевать быстро, но проехать больше _%1$sплиток_ за раз будет сложно.\n\nМаксимальное расстояние, которое вы можете проехать на велосипеде с этого момента, составляет примерно _%2$sплиток_.
items.active.bicycle$professionalridemove.skid_mark.name=Следы торможения
items.active.bicycle$professionalridemove.skid_mark.desc=Сирокко может использовать «Скользящий след», чтобы за 1 ход преодолеть радиус до 3 клеток и перепрыгнуть через ловушки и препятствия.\nНа пути, пройденном Сирокко, остаётся 2 хода пламени.
items.active.bicycle$professionalridemove.riding_reload.name=Перезагрузка во время езды
items.active.bicycle$professionalridemove.riding_reload.desc=Сирокко может использовать способность «Перезарядка верхом», чтобы мгновенно перезарядить текущее оружие, не тратя ход.
items.active.bicycle$professionalridemove.slam.name=Столкновение с отягчающими обстоятельствами
items.active.bicycle$professionalridemove.slam.desc=Сирокко может отталкивать находящихся поблизости врагов на расстояние до 3 клеток, используя взвешенное столкновение, основанное на весе и ускорении.
items.active.bicycle$professionalridemove.accelerate.name=Мгновенное ускорение
items.active.bicycle$professionalridemove.accelerate.desc=Сирокко может использовать «Мгновенное ускорение», чтобы переместиться на следующую 1 клетку, не тратя ход, и получить 3 хода ускорения после перемещения.
items.active.bicycle$professionalridemove.drift.name=Дрейф
items.active.bicycle$professionalridemove.drift.desc=Сирокко может использовать «Дрифт», чтобы мгновенно спешиться с мотоцикла без перезарядки и утроить скорость зарядки мотоцикла на следующие 20 ходов. Увеличение скорости зарядки 3 немедленно исчезает при повторной посадке на мотоцикл, а «Дрифт» активируется снова после победы над 5 врагами.
items.active.bicycle$bicyclecooldown.name=Перезарядка: Езда
items.active.bicycle$bicyclecooldown.desc=Пожалуйста, подождите минутку. Мне нужно немного собраться с мыслями.\n\nМотоцикл будет готов после %s поворота.
items.active.bicycle$driftbuff.name=Дрейф
items.active.bicycle$driftbuff.desc=Хм... только что мне удалось мгновенно слезть с мотоцикла, используя инерцию от заноса. Кроме того, вы сможете быстрее%sподготовить мотоцикл к следующему повороту.\n\nБудьте осторожны, этот эффект исчезает в тот момент, когда вы садитесь на мотоцикл.


###items for testing
items.teleporter.name=Коробка Шиттима

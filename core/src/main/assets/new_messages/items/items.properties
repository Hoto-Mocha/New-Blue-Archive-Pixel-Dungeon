items.scrolls.exotic.scrollofantimagic.desc=The magic of this scroll surrounds you with an anti-magic aura, temporarily neutralizing both beneficial and harmful magical effects. It suppresses wands, scrolls, rings, artifacts, weapon enchantments, and curses. However, student uniform abilities are powerful enough to pierce this effect and remain usable.

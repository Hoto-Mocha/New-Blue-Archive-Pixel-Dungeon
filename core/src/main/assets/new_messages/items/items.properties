items.gunsmithingtool.weight_desc=_Weight Modification_ adjusts the _firearm's tier_ by fundamentally altering its base build.\n\n_Lightweight: -1 tier_\n\n_Heavyweight: +1 tier_
items.gunsmithingtool.attach=Attachment Modification
items.gunsmithingtool$wndmod.normal_attach=Remove Attachment
items.gunsmithingtool$wndmod.laser_attach=Laser Sight
items.gunsmithingtool$wndmod.flash_attach=Flashlight
items.gunsmithingtool.attach_desc=_Attachment Modification_ grants _special effects_ by mounting tactical optical devices onto firearms.\n\n_Laser Sight:_\n- Bullet accuracy _x1.25_\n- Enemy detection chance _+1 tier_\n\n_Flashlight:_\n- On hit, _50%-10%*(distance to target)_ chance to inflict _brief blindness_ on enemies\n- Enemy detection chance _+2 tiers_

items.weapon.melee.gun.sr.sr_sp.name=Anti-Tank SR
items.weapon.melee.gun.sr.sr_sp.desc=A Tier-6 SR with devastating performance. It is far too heavy to be thrown.
items.weapon.melee.gun.sr.sr_sp.stats_desc=This firearm can pierce through 1-tile thick walls, destroying breached walls.\nIf the bullet does not destroy a wall, it knocks back hit enemies.\nUnequipping this firearm or attempting to reload ends its use and equips your original weapon.
items.weapon.melee.gun.sr.sr_sp.discover_hint=This firearm can be obtained through a _specific student's ability_.
items.weapon.melee.gun.sr.justiceincarnate.name=Justice Incarnate
items.weapon.melee.gun.sr.justiceincarnate.desc=A sniper rifle Mashiro uses during her Justice Task Force activities.\n\nWhile somewhat cumbersome to carry around, size poses no obstacle in the face of Mashiro's devotion to justice.
items.weapon.melee.gun.sr.justiceincarnate.stats_desc=This firearm deals relatively low damage.\nOn hit, this firearm has a chance to inflict the same damage a second time.
items.weapon.melee.gun.sr.justiceincarnate.discover_hint=This firearm can be obtained through alchemy using an _SR_.
items.weapon.melee.gun.sr.wineredadmire.name=Wine Red Admiration
items.weapon.melee.gun.sr.wineredadmire.desc=A semi-automatic sniper rifle with an antique design that Aru cherishes dearly.\n\nJust holding it gives off a genuinely hard-boiled vibe.
items.weapon.melee.gun.sr.wineredadmire.stats_desc=This firearm deals relatively low damage.\nWhen the bullet lands, it has a chance to trigger an explosion in the surrounding area.
items.weapon.melee.gun.sr.wineredadmire.discover_hint=This firearm can be obtained through alchemy using an _SR_.

items.weapon.melee.gun.mt.fancylight.name=Fancy Light
items.weapon.melee.gun.mt.fancylight.desc=A mortar favored by Hibiki.\n\nOccasionally used in experiments as well, it often launches all kinds of things besides mortar shells.
items.weapon.melee.gun.mt.fancylight.stats_desc=This firearm can be used without equipping it.\nThis firearm has a slower fire rate if not equipped.\nBullets from this firearm pierce through walls.\nThis firearm has great difficulty hitting enemies within line of sight.\nLoading a bomb allows you to reload more rounds, firing the loaded bomb until the next reload.
items.weapon.melee.gun.mt.fancylight.discover_hint=This firearm can be obtained through alchemy using a _GL_.
items.weapon.melee.gun.mt.fancylight.bomb=Currently loaded with _%s_; upon impact, it deals bullet damage and detonates on the spot.
items.weapon.melee.gun.mt.fancylight.ac_bomb=Load Bomb
items.weapon.melee.gun.mt.fancylight.inv_prompt=Select a bomb to load

###grenade items
items.active.grenade.ac_lightthrow=Throw Grenade!

items.active.claymore.name=Compact Claymore
items.active.claymore.desc=A compact claymore carried by Miyako. When detonated, it deals heavy damage over a wide area and slows the movement speed of affected targets.\n\nDamage and debuff chances increase as you level up.
items.active.claymore.throw_desc=Damage: _%1$d-%2$d_\nRemaining detonations: _%3$d/%4$d_\nRecovery chance on kill: _%5$s%%_
items.active.claymore.ac_lightthrow=Detonate
items.active.claymore.no_left=No claymores remaining.

items.active.handgrenade.name=Hand Grenade
items.active.handgrenade.desc=A hand grenade brought by Miyako. Throwing it deals immediate explosion damage around the impact point. Be careful, as you can also get caught in the blast.\n\nMaximum capacity increases as you level up.
items.active.handgrenade.throw_desc=Damage: _%1$d-%2$d_\nRemaining throws: _%3$d/%4$d_\nRecovery chance on kill: _%5$s%%_
items.active.handgrenade.ac_lightthrow=Throw Grenade!
items.active.handgrenade.no_left=No grenades remaining.

items.active.ironhorus.name=Riot Shield "Iron Horus"
items.active.ironhorus.desc=A foldable riot shield carried by Hoshino. Deploying it in combat grants _%1$d-%2$d_ bonus defense until you move.\n\nEquipping an HG as your primary weapon lets you move while wielding a lightweight shield with half the defensive power.\n\nGranted defense increases as you level up.
items.active.ironhorus.ac_use=Use
items.active.ironhorus$tacticalshieldbuff.name=Deploy Riot Shield!
items.active.ironhorus$tacticalshieldbuff.desc=Hm? What's this, you ask~?\n\nWell, you see~ deploy this shield before combat and it becomes trusty cover. It's my precious partner. It won't block 100%% of enemy attacks, but it can still absorb about _%1$d-%2$d_ damage, y'know?\n\nOnce the standoff is over, gotta pack it up to move again. Folding it up takes a little time, so you probably shouldn't set it up when you need to stay on the move.
items.active.ironhorus$lighttacticalshieldbuff.name=Raise Riot Shield!
items.active.ironhorus$lighttacticalshieldbuff.desc=Hm? What's this, you ask~?\n\nWell, you see~ just holding this shield makes for trusty cover. It's my precious partner. Not quite as solid as planting it in the ground, but you can still move while blocking around _%1$d-%2$d_ damage.\n\nGets in the way when reloading or swapping guns though, so gotta fold it away. Takes a moment to ready up again, so best not to use it when constant skirmishes are expected.
items.active.ironhorus$tacticalshieldcooldown.name=Cooldown: Riot Shield
items.active.ironhorus$tacticalshieldcooldown.desc=Uwah~ give me a sec to pack this up. Gotta stow it properly if we want it ready when things go south, y'know?\n\nShould be good to go in about _%s_ turns.
items.active.ironhorus$shieldbashbuff.action_name=Shield Bash

items.active.bicycle.name=Bicycle
items.active.bicycle.desc=A blue bicycle that Shiroko rides. Moving around while off the bike charges it up to ride longer next time, and riding lets you move swiftly. Keep in mind, however, that aiming attacks becomes much harder while riding.
items.active.bicycle.ac_use=Use
items.active.bicycle$bicyclebuff.name=Riding
items.active.bicycle$bicyclebuff.action_name=Professional Riding
items.active.bicycle$bicyclebuff.desc_1=Nn... this? As you can see, it's just a bicycle, but...
items.active.bicycle$bicyclebuff.desc_acc=Riding lets you move fast, but shooting from the saddle is tricky. _Meaning it's much harder to land attacks_. Stepping off for a bit is easy enough, so you should probably dismount during combat.
items.active.bicycle$bicyclebuff.desc_2=Sprinting irregularly on a bike in a place like this wears you out fast, so regular breaks are essential. Quick bursts over short distances are fine, but going more than _%1$s tiles_ at once will be tough.\n\nFrom here, you can ride for about _%2$s more tiles_.
items.active.bicycle$professionalridemove.skid_mark.name=Skid Mark
items.active.bicycle$professionalridemove.skid_mark.desc=Shiroko can use _Skid Mark_ to cross up to 3 tiles in a single turn, leaping over traps and hazardous terrain.\nFlames linger for 2 turns along the path Shiroko traveled.
items.active.bicycle$professionalridemove.riding_reload.name=Riding Reload
items.active.bicycle$professionalridemove.riding_reload.desc=Shiroko can use _Riding Reload_ to instantly reload her currently equipped firearm without consuming a turn.
items.active.bicycle$professionalridemove.slam.name=Weighted Ram
items.active.bicycle$professionalridemove.slam.desc=Using momentum and weight, Shiroko can execute a _Weighted Ram_ to knock back an adjacent enemy by up to 3 tiles.
items.active.bicycle$professionalridemove.accelerate.name=Sudden Acceleration
items.active.bicycle$professionalridemove.accelerate.desc=Shiroko can use _Sudden Acceleration_ to travel the next 1 tile without consuming a turn, gaining 3 turns of Haste afterward.
items.active.bicycle$professionalridemove.drift.name=Drift
items.active.bicycle$professionalridemove.drift.desc=Shiroko can use _Drift_ to instantly dismount her bicycle without triggering a cooldown, tripling bicycle charge speed for the next 20 turns. The increased charge rate ends immediately upon remounting, and Drift recharges after defeating 5 enemies.
items.active.bicycle$bicyclecooldown.name=Cooldown: Riding
items.active.bicycle$bicyclecooldown.desc=Hold on a moment. I need a quick breather.\n\nThe bicycle will be ready in _%s turns_.
items.active.bicycle$driftbuff.name=Drift
items.active.bicycle$driftbuff.desc=Nn... that drift momentum let me dismount instantly just now. The bike should recharge much faster for the next _%s turns_, too.\n\nJust remember that this boost vanishes the moment you get back on the bike.



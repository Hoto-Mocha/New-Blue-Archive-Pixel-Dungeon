items.weapon.melee.gun.mg.mg_sp.desc=A machine gun used by Nonomi.\n\nContrary to its name "Mini Gun No. 5," its weight is anything but light.
items.weapon.melee.gun.mg.mg_sp.stats_desc=This firearm's performance increases above level 20.
items.weapon.melee.gun.mg.mg_sp.discover_hint=This firearm can be obtained through a _specific student's ability_.
items.weapon.melee.gun.mg.mulligan.name=Mulli<Gun>
items.weapon.melee.gun.mg.mulligan.desc=A machine gun that endured every humiliation alongside Koyuki.\n\nHaving once fallen into seawater, its color shifted during repairs. Performance aside, it is sturdy and resilient—much like Koyuki, who never sweats the small stuff.
items.weapon.melee.gun.mg.mulligan.stats_desc=This firearm triggers a random effect on hit. Upgrading it increases the chance of triggering neutral or beneficial effects.
items.weapon.melee.gun.mg.mulligan.discover_hint=This firearm can be obtained through alchemy using an _MG_.
items.weapon.melee.gun.mg.trickortrick.name=Trick or Trick
items.weapon.melee.gun.mg.trickortrick.desc=A multipurpose machine gun carried by Mutsuki.\n\nMutsuki insists that superior firepower is essential for good pranks.
items.weapon.melee.gun.mg.trickortrick.stats_desc=This firearm is extremely heavy.
items.weapon.melee.gun.mg.trickortrick.discover_hint=This firearm can be obtained through alchemy using an _MG_.


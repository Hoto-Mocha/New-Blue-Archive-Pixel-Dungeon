items.teleporter.desc=*This is a testing item.*\n\nA strange device capable of ascending/descending floors or summoning enemies.\n\nThe test button is used during development and may change without notice in patch notes.
items.teleporter.getitem_title=Spawn Item
items.teleporter.help_title=Help
items.teleporter.help_desc=The item spawn syntax consists of 4 lines in total:\n\n_- Line 1:_ _Exact name_ of the target item. Set to Scroll of Identify as an example.\n_- Line 2:_ _Quantity_ of the target item. Only numbers should be on this line; extra characters beside default text will cause issues. If omitted, or for non-stackable items, it defaults to _1_.\n_- Line 3:_ _Upgrade level_ of the target item. Only numbers should be on this line; extra characters beside default text will cause issues. If omitted, or for non-upgradable items, it defaults to _0_.\n_- Line 4:_ _Identification status_. If you want it identified, type _true_ after default text or on its own. Anything else will spawn it unidentified.\n\n_Example:_\nPlate Uniform\n0\n5\ntrue\n\nResult: Gives an identified Plate Uniform +5.
items.teleporter.list_title=Spawnable Items List

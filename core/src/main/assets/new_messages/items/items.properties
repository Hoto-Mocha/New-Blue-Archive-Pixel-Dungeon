items.weapon.enchantments.vampiric.elestrike_desc=When imbued with Vampiric enchantment, Elemental Strike restores 2.5 HP to the student for each enemy within range.
items.weapon.enchantments.blocking.elestrike_desc=When imbued with Blocking enchantment, Elemental Strike grants the student 6 bonus shielding for each enemy within range.
items.weapon.curses.sacrificial.elestrike_desc=When cursed with Sacrifice, Elemental Strike inflicts 12 HP of bleeding on both the student and all enemies within range.
items.trinkets.vialofblood.typical_stats_desc=Normally, this trinket increases total health gained from potions of healing, waterskins, and wells of health by _%1$s%%_. However, these healing effects take effect more slowly, restoring at most _%2$s_ HP per turn. (Max healing per turn scales with student level)
items.trinkets.vialofblood.stats_desc=At its current level, this trinket increases total health gained from potions of healing, waterskins, and wells of health by _%1$s%%_. However, these healing effects take effect more slowly, restoring at most _%2$s_ HP per turn. (Max healing per turn scales with student level)
items.stones.stoneofenchantment.armor=당신의 의상은 어둠 속에서 빛났다!
items.stones.stoneofaugmentation.desc=이 룬석은 장비를 증강시켜 한 특성을 강화시키지만 다른 특성을 약화시킵니다.\n\n무기에 사용하여 속도와 공격력 중 하나를 강화할 수 있습니다. 또한 투척 무기의 경우 공격 속도에 비례해서 내구도를 얻거나 잃게 됩니다.\n\n의상에 사용하여 회피와 방어력 중 하나를 강화할 수 있습니다.
items.scrolls.exotic.scrollofenchantment.armor=의상에 부여할 상형문자 선택
items.scrolls.exotic.scrollofenchantment.desc=이 주문서는 무기나 의상에 강력한 마법 에너지를 융합합니다. 또한 시전자가 부여할 마법을 어느정도 결정할 수도 있습니다.
items.scrolls.exotic.scrollofantimagic.desc=이 주문서의 마법은 당신을 마법 오라로 둘러싸 잠시 동안 이롭거나 해로운 마법 효과 모두를 차단합니다. 마법 막대, 주문서, 반지, 유물, 무기 마법, 그리고 저주의 효과 발생을 막습니다. 하지만 학생의 의상 능력은 이 효과를 무시할 정도로 강력하기 때문에, 여전히 사용이 가능합니다.
items.rings.ringofenergy.stats=이 반지를 착용하면 착용자의 마법 막대와 유물, 그리고 학생의 의상 충전 속도가 _%s%%_만큼 늘어납니다.
items.rings.ringofenergy.typical_stats=보통 이 반지를 착용하면 마법 막대와 유물, 그리고 학생의 의상 충전 속도가 _%s%%_만큼 늘어납니다.
items.potions.exotic.potionofmastery.armor_easier=당신의 의상이 착용하기 더 쉬워졌다!
items.bombs.bomb.rankings_desc=Defeated by an explosion
items.artifacts.driedrose$wndghosthero.armor_prompt=붙일 의상을 선택하세요
items.armor.classarmor.no_ability=현재 당신의 의상에는 아무런 능력이 없습니다. 하나를 선택하세요!
items.armor.classarmor.not_equipped=이 의상의 능력을 발동하기 위해선 이걸 먼저 입어야만 합니다!
items.armor.classarmor.low_charge=의상의 특별한 능력을 발동할 충전량이 부족하다!
items.armor.classarmor.transfer_complete=학생의 의상이 전승되었다!
items.armor.classarmor.discover_hint=This item appears after defeating the floor 20 boss with a specific student.
items.armor.glyphs.viscosity$defereddamage.ondeath=You succumbed to deferred damage...
items.armor.glyphs.viscosity$defereddamage.rankings_desc=Defeated by deferred damage
items.armor.glyphs.stone.desc=이 상형문자는 의상을 무거운 마법의 돌로 둘러싸 회피를 불가능하게 만들지만, 회피에 비례하여 받는 피해를 감소시킵니다.
items.armor.glyphs.antimagic.desc=이 강력한 상형문자가 부여된 의상은 착용자를 물리 공격뿐만 아니라 마법 공격으로부터도 보호합니다. 마법 방어력은 의상의 티어에 영향을 받지 않습니다.
items.armor.curses.overgrowth.desc=과다 성장의 의상은 다양한 꽃 피는 식물들로 덮여 있습니다. 이 효과는 흥미롭게 보이지만, 방어에는 어떤 도움도 되지 않을 것이며, 이러한 식물들은 전투에서 무작위로 활성화됩니다!
items.armor.curses.multiplicity.desc=다중성의 저주에 걸린 의상은 매우 위험한 복제 주문이 걸려 있습니다. 착용자의 거울상을 만들어 내기도 하지만, 이따금 공격자를 복제시켜 버립니다!
items.armor.curses.corrosion.desc=부식의 의상은 부식성 액체로 파열되어 해당 지역을 끈적이는 산성 점액으로 뒤덮을 수 있습니다.
items.armor.curses.bulk.desc=거추장스러운 의상은 더 크고 위협적이지만, 실제로 방어력이 강화되거나 하진 않습니다. 오히려 갑옷의 더 커진 부피가 출입구에 들어서기 더욱 어렵게 만드는 문제가 있습니다.

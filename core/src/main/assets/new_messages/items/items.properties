items.armor.racing.jacketracingsuit.stats_desc=이 옷은 방어력이 비교적 낮습니다.\n이 옷은 주변에 적이 없을 때 착용자의 이동 속도를 증가시킵니다.\n이 옷은 피격 시 착용자에게 초신속을 부여합니다.


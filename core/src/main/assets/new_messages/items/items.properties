items.conversionkit.name=Conversion Kit
items.conversionkit.desc=An attachment part Noa mounts onto firearms. Simply equipping it onto a firearm allows for easy modification and improves performance.\n\nConversion kits can be _attached to a firearm and freely transferred to other firearms._ Upgrading a firearm while the conversion kit is attached can upgrade the kit up to once; a firearm equipped with an upgraded conversion kit gains +1 bonus upgrade level.

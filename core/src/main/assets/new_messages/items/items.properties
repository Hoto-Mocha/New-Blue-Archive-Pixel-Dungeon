items.brokenseal.name=Millennium Emblem
items.brokenseal.ac_affix=Attach Emblem
items.brokenseal.prompt=붙일 의상을 선택하세요
items.brokenseal.unknown_armor=먼저 의상을 저주받았는지 확인해야 합니다.
items.brokenseal.cursed_armor=엠블럼은 저주받은 의상에 붙일 수 없다.
items.brokenseal.affix=의상에 엠블럼을 붙였다!
items.brokenseal.desc=아리스의 소중한 밀레니엄 엠블럼입니다.\n\n아리스의 보물인 이 엠블럼은 아리스의 인내력을 강화합니다. 엠블럼을 붙임으로써 최대 체력에 더하여 의상의 품질에 비례하는 추가 방어막을 얻을 수 있습니다.\n\n이 엠블럼은 _의상에 붙일 수 있으며, 여러 의상에 옮겨 붙일 수 있습니다._ 또한 1회에 한해 강화가 가능하며, 강화된 엠블럼이 붙은 방어구는 1 만큼의 강화수치를 얻습니다.
items.brokenseal.choose_title=Select a Glyph
items.brokenseal.choose_desc=해당 의상과 엠블럼에 모두 상형문자가 적혀 있습니다. 보존할 상형문자를 선택해주세요.\n\n의상에 부여된 상형문자를 보존할 경우, 이후 엠블럼을 옮길 때 그 상형문자를 같이 옮기지 않습니다.
items.brokenseal$warriorshield.name=Aris's Shield
items.brokenseal$warriorshield.desc_active=Aris's Millennium Emblem bolsters her fortitude, granting bonus shielding over her current health. Once depleted, it incurs a cooldown.\n\nThis shielding does not decay over time, but vanishes after a few turns if no enemies are nearby. Any unspent shielding reduces the cooldown by up to 50%%.\n\nRemaining shield: %1$d.\n\nCurrent cooldown: %2$d.
items.brokenseal$warriorshield.desc_cooldown=You recently received shielding from the Millennium Emblem and must wait before it can be used again.\n\nTurns remaining: %d.
items.brokenseal$warriorshield.desc_negative_cooldown=Aris's shield cooldown has currently become negative, reducing the cooldown accordingly when shielding activates. The shield cooldown can be reduced down to -150 turns, allowing the next shield to be ready immediately upon activation.\n\nCurrent cooldown: %d.


items.food.rollcake.name=Roll Cake
items.food.rollcake.desc=An exceptionally soft and sweet chocolate roll cake Mika brought for dessert. Can be eaten quickly to restore a bit of satiety and health. Be careful not to throw it, as it will no longer be edible.

items.quest.escapecrystal.leaving_kit=_The conversion kit attached to this firearm is bound to the mirror and cannot return with you._ The conversion kit will be removed from the firearm. This lowers the firearm's upgrade level by 1, but its enchantment will not be removed.

items.quest.escapecrystal.name=Escape Radio
items.quest.escapecrystal.ac_use=Use
items.quest.escapecrystal.prompt=Select an item
items.quest.escapecrystal.desc=A radio used to contact Akira. Using it lets you leave the vault at any time, but leaving early forfeits the full rewards!
items.quest.escapecrystal.discover_hint=This item appears during a specific quest.
items.quest.escapecrystal.injure_warning_1=Akira's voice crackles over the radio:\n\n"Hey there, you look pretty banged up—are you holding up alright? I really want that statue, but... please don't overdo it."
items.quest.escapecrystal.injure_warning_2="If you find yourself in a pinch, _you can always use the teleportation item in the starting room._ You can fall back there and try again."
items.quest.escapecrystal.injure_warning_3="If things get truly dangerous, _use the escape radio I gave you._ I'll pull you out right away. I won't be able to give you the full promised reward, but your safety comes before getting knocked out in there."
items.quest.escapecrystal.leaving_start=Akira's voice crackles over the radio:\n\n"Mm, I understand you're feeling uneasy, but please at least step out of the first room."\n\n"Don't worry about the gear you left in my care. I may steal works of art, but I never betray someone's trust. I'll be waiting right here until you return. And don't worry, I won't blame you for using it if you're in real danger."
items.quest.escapecrystal.leaving_early=Akira's voice crackles over the radio:\n\n"Escaping already...? Did you run into trouble so soon?"\n\n"Look, if it's an emergency I'll pull you out, but don't expect to bring anything back from there. That's quite disappointing..."
items.quest.escapecrystal.leaving_partly_explored=Akira's voice crackles over the radio:\n\n"Leaving already? Well... I suppose I should thank you just for clearing out some of the place."\n\n"Still, it's a bit disappointing. Of course, I'll extract you if you need, but you can only bring back simple potions or scrolls."
items.quest.escapecrystal.leaving_fully_explored=Akira's voice crackles over the radio:\n\n"Do you really have to go? You explored quite a bit, though. I had hoped you'd have more of a knack for stealing statues. Still, at least we now understand how the vault operates."\n\n"You can bring something from in there, but nothing upgraded!"
items.quest.escapecrystal.leaving_partial_victory=Akira's voice crackles over the radio:\n\n"I was hoping you'd retrieve the statue, but clearing out and exploring most of the vault was splendid work nonetheless."\n\n"Well, you may keep one item, provided it's upgraded no higher than +1. As for me, I'll head down below to set up shop. I need some time to plan my next move anyway."
items.quest.escapecrystal.leaving_victory=Akira's voice crackles over the radio:\n\n"Magnificent! Ready to depart? I'll take charge of the statue once you return."\n\n"As promised, I'll head down below and set up shop. And I'll let you bring out any single item you choose from in there! The rest will have to stay behind in the vault."
items.quest.escapecrystal.leaving_item=Are you sure that's the item you want to bring back?


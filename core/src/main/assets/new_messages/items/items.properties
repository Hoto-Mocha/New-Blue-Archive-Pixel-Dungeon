items.weapon.melee.gun.smg.twindragon.name=Twin Dragon
items.weapon.melee.gun.smg.twindragon.desc=A pair of submachine guns wielded by Neru.\n\nBoth are elaborately engraved with golden dragon emblems.
items.weapon.melee.gun.smg.twindragon.stats_desc=This firearm has very low accuracy, but fires twice as many bullets.
items.weapon.melee.gun.smg.twindragon.discover_hint=This firearm can be obtained through alchemy using an _SMG_.
items.weapon.melee.gun.smg.beyondthelumination.name=Beyond the Lumination
items.weapon.melee.gun.smg.beyondthelumination.desc=Natsu's submachine gun.\n\nIt is the weapon of last resort pulled out by Natsu, who prefers contemplative musings.
items.weapon.melee.gun.smg.beyondthelumination.stats_desc=This firearm blocks _0-%1$d_ damage.\nThis firearm has relatively low accuracy.\nThis firearm has higher accuracy at close range.\nRestores 1 HP for every _%2$d_ damage blocked with this firearm.
items.weapon.melee.gun.smg.beyondthelumination.typical_stats_desc=This firearm typically blocks _0-%1$d_ damage.\nThis firearm has relatively low accuracy.\nThis firearm has higher accuracy at close range.\nRestores 1 HP for every _%2$d_ damage blocked with this firearm.
items.weapon.melee.gun.smg.beyondthelumination.discover_hint=This firearm can be obtained through alchemy using an _SMG_.


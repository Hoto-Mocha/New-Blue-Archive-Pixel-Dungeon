items.weapon.melee.gun.gl.funnyfirework.name=Funny Fireworks
items.weapon.melee.gun.gl.funnyfirework.desc=A flare gun that Kaede always carries around.\n\nUsed literally as a signal device when spotting something of interest, Kaede often fires it into the air upon finding troublemakers causing incidents, or when discovering a rare Mushiquen card.
items.weapon.melee.gun.gl.funnyfirework.stats_desc=This firearm briefly blinds struck enemies and illuminates the surrounding area.

items.stones.stoneofaugmentation.desc=This runestone augments equipment to enhance one attribute at the expense of another.\n\nUse it on a weapon to boost either speed or damage. For thrown weapons, durability is gained or lost relative to attack speed.\n\nUse it on a school uniform to boost either evasion or defense.
items.scrolls.exotic.scrollofmetamorphosis.desc=This scroll contains powerful transformative magic directed at the caster rather than an item. Its magic allows you to swap one selected talent for one of five talents from the same talent tier of another class!\n\nThis effect can only alter class talents; subclass talents or uniform talents cannot be replaced. Talents you cannot utilize will not be offered.

items.artifacts.ninjacape$capestealth.name=Stealth
items.artifacts.ninjacape$capestealth.desc=When Izuna dons the Ninja Cape, she enters an invisible state. The invisibility effect persists until interrupted or until the cape runs out of energy.\n\nWhile invisible, enemies cannot track or attack you. However, physical attacks or magical effects (such as wands or scrolls) break invisibility immediately.\n\nTurns remaining until energy runs out: %d
items.artifacts.ninjacape$foxdoll.name=Fox Plushie
items.artifacts.ninjacape$foxdoll.desc=A handmade stuffed plushie sewn by Izuna. Somehow, enemies seem convinced that this is the real Izuna!
items.artifacts.ninjacape$foxdoll.discover_hint=This character appears via the effect of a specific EX Skill.


items.brokenseal.desc=Aris's precious Millennium Emblem.\n\nA treasure to Aris, this emblem bolsters her fortitude. Affixing the emblem grants bonus shielding based on the quality of the uniform, on top of her maximum health.\n\nThis emblem can be _affixed to a uniform and freely transferred to other uniforms._ It can also be upgraded once, granting +1 upgrade level to any armor it is attached to.

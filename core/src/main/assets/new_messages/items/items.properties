items.scrolls.emptyscroll.name=Blank Scroll
items.scrolls.emptyscroll.desc=A sheet of parchment with nothing written on it. By copying the contents of a scroll in your possession, it will gain the exact same power as that scroll.\n\nThis paper does not appear capable of replicating the immense power of Scrolls of Upgrade or Magical Infusion.
items.scrolls.emptyscroll.inv_title=Select a scroll to copy

items.active.trashbin.name=Distraction Device
items.active.trashbin.desc=A trash bin that blends in so perfectly with its surroundings that no one realizes anyone is inside once entered.\n\nUpon use, breaks the pursuit of all enemies tracking Miyu, causing them to move elsewhere.\n\nIf Miyu remains within an enemy's line of sight, she can be spotted again by enemies who lost track of her.\n\nIncurs a 20-turn cooldown after use.

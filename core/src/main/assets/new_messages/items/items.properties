items.armor.armor.cursed_worn=이 의상은 저주받았기 때문에, 당신은 이 의상을 벗을 수 없습니다.
items.armor.armor.cursed=당신은 악의로 가득 찬 마법이 이 의상에 깃든 것을 느낍니다.

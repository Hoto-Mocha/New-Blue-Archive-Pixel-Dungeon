items.weapon.melee.quick.assassinskunai.name=Assassin's Kunai
items.weapon.melee.quick.assassinskunai.desc=Izuna's kunai, capable of dealing heavy damage proportional to the enemy's max health when sneaking up to strike a vital point. It can attack enemies without being equipped. _Defeating an enemy with a sneak attack using the Assassin's Kunai restores a portion of the Ninja Cape's charge._\n\nPowerful enemies will resist bonus damage from sneak attacks.

items.artifacts.ninjacape.name=Ninja Cape
items.artifacts.ninjacape.ac_stealth=Stealth
items.artifacts.ninjacape.cooldown=The Ninja Cape requires %d more turns to recharge.
items.artifacts.ninjacape.cursed=Cannot use a cursed cape.
items.artifacts.ninjacape.no_charge=The Ninja Cape has not charged enough to be used.
items.artifacts.ninjacape.desc=A cape used by Izuna to completely disguise herself while carrying out ninja missions. Izuna can blink a short distance before cloaking; using it on her own tile cloaks her without blinking.\n\nThe Ninja Cape recharges slowly, but defeating enemies with the _Assassin's Kunai_ rapidly recovers its charge.\n\nThe cape upgrades as charge is consumed, increasing its maximum capacity and recharge rate as it levels up.
items.artifacts.ninjacape.prompt=Select a location to blink to
items.artifacts.ninjacape.discover_hint=A specific student starts with this item.
items.artifacts.ninjacape$capestealth.no_charge=The cape has run out of energy.
items.artifacts.ninjacape$capestealth.levelup=The cape has grown even stronger!
items.artifacts.ninjacape$capestealth.name=Stealth
items.artifacts.ninjacape$capestealth.desc=When Izuna dons the Ninja Cape, she enters an invisible state. The invisibility effect persists until interrupted or until the cape runs out of energy.\n\nWhile invisible, enemies cannot track or attack you. However, physical attacks or magical effects (such as wands or scrolls) break invisibility immediately.\n\nTurns remaining until energy runs out: %d
items.artifacts.ninjacape$foxdoll.name=Fox Plushie
items.artifacts.ninjacape$foxdoll.desc=A handmade stuffed plushie sewn by Izuna. Somehow, enemies seem convinced that this is the real Izuna!
items.artifacts.ninjacape$foxdoll.discover_hint=This character appears via the effect of a specific EX Skill.


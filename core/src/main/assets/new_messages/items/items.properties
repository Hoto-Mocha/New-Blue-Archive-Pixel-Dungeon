items.weapon.melee.gun.sg.shootingstar.name=Shooting☆Star
items.weapon.melee.gun.sg.shootingstar.desc=Reisa's cherished shotgun.\n\nIts painstakingly customized barrel makes it unmistakably Reisa's. Contrary to its cute appearance, it carries the hardened experience of surviving countless battlefields.
items.weapon.melee.gun.sg.shootingstar.stats_desc=This firearm deals relatively low damage.\nFiring this firearm alerts all enemies across the entire floor.\nOn hit, this firearm inflicts Amok on enemies.
items.weapon.melee.gun.sg.shootingstar.discover_hint=This firearm can be obtained through alchemy using an _SG_.
items.weapon.melee.gun.sg.mtet.name=Multi-Tactical Execution Tool
items.weapon.melee.gun.sg.mtet.desc=A shotgun with a rugged design favored by Eimi.\n\nTrue to its name, it is used for a variety of tasks, from door breaching to responding to paranormal events.
items.weapon.melee.gun.sg.mtet.stats_desc=This firearm deals relatively low damage.\nOn hit, this firearm ignites enemies and deals bonus damage to burning targets.
items.weapon.melee.gun.sg.mtet.discover_hint=This firearm can be obtained through alchemy using an _SG_.


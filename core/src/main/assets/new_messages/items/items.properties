items.weapon.melee.gun.hg.piety.name=Piety
items.weapon.melee.gun.hg.piety.desc=A handgun carried by Mari.\n\nThough she always keeps it on hand, hardly anyone has ever seen her actually shoot it.
items.weapon.melee.gun.hg.piety.stats_desc=This firearm always deals maximum damage against demons and undead.
items.weapon.melee.gun.hg.piety.discover_hint=This firearm can be obtained through alchemy using an _HG_.
items.weapon.melee.gun.hg.chistka.name=Chistka
items.weapon.melee.gun.hg.chistka.desc=A handgun Cherino uses when purging someone.\n\nWithout even needing to pull the trigger, simply aiming down the barrel and shouting "Purge!" is enough to carry out the purge.
items.weapon.melee.gun.hg.chistka.stats_desc=This firearm has a low chance to purge enemies, causing them to disappear into thin air.
items.weapon.melee.gun.hg.chistka.discover_hint=This firearm can be obtained through alchemy using an _HG_.
items.weapon.melee.gun.hg.chistka.purge=Purge!


items.active.trashbin$evasionbuff.name=Blur
items.active.trashbin$evasionbuff.desc=...I'm cloaked right now, so enemies won't be able to hit me even if they attack.\n\nGuarantees dodging the next attack within _%s turns_, but the effect disappears once an attack is dodged.


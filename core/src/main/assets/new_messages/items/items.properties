items.weapon.melee.gun.ar.uniqueidea.name=Unique Idea
items.weapon.melee.gun.ar.uniqueidea.desc=An assault rifle used by Momoi.\n\nIt features an accessory received from her beloved younger sister; fiddling with it whenever she's in a pinch seems to spark brilliant ideas.

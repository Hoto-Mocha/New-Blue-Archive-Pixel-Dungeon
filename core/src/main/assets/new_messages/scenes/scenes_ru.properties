scenes.heroselectscene.title=Пожалуйста, выберите студента.
scenes.heroselectscene.daily_desc=Каждый день всем доступен один и тот же подземелье! В режиме «Ежедневное испытание» все (играющие в одну и ту же версию) могут пройти одно и то же подземелье.\n\nВ режиме «Ежедневное испытание» нет ограничений по времени, но можно играть только в одну игру за раз. В режиме «Ежедневное испытание» нельзя заработать значки, но они дают уникальный рейтинг.\n\nХотите начать «Ежедневное испытание» в режиме «Испытание» с выбранным вами учеником?
scenes.heroselectscene.daily_repeat=Вы уже участвовали в сегодняшнем ежедневном задании. При желании вы можете сыграть в него ещё раз в качестве тренировочной игры без записи.\n\nВы можете завершить игру ещё раз и просмотреть её в окне «Ежедневные рейтинги» в течение короткого времени, после чего запись будет удалена.\n\nХотите ли вы сыграть в сегодняшнее ежедневное задание ещё раз со студентом, который его выбрал?

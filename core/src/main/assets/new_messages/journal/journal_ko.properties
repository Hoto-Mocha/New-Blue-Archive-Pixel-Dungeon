journal.document.intros.dungeon.body=수많은 학생들이 당신보다 먼저 도시 아래의 던전을 탐험하였지만, 대부분은 그 후로 영영 소식이 끊겨 버렸습니다.\n\n전해지는 바로는 어떤 사악한 고대의 존재가 옌더의 아뮬렛을 지키고 있다고 합니다. 지금에 이르러서는 그 사악한 기운이 올라오기 시작해, 도시 가까운 곳까지 영향을 끼치고 있습니다.\n\n당신은 던전을 정복하고 아뮬렛을 쟁취할 수 있을까요? 이제 당신만의 모험기를 만들어갈 차례입니다!
journal.document.adventurers_guide.levelling.body=레벨이 오르면 당신의 신체 능력이 향상되고, 전투에 큰 변화를 줄 수 있게 해 주는 특성 포인트를 얻습니다. 매 층마다 적어도 1 레벨은 얻는 것을 권장합니다.\n\n탐험과 전투를 무시하고 무작정 다음 층으로 달려가는 선택지가 좋아 보일 수 있지만, 이를 실천에 옮기면 당신에게 필요한 유용한 아이템과 경험치를 버리게 될 겁니다.\n\n(게임 인터페이스 구석에 자리잡은 스테이터스 판에서는 경험치를 포함한 각종 학생 정보를 볼 수 있습니다. 학생 그림을 선택해 더 많은 정보를 확인할 수 있습니다.)
journal.catalog.guns.title=총기

journal.document.intros.sewers.title=밀레니엄 폐허 하수구
journal.document.intros.sewers.body=밀레니엄 폐허는 어째서인지 총학생회가 출입을 금지하고 있는 곳입니다.\n\n폐허 밑 하수구의 무해한 생명체들은 던전 아래에서 올라오는 암흑의 기운 때문에 점점 더 위험해지고 있지만, 총학생회에서는 학생들의 안전 보장이라는 목적 하나만 가지고 이 곳의 출입을 금지한 걸까요?\n\n이곳은 위험한 장소긴 하지만, 그나마 사악한 기운은 강하지 않습니다.
journal.document.intros.prison.title=아비도스 폐허 빌딩
journal.document.intros.prison.body=사막화가 오랜 기간 진행되면서, 아비도스 자치구에는 폐허가 된 건물이 많아졌습니다.\n\n수많은 모래로 뒤덮힌 빌딩은 침식되고 무너져 내렸으며, 이제는 찬란했던 과거의 일부만을 보여 주고 있습니다.\n\n이 곳은 위험한 곳이지만, 부유했던 옛 시절의 유산들은 쓸모 있을지도 모릅니다...
journal.document.intros.caves.title=붉은겨울 연방학원 지하
journal.document.intros.caves.body=붉은겨울 연방학원의 매우 넓은 부지는 길을 잃기도 쉽지만, 넓은 만큼 관리가 소홀하기도 합니다.\n\n왜인진 모르겠지만 여기 있는 건물의 벽 속에는 가치 있는 보석이 박혀 있으며, 벽 곳곳에 있는 보석을 드물지 않게 발견할 수 있습니다.\n\n누군가가 무분별한 온천 개발과 보석 채광을 위해 마구잡이로 건물을 파 내어 건물의 구조가 엉망이 되어 버렸습니다...

journal.document.intros.dungeon.body=Бесчисленные студенты исследовали подземелье под городом до вас, но большая его часть была навсегда потеряна.\n\nХодят слухи, что злобная древняя сущность охраняет Амулет Йендера. Теперь эта злая энергия начала подниматься, затрагивая даже окрестности города.\n\nСможете ли вы покорить подземелье и заполучить амулет? Теперь ваша очередь создать собственное приключение!
journal.document.adventurers_guide.levelling.body=По мере повышения уровня улучшаются ваши физические способности, и вы получаете 1 очко характеристик, которые могут существенно повлиять на исход боя. Рекомендуется повышать уровень хотя бы на каждом этаже.\n\nХотя может показаться заманчивым сразу переходить на следующий этаж, игнорируя исследование и сражения, это приведет к растрате полезных предметов и очков опыта, которые вам необходимы.\n\n(Вы можете просмотреть различную информацию об учениках, включая очки опыта, на доске состояния, расположенной в углу игрового интерфейса. Выберите значок ученика, чтобы просмотреть дополнительную информацию.)
journal.catalog.guns.title=Огнестрельное оружие

journal.document.intros.sewers.title=Канализация "Руины тысячелетия"
journal.document.intros.sewers.body=По какой-то причине Студенческий совет запретил вход в Руины Тысячелетия.\n\nБезобидные существа в канализации под руинами подвергаются всё большей опасности из-за тёмной энергии, поднимающейся из-под подземелья, но запретил ли Студенческий совет вход исключительно ради обеспечения безопасности студентов?\n\nХотя это опасное место, злая энергия там не очень сильна.
journal.document.intros.prison.title=Здание руин Абидоса
journal.document.intros.prison.body=В результате длительного процесса опустынивания Абидосский автономный регион заполнился разрушенными зданиями.\n\nПокрытые бесчисленными песками, здания разрушились и обрушились, теперь от них остались лишь фрагменты славного прошлого.\n\nЭто опасное место, но наследие процветающих дней еще может быть полезным…
journal.document.intros.caves.title=Подвал Федеральной академии «Красная зима»
journal.document.intros.caves.body=Обширная территория Академии Красной Зимы Федерации позволяет легко заблудиться, но именно из-за её размеров за её содержанием часто пренебрегают.\n\nПо неизвестным причинам в стены зданий вмурованы ценные драгоценные камни, и нередко можно найти их разбросанными по всей стене.\n\nКто-то беспорядочно раскопал здания для безрассудного развития горячих источников и добычи драгоценных камней, оставив сооружения в ужасном состоянии…

journal.document.intros.dungeon.body=Countless students ventured into the dungeon beneath the city before you, but most were never heard from again.\nLegends say that an ancient, evil presence guards the Amulet of Yendor. Now, that sinister energy has begun to rise, reaching close to the city itself.\nWill you be able to conquer the dungeon and claim the Amulet? It is time to forge your own adventure!
journal.document.adventurers_guide.levelling.body=Leveling up improves your physical attributes and awards talent points that can make a major difference in combat. It is recommended to gain at least 1 level per floor.\nRushing blindly to the next floor while ignoring exploration and combat might seem tempting, but doing so will cost you vital items and experience you will need later.\n(The status pane in the corner of the interface displays various student stats, including experience. Tap or click the student portrait to view more information.)
journal.catalog.guns.title=Firearms

journal.document.intros.sewers.title=Millennium Ruins Sewers
journal.document.intros.sewers.body=For some reason, the Millennium Ruins have been placed off-limits by the General Student Council.\nWhile the harmless creatures in the sewers beneath the ruins are growing increasingly dangerous due to the dark energy rising from the dungeon depths, did the General Student Council ban entry solely to ensure student safety?\nWhile this is a dangerous place, at least the evil energy here is not very strong.
journal.document.intros.prison.title=Abydos Ruined Buildings
journal.document.intros.prison.body=As desertification progressed over a long period, many buildings in the Abydos Autonomous District fell into ruin.\nCovered in deep sand, these buildings have eroded and collapsed, now offering only a glimpse into their glorious past.\nThis is a dangerous place, but the relics left behind from those prosperous days may still prove useful...
journal.document.intros.caves.title=Red Winter Federal Academy Underground
journal.document.intros.caves.body=The vast grounds of the Red Winter Federal Academy are easy to get lost in, but their sheer size also makes them poorly maintained.\nFor reasons unknown, valuable gems are embedded within the walls here, and spotting them scattered across the stonework is not uncommon.\nSomeone recklessly excavated the buildings for haphazard hot spring development and gem mining, leaving the structural layout in utter shambles...


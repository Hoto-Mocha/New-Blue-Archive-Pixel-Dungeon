windows.wndblacksmith.prompt=Right... A deal is a deal. Here is what I can do for you. Bring me only identified and uncursed items, got that?\n\n_Current Favor: %d_
windows.wndblacksmith.pickaxe=_Pickaxe (%d favor):_ If you desire, I can bestow this pickaxe upon you. We have more than enough lying around here anyway.
windows.wndblacksmith.pickaxe_verify=You really need that old thing? The walls around these buildings were built far too sturdy for that flimsy pickaxe to scratch them.
windows.wndblacksmith.pickaxe_free=Ack, fine then... You did handle the job quite splendidly. I shall graciously bestow this pickaxe upon you!
windows.wndblacksmith.pickaxe_yes=Yes
windows.wndblacksmith.pickaxe_no=Nevermind
windows.wndblacksmith.reforge=_Reforge (%d favor):_ I can reforge two items of the same type into a single piece of higher quality equipment.
windows.wndblacksmith.harden=_Harden (%d favor):_ With the great technical prowess of Red Winter Academy, I can harden your weapon or school uniform. It will be much easier to preserve its enchantment or glyph.
windows.wndblacksmith.upgrade=_Upgrade (%d favor):_ With our superior engineering, I can readily upgrade an item for you as long as it's below +2.
windows.wndblacksmith.inscribe=_Engrave (%d favor):_ I can carve Red Winter's special engraving onto your firearm, greatly enhancing its performance.
windows.wndblacksmith.smith=_Craft (%d favor):_ If you wish, I can forge a weapon or armor from scratch. The result will likely be upgraded and of a higher tier. I'll even let you choose what to receive.
windows.wndblacksmith.smith_verify=Very well, I shall prepare the forge. Go ahead and make your choice.
windows.wndblacksmith.smith_yes=Decide
windows.wndblacksmith.smith_no=Nevermind
windows.wndblacksmith.cashout=_Cash Out (all favor):_ If you wish, I can simply hand over credits saved for my coup emergency fund. I shall grant you 1 credit per favor.
windows.wndblacksmith.cashout_verify=Alright, here is %d credits. Now take your leave!
windows.wndblacksmith.cashout_yes=Take credits
windows.wndblacksmith.cashout_no=Nevermind
windows.wndblacksmith$wndreforge.message=Very well. I can reforge two identified items of the same type. The weaker one will be destroyed to upgrade the stronger one. If both items share the same upgrade level, the one on the left will be upgraded.
windows.wndblacksmith$wndreforge.prompt=Reforge an item
windows.wndblacksmith$wndreforge.reforge=Reforge
windows.wndblacksmith$hardenselector.prompt=Harden an item
windows.wndblacksmith$upgradeselector.prompt=Upgrade an item
windows.wndblacksmith$wndsmith.prompt=Alright. Here is what the forge students have brought. I am a busy person, so make your choice swiftly.
windows.wndblacksmith$wndinscribe.message=You have an eye for quality. With our special technique, I can engrave a unique insignia onto a firearm of your choice. An engraved firearm sees a drastic boost in performance, so you certainly won't regret it. Do not bring me unidentified or cursed firearms.
windows.wndblacksmith$wndinscribe.prompt=Select a firearm to engrave
windows.wndblacksmith$wndinscribe.inscribe=Engrave


windows.wndblacksmith.prompt=Хорошо... обещание есть обещание. Я сделаю всё, что смогу. Приносите мне только оцененные предметы, не проклятые.\n\n_Текущая привязанность:%d_
windows.wndblacksmith.pickaxe=Кирка (%dДружба):_ Если хочешь, я могу подарить тебе кирку. В конце концов, здесь их предостаточно.
windows.wndblacksmith.pickaxe_verify=Тебе действительно нужна эта старая штуковина? Стены зданий здесь построены настолько прочно, что эта кирка даже близко не подойдёт.
windows.wndblacksmith.pickaxe_free=А, понятно... Поскольку вы отлично справились с работой, я лично вручу вам кирку.
windows.wndblacksmith.pickaxe_yes=Это верно.
windows.wndblacksmith.pickaxe_no=В этом нет необходимости.
windows.wndblacksmith.reforge=_Улучшение (%dДружба):_ Вы можете улучшить два предмета снаряжения одного типа, превратив их в один предмет с более высокими характеристиками.
windows.wndblacksmith.harden=_Укрепление (%dДружба):_ Благодаря технологиям великой Академии Красной Зимы я могу укрепить ваше оружие или униформу. Это облегчит поддержание магии или глифов, заложенных в вашем снаряжении.
windows.wndblacksmith.upgrade=Улучшение (%dДружба): Благодаря нашим передовым технологиям мы можем мгновенно улучшить снаряжение на +2 или меньше.
windows.wndblacksmith.inscribe=_Гравировка (%dДружба):_ Мы можем выполнить специальную гравировку Red Winter, которая значительно улучшит характеристики вашего огнестрельного оружия.
windows.wndblacksmith.smith=_Создание предметов (%dПривязанность):_ При желании вы можете создавать оружие или доспехи с нуля. Полученные предметы, скорее всего, будут улучшены и обладать относительно высоким уровнем. После создания вы сможете выбрать, какой из них оставить себе.
windows.wndblacksmith.smith_verify=Хорошо, я начну готовить кузницу, так что выбирайте, что хотите.
windows.wndblacksmith.smith_yes=Решать
windows.wndblacksmith.smith_no=В этом нет необходимости.
windows.wndblacksmith.cashout=_Обмен (все уровни привязанности):_ Если хотите, я могу просто отдать вам кредиты, которые я накопил в качестве резервного фонда на случай непредвиденных обстоятельств. Я начислю 1 кредит за каждый уровень привязанности.
windows.wndblacksmith.cashout_verify=Хорошо, вот%d и титры. А теперь отойдите в сторону!
windows.wndblacksmith.cashout_yes=Я возьму это
windows.wndblacksmith.cashout_no=В этом нет необходимости.
windows.wndblacksmith$wndreforge.message=Хорошо. Вы можете улучшить два предмета одного типа. Более слабый предмет будет уничтожен, а более сильный — улучшен. Обратите внимание, что если уровни улучшения двух предметов одинаковы, то будет улучшен тот, что слева.
windows.wndblacksmith$wndreforge.prompt=Пункт для уточнения
windows.wndblacksmith$wndreforge.reforge=Уточнение
windows.wndblacksmith$hardenselector.prompt=Затвердеть
windows.wndblacksmith$upgradeselector.prompt=Укрепить
windows.wndblacksmith$wndsmith.prompt=Хорошо. Вот предметы, которые принесли студенты-кузнецы. Я занят, поэтому, пожалуйста, выбирайте поскорее.
windows.wndblacksmith$wndinscribe.message=У вас хороший вкус. Благодаря нашей специальной технологии мы можем нанести особую гравировку на любое выбранное вами огнестрельное оружие. Гравированное оружие значительно улучшит свои характеристики, так что вы точно не пожалеете. Только убедитесь, что не принесете с собой оружие, которое вам незнакомо, или какое-либо «проклятое» оружие.
windows.wndblacksmith$wndinscribe.prompt=Оружие для гравировки
windows.wndblacksmith$wndinscribe.inscribe=Оттиск

windows.wndchoosesubclass.message=В процессе работы с базой данных тактической подготовки в вашем сознании возникает образ новых возможностей. Какую способность вы освоите?

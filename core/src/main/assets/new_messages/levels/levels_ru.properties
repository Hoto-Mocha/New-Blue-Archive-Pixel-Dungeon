levels.traps.trap.rankings_desc=%sПавший

levels.traps.grimtrap.ondeath=Вы попали в коварную ловушку...
levels.traps.grimtrap.desc=Эта ловушка пропитана чрезвычайно мощной разрушительной магией, способной мгновенно убить любого, кроме самого здорового ученика. Если наступить на неё, она выпустит смертельное заклинание в ближайшего персонажа.\n\nК счастью, это устройство всегда находится на виду.

levels.features.chasm.rankings_desc=Обрушилось в результате взрыва.

levels.prisonlevel.water_name=Стоячая вода
levels.prisonlevel.bookshelf_desc=Это деревянная книжная полка. Легко ли она загорится?
levels.prisonlevel.region_deco_name=Строительный мусор
levels.prisonlevel.region_deco_desc=Куча арматуры, засыпанная песком, перекрыла дорогу.
levels.prisonlevel.region_deco_alt_name=Кран
levels.prisonlevel.region_deco_alt_desc=К потолку подвешен кран для захвата и перемещения объекта.

levels.caveslevel.entrance_desc=Это лестница, ведущая на верхний этаж.
levels.caveslevel.exit_desc=Это лестница, ведущая вниз на нижний этаж.
levels.caveslevel.wall_deco_desc=Повреждена середина стены, и внутри видны какие-то синие минералы. Может ли быть так, что все здание инкрустировано драгоценными камнями?
levels.caveslevel.bookshelf_desc=Интересно, а кто-нибудь здесь вообще читает книги?
levels.caveslevel.water_name=Ледяная вода
levels.caveslevel.region_deco_desc=Это большая железная конструкция, предположительно использовавшаяся для добычи полезных ископаемых в Федеральной академии «Красная зима». При ближайшем рассмотрении верхняя часть, по-видимому, представляет собой железнодорожные пути для вагонеток.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=당신이 커다란 방에 발을 들이자, 무전기에서 아키라의 목소리가 들립니다:\n\n"아무래도 당신이 금고의 가장 깊은 방에 들어간 것 같네요. 조각상이 분명 그 앞에 있을 겁니다! 하지만 거기엔 분명히 무시무시한 수호자가 있을 게 분명해요. 그러니 _더 나아가기 전에 충분히 금고를 탐색하고 준비해야 해요!_ 저는 당신이 정말로 조각상을 가져와 줬으면 하거든요. 행운을 빌어요!
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=당신이 커다란 방에 발을 들이자, 무전기에서 아키라의 목소리가 들립니다:\n\n"아무래도 당신이 금고의 가장 깊은 방에 들어간 것 같네요. 조각상이 분명 그 앞에 있을 겁니다! 하지만 거기엔 분명히 무시무시한 수호자가 있을 게 분명해요. 그러니 _큰 싸움을 치르기 위해 충분히 강해졌는지 확인해!_ 저는 당신이 정말로 조각상을 가져와 줬으면 하거든요. 행운을 빌어요!"
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=이 바닥 타일에 있는 무늬는 아비도스 폐허에 있던 소환의 제단을 거대하게 확대해 놓은 것 같습니다.\n\n건물 전체에 에너지가 넘쳐흐르고, 마치 어떤 엄청난 힘이 곧 분출될 것처럼 느껴집니다.

levels.traps.grimtrap.ondeath=You were struck down by a grim trap...
levels.traps.grimtrap.desc=A grim trap holds powerful destructive magic within it, capable of instantly slaying anything but the heartiest student. When triggered, it will fire deadly magic at the closest creature.\n\nThankfully, these mechanisms are always fully exposed.

levels.features.chasm.rankings_desc=Killed by an explosion

levels.prisonlevel.water_name=Stagnant Water
levels.prisonlevel.bookshelf_desc=A bookshelf made of wood. Would it catch fire easily?
levels.prisonlevel.region_deco_name=Building Debris
levels.prisonlevel.region_deco_desc=A pile of rebar buried in sand is blocking the path.
levels.prisonlevel.region_deco_alt_name=Crane
levels.prisonlevel.region_deco_alt_desc=A crane used for grabbing and carrying objects hangs from the ceiling.

levels.caveslevel.entrance_desc=A ladder leading upstairs.
levels.caveslevel.exit_desc=A ladder leading downstairs.
levels.caveslevel.wall_deco_desc=The middle of the wall is broken, revealing a blue mineral inside. Could they have embedded gems throughout the entire building?
levels.caveslevel.bookshelf_desc=Would anyone even read books in a place like this?
levels.caveslevel.water_name=Freezing Water
levels.caveslevel.region_deco_desc=A massive steel structure presumably used by the Red Winter Federal Academy for mining. Looking closely, the tracks on top seem to be rails for minecarts.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=As you step into the large room, Akira's voice crackles over the radio:\n\n"Looks like you've made it into the deepest chamber of the vault. The statue must be right ahead! But there's bound to be a terrifying guardian watching over it. So, _make sure to fully explore the vault and prepare before heading any further!_ I really need you to bring that statue back to me. Best of luck!"
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=As you step into the large room, Akira's voice crackles over the radio:\n\n"Looks like you've made it into the deepest chamber of the vault. The statue must be right ahead! But there's bound to be a terrifying guardian watching over it. So, _make sure you are strong enough for a major battle!_ I really need you to bring that statue back to me. Best of luck!"
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=The pattern on these floor tiles resembles a vastly enlarged version of the summoning altar found in the Abydos ruins.\n\nEnergy surges throughout the entire building, feeling as though an immense power is about to erupt at any moment.

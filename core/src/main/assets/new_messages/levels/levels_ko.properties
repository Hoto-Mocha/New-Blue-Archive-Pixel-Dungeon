levels.traps.trap.rankings_desc=%s 에 의해 쓰러짐

levels.traps.grimtrap.ondeath=당신은 음침한 함정의 공격으로 쓰러졌다...
levels.traps.grimtrap.desc=매우 강력한 파괴 마법이 이 함정에 깃들어 있으며, 가장 건강한 학생을 제외한 모든 것을 일격사시킬 수 있을 정도다. 함정을 밟게 되면 가장 가까운 캐릭터에게 치명적인 마법을 발사할 것이다.\n\n다행히도 이 장치는 항상 드러나 있다.

levels.features.chasm.rankings_desc=폭발로 인해 쓰러짐

levels.prisonlevel.water_name=고인 물
levels.prisonlevel.bookshelf_desc=나무로 만들어진 책장이다. 불이 잘 붙을까?
levels.prisonlevel.region_deco_name=건물 잔해
levels.prisonlevel.region_deco_desc=모래에 파묻힌 철근 더미가 길을 막고 있다.
levels.prisonlevel.region_deco_alt_name=크레인
levels.prisonlevel.region_deco_alt_desc=무언가를 잡고 운반하기 위한 크레인이 천장에 매달려 있다.

levels.caveslevel.entrance_desc=위층으로 올라가는 사다리이다.
levels.caveslevel.exit_desc=아랫층으로 내려가는 사다리이다.
levels.caveslevel.wall_deco_desc=벽 중간이 망가져 있고, 안에 어떤 푸른 색의 광물이 보인다. 설마 건물 전체에 보석을 박아 넣은 건가?
levels.caveslevel.bookshelf_desc=여기에서 책을 읽는 사람이 있기는 할까?
levels.caveslevel.water_name=얼음장 같은 물
levels.caveslevel.region_deco_desc=붉은겨울 연방학원에서 광산을 채굴할 때 썼던 것으로 추정되는 커다란 철제 구조물이다. 자세히 보니 상부에 놓인 것이 광산 수레용 철길 같아 보이기도 하다.

levels.rooms.quest.vault.vaultfinalroom.imp_warning_unprepared=당신이 커다란 방에 발을 들이자, 무전기에서 아키라의 목소리가 들립니다:\n\n"아무래도 당신이 금고의 가장 깊은 방에 들어간 것 같네요. 조각상이 분명 그 앞에 있을 겁니다! 하지만 거기엔 분명히 무시무시한 수호자가 있을 게 분명해요. 그러니 _더 나아가기 전에 충분히 금고를 탐색하고 준비해야 해요!_ 저는 당신이 정말로 조각상을 가져와 줬으면 하거든요. 행운을 빌어요!
levels.rooms.quest.vault.vaultfinalroom.imp_warning_prepared=당신이 커다란 방에 발을 들이자, 무전기에서 아키라의 목소리가 들립니다:\n\n"아무래도 당신이 금고의 가장 깊은 방에 들어간 것 같네요. 조각상이 분명 그 앞에 있을 겁니다! 하지만 거기엔 분명히 무시무시한 수호자가 있을 게 분명해요. 그러니 _큰 싸움을 치르기 위해 충분히 강해졌는지 확인해!_ 저는 당신이 정말로 조각상을 가져와 줬으면 하거든요. 행운을 빌어요!"
levels.rooms.quest.vault.vaultfinalroom$markertiles.desc=이 바닥 타일에 있는 무늬는 아비도스 폐허에 있던 소환의 제단을 거대하게 확대해 놓은 것 같습니다.\n\n건물 전체에 에너지가 넘쳐흐르고, 마치 어떤 엄청난 힘이 곧 분출될 것처럼 느껴집니다.
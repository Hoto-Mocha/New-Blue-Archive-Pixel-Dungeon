actors.mobs.fox.kurumi.desc=Takakura Kurumi, 3rd year at SRT Special Academy, FOX Platoon — FOX 3.\n\nKurumi is equipped with an _SMG_, but _does not appear to fire it_.\nKurumi can only perform _close-range attacks_.\nKurumi has low _evasion_ and _attack damage_.\nKurumi has relatively high _health_ and _defense_.

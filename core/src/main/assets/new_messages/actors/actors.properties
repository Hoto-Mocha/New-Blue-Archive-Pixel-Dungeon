actors.mobs.fox.otogi.name=Otogi
actors.mobs.fox.otogi.desc=Tenjinyama Otogi, 3rd year at SRT Special Academy, FOX Platoon — FOX 4.\n\nOtogi is equipped with an _SR_.\nOtogi can only perform _ranged attacks_.\nOtogi has high _accuracy_ and _attack damage_.\nOtogi has relatively low _health_.

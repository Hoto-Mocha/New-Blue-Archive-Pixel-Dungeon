actors.hero.talent.mari_armor2_3.desc=_+1:_ 성령의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 유지되는 _15_의 방어막을 얻습니다. 충전 소모량: 6\n\n_+2:_ 성령의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 유지되는 _30_의 방어막을 얻습니다. 충전 소모량: 6\n\n_+3:_ 성령의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 유지되는 _45_의 방어막을 얻습니다. 충전 소모량: 6\n\n_+4:_ 성령의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 유지되는 _60_의 방어막을 얻습니다. 충전 소모량: 6\n\n방어막은 최대 체력과 동일한 양까지 중첩이 가능합니다.

actors.hero.talent.mari_armor3_1.title=앙코르 라이브
actors.hero.talent.mari_armor3_1.desc=_+1:_ 앙코르 라이브 기적을 얻습니다. 아이돌 콘서트 종료 후 5턴 이내에 사용 가능하며, 아이돌 콘서트를 다시 진행합니다. 충전 소모량: _12_\n\n_+2:_ 앙코르 라이브 기적을 얻습니다. 아이돌 콘서트 종료 후 5턴 이내에 사용 가능하며, 아이돌 콘서트를 다시 진행합니다. 충전 소모량: _8_\n\n_+3:_ 앙코르 라이브 기적을 얻습니다. 아이돌 콘서트 종료 후 5턴 이내에 사용 가능하며, 아이돌 콘서트를 다시 진행합니다. 충전 소모량: _4_\n\n_+4:_ 앙코르 라이브 기적을 얻습니다. 아이돌 콘서트 종료 후 5턴 이내에 사용 가능하며, 아이돌 콘서트를 다시 진행합니다. 충전 소모량: _0_
actors.hero.talent.mari_armor3_2.title=자애의 키스 날리기
actors.hero.talent.mari_armor3_2.desc=_+1:_ 자애의 키스 날리기 기적을 얻습니다. 적 하나를 지정해 아군으로 만들고, _3턴_의 아드레날린을 부여합니다. 충전 소모량: 10\n\n_+2:_ 자애의 키스 날리기 기적을 얻습니다. 적 하나를 지정해 아군으로 만들고, _6턴_의 아드레날린을 부여합니다. 충전 소모량: 10\n\n_+3:_ 자애의 키스 날리기 기적을 얻습니다. 적 하나를 지정해 아군으로 만들고, _9턴_의 아드레날린을 부여합니다. 충전 소모량: 10\n\n_+4:_ 자애의 키스 날리기 기적을 얻습니다. 적 하나를 지정해 아군으로 만들고, _12턴_의 아드레날린을 부여합니다. 충전 소모량: 10
actors.hero.talent.mari_armor3_3.title=넘치는 하트
actors.hero.talent.mari_armor3_3.desc=_+1:_ 넘치는 하트 기적을 얻습니다. 매 _5턴_마다 1의 체력을 총 5만큼 회복합니다. 아이돌 콘서트 도중에는 회복이 계속해서 이어지며, 아이돌 콘서트 종료 시 효과가 즉시 제거됩니다. 충전 소모량: 10\n\n_+2:_ 넘치는 하트 기적을 얻습니다. 매 _4턴_마다 1의 체력을 총 5만큼 회복합니다. 아이돌 콘서트 도중에는 회복이 계속해서 이어지며, 아이돌 콘서트 종료 시 효과가 즉시 제거됩니다. 충전 소모량: 10\n\n_+3:_ 넘치는 하트 기적을 얻습니다. 매 _3턴_마다 1의 체력을 총 5만큼 회복합니다. 아이돌 콘서트 도중에는 회복이 계속해서 이어지며, 아이돌 콘서트 종료 시 효과가 즉시 제거됩니다. 충전 소모량: 10\n\n_+4:_ 넘치는 하트 기적을 얻습니다. 매 _2턴_마다 1의 체력을 총 5만큼 회복합니다. 아이돌 콘서트 도중에는 회복이 계속해서 이어지며, 아이돌 콘서트 종료 시 효과가 즉시 제거됩니다. 충전 소모량: 10

actors.hero.abilities.mari.lightmagazinereload.name=빛의 탄창 장전
actors.hero.abilities.mari.lightmagazinereload.short_desc=마리는 장착한 총기를 즉시 재장전하며 장전한 탄환의 수만큼 _빛의 탄창 효과_를 얻습니다.
actors.hero.abilities.mari.lightmagazinereload.desc=마리는 턴 소모 없이 장착한 총기를 재장전하고, 장전한 탄환의 수만큼 빛의 탄창 효과를 얻습니다. 재장전 시 효과가 발동하지 않으며, 따라서 빛의 탄창 효과가 제거되지 않습니다.
actors.hero.abilities.mari.maritrinity.name=삼위일체
actors.hero.abilities.mari.maritrinity.short_desc=마리는 잠시 동안 _벽 너머로 탄환을 발사할 수 있으며_ 기적으로 추가 효과를 모두 얻으면 신성 피해가 증가합니다.
actors.hero.abilities.mari.maritrinity.desc=마리는 삼위일체의 힘을 얻어, 15턴 동안 벽 너머로 탄환을 발사할 수 있게 됩니다. 기적을 통해 삼위일체의 힘을 완전하게 만들면 삼위일체가 유지되는 동안 가하는 모든 신성 피해가 +50% 증가합니다.
actors.hero.abilities.mari.maritrinity$trinitybuff.name=삼위일체
actors.hero.abilities.mari.maritrinity$trinitybuff.desc=마리가 신성한 힘의 가호를 받아 벽 너머로 탄환을 발사할 수 있게 되었습니다. 삼위일체가 유지되는 동안 시전한 4티어 기적의 추가 효과가 유지되며, 삼위일체의 효과가 사라지면 추가 효과 또한 제거됩니다.
actors.hero.abilities.mari.maritrinity$trinitybuff.desc_red=마리에게 _성체의 힘_이 깃들었으며, 마리가 _%1$d-%2$d_의 물리 방어력을 추가로 얻게 되었습니다.
actors.hero.abilities.mari.maritrinity$trinitybuff.desc_yellow=마리에게 _성심의 힘_이 깃들었으며, 마리가 반경 _%d타일_까지 장애물에 상관없이 시야를 확보할 수 있게 되었습니다.
actors.hero.abilities.mari.maritrinity$trinitybuff.desc_blue=마리에게 _성령의 힘_이 깃들었으며, 마리가 _%d_의 방어막을 얻었습니다.
actors.hero.abilities.mari.maritrinity$trinitybuff.desc_all=마리에게 _완전한 힘_이 깃들었으며, 적에게 가하는 신성 피해가 _+50%_ 증가합니다!
actors.hero.abilities.mari.maritrinity$trinitybuff.desc_left=남은 턴: _%d_.
actors.hero.abilities.mari.idolconcert.name=아이돌 콘서트
actors.hero.abilities.mari.idolconcert.short_desc=마리는 _아이돌 콘서트_를 진행해 층 전체의 분위기를 뜨겁게 달굽니다.
actors.hero.abilities.mari.idolconcert.desc=마리는 아이돌 콘서트를 시작하여 50턴 동안 움직일 수 없게 되며 심안을 얻고, 그 동안 적이 마리를 공격하지 않습니다. 그 동안 매 5턴마다 층 전체의 모든 적들에게 5턴의 광란을 부여하고, 층 전체의 모든 아군의 체력을 5만큼 회복합니다.
actors.hero.abilities.mari.idolconcert$encore.name=앙코르
actors.hero.abilities.mari.idolconcert$encore.desc=아, 팬 분들이 앙코르 요청을 하고 있어요! 지금이라면 한 곡 더 부를 수 있을지도 몰라요.\n\n앞으로 _%s턴_ 정도는 이 열기가 지속될 거예요.

actors.hero.miracles.marimiracle.prompt=대상을 선택하세요
actors.hero.miracles.marimiracle.no_target=대상이 없다.
actors.hero.miracles.marimiracle.invalid_target=해당 지역을 목표로 할 수 없다.
actors.hero.miracles.marimiracle.invalid_enemy=그 적을 대상으로 할 수 없다.
actors.hero.miracles.marimiracle.charge_cost=충전 소모량: %d

actors.hero.miracles.lightbullet.name=광탄
actors.hero.miracles.lightbullet.prompt=발사할 위치를 선택하세요
actors.hero.miracles.lightbullet.short_desc=원거리 신성 피해를 입히며 탄환을 장전하고 다음 탄환이 반드시 적중.
actors.hero.miracles.lightbullet.desc=마리가 신성력으로 이루어진 탄환을 발사해 대상에게 _2-8_ 피해를 입힙니다. 장착 중인 총기의 탄환을 1발 장전합니다. 또한 다음에 발사하는 힘 제한을 충족하는 탄환 1발이 반드시 명중합니다. 이 효과는 장착 중인 총기의 최대 장탄수까지 중첩할 수 있으며, 총기를 재장전하면 사라집니다.
actors.hero.miracles.lightbullet.desc_prayer=이 기적은 경건한 성자인 마리가 사용하면 50턴마다 충전량 소모 없이 사용할 수 있으며, 빛의 탄창 효과를 성탄으로 소모하면 마리의 레벨과 동일한 추가 신성 피해를 줍니다.
actors.hero.miracles.lightbullet$lightbulletprayercooldown.name=광탄
actors.hero.miracles.lightbullet$lightbulletprayercooldown.desc=마리는 50턴마다 광탄을 충전량 소모 없이 사용할 수 있습니다.\n\n남은 턴: _%s_.
actors.hero.miracles.lightbullet$lightmagazine.name=빛의 탄창
actors.hero.miracles.lightbullet$lightmagazine.desc=마리의 신성력으로 인해 강화된 탄환이 빛을 내, 탄창이 빛나고 있습니다.\n\n다음에 발사하는 힘 제한을 충족하는 탄환 _%d_발이 반드시 명중합니다. 이 효과는 총기를 재장전하면 즉시 사라집니다.

actors.hero.miracles.protection.name=가호
actors.hero.miracles.protection.short_desc=50턴 동안 방어력이 1 오르며 벼락 피해가 2 증가.
actors.hero.miracles.protection.desc=마리가 신성한 힘으로 둘러싸여 다음 50턴 동안 방어력이 _+1_ 증가하며 적에게 내리치는 벼락의 피해가 _+2_ 증가합니다. 이 기적은 턴 소모 없이 시전할 수 있습니다.
actors.hero.miracles.protection.desc_prayer=이 기적은 경건한 성자인 마리가 사용하면 더욱 강력해집니다. 효과가 지속되는 동안 추가 방어력이 3으로 증가하며, 추가 벼락 피해는 4로 증가합니다. 또한 벼락이 내리칠 때마다 빛의 탄창 효과를 하나씩 얻습니다.
actors.hero.miracles.protection.desc_symbol=이 기적은 평화의 상징인 마리가 사용하면 더욱 강력해집니다. 방어력이 물리 피해 뿐만이 아닌 굶주림을 제외한 모든 피해를 감소시키게 됩니다.
actors.hero.miracles.protection$protectionbuff.name=가호
actors.hero.miracles.protection$protectionbuff.desc=마리가 현재 신성한 힘으로 둘러싸여 있습니다. 이 효과는 마리의 물리 방어력을 _+%1$d_만큼 증가시키고, 마리를 공격하는 적에게 내리치는 벼락의 피해량을 _+%2$d_만큼 증가시킵니다.\n\n남은 턴: _%3$s_.
actors.hero.miracles.protection$protectionbuff.desc_symbol=마리가 현재 신성한 힘으로 둘러싸여 있습니다. 이 효과는 굶주림을 제외한 모든 피해를 _%1$d_만큼 감소시키고, 마리를 공격하는 적에게 내리치는 벼락의 피해량을 _+%2$d_만큼 증가시킵니다.\n\n남은 턴: _%3$s_.

actors.hero.miracles.pray.name=기도
actors.hero.miracles.pray.short_desc=5턴 동안 기도하여 충전과 유물 충전 효과를 얻음.
actors.hero.miracles.pray.desc=마리가 5턴 동안 정성을 담아 기도합니다. 기도를 마치고 나면 5턴의 충전과 유물 충전 효과를 얻습니다.\n\n기도에는 5턴의 허기를 추가로 소모하며, 기도하는 도중에는 십자가 목걸이의 현재 충전량에 따라 30%-80%의 피해 감소 효과를 얻습니다. 충전량이 적을수록 피해 감소량이 많아집니다.

actors.hero.miracles.unholydetection.name=부정 감지
actors.hero.miracles.unholydetection.prompt=아이템을 선택하세요
actors.hero.miracles.unholydetection.short_desc=아이템의 저주 여부를 확인.
actors.hero.miracles.unholydetection.desc=마리가 아이템에 감각을 집중하여 착용하지 않고도 저주 유무를 확인할 수 있습니다.

actors.hero.miracles.silverbullet.name=은탄
actors.hero.miracles.silverbullet.prompt=발사할 위치를 선택하세요
actors.hero.miracles.silverbullet.short_desc=원거리 신성 피해를 입히며 탄환을 장전하고 대상을 실명시킴.
actors.hero.miracles.silverbullet.desc=마리가 부정한 힘을 정화하는 은 탄환을 발사해 대상에게 _%1$d-%2$d_ 피해를 입히고 대상을 _%3$d_턴만큼 실명시킵니다. 장착 중인 총기의 탄환을 1발 장전합니다. 악마와 언데드는 항상 최대의 피해를 입습니다.

actors.hero.miracles.mindbind.name=정신의 결속
actors.hero.miracles.mindbind.prompt=위치를 선택하세요
actors.hero.miracles.mindbind.short_desc=지정한 위치에 있는 적에 대해 심안을 얻음.
actors.hero.miracles.mindbind.desc=마리가 지정한 위치에 있는 적 하나와 영적인 결속을 맺어 _%d 턴_ 동안 해당 대상의 위치를 볼 수 있게 됩니다. 이 효과가 유지되는 동안 _해당 대상에게 발사하는 탄환이 벽을 관통합니다_. 시야 밖의 위치도 지정할 수 있지만, 대상이 없더라도 충전량을 소모합니다.

actors.hero.miracles.blessofcharity.name=자애의 축복
actors.hero.miracles.blessofcharity.prompt=대상을 선택하세요
actors.hero.miracles.blessofcharity.short_desc=시야 내 대상에게 축복과 지속적인 방어막을 제공.
actors.hero.miracles.blessofcharity.desc=마리가 시야 내에 있는 대상 하나에게 자애의 축복을 하사합니다. 대상은 10턴의 축복을 얻고, 10턴 동안 매 턴마다 _%d_의 방어막을 얻습니다. 방어막은 중첩되지 않습니다.
actors.hero.miracles.blessofcharity$blessofcharitybuff.name=자애의 축복
actors.hero.miracles.blessofcharity$blessofcharitybuff.desc=대상의 신체에 신성한 축복이 깃들어, 지속적인 방어막을 얻고 있습니다.\n\n남은 턴: _%s_.

actors.hero.miracles.purification.name=정화의 세례
actors.hero.miracles.purification.short_desc=디버프를 정화하고 방어막을 얻음.
actors.hero.miracles.purification.desc=마리가 자신과 시야 내에 있는 모든 아군이 가진 해로운 효과를 제거합니다. 또한 영향을 받은 대상은 _%1$d턴_의 디버프 면역과 _%2$d_의 방어막을 얻습니다.

actors.hero.miracles.holybullet.name=성탄
actors.hero.miracles.holybullet.prompt=발사할 위치를 선택하세요
actors.hero.miracles.holybullet.short_desc=원거리 신성 피해를 입히며 처치 시 탄환을 모두 장전함.
actors.hero.miracles.holybullet.desc=마리가 성스러운 힘이 담긴 탄환을 발사해 대상에게 _10-20_의 피해를 입힙니다. 장착 중인 총기의 탄환을 1발 장전합니다. 만약 빛의 탄창 효과가 있다면 효과를 1회 소모하고 _%d_의 피해를 추가로 입힙니다. 만약 적을 처치했다면 장착 중인 총기의 탄환을 모두 장전합니다. 악마와 언데드는 1.5배의 피해를 입습니다.

actors.hero.miracles.holyblast.name=단호한 결의
actors.hero.miracles.holyblast.short_desc=주변의 대상을 밀어냄.
actors.hero.miracles.holyblast.desc=마리가 성스러운 힘을 모아 폭발시켜 주변 3x3 범위의 모든 대상을 바깥쪽 방향으로 _%d 타일_ 밀어냅니다.
actors.hero.miracles.holyblast$holyblastcooldown.name=재사용 대기 시간: 단호한 결의
actors.hero.miracles.holyblast$holyblastcooldown.desc=최근에 마리가 단호한 결의를 시전하여, 준비될 때까지 기다려야 합니다.\n\n남은 턴: _%s_.

actors.hero.miracles.thunderlance.name=뇌창
actors.hero.miracles.thunderlance.prompt=던질 위치를 선택하세요
actors.hero.miracles.thunderlance.short_desc=빛의 탄창을 소모하여 강력한 뇌창을 던짐.
actors.hero.miracles.thunderlance.desc=마리가 신성력을 한데 모아 창의 형태로 만들어 발사합니다. 이 창은 %1$d-%2$d 피해를 입히고 %3$d턴의 마비를 부여하며, 언데드나 악마 적에겐 반드시 최대 피해를 입힙니다.

actors.hero.miracles.holymantle.name=신성한 보호막
actors.hero.miracles.holymantle.short_desc=다음 공격 피해를 1회 막음.
actors.hero.miracles.holymantle.desc=마리가 자신 주변에 보호막을 펼쳐 다음에 받는 공격을 1회 막아냅니다. 공격을 막고 나서 50턴의 재사용 대기 시간이 있습니다.
actors.hero.miracles.holymantle$holymantlebuff.name=신성한 보호막
actors.hero.miracles.holymantle$holymantlebuff.desc=앗, 지금은 근처에 오시면 안 돼요. 이 보호막은 제게 향하는 적의 공격을 튕겨내지만, 약한 자극에도 사라져버리거든요.\n\n신성한 보호막은 적으로부터 다음에 받는 공격을 1회 막아내고 사라질 거예요.
actors.hero.miracles.holymantle$holymantlebuffcooldown.name=재사용 대기 시간: 신성한 보호막
actors.hero.miracles.holymantle$holymantlebuffcooldown.desc=지금은 신성한 보호막을 쓸 수 없어요.\n\n_%s턴_ 정도만 기다려 주시겠어요? 금방 준비할게요. :)

actors.hero.miracles.healingtouch.name=치유의 손길
actors.hero.miracles.healingtouch.prompt=대상을 선택하세요
actors.hero.miracles.healingtouch.short_desc=대상을 일시적으로 완전 치유함.
actors.hero.miracles.healingtouch.desc=마리가 지정한 대상을 완전히 치료합니다. 대상은 회복한 체력만큼의 지연된 피해를 얻고, 마리는 회복한 체력만큼의 방어막을 얻습니다. 마리 스스로를 치유할 경우 방어막을 얻지 않습니다.\n\n이 효과로 발생한 지연된 피해는 디버프 제거 효과로 제거되지 않습니다.

actors.hero.miracles.baptize.name=세례
actors.hero.miracles.baptize.prompt=대상을 선택하세요
actors.hero.miracles.baptize.short_desc=방어막을 소모하고 신성 피해를 입힘.
actors.hero.miracles.baptize.desc=마리가 가지고 있는 방어막을 전부 소모하고, 지정한 적에게 _%d_의 피해를 입힙니다.

actors.hero.miracles.salvation.name=구원
actors.hero.miracles.salvation.short_desc=모든 대상에게 무적 효과를 부여함.
actors.hero.miracles.salvation.desc=마리가 엄청난 신성력을 발휘해 층 전체에 있는 모든 대상에게 무적 효과를 _%d턴_ 부여합니다.

actors.hero.miracles.repent.name=회개
actors.hero.miracles.repent.prompt=대상을 선택하세요
actors.hero.miracles.repent.short_desc=대상을 확률적으로 아군으로 만듦.
actors.hero.miracles.repent.desc=마리는 근접한 적을 _대상이 잃은 체력 비율_의 확률로 아군으로 만듭니다. 아군으로 만드는 데에 실패하면 대신 약화를 10턴 부여합니다.
actors.hero.miracles.repent.alt_desc=마리는 근접한 적을 _대상이 잃은 체력 비율+%d%%_의 확률로 아군으로 만듭니다. 아군으로 만드는 데에 실패하면 대신 약화를 10턴 부여합니다.

actors.hero.miracles.holybody.name=성체의 힘
actors.hero.miracles.holybody.short_desc=삼위일체가 유지되는 동안 추가 방어력을 얻음.
actors.hero.miracles.holybody.desc=마리에게 성체의 힘이 깃들어, 삼위일체가 유지되는 동안 _%1$d-%2$d_의 물리 방어력을 얻습니다. 방어력은 최대 2회 중첩이 가능합니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 늘립니다.

actors.hero.miracles.holymind.name=성심의 힘
actors.hero.miracles.holymind.short_desc=삼위일체가 유지되는 동안 벽 너머 시야를 얻음.
actors.hero.miracles.holymind.desc=마리에게 성심의 힘이 깃들어, 삼위일체가 유지되는 동안 _+%1$d_타일의 벽 너머 시야를 얻습니다. 시야 범위는 최대 _%2$d_타일까지 중첩됩니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 늘립니다.

actors.hero.miracles.holysoul.name=성령의 힘
actors.hero.miracles.holysoul.short_desc=삼위일체가 유지되는 동안 방어막을 얻음.
actors.hero.miracles.holysoul.desc=마리에게 성령의 힘이 깃들어, 삼위일체가 유지되는 동안 지속되는 방어막을 _%d_ 얻습니다. 방어막은 최대 체력과 동일한 양까지 중첩됩니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 늘립니다.

actors.hero.miracles.flash.name=섬광 탄환
actors.hero.miracles.flash.short_desc=다음에 발사하는 탄환이 적을 실명시키고 주변을 밝힘.
actors.hero.miracles.flash.desc=빛의 탄창의 효과가 강화되며 다음에 발사하는 탄환이 적을 _%1$d턴_ 실명시키고 _%2$d턴_의 발광을 얻습니다. 턴을 소모하지 않으며, 빛의 탄창 효과가 제거되면 효과가 사라집니다.
actors.hero.miracles.flash$flashbuff.desc=빛의 탄창이 강화되었으며, 다음에 발사하는 탄환이 _적을 실명시키고 주변을 밝힙니다_.

actors.hero.miracles.blessoflight.name=빛의 은혜
actors.hero.miracles.blessoflight.short_desc=빛의 탄창이 추가로 생명력 흡수 효과를 얻음.
actors.hero.miracles.blessoflight.desc=빛의 탄창의 효과가 강화되며 효과가 유지되는 동안 마리가 탄환으로 입히는 피해의 _40%_만큼 체력을 회복합니다.
actors.hero.miracles.blessoflight$blessoflightbuff.desc=빛의 탄창이 강화되었으며, 효과가 유지되는 동안 _마리가 입히는 피해의 일정량을 체력으로 회복합니다_.

actors.hero.miracles.punishmentbullet.name=천벌의 탄환
actors.hero.miracles.punishmentbullet.short_desc=빛의 탄창이 추가로 벼락을 내리침.
actors.hero.miracles.punishmentbullet.desc=빛의 탄창의 효과가 강화되며 효과가 유지되는 동안 마리가 탄환을 명중시킬 때마다 _%d%%_ 확률로 대상에게 벼락을 내리칩니다.
actors.hero.miracles.punishmentbullet$punishmentbulletbuff.desc=빛의 탄창이 강화되었으며, 효과가 유지되는 동안 _탄환이 확률적으로 대상에게 벼락을 내리칩니다_.

actors.hero.miracles.encore.name=앙코르
actors.hero.miracles.encore.short_desc=아이돌 콘서트를 다시 함.
actors.hero.miracles.encore.desc=마리가 아이돌 콘서트를 한 번 더 진행합니다. 콘서트가 끝나고 5턴 이내에 사용할 수 있습니다.

actors.hero.miracles.charitykiss.name=자애의 키스 날리기
actors.hero.miracles.charitykiss.prompt=대상을 선택하세요
actors.hero.miracles.charitykiss.short_desc=대상을 아군으로 만듦.
actors.hero.miracles.charitykiss.desc=마리가 적 하나에게 자애의 키스를 날려, 대상을 완전히 매료시켜 아군으로 만듭니다. 대상은 매우 기쁜 나머지 _%d턴_의 아드레날린을 얻게 됩니다.

actors.hero.miracles.heartoverflow.name=넘치는 하트
actors.hero.miracles.heartoverflow.short_desc=일정 주기로 약간의 체력을 회복함.
actors.hero.miracles.heartoverflow.desc=마리가 팬들의 사랑을 듬뿍 받아 자신의 체력을 _%d턴_마다 1씩, 총 _%d_만큼 회복합니다. 콘서트 도중에는 회복이 계속해서 유지되지만, 콘서트가 끝나면 즉시 효과가 사라집니다.
actors.hero.miracles.heartoverflow$heartoverflowbuff.name=넘치는 하트
actors.hero.miracles.heartoverflow$heartoverflowbuff.desc=팬 분들이 이렇게나 가득 마음을 전해 주고 계셔서 정말 기뻐요!\n\n매 _%d턴_마다 체력을 1씩 회복하고, 총 _%d_의 체력을 더 회복할 수 있지만, 콘서트 도중에는 회복이 중단되지 않을 거예요.


###npcs
actors.mobs.npcs.blacksmith.name=Cherino
actors.mobs.npcs.blacksmith.intro_quest_all=Come over here! I have an order for you.
actors.mobs.npcs.blacksmith.intro_quest_start=See that ladder over there? Take this pickaxe and _mine me some Pyroxene. Bring back 40_, or face a purge! The walls down there can be broken, so do your best.\n\nWhat, compensation? You... you dare...?\n\n...Fine then! I shall graciously grant you access to the forge of our Red Winter Secretariat.
actors.mobs.npcs.blacksmith.intro_quest_crystal=I shall bestow some advice upon you to ensure your mission's success. There are tons of crystals growing down below. They might look shiny, but they're flimsy, useless, and menacing to boot! They even cast weird magic to protect themselves. Ahem, ahem. At any rate, _no matter where you mine, keep your guard up for your own safety_. Otherwise, you'll draw their attention.\n\nThere should also be a giant crystal somewhere in the mine. That one is far more dangerous, so prepare thoroughly if you intend to smash it. Smashing it will slow down the other crystals; if you shatter it, I shall grant you an extra reward.
actors.mobs.npcs.blacksmith.intro_quest_fungi=You'd better watch your step. That mine is treacherous for a tiny human like you. Some sort of mushroom monstrosities are growing down there. They even have mushroom turrets attached, which could prove lethal if spotted. Even if they can't get up, they can at least track you, so if you value your life, _stay out of their sight as much as possible_.\n\nIf you somehow manage to eliminate the _largest mushroom_ down there, I'll pay you extra. It won't be easy, though. It's connected to countless mycelial nodes hidden within the walls, so you'll have to smash every single one to deal actual damage.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=I shall bestow some advice upon you to ensure your mission's success. Some gnolls went mad over my Pyroxene and began wrecking the place! Being brutish and stupid creatures, mining in that reckless manner triggers all sorts of cave-ins. You must mine Pyroxene amidst all that chaos. So, _keep a sharp eye on recently fallen rocks_.\n\nAnd one among them seems particularly troublesome. Probably an _earthen geomancer_ or someone of that sort. If you hunt that one down and deal with it, I shall grant you an extra reward. But mark my words, that one won't go down easily either.
actors.mobs.npcs.blacksmith.reminder=Hurry down and fetch my Pyroxene! Slack off and it's a purge! A purge!
actors.mobs.npcs.blacksmith.lost_pick=Where did you run off and sell my pickaxe?! Find it immediately or face a purge!
actors.mobs.npcs.blacksmith.quest_start_prompt=Are your preparations complete? Make sure to leave plenty of room in your bag for that Pyroxene.\n\n_I'm only sending you down once!_
actors.mobs.npcs.blacksmith.enter_yes=I am ready
actors.mobs.npcs.blacksmith.enter_no=Not yet
actors.mobs.npcs.blacksmith.exit_warn_none=Done already? Fast work. My eye for talent never fails... Wait, you don't have a single Pyroxene! Bring back _40_, or it's a purge! A purge!\n\n_If you give up, so be it, but I won't let you back in!_
actors.mobs.npcs.blacksmith.exit_warn_low=Done already? Doesn't look like you're carrying all that much Pyroxene. Bring me _40_ of them!\n\n_If you give up, so be it, but I won't let you back in!_
actors.mobs.npcs.blacksmith.exit_warn_med=Finished? You seem to have some Pyroxene at least, but there's definitely plenty left down in the mine... Bring me _40_, I said!\n\n_If you give up, so be it, but I won't let you back in!_
actors.mobs.npcs.blacksmith.exit_warn_high=Finished? Looks like you've brought quite a lot of Pyroxene, but you could still manage _40_, couldn't you...?\n\n_If you give up, so be it, but I won't let you back in!_
actors.mobs.npcs.blacksmith.exit_warn_full=Finished? Hehehe... good, good! Your bag is bursting with Pyroxene. Check carefully to make sure you haven't left anything behind.\n\n_Once you climb back up, I won't let you back down, so double-check!_
actors.mobs.npcs.blacksmith.exit_warn_crystal=That giant crystal is still down there! Shatter it, and I'll give you a bonus reward.
actors.mobs.npcs.blacksmith.exit_warn_fungi=That giant mushroom is still down there! Defeat it, and I'll give you a bonus reward.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=That gnoll geomancer is still down there! Deal with it, and I'll give you a bonus reward.
actors.mobs.npcs.blacksmith.exit_yes=I am done
actors.mobs.npcs.blacksmith.exit_no=Not yet
actors.mobs.npcs.blacksmith.get_lost=If your business here is finished, take your leave!
actors.mobs.npcs.blacksmith.entrance_blocked=The way down is blocked.
actors.mobs.npcs.blacksmith.cant_enter_old=That area is no longer accessible in this game. Start a new game to attempt a new quest!
actors.mobs.npcs.blacksmith.def_verb="You'd best not do that!"
actors.mobs.npcs.blacksmith.desc=Cherino, the Executive President of the Red Winter Secretariat. A terrifying figure who maintains absolute power through countless purges amidst constant coups. However, her purge merely consists of pointing down the barrel of a gun and shouting "Purge!", which holds no real effect over you.
actors.mobs.npcs.blacksmith.reminder_crystal=Bring back as much Pyroxene as you possibly can! ...And shatter that giant crystal while you're at it.
actors.mobs.npcs.blacksmith.reminder_gnoll=Bring back as much Pyroxene as you possibly can! ...And take down that gnoll geomancer while you're at it.
actors.mobs.npcs.blacksmith.reminder_fungi=Bring back as much Pyroxene as you possibly can! ...And deal with that giant mushroom while you're at it.

actors.mobs.npcs.shopkeeper.name=Sora
actors.mobs.npcs.shopkeeper.thief=Ah, a thief!
actors.mobs.npcs.shopkeeper.warn=Excuse me, you can't cause trouble like this...!
actors.mobs.npcs.shopkeeper.yell=Kyaaak!
actors.mobs.npcs.shopkeeper.yell_akira=...So that's how you're going to play it after all.
actors.mobs.npcs.shopkeeper.flee=Sora fled in panic.
actors.mobs.npcs.shopkeeper.flee_akira=Akira backed off obediently.
actors.mobs.npcs.shopkeeper.flee_warning=Sora hit the alarm button and fled!
actors.mobs.npcs.shopkeeper.flee_warning_akira=Akira hit the alarm button and vanished!
actors.mobs.npcs.shopkeeper.sell=Select an item to sell
actors.mobs.npcs.shopkeeper.talk=Talk
actors.mobs.npcs.shopkeeper.buyback=Sora: "Here you go, returning it to you. Please be more careful about what you sell next time..."
actors.mobs.npcs.shopkeeper.talk_prison_intro=(Faithfully slacking off while staring at her phone.)
actors.mobs.npcs.shopkeeper.talk_prison_aris=Ah, hello there, Aris-san! That emblem looks lovely! The Millennium symbol suits you so well.
actors.mobs.npcs.shopkeeper.talk_prison_nonomi=Ah, hello, Nonomi-san! Gasp, that card is......
actors.mobs.npcs.shopkeeper.talk_prison_miyako=Oh, hello, Miyako-san! Did you come to help out with work? Ah, I guess not...
actors.mobs.npcs.shopkeeper.talk_prison_hoshino=H-Hell— Ah, you can't sleep here, Hoshino-san!
actors.mobs.npcs.shopkeeper.talk_prison_shiroko=Welc— Eek! (shivering) Th-There's nothing v-very expensive here (trembling), so please... t-try somewhere else...
actors.mobs.npcs.shopkeeper.talk_prison_noa=(Hurriedly hiding her phone) W-Welcome! What do you need today, Noa-san?
actors.mobs.npcs.shopkeeper.talk_prison_miyu=So bored... Ack, Miyu-san, how long have you been standing there?
actors.mobs.npcs.shopkeeper.talk_prison_yuzu=Ah, Yuzu-san! Nice to see you. Please buy some items here in person instead of just online, okay?
actors.mobs.npcs.shopkeeper.talk_prison_izuna=Aahh, Izuna-san! Please don't run all over the store like that! Kyaak!
actors.mobs.npcs.shopkeeper.talk_prison_mika=Ah, welcome, Mika-san! How may I help you?
actors.mobs.npcs.shopkeeper.talk_prison_mari=앗, 어서 오세요, 마리 씨! 무엇을 도와드릴까요?
actors.mobs.npcs.shopkeeper.talk_caves=Ah, welcome, nice seeing you again! Feel free to look around.
actors.mobs.npcs.shopkeeper.talk_city=Oh, you've made it all the way here! I'm sure we have what you need.
actors.mobs.npcs.shopkeeper.talk_halls=Fufu, hello there. A shop made just for you. Just let me know if you need anything.
actors.mobs.npcs.shopkeeper.talk_ascent=Just what on earth did you do?! Bombardments are raining down everywhere! Hurry up and evacuate!
actors.mobs.npcs.shopkeeper.desc=A part-timer at "Angel 24," the convenience store located in the Federal Investigation Club SCHALE building. With things usually being quiet, she often slacks off on the job.

actors.mobs.fox.fox.stats_desc=FOX Platoon members are immune to Terror, Dread, Amok, Targeted, and Drowsy debuffs, and cannot be allied. The FOX Platoon moves together in formation and will attempt to return to their initial spawn location when no enemies can be found.
actors.mobs.fox.yukino.name=Yukino
actors.mobs.fox.yukino.desc=Shichido Yukino, 3rd year at SRT Special Academy, Squad Leader of FOX Platoon — FOX 1.\n\nYukino is equipped with an _AR_.\nYukino can perform _ranged attacks_ and can also attack at _close quarters_.
actors.mobs.fox.yukino.show=FOX 1, operational preparations complete. Commencing mission.
actors.mobs.fox.yukino.hit=FOX 1 reporting: taking hostile fire. Backup required.
actors.mobs.fox.yukino.die=...FOX 1, ...falling back.
actors.mobs.fox.yukino.kill=A weapon that has lost its purpose deserves only to be discarded.
actors.mobs.fox.yukino.aggro=FOX 1, hostile spotted ahead. In pursuit.
actors.mobs.fox.niko.name=Niko
actors.mobs.fox.niko.desc=Yoshino Niko, 3rd year at SRT Special Academy, FOX Platoon — FOX 2.\n\nNiko is equipped with an _SG_.\nNiko can only perform _close-range attacks_.\nNiko has high _accuracy_ and _attack damage_.\nNiko can move _very swiftly_.\nNiko has relatively low _health_.

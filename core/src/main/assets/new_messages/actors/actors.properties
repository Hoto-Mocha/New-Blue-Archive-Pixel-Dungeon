actors.mobs.npcs.vaultmirror.scene_mika=You see the _Scrunchie_. This scene feels like a fragment of your memory, yet subtle details are different.
actors.mobs.npcs.vaultmirror.scene_mari=당신에게 _십자가 목걸이_가 보입니다. 이 장면은 마치 기억 속 한 장면 같지만, 자세히는 다른 부분이 있습니다.

actors.mobs.npcs.imp.name=Akira
actors.mobs.npcs.imp.cya=See you later, %s-san!
actors.mobs.npcs.imp.hey=...%s-san, could you come over here for a moment?
actors.mobs.npcs.imp.quest_intro_1=Hello there, could you perhaps lend me a hand? I find myself in quite a bit of a predicament.\n\nThere is a massive vault right before me, filled to the brim with rare works of art. Beautiful things shouldn't be left to rot in some gloomy vault where no one appreciates their worth—they belong in the hands of someone like me, who truly understands art. ...At any rate, there's a particular statue in there that I simply must have.\n\nThe vault is outfitted with all manner of security systems, making it too much for me to handle alone. That's why I need your help.
actors.mobs.npcs.imp.quest_intro_2=The vault is currently sealed tight under strict security. I can teleport you inside using gear I've prepared in advance, but _I cannot teleport your equipment along with you._ There will be plenty of fine gear in there that should certainly help you out. _At first, it would be wise to avoid enemies while scavenging for items that are lightly guarded._\n\nWhen I pull you out of the vault, I can let you bring back two of the items in your possession. One is naturally my statue, and for the other, _choose whatever you like._ ...Fufu, quite an enticing offer for you as well, isn't it?\n\nI've also gathered a massive collection of items you might need, so if you help me, _I'll set up a shop for you down below._ I'm sure we can do some wonderful business together.
actors.mobs.npcs.imp.quest_in_progress=Whenever you're ready, simply stand in the center of the vault entrance before you. I'll teleport you inside.
actors.mobs.npcs.imp.enter_text=Are you ready? I'll keep your current belongings safe up here, and _return everything to you once you come back_.\n\nTake this _Millennium Uniform_ and _Escape Radio_. Use this radio once you obtain the statue. ..._If you get into trouble, you may use it early_, but what you receive will be far from the promised reward.\n\nSince this vault hasn't been breached in quite some time, the guards inside are likely lazier than usual. It will be especially easy to evade surveillance _if you remain behind the patrol routes of enemies._ _Even if an enemy spots you, a fleeting glance won't cause them to pursue you immediately._ And if you listen closely, _you can even hear the footsteps of nearby enemies wandering around._
actors.mobs.npcs.imp.quest_completed_bad=Well, thank you for giving it a shot anyway.\n\nThe apparatus I used to send you into the vault takes an exceptionally long time to prep again, so you'd best move along rather than wait around.
actors.mobs.npcs.imp.quest_completed_good=Thank you for your assistance.\n\nGive me a moment to pack up my gear. I also need to draft some plans based on the intel you provided.\n\nI'll pack my bags and head down below, so see you downstairs. Naturally, I still need credits, so let's conduct some fair business. Fufut.
actors.mobs.npcs.imp.quest_completed_great=You accomplished something truly magnificent, thank you so very much!\n\nI obtained everything I needed from in there. I'll pack my bags and head down below, so see you downstairs. Naturally, I still need credits, so let's conduct some fair business. Fufut.
actors.mobs.npcs.imp.desc=One of Kivotos's notorious "Seven Prisoners," a.k.a. the "Phantom Thief of Merciful Benevolence," Akira.\n\nA master thief who has stolen all manner of art pieces under the conviction that nothing in this world is unstealable and that precious treasures belong to all.\n\nDespite her peerless thieving talents, she somehow wears a troubled expression before you right now.

actors.mobs.npcs.impshopkeeper.name=Akira
actors.mobs.npcs.impshopkeeper.greetings=Hello there, %s-san.
actors.mobs.npcs.impshopkeeper.greetings_ascent=Looks like it's time to depart. %s-san, if there's anything you wish to purchase, please tell me quickly. I need to get going soon myself!
actors.mobs.npcs.impshopkeeper.thief=How laughable, daring to steal from me. Fufut, until next time then!
actors.mobs.npcs.impshopkeeper.buyback=Akira readily returned the item to you.
actors.mobs.npcs.impshopkeeper.desc=Akira has set up a small shop exclusively for you. Seeing a familiar face is welcoming, though the prices can hardly be called friendly.

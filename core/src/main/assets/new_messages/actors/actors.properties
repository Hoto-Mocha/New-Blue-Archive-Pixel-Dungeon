actors.hero.talent.mari_armor2_2.desc=_+1:_ 성심의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 반경 _2타일_의 마법 시야를 얻습니다. 충전 소모량: 6\n\n_+2:_ 성심의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 반경 _3타일_의 마법 시야를 얻습니다. 충전 소모량: 6\n\n_+3:_ 성심의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 반경 _4타일_의 마법 시야를 얻습니다. 충전 소모량: 6\n\n_+4:_ 성심의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 반경 _5타일_의 마법 시야를 얻습니다. 충전 소모량: 6\n\n마법 시야는 최대 12타일까지 중첩이 가능합니다.

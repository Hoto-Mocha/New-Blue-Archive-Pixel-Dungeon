actors.hero.talent.mari_armor2_1.desc=_+1:_ 성체의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 _1-5_의 추가 방어력을 얻습니다. 충전 소모량: 6\n\n_+2:_ 성체의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 _2-10_의 추가 방어력을 얻습니다. 충전 소모량: 6\n\n_+3:_ 성체의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 _3-15_의 추가 방어력을 얻습니다. 충전 소모량: 6\n\n_+4:_ 성체의 힘 기적을 얻습니다. 턴을 소모하지 않으며, 삼위일체의 지속 시간을 5턴 연장하고 삼위일체가 유지되는 동안 _4-20_의 추가 방어력을 얻습니다. 충전 소모량: 6\n\n방어력은 2회까지 중첩이 가능합니다.

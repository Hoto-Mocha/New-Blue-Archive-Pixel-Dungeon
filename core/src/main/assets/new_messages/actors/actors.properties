actors.buffs.supernovacharge.action_name=Battery Charge!

actors.hero.talent.aris_t1_1.title=Beginning of Adventure
actors.hero.talent.aris_t1_1.desc=_+1:_ Increases melee damage by _+1_.\n\n_+2:_ Increases melee damage by _+2_.
actors.hero.talent.aris_t1_2.title=Scan
actors.hero.talent.aris_t1_2.desc=_+1:_ Identification speed of melee weapons and uniforms increased by _2.5x_.\n\n_+2:_ Equipping melee weapons and uniforms instantly identifies them.
actors.hero.talent.aris_t1_3.title=Curiosity
actors.hero.talent.aris_t1_3.desc=_+1:_ Gaining _5_ experience when identifying a potion or scroll.\n\n_+2:_ Gaining _8_ experience when identifying a potion or scroll.
actors.hero.talent.aris_t1_4.title=Ironclad Defense
actors.hero.talent.aris_t1_4.desc=_+1:_ Maximum shielding provided by Aris's emblem increased by _1_.\n\n_+2:_ Maximum shielding provided by Aris's emblem increased by _2_.

actors.hero.talent.aris_t2_1.title=Recharged and Ready!
actors.hero.talent.aris_t2_1.desc=_+1:_ Eating takes only 1 turn, reducing damage taken while eating by _75%_.\n\n_+2:_ Eating takes only 1 turn, reducing damage taken while eating by _100%_.
actors.hero.talent.aris_t2_2.title=Light, Grant Me Power!
actors.hero.talent.aris_t2_2.desc=_+1:_ Striking an enemy for the first time inflicts Blindness for _2 turns_.\n\n_+2:_ Striking an enemy for the first time inflicts Blindness for _3 turns_.
actors.hero.talent.aris_t2_3.title=Memory Activation
actors.hero.talent.aris_t2_3.desc=_+1:_ Aris's emblem can now _transfer inscribed glyphs_ in the same manner as upgrade levels.\n\n_+2:_ In addition to the +1 effect, _upgrading armor will no longer erase inscribed glyphs._
actors.hero.talent.aris_t2_4.title=Cheat Command
actors.hero.talent.aris_t2_4.desc=_+1:_ Balance Breaker has a _5%_ chance to set its minimum damage to the enemy's current HP.\n\n_+2:_ Balance Breaker has a _10%_ chance to set its minimum damage to the enemy's current HP.
actors.hero.talent.aris_t2_5.title=Balance Patch
actors.hero.talent.aris_t2_5.desc=_+1:_ Decreases Balance Breaker cooldown by _20%_.\n\n_+2:_ Decreases Balance Breaker cooldown by _30%_.

actors.hero.talent.aris_t3_1.title=Robotic Vacuum
actors.hero.talent.aris_t3_1.desc=_+1:_ Increases movement speed by _+5%_.\n\n_+2:_ Increases movement speed by _+10%_.\n\n_+3:_ Increases movement speed by _+15%_.
actors.hero.talent.aris_t3_2.title=Skip Cutscene
actors.hero.talent.aris_t3_2.desc=_+1:_ Entering a floor for the first time has a _33%_ chance to reveal the shortest path to the next floor.\n\n_+2:_ Entering a floor for the first time has a _67%_ chance to reveal the shortest path to the next floor.\n\n_+3:_ Entering a floor for the first time has a _100%_ chance to reveal the shortest path to the next floor.

actors.hero.talent.aris_ex1_1.title=Main DPS
actors.hero.talent.aris_ex1_1.desc=_+1:_ When Balance Breaker is fully charged, the upgrade level of Sword of Light: Supernova increases by _+1_.\n\n_+2:_ When Balance Breaker is fully charged, the upgrade level of Sword of Light: Supernova increases by _+2_.\n\n_+3:_ When Balance Breaker is fully charged, the upgrade level of Sword of Light: Supernova increases by _+3_.
actors.hero.talent.aris_ex1_2.title=Defenses Primed
actors.hero.talent.aris_ex1_2.desc=_+1:_ Defense increases by _+1-4_ while Balance Breaker is charging.\n\n_+2:_ Defense increases by _+2-8_ while Balance Breaker is charging.\n\n_+3:_ Defense increases by _+3-12_ while Balance Breaker is charging.
actors.hero.talent.aris_ex1_3.title=Supernova, Awakening!
actors.hero.talent.aris_ex1_3.desc=_+1:_ Landing melee hits with the Sword of Light: Supernova reduces Balance Breaker cooldown by _1 turn_.\n\n_+2:_ Landing melee hits with the Sword of Light: Supernova reduces Balance Breaker cooldown by _2 turns_.\n\n_+3:_ Landing melee hits with the Sword of Light: Supernova reduces Balance Breaker cooldown by _3 turns_.

actors.hero.talent.aris_ex2_1.title=The Balance Feels Off...
actors.hero.talent.aris_ex2_1.desc=_+1:_ Battery Charge stacks gained per melee hit become _-1 to +2_.\n\n_+2:_ Battery Charge stacks gained per melee hit become _+0 to +2_.\n\n_+3:_ Battery Charge stacks gained per melee hit become _+1 to +3_.
actors.hero.talent.aris_ex2_2.title=Hidden Trigger
actors.hero.talent.aris_ex2_2.desc=_+1:_ Upon being attacked, has a _10%_ chance to parry the blow and counterattack immediately.\n\n_+2:_ Upon being attacked, has a _20%_ chance to parry the blow and counterattack immediately.\n\n_+3:_ Upon being attacked, has a _30%_ chance to parry the blow and counterattack immediately.
actors.hero.talent.aris_ex2_3.title=Protagonist Buff
actors.hero.talent.aris_ex2_3.desc=_+1:_ Increases equipped ring upgrade levels by +1 per _100_ Battery Charge stacks.\n\n_+2:_ Increases equipped ring upgrade levels by +1 per _50_ Battery Charge stacks.\n\n_+3:_ Increases equipped ring upgrade levels by +1 per _30_ Battery Charge stacks.\n\nBonus upgrade level capped at +3.

actors.hero.talent.aris_armor1_1.title=Overheat Reduction
actors.hero.talent.aris_armor1_1.desc=_+1:_ After using the ability, reduces Balance Breaker cooldown by _13%_.\n\n_+2:_ After using the ability, reduces Balance Breaker cooldown by _25%_.\n\n_+3:_ After using the ability, reduces Balance Breaker cooldown by _38%_.\n\n_+4:_ After using the ability, reduces Balance Breaker cooldown by _50%_.
actors.hero.talent.aris_armor1_2.title=Energy Barrier
actors.hero.talent.aris_armor1_2.desc=_+1:_ After using the ability, grants _2_ shielding per enemy hit by Balance Breaker.\n\n_+2:_ After using the ability, grants _4_ shielding per enemy hit by Balance Breaker.\n\n_+3:_ After using the ability, grants _6_ shielding per enemy hit by Balance Breaker.\n\n_+4:_ After using the ability, grants _8_ shielding per enemy hit by Balance Breaker.\n\nCaps at 8 targets.
actors.hero.talent.aris_armor1_3.title=The Light Shall...
actors.hero.talent.aris_armor1_3.desc=_+1:_ After using the ability, has a _25%_ chance to ignite enemies hit by Balance Breaker.\n\n_+2:_ After using the ability, has a _50%_ chance to ignite enemies hit by Balance Breaker.\n\n_+3:_ After using the ability, has a _75%_ chance to ignite enemies hit by Balance Breaker.\n\n_+4:_ After using the ability, has a _100%_ chance to ignite enemies hit by Balance Breaker.

actors.hero.talent.aris_armor2_1.title=Protective Might
actors.hero.talent.aris_armor2_1.desc=_+1:_ Grants _8_ shielding upon activating Divi:Sion.\n\n_+2:_ Grants _16_ shielding upon activating Divi:Sion.\n\n_+3:_ Grants _24_ shielding upon activating Divi:Sion.\n\n_+4:_ Grants _32_ shielding upon activating Divi:Sion.
actors.hero.talent.aris_armor2_2.title=Life Drain
actors.hero.talent.aris_armor2_2.desc=_+1:_ Corrupting an enemy with Divi:Sion restores _2_ HP.\n\n_+2:_ Corrupting an enemy with Divi:Sion restores _4_ HP.\n\n_+3:_ Corrupting an enemy with Divi:Sion restores _6_ HP.\n\n_+4:_ Corrupting an enemy with Divi:Sion restores _8_ HP.
actors.hero.talent.aris_armor2_3.title=Enduring Might
actors.hero.talent.aris_armor2_3.desc=_+1:_ Corrupting an enemy with Divi:Sion extends ability duration by _2 turns_.\n\n_+2:_ Corrupting an enemy with Divi:Sion extends ability duration by _4 turns_.\n\n_+3:_ Corrupting an enemy with Divi:Sion extends ability duration by _6 turns_.\n\n_+4:_ Corrupting an enemy with Divi:Sion extends ability duration by _8 turns_.\n\nCaps at 8 targets.

actors.hero.talent.aris_armor3_1.title=High-Efficiency Battery
actors.hero.talent.aris_armor3_1.desc=_+1:_ Balance Breaker fired after activating Battery Replacement has its cooldown reduced by _10%_.\n\n_+2:_ Balance Breaker fired after activating Battery Replacement has its cooldown reduced by _20%_.\n\n_+3:_ Balance Breaker fired after activating Battery Replacement has its cooldown reduced by _30%_.\n\n_+4:_ Balance Breaker fired after activating Battery Replacement has its cooldown reduced by _40%_.
actors.hero.talent.aris_armor3_2.title=High-Performance Battery
actors.hero.talent.aris_armor3_2.desc=_+1:_ Balance Breaker fired after activating Battery Replacement deals _10%_ increased damage.\n\n_+2:_ Balance Breaker fired after activating Battery Replacement deals _20%_ increased damage.\n\n_+3:_ Balance Breaker fired after activating Battery Replacement deals _30%_ increased damage.\n\n_+4:_ Balance Breaker fired after activating Battery Replacement deals _40%_ increased damage.
actors.hero.talent.aris_armor3_3.title=Rapid Swap
actors.hero.talent.aris_armor3_3.desc=_+1:_ Activating Battery Replacement has a _25%_ chance not to consume a turn.\n\n_+2:_ Activating Battery Replacement has a _50%_ chance not to consume a turn.\n\n_+3:_ Activating Battery Replacement has a _75%_ chance not to consume a turn.\n\n_+4:_ Activating Battery Replacement has a _100%_ chance not to consume a turn.

actors.hero.abilities.aris.extendedlaser.name=Expansion Module
actors.hero.abilities.aris.extendedlaser.short_desc=Aris can equip a single-use module onto the Sword of Light: Supernova to _massively empower Balance Breaker_.
actors.hero.abilities.aris.extendedlaser.desc=Aris empowers her next Balance Breaker shot, tripling its width and doubling its maximum range. Firing Balance Breaker after using the Expansion Module doubles its cooldown.
actors.hero.abilities.aris.extendedlaser.cooldown=Cannot equip modules while the Sword of Light: Supernova is overheated.
actors.hero.abilities.aris.extendedlaser.already_used=An Expansion Module is already equipped!
actors.hero.abilities.aris.extendedlaser$extendedlaserbuff.name=Expansion Module
actors.hero.abilities.aris.extendedlaser$extendedlaserbuff.desc=Expansion Module ready! It is dangerous, so please take cover over there for a moment.\n\nTriples the beam width and doubles the maximum range of your next Balance Breaker shot.
actors.hero.abilities.aris.division.name=Divi:SION
actors.hero.abilities.aris.division.short_desc=Aris awakens the power of the Princess to levitate briefly, _corrupting defeated enemies into allies_.
actors.hero.abilities.aris.division.desc=Aris reclaims the power of the Princess of the Nameless Gods for 20 turns, allowing her to levitate above the ground. In addition, most enemies defeated while this effect lasts are corrupted into allies.
actors.hero.abilities.aris.division.already_activated=Cannot be used again while already awakened!
actors.hero.abilities.aris.division$divisionbuff.name=Princess of the Nameless Gods
actors.hero.abilities.aris.division$divisionbuff.desc=Aris has temporarily awakened a fragment of Key's persona. She levitates through the air and can corrupt defeated enemies into allies.\n\nTurns remaining: %s.
actors.hero.abilities.aris.batterychange.name=Battery Replacement
actors.hero.abilities.aris.batterychange.short_desc=Aris can swap out the battery during cooldown to _instantly ready Balance Breaker_.
actors.hero.abilities.aris.batterychange.desc=Aris replaces the battery of the Sword of Light: Supernova, making Balance Breaker ready to fire immediately.

###Nonomi sentences
actors.hero.heroclass.nonomi=Nonomi
actors.hero.heroclass.nonomi_desc_short=Have a wonderful day, Sensei! Leave everything to me~\n\nDifficulty: _Easy_
actors.hero.heroclass.nonomi_desc=Through continuous financial investment, Nonomi increases her held credits by _1%_ each time she defeats an enemy, putting the magic of compound interest to work.\n\nNonomi is skilled with MGs, requiring _1 less strength_ to handle them properly.\n\nNonomi also enters the dungeon with a _Tier-1 MG_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nNonomi begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.nonomi_unlock=Nonomi is unlocked by default.

actors.hero.herosubclass.shoot_all=Full Burst
actors.hero.herosubclass.shoot_all_short_desc=Nonomi can fire all loaded rounds in her equipped firearm _in a single burst_.\n
actors.hero.herosubclass.shoot_all_desc=Nonomi can fire every round loaded in her equipped firearm in a single burst.\n\nAfter a Full Burst, an Overheat debuff is applied, preventing firearm swapping or firing for a set period.\n\nFull Burst can be toggled ON/OFF through extra controls.
actors.hero.herosubclass.spread_shot=Punishment Time~
actors.hero.herosubclass.spread_shot_short_desc=Nonomi sweeps her gunfire across a wide area to _damage multiple enemies spread out over the zone_.\n
actors.hero.herosubclass.spread_shot_desc=Nonomi sweeps her gunfire across a cone-shaped area to inflict bullet damage on multiple enemies.\n\nAiming further away narrows the spread angle, while weapons that fire more rounds per shot widen the cone.

actors.hero.hero.nonomi_health_critical_1=Shall we take a rest somewhere safe? I'm having a bit of a hard time...
actors.hero.hero.nonomi_health_critical_2=I've reached my limit...
actors.hero.hero.nonomi_health_critical_3=Are you doing alright? Things are looking a bit dangerous for me...

actors.hero.hero.nonomi_health_warn_1=This might be getting a little dangerous...
actors.hero.hero.nonomi_health_warn_2=I'm feeling a bit exhausted. I think I need to recover for a moment.
actors.hero.hero.nonomi_health_warn_3=It's probably best not to push ourselves too hard.

actors.hero.hero.nonomi_die=Ugh... I'm so sorry...

actors.hero.hero.nonomi_enemy_defeated_1=It's punishment time~
actors.hero.hero.nonomi_enemy_defeated_2=Hehe~ That was a wonderful battle~
actors.hero.hero.nonomi_enemy_defeated_3=Splendid leadership, Sensei!
actors.hero.hero.nonomi_enemy_defeated_4=Are you hurt anywhere~?
actors.hero.hero.nonomi_enemy_defeated_5=Something like this is a piece of cake!

actors.hero.hero.nonomi_levelup_1=Because I'm constantly growing, even at this very moment!
actors.hero.hero.nonomi_levelup_2=Fufu, taking another step forward!
actors.hero.hero.nonomi_levelup_3=I'll keep doing my best!
actors.hero.hero.nonomi_levelup_4=I feel much stronger now.
actors.hero.hero.nonomi_levelup_5=Fufu, I'm in top condition!
actors.hero.hero.nonomi_levelup_rare=Mhm. Power may be a double-edged sword, but if it's for Sensei and everyone else, I believe it's necessary. I promise to use it responsibly, so please watch over me, Sensei.

actors.hero.hero.nonomi_push=No way!
actors.hero.hero.nonomi_spread_no_gun=Oh my, I forgot to ready my gun~ You need to equip a firearm first.

actors.hero.talent.nonomi_t1_1.title=Rest Time
actors.hero.talent.nonomi_t1_1.desc=_+1:_ Eating restores _3_ HP when your remaining health is below 40%.\n\n_+2:_ Eating restores _5_ HP when your remaining health is below 40%.
actors.hero.talent.nonomi_t1_2.title=Machine Gun Specialist
actors.hero.talent.nonomi_t1_2.desc=_+1:_ Instantly identifies MGs _upon equipping_.\n\n_+2:_ Instantly identifies MGs _upon acquiring_.
actors.hero.talent.nonomi_t1_3.title=Impact Rounds
actors.hero.talent.nonomi_t1_3.desc=_+1:_ Increases bullet damage by _+0-1_.\n\n_+2:_ Increases bullet damage by _+1_.
actors.hero.talent.nonomi_t1_4.title=Safety Zone
actors.hero.talent.nonomi_t1_4.desc=_+1:_ Reloading a firearm grants shielding equal to the _turns required to reload_.\n\n_+2:_ Reloading a firearm grants shielding equal to the _turns required to reload + 1_.

actors.hero.talent.nonomi_t2_1.title=Picnic Time
actors.hero.talent.nonomi_t2_1.desc=_+1:_ Eating takes only 1 turn and _reloads the equipped firearm without consuming a turn_.\n\n_+2:_ Eating takes only 1 turn, _reloads the equipped firearm without consuming a turn, and chambers 1 additional round_.
actors.hero.talent.nonomi_t2_2.title=Gold Card
actors.hero.talent.nonomi_t2_2.desc=_+1:_ All shop items are discounted by _20%_.\n\n_+2:_ All shop items are discounted by _40%_.
actors.hero.talent.nonomi_t2_3.title=Popular Girl
actors.hero.talent.nonomi_t2_3.desc=_+1:_ Decreases damage taken by _5%_ per visible enemy in line of sight.\n\n_+2:_ Decreases damage taken by _7.5%_ per visible enemy in line of sight.
actors.hero.talent.nonomi_t2_4.title=Surprise!
actors.hero.talent.nonomi_t2_4.desc=_+1:_ Increases bullet damage by _+1_ on sneak attacks.\n\n_+2:_ Increases bullet damage by _+2_ on sneak attacks.
actors.hero.talent.nonomi_t2_5.title=No Way!
actors.hero.talent.nonomi_t2_5.desc=_+1:_ Striking an enemy with a melee attack for the first time knocks them back _2 tiles_.\n\n_+2:_ Striking an enemy with a melee attack for the first time knocks them back _3 tiles_.\n\nEnemies cannot be knocked into chasms with this attack.

actors.hero.talent.nonomi_t3_1.title=Unique Weapon
actors.hero.talent.nonomi_t3_1.desc=_+1:_ _미니 No.5_를 얻습니다.\n\n_+2:_ 미니 No.5의 강화 수치가 _+1_ 증가합니다.\n\n_+3:_ 미니 No.5의 강화 수치가 _+2_ 증가합니다.
actors.hero.talent.nonomi_t3_2.title=Auto-Supply Ammo
actors.hero.talent.nonomi_t3_2.desc=_+1:_ Has a _5%_ chance each turn to chamber 1 round into the equipped firearm.\n\n_+2:_ Has a _10%_ chance each turn to chamber 1 round into the equipped firearm.\n\n_+3:_ Has a _15%_ chance each turn to chamber 1 round into the equipped firearm.

actors.hero.talent.nonomi_ex1_1.title=Extended Magazine
actors.hero.talent.nonomi_ex1_1.desc=_+1:_ Reload time increases by 1 turn, and equipped firearm maximum ammo increases by _1 round_.\n\n_+2:_ Reload time increases by 1 turn, and equipped firearm maximum ammo increases by _2 rounds_.\n\n_+3:_ Reload time increases by 1 turn, and equipped firearm maximum ammo increases by _3 rounds_.
actors.hero.talent.nonomi_ex1_2.title=Cooling Solution
actors.hero.talent.nonomi_ex1_2.desc=_+1:_ Landing a melee hit while Overheated has a _33%_ chance to reduce remaining Overheat duration by an extra 1 turn.\n\n_+2:_ Landing a melee hit while Overheated has a _67%_ chance to reduce remaining Overheat duration by an extra 1 turn.\n\n_+3:_ Landing a melee hit while Overheated has a _100%_ chance to reduce remaining Overheat duration by an extra 1 turn.
actors.hero.talent.nonomi_ex1_3.title=Thermal Conduction
actors.hero.talent.nonomi_ex1_3.desc=_+1:_ Landing a melee hit while Overheated has a _(remaining Overheat turns x 10)%_ chance to ignite the enemy.\n\n_+2:_ Landing a melee hit while Overheated has a _((remaining Overheat turns + 1) x 10)%_ chance to ignite the enemy.\n\n_+3:_ Landing a melee hit while Overheated has a _((remaining Overheat turns + 2) x 10)%_ chance to ignite the enemy.

actors.hero.talent.nonomi_ex2_1.title=Cleaning Time
actors.hero.talent.nonomi_ex2_1.desc=_+1:_ Base cone angle increases by _+10°_.\n\n_+2:_ Base cone angle increases by _+20°_.\n\n_+3:_ Base cone angle increases by _+30°_.
actors.hero.talent.nonomi_ex2_2.title=Piercing Shot
actors.hero.talent.nonomi_ex2_2.desc=_+1:_ This ability has a _20%_ chance to pierce through walls and deal damage.\n\n_+2:_ This ability has a _40%_ chance to pierce through walls and deal damage.\n\n_+3:_ This ability has a _60%_ chance to pierce through walls and deal damage.
actors.hero.talent.nonomi_ex2_3.title=Repelling Shot
actors.hero.talent.nonomi_ex2_3.desc=_+1:_ Enemies hit by this ability have a _10%_ chance to be knocked back 1 tile.\n\n_+2:_ Enemies hit by this ability have a _20%_ chance to be knocked back 1 tile.\n\n_+3:_ Enemies hit by this ability have a _30%_ chance to be knocked back 1 tile.

actors.hero.talent.nonomi_armor1_1.title=Generous Gift
actors.hero.talent.nonomi_armor1_1.desc=_+1:_ Increases Charm duration by _+33%_.\n\n_+2:_ Increases Charm duration by _+67%_.\n\n_+3:_ Increases Charm duration by _+100%_.\n\n_+4:_ Increases Charm duration by _+133%_.
actors.hero.talent.nonomi_armor1_2.title=Can't Look Away
actors.hero.talent.nonomi_armor1_2.desc=_+1:_ This ability additionally inflicts Blindness for _1 turn_.\n\n_+2:_ This ability additionally inflicts Blindness for _2 turns_.\n\n_+3:_ This ability additionally inflicts Blindness for _3 turns_.\n\n_+4:_ This ability additionally inflicts Blindness for _4 turns_.
actors.hero.talent.nonomi_armor1_3.title=Charming Gift
actors.hero.talent.nonomi_armor1_3.desc=_+1:_ Enemies affected by this ability have a _2%_ chance to become allies.\n\n_+2:_ Enemies affected by this ability have a _4%_ chance to become allies.\n\n_+3:_ Enemies affected by this ability have a _6%_ chance to become allies.\n\n_+4:_ Enemies affected by this ability have a _8%_ chance to become allies.

actors.hero.talent.nonomi_armor2_1.title=Adult's Card
actors.hero.talent.nonomi_armor2_1.desc=_+1:_ Credits spent per 1 damage dealt are reduced by _5_.\n\n_+2:_ Credits spent per 1 damage dealt are reduced by _10_.\n\n_+3:_ Credits spent per 1 damage dealt are reduced by _15_.\n\n_+4:_ Credits spent per 1 damage dealt are reduced by _20_.
actors.hero.talent.nonomi_armor2_2.title=Return on Investment
actors.hero.talent.nonomi_armor2_2.desc=_+1:_ Defeating an enemy with this ability grants _20 Credits_.\n\n_+2:_ Defeating an enemy with this ability grants _40 Credits_.\n\n_+3:_ Defeating an enemy with this ability grants _60 Credits_.\n\n_+4:_ Defeating an enemy with this ability grants _80 Credits_.
actors.hero.talent.nonomi_armor2_3.title=Shining Gold
actors.hero.talent.nonomi_armor2_3.desc=_+1:_ Grants _1 turn_ of Radiance per credit spent by this ability.\n\n_+2:_ Grants _2 turns_ of Radiance per credit spent by this ability.\n\n_+3:_ Grants _3 turns_ of Radiance per credit spent by this ability.\n\n_+4:_ Grants _4 turns_ of Radiance per credit spent by this ability.

actors.hero.talent.nonomi_armor3_1.title=Belt-Feed Solution
actors.hero.talent.nonomi_armor3_1.desc=_+1:_ Automatically chambers 1 round every _8 turns_ while this ability is active.\n\n_+2:_ Automatically chambers 1 round every _7 turns_ while this ability is active.\n\n_+3:_ Automatically chambers 1 round every _6 turns_ while this ability is active.\n\n_+4:_ Automatically chambers 1 round every _5 turns_ while this ability is active.
actors.hero.talent.nonomi_armor3_2.title=Steady Stance
actors.hero.talent.nonomi_armor3_2.desc=_+1:_ Increases bullet accuracy by _20%_ while this ability is active.\n\n_+2:_ Increases bullet accuracy by _40%_ while this ability is active.\n\n_+3:_ Increases bullet accuracy by _60%_ while this ability is active.\n\n_+4:_ Increases bullet accuracy by _80%_ while this ability is active.
actors.hero.talent.nonomi_armor3_3.title=Reposition
actors.hero.talent.nonomi_armor3_3.desc=_+1:_ Reactivating this ability within _1 turn_ after it ends costs 50% less energy.\n\n_+2:_ Reactivating this ability within _2 turns_ after it ends costs 50% less energy.\n\n_+3:_ Reactivating this ability within _3 turns_ after it ends costs 50% less energy.\n\n_+4:_ Reactivating this ability within _4 turns_ after it ends costs 50% less energy.

actors.hero.abilities.nonomi.present.name=Presents for Everyone
actors.hero.abilities.nonomi.present.short_desc=Nonomi hands out gifts to all visible enemies, _temporarily preventing them from attacking her_.\n
actors.hero.abilities.nonomi.present.desc=Nonomi hands out gifts to everyone in line of sight, Charming them for 5 turns so they cannot attack her.
actors.hero.abilities.nonomi.blackcard.name=Black Card
actors.hero.abilities.nonomi.blackcard.short_desc=Nonomi spends all of her credits to _deal defense-piercing damage to all enemies in line of sight_.\n
actors.hero.abilities.nonomi.blackcard.desc=Unleashing the power of her Black Card, Nonomi consumes all held credits to deal 1 defense-ignoring damage to all enemies in line of sight for every 30 credits spent.
actors.hero.abilities.nonomi.blackcard.no_gold=Not enough credits!
actors.hero.abilities.nonomi.bipod.name=Deploy Bipod
actors.hero.abilities.nonomi.bipod.short_desc=Nonomi deploys a bipod to _fire her firearm without consuming turns_ until performing another action.\n
actors.hero.abilities.nonomi.bipod.desc=Nonomi deploys a bipod to brace recoil, allowing her to fire without consuming turns until she moves, reloads, or makes a melee attack.
actors.hero.abilities.nonomi.bipod$bipodbuff.name=Bipod
actors.hero.abilities.nonomi.bipod$bipodbuff.desc=Nonomi has deployed her bipod, firmly anchoring it to the ground.\n\nWhile the bipod is deployed, firing firearms consumes no turns until she moves or makes a melee attack.
actors.hero.abilities.nonomi.bipod$bipodtracker.name=Reposition
actors.hero.abilities.nonomi.bipod$bipodtracker.desc=Nonomi is adjusting her bipod position!\n\nDeploying the bipod again right now costs 50%% less energy.\n\nTurns remaining: %s.


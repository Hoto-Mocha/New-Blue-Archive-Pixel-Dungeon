###Miyako Sentences
actors.hero.heroclass.miyako=Miyako
actors.hero.heroclass.miyako_desc_short=Tsukiyuki Miyako, RABBIT Platoon, SRT Special Academy. Awaiting your orders, Sensei.\n\nDifficulty: _Normal_
actors.hero.heroclass.miyako_desc=Miyako begins with a _Claymore_ that deals damage over a wide area and inflicts a brief Slow.\n\nMiyako is proficient with SMGs, requiring _1 less strength_ to handle them properly.\n\nMiyako also enters the dungeon with a _Tier-1 SMG_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nMiyako begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.miyako_unlock=Miyako is unlocked by default.

actors.hero.herosubclass.rabbit_squad=RABBIT Squad, Deploy!
actors.hero.herosubclass.rabbit_squad_short_desc=Miyako can _fight alongside the support of her RABBIT Platoon squadmates_.\n
actors.hero.herosubclass.rabbit_squad_desc=Each time Miyako activates this ability, she receives support from her squadmates in sequence: Saki, Miyu, then Moe.\n\n_Saki:_ Saki deploys onto the field, following Miyako and assisting in combat.\nSaki's combat stats scale with Miyako's.\nCooldown: 250 turns\n\n_Miyu:_ Fires a powerful SR round at a targeted location without consuming a turn.\nDamage scales with Miyako's equipped weapon.\nCooldown: 50 turns\n\n_Moe:_ Calls in 6 powerful airstrikes at random locations within a 3x3 area around the target.\nDamage scales with the current region and Miyako's level.\nCooldown: 100 turns
actors.hero.herosubclass.support_drone=Combat Support Drone
actors.hero.herosubclass.support_drone_short_desc=Each time Miyako defeats an enemy, she gains a _combat support drone that aids in battle_.\n
actors.hero.herosubclass.support_drone_desc=Each enemy Miyako defeats grants 1 combat support drone, up to a maximum of 3. On bullet hits, each drone deals minor shock damage.\n\nWhenever Miyako takes a hit, a drone reduces incoming damage by 50% and is destroyed in the process.

actors.hero.hero.miyako_health_critical_1=Status critical. Medical treatment required.
actors.hero.hero.miyako_health_critical_2=Ugh... This is looking critical.
actors.hero.hero.miyako_health_critical_3=I'm... alri—no, this is not alright...

actors.hero.hero.miyako_health_warn_1=My condition is deteriorating... It would be wise to find a safe spot to rest.
actors.hero.hero.miyako_health_warn_2=The shortcut to mission success lies in maintaining peak condition. We should take a brief rest.
actors.hero.hero.miyako_health_warn_3=It would be best to regroup and reorganize for a moment.

actors.hero.hero.miyako_die=Mission... failed...

actors.hero.hero.miyako_enemy_defeated_1=Futile resistance.
actors.hero.hero.miyako_enemy_defeated_2=The mission is not yet over.
actors.hero.hero.miyako_enemy_defeated_3=Where is the next hostile?
actors.hero.hero.miyako_enemy_defeated_4=After-action report: all clear. Moving out.
actors.hero.hero.miyako_enemy_defeated_5=Kill confirmed. We must maintain situational awareness at all times.

actors.hero.hero.miyako_levelup_1=I feel my capabilities expanding.
actors.hero.hero.miyako_levelup_2=Is this also... growth...?
actors.hero.hero.miyako_levelup_3=Growing stronger is such a rewarding feeling.
actors.hero.hero.miyako_levelup_4=I'll work even harder to live up to your expectations.
actors.hero.hero.miyako_levelup_5=I will make sure not to disappoint you.
actors.hero.hero.miyako_levelup_rare=It's an unfamiliar environment, but I seem to be adapting well enough. Things are steadily improving.

actors.hero.talent.miyako_t1_1.title=High-Explosive Grenade
actors.hero.talent.miyako_t1_1.desc=_+1:_ Increases grenade damage by _2_.\n\n_+2:_ Increases grenade damage by _3_.
actors.hero.talent.miyako_t1_2.title=SMG Specialist
actors.hero.talent.miyako_t1_2.desc=_+1:_ Instantly identifies SMGs _upon equipping_.\n\n_+2:_ Instantly identifies SMGs _upon acquiring_.
actors.hero.talent.miyako_t1_3.title=CQC
actors.hero.talent.miyako_t1_3.desc=_+1:_ Increases firearm melee damage by _1_.\n\n_+2:_ Increases firearm melee damage by _1-2_.
actors.hero.talent.miyako_t1_4.title=Diversionary Tactics
actors.hero.talent.miyako_t1_4.desc=_+1:_ The first sneak attack on an enemy inflicts Dazed for _2 turns_.\n\n_+2:_ The first sneak attack on an enemy inflicts Dazed for _3 turns_.

actors.hero.talent.miyako_t2_1.title=Field Rations
actors.hero.talent.miyako_t2_1.desc=_+1:_ Eating takes only 1 turn and grants shielding equal to _10%_ of max HP.\n\n_+2:_ Eating takes only 1 turn and grants shielding equal to _15%_ of max HP.
actors.hero.talent.miyako_t2_2.title=Combat Supplies
actors.hero.talent.miyako_t2_2.desc=_+1:_ Increases maximum _Hand Grenade_ capacity by 1.\n\n_+2:_ In addition to the +1 effect, increases maximum _Compact Claymore_ capacity by 1.
actors.hero.talent.miyako_t2_3.title=Intel Acquisition
actors.hero.talent.miyako_t2_3.desc=_+1:_ Grants Mind Vision for enemies within _2 tiles_.\n\n_+2:_ Grants Mind Vision for enemies within _3 tiles_.
actors.hero.talent.miyako_t2_4.title=Tactical Maneuver
actors.hero.talent.miyako_t2_4.desc=_+1:_ Dodging an attack has a _25%_ chance to chamber 1 round into your equipped firearm.\n\n_+2:_ Dodging an attack has a _50%_ chance to chamber 1 round into your equipped firearm.
actors.hero.talent.miyako_t2_5.title=Ballistic Plate Insert
actors.hero.talent.miyako_t2_5.desc=_+1:_ Increases maximum health by _10%_.\n\n_+2:_ Increases maximum health by _20%_.

actors.hero.talent.miyako_t3_1.title=High Lob
actors.hero.talent.miyako_t3_1.desc=_+1:_ Grenades pass through _characters_ within 3 tiles.\n\n_+2:_ Grenades pass through _characters and doors_ within 3 tiles.\n\n_+3:_ Grenades pass through _characters, doors, and walls_ within 3 tiles.
actors.hero.talent.miyako_t3_2.title=Rabbit, Open Up!
actors.hero.talent.miyako_t3_2.desc=_+1:_ Detonating a Compact Claymore at a door breaches it, increasing Claymore blast radius and damage by _100%_.\n\n_+2:_ Detonating a Compact Claymore at a door breaches it, increasing Claymore blast radius and damage by _200%_.\n\n_+3:_ Detonating a Compact Claymore at a door breaches it, increasing Claymore blast radius and damage by _300%_.

actors.hero.talent.miyako_ex1_1.title=Rapid Backup
actors.hero.talent.miyako_ex1_1.desc=_+1:_ Decreases Saki's cooldown by _50 turns_.\n\n_+2:_ Decreases Saki's cooldown by _100 turns_.\n\n_+3:_ Decreases Saki's cooldown by _150 turns_.
actors.hero.talent.miyako_ex1_2.title=Flawless Sniper
actors.hero.talent.miyako_ex1_2.desc=_+1:_ Miyu's snipe gains _+100%_ accuracy.\n\n_+2:_ Miyu's snipe gains _+300%_ accuracy.\n\n_+3:_ Miyu's snipe gains _+500%_ accuracy.
actors.hero.talent.miyako_ex1_3.title=Indiscriminate Bombardment
actors.hero.talent.miyako_ex1_3.desc=_+1:_ Increases Concentrated Fire projectiles by _+3 shells_.\n\n_+2:_ Increases Concentrated Fire projectiles by _+6 shells_.\n\n_+3:_ Increases Concentrated Fire projectiles by _+9 shells_.

actors.hero.talent.miyako_ex2_1.title=Expansion Port
actors.hero.talent.miyako_ex2_1.desc=_+1:_ Defeating an enemy has a _20%_ chance to activate 2 drones.\n\n_+2:_ In addition to the +1 effect, taking a hit has a _20%_ chance not to lose a drone.\n\n_+3:_ In addition to the +2 effect, _increases maximum active drones by 1_.
actors.hero.talent.miyako_ex2_2.title=High-Voltage Shock
actors.hero.talent.miyako_ex2_2.desc=_+1:_ Increases drone electric shock maximum damage by _+0.5_.\n\n_+2:_ Increases drone electric shock maximum damage by _+1_.\n\n_+3:_ Increases drone electric shock maximum damage by _+1.5_.\n\nFractional damage values apply as an equivalent percentage chance.
actors.hero.talent.miyako_ex2_3.title=Drone Recon
actors.hero.talent.miyako_ex2_3.desc=_+1:_ Grants Mind Vision for enemies up to 1 tile behind walls per drone held, capping at _1 drone_.\n\n_+2:_ Grants Mind Vision for enemies up to 1 tile behind walls per drone held, capping at _2 drones_.\n\n_+3:_ Grants Mind Vision for enemies up to 1 tile behind walls per drone held, capping at _3 drones_.\n\nStacks with other Mind Vision effects.

actors.hero.talent.miyako_armor1_1.title=Wire Snare
actors.hero.talent.miyako_armor1_1.desc=_+1:_ Roots enemies pulled by the Wire Hook for _1 turn_.\n\n_+2:_ Roots enemies pulled by the Wire Hook for _2 turns_.\n\n_+3:_ Roots enemies pulled by the Wire Hook for _3 turns_.\n\n_+4:_ Roots enemies pulled by the Wire Hook for _4 turns_.
actors.hero.talent.miyako_armor1_2.title=Multi-Hook
actors.hero.talent.miyako_armor1_2.desc=_+1:_ Using the Wire Hook within 3 turns of a previous cast costs _10%_ less energy.\n\n_+2:_ Using the Wire Hook within 3 turns of a previous cast costs _19%_ less energy.\n\n_+3:_ Using the Wire Hook within 3 turns of a previous cast costs _27%_ less energy.\n\n_+4:_ Using the Wire Hook within 3 turns of a previous cast costs _34%_ less energy.\n\nDoes not apply to subsequent Wire Hook uses while the energy discount is active.
actors.hero.talent.miyako_armor1_3.title=Point-Blank Fire
actors.hero.talent.miyako_armor1_3.desc=_+1:_ After pulling an enemy, bullet accuracy against adjacent enemies increases by +200% for _4 turns_.\n\n_+2:_ After pulling an enemy, bullet accuracy against adjacent enemies increases by +200% for _8 turns_.\n\n_+3:_ After pulling an enemy, bullet accuracy against adjacent enemies increases by +200% for _12 turns_.\n\n_+4:_ After pulling an enemy, bullet accuracy against adjacent enemies increases by +200% for _16 turns_.

actors.hero.talent.miyako_armor2_1.title=Fast-Rope Training
actors.hero.talent.miyako_armor2_1.desc=_+1:_ Turn delay upon landing is reduced by _20%_.\n\n_+2:_ Turn delay upon landing is reduced by _40%_.\n\n_+3:_ Turn delay upon landing is reduced by _60%_.\n\n_+4:_ Turn delay upon landing is reduced by _80%_.
actors.hero.talent.miyako_armor2_2.title=Drive-By Fire
actors.hero.talent.miyako_armor2_2.desc=_+1:_ Activating this ability has a _25% chance_ to fire your equipped firearm at all enemies along the flight path.\n\n_+2:_ Activating this ability has a _50% chance_ to fire your equipped firearm at all enemies along the flight path.\n\n_+3:_ Activating this ability has a _75% chance_ to fire your equipped firearm at all enemies along the flight path.\n\n_+4:_ Activating this ability has a _100% chance_ to fire your equipped firearm at all enemies along the flight path.
actors.hero.talent.miyako_armor2_3.title=Prior Recon
actors.hero.talent.miyako_armor2_3.desc=_+1:_ Energy cost for revealing enemy positions with this ability is reduced by _25%_.\n\n_+2:_ Energy cost for revealing enemy positions with this ability is reduced by _50%_.\n\n_+3:_ Energy cost for revealing enemy positions with this ability is reduced by _75%_.\n\n_+4:_ Energy cost for revealing enemy positions with this ability is reduced by _100%_.

actors.hero.talent.miyako_armor3_1.title=Napalm Strike
actors.hero.talent.miyako_armor3_1.desc=_+1:_ Flames linger for _2 turns_ at the bombardment impact point.\n\n_+2:_ Flames linger for _4 turns_ at the bombardment impact point.\n\n_+3:_ Flames linger for _6 turns_ at the bombardment impact point.\n\n_+4:_ Flames linger for _8 turns_ at the bombardment impact point.
actors.hero.talent.miyako_armor3_2.title=Supply Drop
actors.hero.talent.miyako_armor3_2.desc=_+1:_ Activating this ability grants _1 Hand Grenade_.\n\n_+2:_ Activating this ability grants _1-2 Hand Grenades_.\n\n_+3:_ Activating this ability grants _2 Hand Grenades_.\n\n_+4:_ Activating this ability grants _2 Hand Grenades and 1 Compact Claymore_.
actors.hero.talent.miyako_armor3_3.title=High-Yield Payload
actors.hero.talent.miyako_armor3_3.desc=_+1:_ Increases explosion damage by _25%_.\n\n_+2:_ Increases explosion damage by _50%_.\n\n_+3:_ Increases explosion damage by _75%_.\n\n_+4:_ Increases explosion damage by _100%_.

actors.hero.abilities.miyako.wirehook.name=Wire Hook
actors.hero.abilities.miyako.wirehook.short_desc=Miyako uses a wire hook to _pull distant enemies directly to her_.\n
actors.hero.abilities.miyako.wirehook.desc=Miyako launches a wire hook, pulling a distant enemy directly in front of her while Crippling them for 5 turns.

actors.mobs.gnollsapper.desc=A small, frail, but clever gnoll with pale fur and a pack full of various tools. They were likely brought here to aid in prospecting and mining Pyroxene, protected by nearby guards. While capable of fighting, their attacks are no stronger than a gnoll scout's.\n\nRather than fighting directly, sappers prefer using various tools to let the rocky environment do the attacking for them. However, since they cannot wield earth-shaping magic themselves, they tend to use their tools rather recklessly. _There may be a way to turn their attacks back against them or their guards._


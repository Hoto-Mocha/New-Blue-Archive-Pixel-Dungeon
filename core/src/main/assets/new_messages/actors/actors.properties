actors.buffs.chasemark.name=Target Tracking
actors.buffs.chasemark.desc=Ah, My Lord! Izuna is tracking a target right now! I can perfectly predict where the enemy I recently struck with a thrown weapon is located!\nRight now I can close in instantly and attack them, but after some time passes I won't be able to pursue them.\n\nI can track and strike them immediately for the next _%s turns_.

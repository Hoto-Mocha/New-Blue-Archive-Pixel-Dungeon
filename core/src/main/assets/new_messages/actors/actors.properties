actors.mobs.npcs.vaultmirror.scene_aris=You see the _Sword of Light: Supernova_. This scene feels like a fragment of your memory, yet subtle details are different.
actors.mobs.npcs.vaultmirror.scene_nonomi=You see the _Mini Gun No. 5_. This scene feels like a fragment of your memory, yet subtle details are different.

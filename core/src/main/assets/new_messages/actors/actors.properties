###Aris sentences
actors.hero.heroclass.aris=Aris
actors.hero.heroclass.aris_desc_short=What kind of quest shall we embark on today? Aris is ready to join you!\n\nDifficulty: _Special_
actors.hero.heroclass.aris_desc=Aris starts with the shield-generating _Millennium Emblem_. A treasure to Aris, this emblem can be transferred between school uniforms, carrying over its _+1 upgrade level_ along with it.\n\nAs the Hero of Light exploring the dungeon, Aris wields melee weapons rather than firearms. She will find _melee weapons_ throughout the dungeon instead of guns.\n\nAris also enters the dungeon with a _Worn Shortsword_, _three Throwing Stones_, the _Sword of Light: Supernova_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nAris begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.aris_unlock=Aris is unlocked by default.

actors.hero.herosubclass.light_hero=Hero of Light
actors.hero.herosubclass.light_hero_short_desc=Taking up the calling of the Hero of Light, Aris can now _swing the Sword of Light: Supernova as a melee weapon_.
actors.hero.herosubclass.light_hero_desc=Embracing the destiny of the Hero of Light, Aris gains the ability to swing the Sword of Light: Supernova as a melee weapon.
actors.hero.herosubclass.battery_charge=Battery Charge!
actors.hero.herosubclass.battery_charge_short_desc=Landing melee attacks builds up Supernova charge, _hastening the next Balance Breaker shot or amplifying its damage_.
actors.hero.herosubclass.battery_charge_desc=Each successful melee hit grants Aris 1 stack of Supernova Charge.\n\nStacks can be spent during the Balance Breaker cooldown to reduce the remaining time by an equivalent amount. Firing Balance Breaker with existing stacks grants +1% bonus damage per stack held.


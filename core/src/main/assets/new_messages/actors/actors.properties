actors.buffs.supportdrone.name=Combat Support Drone
actors.buffs.supportdrone.desc=Combat support drones hover around Miyako, automatically attacking any enemy she engages!\n\nDefeating an enemy activates a drone, and taking a physical hit reduces damage taken by 50%% at the cost of destroying 1 drone.\n\nDrones remaining: %d.

###Hoshino Sentences
actors.hero.heroclass.hoshino=Hoshino
actors.hero.heroclass.hoshino_desc_short=Yaa~awn. Let's take it easy. Having room to breathe is what counts, y'know?\n\nDifficulty: _Easy_
actors.hero.heroclass.hoshino_desc=Hoshino begins with the _Riot Shield "Iron Horus"_, granting bonus defense until she moves. Wielding an HG reduces the shield's defense, but its protection persists even while moving.\n\nHoshino is proficient with SGs, requiring _1 less strength_ to handle them properly.\n\nReloading a firearm that is already full lets Hoshino chamber _1 additional round_.\n\nHoshino also enters the dungeon with a _Tier-1 SG_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nHoshino begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.hoshino_unlock=Hoshino is unlocked by default.

actors.hero.herosubclass.shield_bash=Shield Bash
actors.hero.herosubclass.shield_bash_short_desc=While shielding, Hoshino can _dash a short distance_ to strike and knock back enemies.\n
actors.hero.herosubclass.shield_bash_desc=Hoshino dashes across a short distance in 1 turn using Shield Bash. Ramming an enemy deals damage equal to the shield's defense and knocks them back. Dismisses the shield after use.\n\nWhile wielding guns other than HGs:\nDash distance: 1 tile, Knockback distance: 4 tiles\n\nWhile wielding an HG:\nDash distance: 3 tiles, Knockback distance: 2 tiles
actors.hero.herosubclass.swift_movement=Nimble Maneuver
actors.hero.herosubclass.swift_movement_short_desc=Hoshino blinks instantly to a nearby tile, leaving behind an afterimage to _confuse enemies_.\n
actors.hero.herosubclass.swift_movement_desc=Hoshino instantly moves to a chosen tile within 1 tile, leaving behind an afterimage. Enemies prioritize attacking the afterimage; when struck, it breaks the pursuit of all visible hostiles. Reloading your firearm reactivates this ability.

actors.hero.hero.hoshino_health_critical_1=Uhe~ I'm used to fighting, but my body doesn't seem quite so eager.
actors.hero.hero.hoshino_health_critical_2=Hey now~ can't we go find a spot to sleep?
actors.hero.hero.hoshino_health_critical_3=Listen here. You're working this old lady way too hard, cut me some slack.

actors.hero.hero.hoshino_health_warn_1=Aren't you worn out~? Let's go over there and take a quick nap~
actors.hero.hero.hoshino_health_warn_2=Let's just sleep a tiny bit first~ pleeease~?
actors.hero.hero.hoshino_health_warn_3=So tired~ so sleepy~ let's take a break~

actors.hero.hero.hoshino_die=This wasn't how things were supposed to go...

actors.hero.hero.hoshino_enemy_defeated_1=No use.
actors.hero.hero.hoshino_enemy_defeated_2=Yaaawn~ Victory, victory~
actors.hero.hero.hoshino_enemy_defeated_3=It's no use, y'know~
actors.hero.hero.hoshino_enemy_defeated_4=Yaaawn~ Guess we won without even trying.
actors.hero.hero.hoshino_enemy_defeated_5=Uwah~ What a pain—

actors.hero.hero.hoshino_levelup_1=Phew, did I get stronger?
actors.hero.hero.hoshino_levelup_2=Yep, feels pretty good~
actors.hero.hero.hoshino_levelup_3=Haa~ went and got even stronger, huh.
actors.hero.hero.hoshino_levelup_4=Uhe~ this'll make me way sturdier.
actors.hero.hero.hoshino_levelup_5=Hm? Not bad at all.
actors.hero.hero.hoshino_levelup_rare=Hmm. Might not be half bad. Believe it or not, I'm steadily growing stronger.

actors.hero.hero.hoshino_too_far=Gotta pick somewhere closer. That's way too far, y'know.
actors.hero.hero.hoshino_rooted=My feet are tied up, can't move.
actors.hero.hero.hoshino_bad_location=Can't move there.
actors.hero.hero.hoshino_shield_cooldown=Not ready just yet.

actors.hero.talent.hoshino_t1_1.title=First Aid
actors.hero.talent.hoshino_t1_1.desc=_+1:_ Taking damage that drops HP below 25% instantly restores _4_ HP.\n\n_+2:_ Taking damage that drops HP below 25% instantly restores _6_ HP.\n\nIncurs a 50-turn cooldown.
actors.hero.talent.hoshino_t1_2.title=Shotgun Specialist
actors.hero.talent.hoshino_t1_2.desc=_+1:_ Instantly identifies SGs _upon equipping_.\n\n_+2:_ Instantly identifies SGs _upon acquiring_.
actors.hero.talent.hoshino_t1_3.title=Light Armor
actors.hero.talent.hoshino_t1_3.desc=_+1:_ Increases maximum defense of tier-3 or lower armor by _2_.\n\n_+2:_ Increases maximum defense of tier-3 or lower armor by _3_.
actors.hero.talent.hoshino_t1_4.title=Reload Proficiency
actors.hero.talent.hoshino_t1_4.desc=_+1:_ Reloading after spending all ammo grants _3_ shielding.\n\n_+2:_ Reloading after spending all ammo grants _5_ shielding.

actors.hero.talent.hoshino_t2_1.title=Food Coma...
actors.hero.talent.hoshino_t2_1.desc=_+1:_ Eating takes only 1 turn and inflicts Drowsy for _200_ turns.\n\n_+2:_ Eating takes only 1 turn and inflicts Drowsy for _125_ turns.\n\nDoes not refresh duration if already Drowsy.
actors.hero.talent.hoshino_t2_2.title=World-Piercing Eye
actors.hero.talent.hoshino_t2_2.desc=_+1:_ Reading a scroll searches a radius of _8 tiles_ around you.\n\n_+2:_ Reading a scroll searches a radius of _12 tiles_ around you.\n\nSearch range doubles when reading Scrolls of Upgrade, Scrolls of Transmutation, or using alchemy items crafted from them.\n\nFor crafted alchemy items that yield more outputs than scrolls consumed (e.g. spells), search distance scales based on the quantity produced.
actors.hero.talent.hoshino_t2_3.title=Truth-Piercing Eye
actors.hero.talent.hoshino_t2_3.desc=_+1:_ Grants Mind Vision for all characters within _2 tiles_.\n\n_+2:_ Grants Mind Vision for all characters within _3 tiles_.
actors.hero.talent.hoshino_t2_4.title=Shield Barrier
actors.hero.talent.hoshino_t2_4.desc=_+1:_ While using the riot shield, grants magical defense equal to _50%_ of shield defense.\n\n_+2:_ While using the riot shield, grants magical defense equal to _75%_ of shield defense.
actors.hero.talent.hoshino_t2_5.title=Preemptive Strike
actors.hero.talent.hoshino_t2_5.desc=_+1:_ Defeating an enemy increases damage of the next _2 rounds_ by 1.\n\n_+2:_ Defeating an enemy increases damage of the next _3 rounds_ by 1.\n\nShot count does not stack, but bullet damage stacks up to 10.\nDefeating an enemy with bullets reduces shots gained by 1.
actors.hero.talent$intimidatebonusdamagebuff.name=Increased Bullet Damage
actors.hero.talent$intimidatebonusdamagebuff.desc=Bullet damage is temporarily increased. Each bullet hit consumes one charge of this effect.\n\nBonus damage: %1$d.\nRemaining hits: %2$d.

actors.hero.talent.hoshino_t3_1.title=Tactical Suppression
actors.hero.talent.hoshino_t3_1.desc=_+1:_ The next melee hit against an enemy struck by bullets instantly executes targets below _7%_ HP.\n\n_+2:_ The next melee hit against an enemy struck by bullets instantly executes targets below _13%_ HP.\n\n_+3:_ The next melee hit against an enemy struck by bullets instantly executes targets below _20%_ HP.
actors.hero.talent.hoshino_t3_2.title=Suppression Mastery
actors.hero.talent.hoshino_t3_2.desc=_+1:_ Increases close-range bullet accuracy by _50%_.\n\n_+2:_ Increases close-range bullet accuracy by _100%_.\n\n_+3:_ Increases close-range bullet accuracy by _150%_.

actors.hero.talent.hoshino_ex1_1.title=Heavy Impact
actors.hero.talent.hoshino_ex1_1.desc=_+1:_ Inflicts Dazed for _2 turns_ and reduces defense by _1_ on knocked-back targets.\n\n_+2:_ Inflicts Dazed for _4 turns_ and reduces defense by _2_ on knocked-back targets.\n\n_+3:_ Inflicts Dazed for _6 turns_ and reduces defense by _3_ on knocked-back targets.
actors.hero.talent.hoshino_ex1_2.title=Head-On Collision
actors.hero.talent.hoshino_ex1_2.desc=_+1:_ Increases Shield Bash damage by _50%_, but you also suffer _4-10_ recoil damage.\n\n_+2:_ Increases Shield Bash damage by _100%_, but you also suffer _8-20_ recoil damage.\n\n_+3:_ Increases Shield Bash damage by _150%_, but you also suffer _12-30_ recoil damage.\n\nSelf-damage can be mitigated by defense.
actors.hero.talent.hoshino_ex1_3.title=Momentary Focus
actors.hero.talent.hoshino_ex1_3.desc=_+1:_ The next physical attack landed within 5 turns of knocking back an enemy gains _2x_ accuracy.\n\n_+2:_ The next physical attack landed within 5 turns of knocking back an enemy gains _5x_ accuracy.\n\n_+3:_ The next physical attack landed within 5 turns of knocking back an enemy _always hits_.

actors.hero.talent.hoshino_ex2_1.title=Tactical Retreat
actors.hero.talent.hoshino_ex2_1.desc=_+1:_ If there are _4 or more_ enemies in line of sight, gaining 5 turns of Invisibility when the afterimage is struck.\n\n_+2:_ If there are _3 or more_ enemies in line of sight, gaining 5 turns of Invisibility when the afterimage is struck.\n\n_+3:_ If there are _2 or more_ enemies in line of sight, gaining 5 turns of Invisibility when the afterimage is struck.
actors.hero.talent.hoshino_ex2_2.title=Exposed Weakness
actors.hero.talent.hoshino_ex2_2.desc=_+1:_ Attacking an enemy that struck the afterimage instantly executes them if their health drops below _13%_.\n\n_+2:_ Attacking an enemy that struck the afterimage instantly executes them if their health drops below _27%_.\n\n_+3:_ Attacking an enemy that struck the afterimage instantly executes them if their health drops below _40%_.
actors.hero.talent.hoshino_ex2_3.title=Booby Trap
actors.hero.talent.hoshino_ex2_3.desc=_+1:_ Whenever the afterimage is attacked, it detonates to deal _3_ damage to surrounding enemies.\n\n_+2:_ Whenever the afterimage is attacked, it detonates to deal _5_ damage to surrounding enemies.\n\n_+3:_ Whenever the afterimage is attacked, it detonates to deal _7_ damage to surrounding enemies.\n\nAllies take no damage from this explosion.

actors.hero.talent.hoshino_armor1_1.title=High Propulsion
actors.hero.talent.hoshino_armor1_1.desc=_+1:_ Increases Pursuit range by _+1 tile_, and executes enemies with HP up to _5_ above the lethal execution threshold.\n\n_+2:_ Increases Pursuit range by _+2 tiles_, and executes enemies with HP up to _10_ above the lethal execution threshold.\n\n_+3:_ Increases Pursuit range by _+3 tiles_, and executes enemies with HP up to _15_ above the lethal execution threshold.\n\n_+4:_ Increases Pursuit range by _+4 tiles_, and executes enemies with HP up to _20_ above the lethal execution threshold.
actors.hero.talent.hoshino_armor1_2.title=Shove
actors.hero.talent.hoshino_armor1_2.desc=_+1:_ Failing to execute an enemy with Pursuit knocks them back _2 tiles_ and grants _5_ shielding.\n\n_+2:_ Failing to execute an enemy with Pursuit knocks them back _4 tiles_ and grants _10_ shielding.\n\n_+3:_ Failing to execute an enemy with Pursuit knocks them back _6 tiles_ and grants _15_ shielding.\n\n_+4:_ Failing to execute an enemy with Pursuit knocks them back _8 tiles_ and grants _20_ shielding.
actors.hero.talent.hoshino_armor1_3.title=Chain Pursuit
actors.hero.talent.hoshino_armor1_3.desc=_+1:_ Instantly executing an enemy with Pursuit reduces the charge cost of your next Pursuit by _13%_.\n\n_+2:_ Instantly executing an enemy with Pursuit reduces the charge cost of your next Pursuit by _25%_.\n\n_+3:_ Instantly executing an enemy with Pursuit reduces the charge cost of your next Pursuit by _38%_.\n\n_+4:_ Instantly executing an enemy with Pursuit reduces the charge cost of your next Pursuit by _50%_.

actors.hero.talent.hoshino_armor2_1.title=Barbed Spikes
actors.hero.talent.hoshino_armor2_1.desc=_+1:_ Increases bleeding dealt by Spiked Shield by _25%_.\n\n_+2:_ Increases bleeding dealt by Spiked Shield by _50%_.\n\n_+3:_ Increases bleeding dealt by Spiked Shield by _75%_.\n\n_+4:_ Increases bleeding dealt by Spiked Shield by _100%_.
actors.hero.talent.hoshino_armor2_2.title=Defensive Stance
actors.hero.talent.hoshino_armor2_2.desc=_+1:_ Increases defense provided by the Riot Shield by _+2_ while Spiked Shield is active.\n\n_+2:_ Increases defense provided by the Riot Shield by _+4_ while Spiked Shield is active.\n\n_+3:_ Increases defense provided by the Riot Shield by _+6_ while Spiked Shield is active.\n\n_+4:_ Increases defense provided by the Riot Shield by _+8_ while Spiked Shield is active.
actors.hero.talent.hoshino_armor2_3.title=Quick Prep
actors.hero.talent.hoshino_armor2_3.desc=_+1:_ Using this ability during Riot Shield cooldown consumes _10%_ less charge and clears the cooldown.\n\n_+2:_ Using this ability during Riot Shield cooldown consumes _19%_ less charge and clears the cooldown.\n\n_+3:_ Using this ability during Riot Shield cooldown consumes _27%_ less charge and clears the cooldown.\n\n_+4:_ Using this ability during Riot Shield cooldown consumes _33%_ less charge and clears the cooldown.

actors.hero.talent.hoshino_armor3_1.title=Shock Absorption
actors.hero.talent.hoshino_armor3_1.desc=_+1:_ Restores _2_ HP whenever you block an attack.\n\n_+2:_ Restores _4_ HP whenever you block an attack.\n\n_+3:_ Restores _6_ HP whenever you block an attack.\n\n_+4:_ Restores _8_ HP whenever you block an attack.
actors.hero.talent.hoshino_armor3_2.title=Shock Reflection
actors.hero.talent.hoshino_armor3_2.desc=_+1:_ Has a _25%_ chance to Paralyze the attacker whenever you block an attack.\n\n_+2:_ Has a _50%_ chance to Paralyze the attacker whenever you block an attack.\n\n_+3:_ Has a _75%_ chance to Paralyze the attacker whenever you block an attack.\n\n_+4:_ Has a _100%_ chance to Paralyze the attacker whenever you block an attack.
actors.hero.talent.hoshino_armor3_3.title=Follow-Through
actors.hero.talent.hoshino_armor3_3.desc=_+1:_ Blocking an attack chambers _0.5_ additional rounds.\n\n_+2:_ Blocking an attack chambers _1_ additional round.\n\n_+3:_ Blocking an attack chambers _1.5_ additional rounds.\n\n_+4:_ Blocking an attack chambers _2_ additional rounds.\n\nFractional amounts apply as an equivalent percentage chance.

actors.hero.abilities.hoshino.chase.name=Pursuit
actors.hero.abilities.hoshino.chase.short_desc=Hoshino leaps across a short distance to _strike down a targeted enemy_.\n
actors.hero.abilities.hoshino.chase.desc=Hoshino uses Pursuit to leap onto an enemy within 2 tiles and attack. If the target's HP is at or below 25% of their max health, they are executed instantly; otherwise, it deals 20 defense-ignoring damage.
actors.hero.abilities.hoshino.chase.too_far=Too far away to use this ability.
actors.hero.abilities.hoshino.spikeshield.name=Spiked Shield
actors.hero.abilities.hoshino.spikeshield.short_desc=While shielding, Hoshino can _inflict bleeding on attackers whenever she takes a hit_.\n
actors.hero.abilities.hoshino.spikeshield.desc=Hoshino can activate Spiked Shield while deploying the Riot Shield "Iron Horus". As long as the shield remains deployed, taking physical damage inflicts bleeding on the attacker proportional to their maximum health.\n\nActivating Spiked Shield consumes no turns, and its effect ends when the shield is dismissed.
actors.hero.abilities.hoshino.spikeshield.no_shield=You must be deploying the Riot Shield "Iron Horus" to use this ability!
actors.hero.abilities.hoshino.spikeshield.already_active=This ability is already active.
actors.hero.abilities.hoshino.spikeshield$spikeshieldbuff.name=Spiked Shield
actors.hero.abilities.hoshino.spikeshield$spikeshieldbuff.desc=Uhe, it's dangerous to get close. Back off, now.\n\nI mounted spikes onto Iron Horus while deploying it. Anyone who hits this is gonna regret it big time.
actors.hero.abilities.hoshino.shieldparry.name=Shield Deflect
actors.hero.abilities.hoshino.shieldparry.short_desc=While shielding, Hoshino can _block all incoming attacks_ for 1 turn.\n
actors.hero.abilities.hoshino.shieldparry.desc=Hoshino can activate Shield Deflect while deploying the Riot Shield "Iron Horus", completely blocking all incoming attacks for 1 turn without taking damage.
actors.hero.abilities.hoshino.shieldparry.no_shield=You must be deploying the Riot Shield "Iron Horus" to use this ability!

###Shiroko Sentences
actors.hero.heroclass.shiroko=Shiroko
actors.hero.heroclass.shiroko_desc_short=I'm Sunaookami Shiroko, 2nd year at the Abydos Foreclosure Task Force. Nice to meet you.\n\nDifficulty: _Normal_
actors.hero.heroclass.shiroko_desc=Shiroko begins with a _Bicycle_ that allows her to move a set distance at double speed.\n\nShiroko is proficient with ARs, requiring _1 less strength_ to handle them properly.\n\nUsing explosive-type ammo, _bullet hits deal minor bonus damage scaling with the current floor_.\n\nShiroko also enters the dungeon with a _Tier-1 AR_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nShiroko begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.shiroko_unlock=Shiroko is unlocked by default.

actors.hero.herosubclass.professional_riding=Professional Riding
actors.hero.herosubclass.professional_riding_short_desc=Shiroko masters _Professional Riding_, spending charge to perform various tactical maneuvers while on her bicycle.
actors.hero.herosubclass.professional_riding_desc=Shiroko can spend extra charge while riding her bicycle to perform various maneuvers.\n\nSkid Mark (10 charge): Dashes up to 3 tiles in 1 turn. Can jump over chasms, igniting traveled non-chasm tiles for 2 turns.\nRiding Reload (10 charge): Instantly reloads the equipped firearm without consuming a turn.\nWeighted Ram (15 charge): Knocks back an adjacent enemy by 3 tiles.\nSudden Acceleration (20 charge): The next 1-tile movement consumes no turn, granting 3 turns of Haste afterward.\nDrift (20 charge): Dismounts instantly with no cooldown or turn cost, tripling bicycle charge speed for the next 20 turns.
actors.hero.herosubclass.bank_robber=Bank Robber
actors.hero.herosubclass.bank_robber_short_desc=Shiroko becomes a bank robber, striking _terror_ into the hearts of everyone.
actors.hero.herosubclass.bank_robber_desc=Shiroko spends all chambered rounds to inflict Terror on all visible hostiles, scaling with firearm tier and rounds spent. Healthier enemies suffer less Terror, and completely healthy enemies are barely affected.\n\nAccumulating 20 or more turns of Terror converts it into 20 turns of Dread; affected enemies drop their loot, flee from you, and permanently escape the dungeon.\n\nAttacking enemies suffering from Terror or Dread extorts credits based on damage dealt.

actors.hero.hero.shiroko_health_critical_1=My condition isn't looking good.
actors.hero.hero.shiroko_health_critical_2=I think I need to rest.
actors.hero.hero.shiroko_health_critical_3=Getting a bit exhausted.

actors.hero.hero.shiroko_health_warn_1=Ugh... this might be getting dangerous.
actors.hero.hero.shiroko_health_warn_2=I need something to restore my health.
actors.hero.hero.shiroko_health_warn_3=My body is in rough shape...

actors.hero.hero.shiroko_die=Was I... just not good enough...

actors.hero.hero.shiroko_enemy_defeated_1=Hmph.
actors.hero.hero.shiroko_enemy_defeated_2=Target neutralized.
actors.hero.hero.shiroko_enemy_defeated_3=A tactical victory.
actors.hero.hero.shiroko_enemy_defeated_4=Clear.
actors.hero.hero.shiroko_enemy_defeated_5=Let's move out.

actors.hero.hero.shiroko_levelup_1=Feels like I've grown a bit.
actors.hero.hero.shiroko_levelup_2=I can feel the improvement.
actors.hero.hero.shiroko_levelup_3=Growing stronger...
actors.hero.hero.shiroko_levelup_4=Feeling a bit better now.
actors.hero.hero.shiroko_levelup_5=I feel stronger.
actors.hero.hero.shiroko_levelup_rare=Nn... so there are no banks around here, huh... What a shame.

actors.hero.hero.shiroko_bicycle_charged=My stamina has fully recovered.
actors.hero.hero.shiroko_ride_cooldown=Cannot ride the bicycle right now.
actors.hero.hero.shiroko_cannot_ride=I need a quick breather before riding the bicycle again.
actors.hero.hero.shiroko_no_charge=...Pushing the bike any further is impossible.
actors.hero.hero.shiroko_dash_bad_position=Can't go that way.
actors.hero.hero.shiroko_cannot_slam=Can't do that.
actors.hero.hero.shiroko_rooted=...My feet are pinned down, don't think I can do that...
actors.hero.hero.shiroko_need_gun=Nn... I need a gun to do that.
actors.hero.hero.shiroko_low_str=This gun is too heavy.
actors.hero.hero.shiroko_no_ammo=Out of ammo to fire...
actors.hero.hero.shiroko_cant_find_path=Nn... seems there's no path forward.
actors.hero.hero.shiroko_found_path=Found a way. Let's follow it.

actors.hero.talent.shiroko_t1_1.title=Short Rest...
actors.hero.talent.shiroko_t1_1.desc=_+1:_ Eating restores _1_ HP.\n\n_+2:_ Eating restores _2_ HP.
actors.hero.talent.shiroko_t1_2.title=Assault Rifle Specialist
actors.hero.talent.shiroko_t1_2.desc=_+1:_ Instantly identifies ARs _upon equipping_.\n\n_+2:_ Instantly identifies ARs _upon acquiring_.
actors.hero.talent.shiroko_t1_3.title=Explosive Rounds Upgrade
actors.hero.talent.shiroko_t1_3.desc=_+1:_ Increases bullet bonus damage by _1_.\n\n_+2:_ Increases bullet bonus damage by _2_.
actors.hero.talent.shiroko_t1_4.title=Defensive Feedback
actors.hero.talent.shiroko_t1_4.desc=_+1:_ Defeating an enemy grants _5_ shielding.\n\n_+2:_ Defeating an enemy grants _8_ shielding.

actors.hero.talent.shiroko_t2_1.title=Back on Track
actors.hero.talent.shiroko_t2_1.desc=_+1:_ Eating takes only 1 turn and grants Haste for _2 turns_.\n\n_+2:_ Eating takes only 1 turn and grants Haste for _3 turns_.
actors.hero.talent.shiroko_t2_2.title=Energy Drink
actors.hero.talent.shiroko_t2_2.desc=_+1:_ Drinking a potion restores _20_ bicycle charge.\n\n_+2:_ Drinking a potion restores _30_ bicycle charge.\n\nBicycle charge restored is doubled when drinking Potions of Strength, Potions of Experience, or using alchemy items crafted from them.\n\nFor crafted alchemy items that yield more outputs than potions consumed (e.g. aquatic brews), charge restored scales based on the quantity produced.
actors.hero.talent.shiroko_t2_3.title=Feral Instinct
actors.hero.talent.shiroko_t2_3.desc=_+1:_ While standing on grass tiles, grants Mind Vision for all characters within _3 tiles_.\n\n_+2:_ While standing on grass tiles, grants Mind Vision for all characters within _5 tiles_.
actors.hero.talent.shiroko_t2_4.title=Lock-"Pick"?
actors.hero.talent.shiroko_t2_4.desc=_+1:_ Locked doors can now be _blown open with explosions._\n\n_+2:_ In addition to the +1 effect, entering a floor for the first time _reveals a 3x3 area around locked doors._\n\nDoes not apply to crystal doors.
actors.hero.talent.shiroko_t2_5.title=Self-Sustaining Dynamo
actors.hero.talent.shiroko_t2_5.desc=_+1:_ Moving while riding the bicycle recharges wands by an extra _0.05_.\n\n_+2:_ Moving while riding the bicycle recharges wands by an extra _0.08_.

actors.hero.talent.shiroko_t3_1.title=Flawless Balance
actors.hero.talent.shiroko_t3_1.desc=_+1:_ Accuracy penalty while riding is adjusted from -50% to _-25%_.\n\n_+2:_ Accuracy penalty while riding is adjusted from -50% to _0%_.\n\n_+3:_ Accuracy penalty while riding is adjusted from -50% to _+25%_.
actors.hero.talent.shiroko_t3_2.title=Tracker Rounds
actors.hero.talent.shiroko_t3_2.desc=_+1:_ Bullet hits grant Mind Vision for the target for _10 turns_.\n\n_+2:_ Bullet hits grant Mind Vision for the target for _20 turns_.\n\n_+3:_ Bullet hits grant Mind Vision for the target for _30 turns_.

actors.hero.talent.shiroko_ex1_1.title=Rapid Recharge
actors.hero.talent.shiroko_ex1_1.desc=_+1:_ Increases bicycle recharge rate by _17%_.\n\n_+2:_ Increases bicycle recharge rate by _33%_.\n\n_+3:_ Increases bicycle recharge rate by _50%_.
actors.hero.talent.shiroko_ex1_2.title=Afterimage
actors.hero.talent.shiroko_ex1_2.desc=_+1:_ While riding, evasion increases by _17%_ of bonus movement speed gained.\n\n_+2:_ While riding, evasion increases by _33%_ of bonus movement speed gained.\n\n_+3:_ While riding, evasion increases by _50%_ of bonus movement speed gained.\n\nEvasion is not penalized when movement speed is slower than normal.
actors.hero.talent.shiroko_ex1_3.title=Eco-Drive
actors.hero.talent.shiroko_ex1_3.desc=_+1:_ Professional Riding actions consume _17%_ less charge.\n\n_+2:_ Professional Riding actions consume _33%_ less charge.\n\n_+3:_ Professional Riding actions consume _50%_ less charge.

actors.hero.talent.shiroko_ex2_1.title=Hostage Situation
actors.hero.talent.shiroko_ex2_1.desc=_+1:_ When 2 or more hostiles are visible, activating this adjacent to enemies Stuns all adjacent foes and has a _20%_ chance to instantly inflict Dread on enemies already suffering Terror.\n\n_+2:_ When 2 or more hostiles are visible, activating this adjacent to enemies Stuns all adjacent foes and has a _40%_ chance to instantly inflict Dread on enemies already suffering Terror.\n\n_+3:_ When 2 or more hostiles are visible, activating this adjacent to enemies Stuns all adjacent foes and has a _60%_ chance to instantly inflict Dread on enemies already suffering Terror.
actors.hero.talent.shiroko_ex2_2.title=Nn. Hand Over Everything.
actors.hero.talent.shiroko_ex2_2.desc=_+1:_ Enemies afflicted with Dread have a _33%_ increased chance to drop items.\n\n_+2:_ Enemies afflicted with Dread have a _67%_ increased chance to drop items.\n\n_+3:_ Enemies afflicted with Dread have a _100%_ increased chance to drop items.
actors.hero.talent.shiroko_ex2_3.title=Robbery Specialist
actors.hero.talent.shiroko_ex2_3.desc=_+1:_ Activating this ability in a shop causes Sora to flee, making all merchandise free and spawning 4 FOX Platoon members with a _100%_ chance.\n\n_+2:_ Activating this ability in a shop causes Sora to flee, making all merchandise free and spawning 4 FOX Platoon members with an _80%_ chance.\n\n_+3:_ Activating this ability in a shop causes Sora to flee, making all merchandise free and spawning 4 FOX Platoon members with a _60%_ chance.

actors.hero.talent.shiroko_armor1_1.title=Obstacle Piercing
actors.hero.talent.shiroko_armor1_1.desc=_+1:_ Increases bullet accuracy by _25%_ and pierces up to _2_ solid terrain tiles.\n\n_+2:_ Increases bullet accuracy by _50%_ and pierces up to _4_ solid terrain tiles.\n\n_+3:_ Increases bullet accuracy by _75%_ and pierces up to _6_ solid terrain tiles.\n\n_+4:_ Increases bullet accuracy by _100%_ and pierces up to _8_ solid terrain tiles.
actors.hero.talent.shiroko_armor1_2.title=Armor Breaker
actors.hero.talent.shiroko_armor1_2.desc=_+1:_ Bullets have a _25%_ chance to bypass enemy defense and inflict Vulnerable for 10 turns.\n\n_+2:_ Bullets have a _50%_ chance to bypass enemy defense and inflict Vulnerable for 10 turns.\n\n_+3:_ Bullets have a _75%_ chance to bypass enemy defense and inflict Vulnerable for 10 turns.\n\n_+4:_ Bullets have a _100%_ chance to bypass enemy defense and inflict Vulnerable for 10 turns.
actors.hero.talent.shiroko_armor1_3.title=Multi-Hit
actors.hero.talent.shiroko_armor1_3.desc=_+1:_ Reduces bullet damage by _45%_, but lands hits _2x_ as many times.\n\n_+2:_ Reduces bullet damage by _60%_, but lands hits _3x_ as many times.\n\n_+3:_ Reduces bullet damage by _68%_, but lands hits _4x_ as many times.\n\n_+4:_ Reduces bullet damage by _72%_, but lands hits _5x_ as many times.

actors.hero.talent.shiroko_armor2_1.title=High-Explosive Grenade
actors.hero.talent.shiroko_armor2_1.desc=_+1:_ Increases grenade damage by _25%_ and Weakened duration by _30%_.\n\n_+2:_ Increases grenade damage by _50%_ and Weakened duration by _50%_.\n\n_+3:_ Increases grenade damage by _75%_ and Weakened duration by _80%_.\n\n_+4:_ Increases grenade damage by _100%_ and Weakened duration by _100%_.
actors.hero.talent.shiroko_armor2_2.title=Flashbang
actors.hero.talent.shiroko_armor2_2.desc=_+1:_ Grenades have a _30%_ chance to Blind enemies.\n\n_+2:_ Grenades have a _60%_ chance to Blind enemies.\n\n_+3:_ Grenades have a _90%_ chance to Blind enemies.\n\n_+4:_ Grenades guarantee Blinding enemies, with a _20%_ chance to Stun them.
actors.hero.talent.shiroko_armor2_3.title=Fluid Motions
actors.hero.talent.shiroko_armor2_3.desc=_+1:_ Activating this ability reloads _1 round_, with a _25%_ chance not to consume a turn.\n\n_+2:_ Activating this ability reloads _2 rounds_, with a _50%_ chance not to consume a turn.\n\n_+3:_ Activating this ability reloads _3 rounds_, with a _75%_ chance not to consume a turn.\n\n_+4:_ Activating this ability reloads _4 rounds_, with a _100%_ chance not to consume a turn.\n\nRounds can exceed maximum capacity, but will not load further if already beyond max capacity.

actors.hero.talent.shiroko_armor3_1.title=Milestone
actors.hero.talent.shiroko_armor3_1.desc=_+1:_ Reactivating the ability while a trail is active instantly teleports you to the initial activation spot, using _30%_ less charge if standing on the trail.\n\n_+2:_ Reactivating the ability while a trail is active instantly teleports you to the initial activation spot, using _51%_ less charge if standing on the trail.\n\n_+3:_ Reactivating the ability while a trail is active instantly teleports you to the initial activation spot, using _66%_ less charge if standing on the trail.\n\n_+4:_ Reactivating the ability while a trail is active instantly teleports you to the initial activation spot, using _76%_ less charge if standing on the trail.
actors.hero.talent.shiroko_armor3_2.title=Trail Retention
actors.hero.talent.shiroko_armor3_2.desc=_+1:_ Increases trail duration by _25%_.\n\n_+2:_ Increases trail duration by _50%_.\n\n_+3:_ Increases trail duration by _75%_.\n\n_+4:_ Increases trail duration by _100%_.
actors.hero.talent.shiroko_armor3_3.title=Shortcut
actors.hero.talent.shiroko_armor3_3.desc=_+1:_ Activating this ability reveals the location of _Potions of Strength_.\n\n_+2:_ In addition to the +1 effect, reveals the location of _Scrolls of Upgrade_ upon activation.\n\n_+3:_ In addition to the +2 effect, reveals the location of _Potions of Experience_ upon activation.\n\n_+4:_ In addition to the +3 effect, reveals the location of _Scrolls of Transmutation_ upon activation.

actors.hero.abilities.shiroko.penetrationshot.name=Piercing Shot
actors.hero.abilities.shiroko.penetrationshot.short_desc=Shiroko fires a round that damages _all enemies along its trajectory_.\n
actors.hero.abilities.shiroko.penetrationshot.desc=Shiroko activates Piercing Shot to fire 1 round from her equipped firearm toward a designated location, dealing bullet hit damage to all hostiles along the path.\n\nRequires an equipped firearm loaded with at least 1 round to use Piercing Shot.
actors.hero.abilities.shiroko.penetrationshot.prompt=Select a target location
actors.hero.abilities.shiroko.penetrationshot.need_gun=You must equip a firearm to use this ability!
actors.hero.abilities.shiroko.penetrationshot.no_rounds=Out of ammo.
actors.hero.abilities.shiroko.weakeninggrenade.name=Weakening Grenade
actors.hero.abilities.shiroko.weakeninggrenade.short_desc=Shiroko lobs a _grenade_ at a chosen location to deal damage.\n
actors.hero.abilities.shiroko.weakeninggrenade.desc=While riding her bicycle, Shiroko lobs a guaranteed-hit grenade at a chosen location, dealing immediate damage across a small area and inflicting Weakened for 10 turns. The grenade can be thrown past enemies.
actors.hero.abilities.shiroko.weakeninggrenade.cannot_self=Probably best not to throw that at yourself.
actors.hero.abilities.shiroko.gpsroute.name=GPS Route Finder
actors.hero.abilities.shiroko.gpsroute.short_desc=Shiroko scans for the _fastest route to the next floor_, allowing her to sprint along it at high speed.\n
actors.hero.abilities.shiroko.gpsroute.desc=Shiroko uses the GPS Route Finder to locate and reveal the fastest path from her current location down to the next floor.\n\nThe trail persists for 8 turns. Standing on the path prevents its duration from ticking down while granting 3x movement speed.\n\nCannot be reactivated while an active trail exists.
actors.hero.abilities.shiroko.gpsroute.already_active=An active trail already exists.
actors.hero.abilities.shiroko.gpsroute.cannot_use=Cannot do that.
actors.hero.abilities.shiroko.gpsroute$routebuff.name=GPS Route Tracking
actors.hero.abilities.shiroko.gpsroute$routebuff.desc=Nn, this path in sight seems to be the fastest route to the next floor.\n\nFollowing this path lets you move much faster. The discovered trail will vanish if you transition to another floor or spend too much time off-path.\n\nYou can remain off the path for about _%s turns_.

###Noa Sentences
actors.hero.heroclass.noa=Noa
actors.hero.heroclass.noa_desc_short=I am Ushio Noa, Seminar's secretary. I look forward to working with you, Sensei. ...In more ways than one.\n\nDifficulty: _Normal_
actors.hero.heroclass.noa_desc=Noa starts with a _Conversion Kit_ that mounts onto firearms to boost performance. The kit can be transferred between firearms, carrying over its _+1 upgrade level_ along with it.\n\nNoa is proficient with HGs, requiring _1 less strength_ to handle them properly.\n\nBlessed with quick discernment, Noa can _search a wider area at once_.\n\nNoa also enters the dungeon with a _Tier-1 HG_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nNoa begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.noa_unlock=Noa is unlocked by default.

actors.hero.herosubclass.double_barrel=Akimbo
actors.hero.herosubclass.double_barrel_short_desc=Noa can equip an HG in her off-hand, _firing her secondary firearm immediately after a bullet hits_.\n
actors.hero.herosubclass.double_barrel_desc=Noa can equip an HG as a secondary weapon.\n\nLanding a bullet hit lets her fire her secondary weapon at that enemy without consuming a turn, dealing 67% damage.\n\nManually reloading the secondary weapon takes 1 extra turn.
actors.hero.herosubclass.conversation=Rational Dialogue
actors.hero.herosubclass.conversation_short_desc=Noa addresses a targeted enemy, _inflicting a random debuff or swaying them into an ally_.\n
actors.hero.herosubclass.conversation_desc=Noa addresses a target, weakening them by inflicting one debuff among Blindness, Drowsy, Dazed, Charmed, Amok, or Vertigo. Debuff duration lengthens as Noa levels up; using this on an already weakened enemy enchants them into an ally.

actors.hero.hero.noa_health_critical_1=This might be getting... a little dangerous...
actors.hero.hero.noa_health_critical_2=I have reached my limit...
actors.hero.hero.noa_health_critical_3=Perhaps we could rest for a moment...?

actors.hero.hero.noa_health_warn_1=I am beginning to feel the strain.
actors.hero.hero.noa_health_warn_2=Running low on stamina. Should I record this as well...?
actors.hero.hero.noa_health_warn_3=In this condition, keeping records might become rather difficult.

actors.hero.hero.noa_die=Perhaps I was a bit too overconfident...

actors.hero.hero.noa_enemy_defeated_1=Shall we call that wrapped up?
actors.hero.hero.noa_enemy_defeated_2=I wonder what variables await us up ahead?
actors.hero.hero.noa_enemy_defeated_3=I see... so that was their weak point.
actors.hero.hero.noa_enemy_defeated_4=One needs some exercise every now and then!
actors.hero.hero.noa_enemy_defeated_5=Neutralizing swiftly.

actors.hero.hero.noa_levelup_1=Acquiring something new is delightful at any time.
actors.hero.hero.noa_levelup_2=Fuhu, this might actually be rather fun.
actors.hero.hero.noa_levelup_3=I cannot say for certain, but... perhaps I have grown a little compared to before, fuhu.
actors.hero.hero.noa_levelup_4=Though I may look unchanged on the surface, I have grown quite a bit stronger, you know?
actors.hero.hero.noa_levelup_5=Fuhu, growing stronger is truly enjoyable as always.
actors.hero.hero.noa_levelup_rare=This feeling isn't half bad either. Better make a note of this...

actors.hero.hero.noa_trap_discover=I have documented the layouts and mechanisms of all traps on this floor.
actors.hero.hero.noa_secondwep_no_ammo=Out of ammunition!
actors.hero.hero.noa_no_charge=Nothing appropriate comes to mind to say right now.
actors.hero.hero.noa_cannot_see=I am hardly eccentric enough to converse with empty air.
actors.hero.hero.noa_no_target=Chattering away all by myself accomplishes nothing.
actors.hero.hero.noa_unavailable_target=That won't work on that one.
actors.hero.hero.noa_unreachable_target=My voice won't reach whoever is over there.
actors.hero.hero.noa_debuff_drowsy_1=Allow me to share an excerpt from an intriguing paper Hibiki-san gave me—(esoteric ballistic physics monologue) ...Oh my? Feeling sleepy already...?
actors.hero.hero.noa_debuff_drowsy_2=Hare-san sent over fascinating notes on drone dynamics—(incomprehensible aeronautics discourse) ...Is it bedtime already? Fuhu.
actors.hero.hero.noa_debuff_drowsy_3=This is from a discussion I had with Himari-san regarding cyber warfare—(dense hacking technical jargon) ...Oh dear, I had so much more to share. What a pity...
actors.hero.hero.noa_debuff_charm_1=Shh, come over this way... ♡
actors.hero.hero.noa_debuff_charm_2=Come closer and I'll tell you an entertaining story... ♡
actors.hero.hero.noa_debuff_charm_3=(Smiles gently and winks)
actors.hero.hero.noa_debuff_vertigo_1=Did you know? In fact... (deeply shocking revelation)
actors.hero.hero.noa_debuff_vertigo_2=Well, you see... (earth-shattering gossip)
actors.hero.hero.noa_debuff_vertigo_3=I caught wind of a rumor that (unbelievable revelation)... could it be true?
actors.hero.hero.noa_debuff_blindness_1=Shall we take a look into the future? Close your eyes. What do you see?
actors.hero.hero.noa_debuff_blindness_2=I recently learned a bit about hypnosis. Care to close your eyes? ...Fuhu.
actors.hero.hero.noa_debuff_blindness_3=(Pulls out a compact mirror and angles it back and forth)
actors.hero.hero.noa_debuff_amok_1=I heard somewhere that Mutsuki-san has a "mesugaki" persona.
actors.hero.hero.noa_debuff_amok_2=(Clairvoyance future story spoilers)
actors.hero.hero.noa_debuff_amok_3=(Unforgivable movie spoilers)
actors.hero.hero.noa_debuff_daze_1=Allow me to explain the wonders of Aris. (Proceeds to recite 154 reasons why Aris is adorable)
actors.hero.hero.noa_debuff_daze_2=Here is a poem I hold very dear. (Begins reciting a lengthy poem)
actors.hero.hero.noa_debuff_daze_3=I came across a truly moving stanza recently... (Begins reciting verse)
actors.hero.hero.noa_cannot_self=Fuhu, I certainly shouldn't fire this at myself.
actors.hero.hero.noa_supernova_1=Initiating charge!
actors.hero.hero.noa_supernova_2=Imbuing this light with my will...
actors.hero.hero.noa_supernova_3=Light, grant me power!
actors.hero.hero.noa_supernova_shoot_1=...Firing! Balance Breaker!
actors.hero.hero.noa_supernova_shoot_2=Here it goes! Balance Breaker!
actors.hero.hero.noa_supernova_shoot_3=...Is this how it's done, Aris?

actors.hero.talent.noa_t1_1.title=Offensive Assist Module
actors.hero.talent.noa_t1_1.desc=_+1:_ Increases melee damage of firearms equipped with the Conversion Kit by _1-2_.\n\n_+2:_ Increases melee damage of firearms equipped with the Conversion Kit by _2_.
actors.hero.talent.noa_t1_2.title=Handgun Specialist
actors.hero.talent.noa_t1_2.desc=_+1:_ Instantly identifies HGs _upon equipping_.\n\n_+2:_ Instantly identifies HGs _upon acquiring_.
actors.hero.talent.noa_t1_3.title=Zeroing In
actors.hero.talent.noa_t1_3.desc=_+1:_ Missing a bullet increases the accuracy of your next round by _+3_.\n\n_+2:_ Missing a bullet increases the accuracy of your next round by _+5_.\n\nAccuracy bonus stacks and is consumed upon landing a hit.
actors.hero.talent.noa_t1_4.title=Thorough Preparation
actors.hero.talent.noa_t1_4.desc=_+1:_ Grants _2_ shielding when your magazine reaches 0 rounds.\n\n_+2:_ Grants _3_ shielding when your magazine reaches 0 rounds.

actors.hero.talent.noa_t2_1.title=Rest Is Part of Work
actors.hero.talent.noa_t2_1.desc=_+1:_ Eating takes only 1 turn, restoring 1 HP each turn for _5 turns_ afterward.\n\n_+2:_ Eating takes only 1 turn, restoring 1 HP each turn for _8 turns_ afterward.
actors.hero.talent.noa_t2_2.title=Copy Paper
actors.hero.talent.noa_t2_2.desc=_+1:_ Reading a scroll has a _20%_ chance to grant a Blank Scroll.\n\n_+2:_ Reading a scroll has a _30%_ chance to grant a Blank Scroll.\n\nActivation chance doubles when reading Scrolls of Upgrade, Scrolls of Transmutation, or using alchemy items crafted from them.\n\nFor crafted alchemy items that yield more outputs than scrolls consumed (e.g. spells), chance scales based on the quantity produced.
actors.hero.talent.noa_t2_3.title=Proficient Search
actors.hero.talent.noa_t2_3.desc=_+1:_ Increases search area to a _7x7 circular_ radius.\n\n_+2:_ Increases search area to a _7x7 square_ area.
actors.hero.talent.noa_t2_4.title=Reloading Step
actors.hero.talent.noa_t2_4.desc=_+1:_ Reloading from an empty magazine allows you to move _1 turn_ worth of distance without consuming a turn.\n\n_+2:_ Reloading from an empty magazine allows you to move _2 turns_ worth of distance without consuming a turn.
actors.hero.talent.noa_t2_5.title=Structural Insight
actors.hero.talent.noa_t2_5.desc=_+1:_ Entering a floor has a _30%_ chance to detect traps and reveal their locations.\n\n_+2:_ Entering a floor has a _50%_ chance to detect traps and reveal their locations.

actors.hero.talent.noa_t3_1.title=Flawless Precision
actors.hero.talent.noa_t3_1.desc=_+1:_ Landing a bullet hit increases next round accuracy by _3x_.\n\n_+2:_ Landing a bullet hit increases next round accuracy by _5x_.\n\n_+3:_ Landing a bullet hit guarantees the next round _always hits_.
actors.hero.talent.noa_t3_2.title=Extended Magazine
actors.hero.talent.noa_t3_2.desc=_+1:_ Increases firearm maximum ammo capacity by _+1 round_.\n\n_+2:_ Increases firearm maximum ammo capacity by _+2 rounds_.\n\n_+3:_ Increases firearm maximum ammo capacity by _+3 rounds_.

actors.hero.talent.noa_ex1_1.title=Dual Reload
actors.hero.talent.noa_ex1_1.desc=_+1:_ Reloading your primary weapon loads _1 round_ into your secondary weapon.\n\n_+2:_ Reloading your primary weapon loads _2 rounds_ into your secondary weapon.\n\n_+3:_ Reloading your primary weapon loads _3 rounds_ into your secondary weapon.\n\nCannot exceed maximum ammo capacity.
actors.hero.talent.noa_ex1_2.title=Dual Upgrade
actors.hero.talent.noa_ex1_2.desc=_+1:_ If the more upgraded equipped firearm is _2 tiers_ higher than the other, the lesser-upgraded firearm matches its upgrade level.\n\n_+2:_ If the more upgraded equipped firearm is _1 tier_ higher than the other, the lesser-upgraded firearm matches its upgrade level.\n\n_+3:_ If the more upgraded equipped firearm is _equal to or higher in tier_ than the other, the lesser-upgraded firearm matches its upgrade level.
actors.hero.talent.noa_ex1_3.title=Rapid Response
actors.hero.talent.noa_ex1_3.desc=_+1:_ Landing a melee hit _activates this ability_.\n\n_+2:_ In addition to the +1 effect, bullets fired via this ability _always hit adjacent enemies_.\n\n_+3:_ In addition to the +2 effect, defeating an adjacent enemy reloads all equipped firearms. Does not trigger on-reload effects.

actors.hero.talent.noa_ex2_1.title=Inspiration
actors.hero.talent.noa_ex2_1.desc=_+1:_ Reading a scroll or casting a spell restores _2_ charge. Amount restored varies by item used.\n\n_+2:_ In addition to the +1 effect, using a runestone restores _1_ charge.\n\n_+3:_ In addition to the +2 effect, charge restoration increases by _+50%_.
actors.hero.talent.noa_ex2_2.title=Rapid Speech
actors.hero.talent.noa_ex2_2.desc=_+1:_ This ability has a _33%_ chance not to consume a turn.\n\n_+2:_ This ability has a _67%_ chance not to consume a turn.\n\n_+3:_ This ability has a _100%_ chance not to consume a turn.
actors.hero.talent.noa_ex2_3.title=Persuasion
actors.hero.talent.noa_ex2_3.desc=_+1:_ Enemies charmed by Noa recover _33%_ of their missing health.\n\n_+2:_ Enemies charmed by Noa recover _67%_ of their missing health.\n\n_+3:_ Enemies charmed by Noa recover _100%_ of their missing health.

actors.hero.talent.noa_armor1_1.title=Trap Disarmament
actors.hero.talent.noa_armor1_1.desc=_+1:_ Disarming a trap also disarms up to _2_ traps in a surrounding 3x3 area.\n\n_+2:_ Disarming a trap also disarms up to _4_ traps in a surrounding 3x3 area.\n\n_+3:_ Disarming a trap also disarms up to _6_ traps in a surrounding 3x3 area.\n\n_+4:_ Disarming a trap also disarms up to _8_ traps in a surrounding 3x3 area.
actors.hero.talent.noa_armor1_2.title=Added Explosives
actors.hero.talent.noa_armor1_2.desc=_+1:_ Triggers an explosion dealing _4-12_ damage at the tile where a stored trap is placed.\n\n_+2:_ Triggers an explosion dealing _6-24_ damage at the tile where a stored trap is placed.\n\n_+3:_ Triggers an explosion dealing _8-36_ damage at the tile where a stored trap is placed.\n\n_+4:_ Triggers an explosion dealing _10-48_ damage at the tile where a stored trap is placed.
actors.hero.talent.noa_armor1_3.title=Versatility
actors.hero.talent.noa_armor1_3.desc=_+1:_ Using a trap has a _10%_ chance to let you reuse that trap again.\n\n_+2:_ Using a trap has a _20%_ chance to let you reuse that trap again.\n\n_+3:_ Using a trap has a _30%_ chance to let you reuse that trap again.\n\n_+4:_ Using a trap has a _40%_ chance to reuse that trap again.

actors.hero.talent.noa_armor2_1.title=Hologram Duplication
actors.hero.talent.noa_armor2_1.desc=_+1:_ This ability has a _25%_ chance to summon 2 holograms.\n\n_+2:_ This ability has a _50%_ chance to summon 2 holograms.\n\n_+3:_ This ability has a _75%_ chance to summon 2 holograms.\n\n_+4:_ This ability has a _100%_ chance to summon 2 holograms.
actors.hero.talent.noa_armor2_2.title=Materialization
actors.hero.talent.noa_armor2_2.desc=_+1:_ Holograms gain _15_ shielding and _1-4_ defense.\n\n_+2:_ Holograms gain _30_ shielding and _2-8_ defense.\n\n_+3:_ Holograms gain _45_ shielding and _3-12_ defense.\n\n_+4:_ Holograms gain _60_ shielding and _4-16_ defense.
actors.hero.talent.noa_armor2_3.title=Blurred Silhouette
actors.hero.talent.noa_armor2_3.desc=_+1:_ Holograms are guaranteed to dodge their first _2_ incoming attacks.\n\n_+2:_ Holograms are guaranteed to dodge their first _4_ incoming attacks.\n\n_+3:_ Holograms are guaranteed to dodge their first _6_ incoming attacks.\n\n_+4:_ Holograms are guaranteed to dodge their first _8_ incoming attacks.

actors.hero.talent.noa_armor3_1.title=Light...? Grant Me Power!
actors.hero.talent.noa_armor3_1.desc=_+1:_ Activating this ability grants Radiance for _50 turns_.\n\n_+2:_ Activating this ability grants Radiance for _100 turns_.\n\n_+3:_ Activating this ability grants Radiance for _150 turns_.\n\n_+4:_ Activating this ability grants Radiance for _200 turns_.
actors.hero.talent.noa_armor3_2.title=Increased Output
actors.hero.talent.noa_armor3_2.desc=_+1:_ Increases ability damage by _25%_.\n\n_+2:_ Increases ability damage by _50%_.\n\n_+3:_ Increases ability damage by _75%_.\n\n_+4:_ Increases ability damage by _100%_.
actors.hero.talent.noa_armor3_3.title=Energy Recycling
actors.hero.talent.noa_armor3_3.desc=_+1:_ Using this ability consumes _10%_ less charge for 5 turns after activation.\n\n_+2:_ Using this ability consumes _19%_ less charge for 5 turns after activation.\n\n_+3:_ Using this ability consumes _27%_ less charge for 5 turns after activation.\n\n_+4:_ Using this ability consumes _34%_ less charge for 5 turns after activation.

actors.hero.abilities.noa.trapduplicate.name=Mechanism Replication
actors.hero.abilities.noa.trapduplicate.short_desc=Noa can _disarm a trap_ and redeploy it at a chosen location.\n
actors.hero.abilities.noa.trapduplicate.desc=Noa can disarm a revealed trap within line of sight and deploy it at a chosen location. Selecting your own tile removes the stored trap. Turns and charge are consumed only when disarming the trap.
actors.hero.abilities.noa.trapduplicate.out_of_view=Cannot target a location outside line of sight.
actors.hero.abilities.noa.trapduplicate.no_trap=No trap here.
actors.hero.abilities.noa.trapduplicate.trap_preserved=Trap preserved!
actors.hero.abilities.noa.trapduplicate.trap_removed=Removed the trap.
actors.hero.abilities.noa.hologram.name=Summon Hologram
actors.hero.abilities.noa.hologram.short_desc=Noa summons a _hologram_ that projects and fires a duplicate of her equipped firearm.\n
actors.hero.abilities.noa.hologram.desc=Noa summons a hologram that deals damage equal to her currently equipped firearm. The hologram can make ranged attacks.
actors.hero.abilities.noa.hologram.no_space=No room to summon a hologram.
actors.hero.abilities.noa.hologram$hologramimage.name=Hologram Projection
actors.hero.abilities.noa.hologram$hologramimage.desc=This hologram projects an identical image of yourself. Until it dissipates, it makes attacks dealing damage equal to your equipped firearm, though it is quite fragile.\n\nHologram attack damage equals your equipped firearm's bullet damage multiplied by its rounds fired per shot.
actors.hero.abilities.noa.supernovabeam.name=Aris, May I Borrow This for a Moment?
actors.hero.abilities.noa.supernovabeam.short_desc=Noa borrows and fires Aris's _Sword of Light: Supernova_.\n
actors.hero.abilities.noa.supernovabeam.desc=Noa briefly borrows Aris's Sword of Light: Supernova to unleash a blast. The beam pierces in a straight line up to 12 tiles, dealing _20-100_ damage to all hostiles along the path.

###Miyu Sentences
actors.hero.heroclass.miyu=Miyu
actors.hero.heroclass.miyu_desc_short=I'm Kasumizawa Miyu of the RABBIT Platoon, SRT Special Academy... Um... could I... go home now...? Probably not, right...?\n\nDifficulty: _Hard_
actors.hero.heroclass.miyu_desc=Miyu begins with a _Distraction Device_ that confounds hostiles pursuing her.\n\nMiyu is proficient with SRs, requiring _1 less strength_ to handle them properly.\n\nMiyu is easily overlooked by enemies, an effect that grows stronger as she levels up. She also does not trample tall grass.\n\nMiyu also enters the dungeon with a _Tier-1 SR_, _3 Throwing Knives_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nMiyu begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.miyu_unlock=Miyu is unlocked by default.

actors.hero.herosubclass.telescope=Binocular Recon
actors.hero.herosubclass.telescope_short_desc=Miyu scouts a small area around a chosen tile, _firing her gun there while ignoring obstacles_.\n
actors.hero.herosubclass.telescope_desc=Miyu uses this ability to reveal a 3x3-tile area around a chosen location for 10 turns. Firing toward that location executes a snipe. Sniping fires a round from her equipped firearm that ignores obstacles and is guaranteed to reach the designated point.
actors.hero.herosubclass.camouflage=Foliage Camouflage
actors.hero.herosubclass.camouflage_short_desc=Miyu _can see past tall grass_, _blocks enemy vision_ with her trash bin, and _becomes vastly harder for enemies to detect_.\n
actors.hero.herosubclass.camouflage_desc=Miyu gains the ability to see through tall grass. Using her trash bin places furrowed grass that blocks enemy vision on adjacent empty tiles. In addition to her base stealth value of 2, she gains extra stealth equal to Level / 3.

actors.hero.hero.miyu_health_critical_1=Ugh... things are getting really dangerous.
actors.hero.hero.miyu_health_critical_2=A sniper should be fine with just this much... shouldn't she...?
actors.hero.hero.miyu_health_critical_3=I might be reaching my limit soon...

actors.hero.hero.miyu_health_warn_1=Ouch... Ah, I'm okay with this much...
actors.hero.hero.miyu_health_warn_2=I took a bit of a hit...
actors.hero.hero.miyu_health_warn_3=I'd really love to hide and rest for a bit...

actors.hero.hero.miyu_die=No... I'm so sorry...

actors.hero.hero.miyu_enemy_defeated_1=Relocating now.
actors.hero.hero.miyu_enemy_defeated_2=Adjusting position.
actors.hero.hero.miyu_enemy_defeated_3=It feels like enemies walk right past me even when looking at me... Just my imagination, right?
actors.hero.hero.miyu_enemy_defeated_4=Target neutralization confirmed.
actors.hero.hero.miyu_enemy_defeated_5=Kill confirmed. All clear.

actors.hero.hero.miyu_levelup_1=My tactical understanding has deepened.
actors.hero.hero.miyu_levelup_2=I'll do my best... so I don't bring shame to the name of SRT.
actors.hero.hero.miyu_levelup_3=I'll work hard to improve... so I won't hold everyone back.
actors.hero.hero.miyu_levelup_4=Am I... doing well, I wonder...?
actors.hero.hero.miyu_levelup_5=I feel stronger...
actors.hero.hero.miyu_levelup_rare=I really wish I had a nice, warm cup of cocoa...

actors.hero.hero.miyu_bin_use_1=Executing diversionary operation...
actors.hero.hero.miyu_bin_use_2=Disrupting enemy pursuit...
actors.hero.hero.miyu_bin_use_3=A-Are they... gone...?
actors.hero.hero.miyu_bin_cooldown=...I can't use it just yet...
actors.hero.hero.miyu_cannot_see_wall=Doesn't seem like I can target over there...
actors.hero.hero.miyu_need_gun=You must have an equipped firearm.
actors.hero.hero.miyu_already_got=I'm already using one.
actors.hero.hero.miyu_switching_new=RABBIT 4, equipping Anti-Tank SR.
actors.hero.hero.miyu_switching_original=RABBIT 4, rifle deployment finished. Unequipping now...

actors.hero.talent.miyu_t1_1.title=Field Rations
actors.hero.talent.miyu_t1_1.desc=_+1:_ Allows you to find up to _4 pieces_ of hardtack stored inside chests across the next few explored floors.\n\n_+2:_ Allows you to find up to _6 pieces_ of hardtack stored inside chests across the next few explored floors.
actors.hero.talent.miyu_t1_2.title=Sniper Rifle Specialist
actors.hero.talent.miyu_t1_2.desc=_+1:_ Instantly identifies SRs _upon equipping_.\n\n_+2:_ Instantly identifies SRs _upon acquiring_.
actors.hero.talent.miyu_t1_3.title=Sneak Shot
actors.hero.talent.miyu_t1_3.desc=_+1:_ The first sneak attack bullet deals _2 bonus damage_.\n\n_+2:_ The first sneak attack bullet deals _3 bonus damage_.
actors.hero.talent.miyu_t1_4.title=Nature's Friend
actors.hero.talent.miyu_t1_4.desc=_+1:_ Stepping on tall grass grants _2_ shielding.\n\n_+2:_ Stepping on tall grass grants _3_ shielding.

actors.hero.talent.miyu_t2_1.title=Solitary Meal
actors.hero.talent.miyu_t2_1.desc=_+1:_ Eating takes only 1 turn and grants Invisibility for _5 turns_.\n\n_+2:_ Eating takes only 1 turn and grants Invisibility for _8 turns_.\n\nHardtack can now be eaten instantly.
actors.hero.talent.miyu_t2_2.title=Watering the Plants
actors.hero.talent.miyu_t2_2.desc=_+1:_ Drinking or throwing a potion, brew, or elixir sprouts up to _4 tiles_ of grass around the area and Roots nearby enemies for _1 turn_.\n\n_+2:_ Drinking or throwing a potion, brew, or elixir sprouts up to _6 tiles_ of grass around the area and Roots nearby enemies for _2 turns_.\n\nGrass count and Root duration double when using Potions of Strength, Potions of Experience, or alchemy items crafted from them.\n\nFor crafted alchemy items that yield more outputs than potions consumed (e.g. aquatic brews), trigger chance scales with the quantity produced.
actors.hero.talent.miyu_t2_3.title=Concealment Technique
actors.hero.talent.miyu_t2_3.desc=_+1:_ Stepping on tall grass grants Invisibility for _2 turns_.\n\n_+2:_ Stepping on tall grass grants Invisibility for _3 turns_.
actors.hero.talent.miyu_t2_4.title=Shoot and Scoot
actors.hero.talent.miyu_t2_4.desc=_+1:_ Defeating an enemy with a bullet allows you to move _3 turns_ worth of distance instantly.\n\n_+2:_ Defeating an enemy with a bullet allows you to move _5 turns_ worth of distance instantly.
actors.hero.talent.miyu_t2_5.title=Suppressor
actors.hero.talent.miyu_t2_5.desc=_+1:_ Firing a gun has a _50%_ chance not to generate gunfire noise that alerts enemies.\n\n_+2:_ Firing a gun has a _100%_ chance not to generate gunfire noise that alerts enemies.

actors.hero.talent.miyu_t3_1.title=Lethal Round
actors.hero.talent.miyu_t3_1.desc=_+1:_ The minimum damage of sneak attack bullets increases by _25%_ of the spread between minimum and maximum damage.\n\n_+2:_ The minimum damage of sneak attack bullets increases by _33%_ of the spread between minimum and maximum damage.\n\n_+3:_ The minimum damage of sneak attack bullets increases by _50%_ of the spread between minimum and maximum damage.
actors.hero.talent.miyu_t3_2.title=Comfortable in Solitude
actors.hero.talent.miyu_t3_2.desc=_+1:_ As long as enemies have not noticed Miyu, the upgrade level of her equipped firearm increases by _+1_.\n\n_+2:_ As long as enemies have not noticed Miyu, the upgrade level of her equipped firearm increases by _+2_.\n\n_+3:_ As long as enemies have not noticed Miyu, the upgrade level of her equipped firearm increases by _+3_.

actors.hero.talent.miyu_ex1_1.title=Bullet Time
actors.hero.talent.miyu_ex1_1.desc=_+1:_ Activating this ability inflicts Slow for 3 turns on enemies within the zone who are at least _9 tiles_ away from Miyu.\n\n_+2:_ Activating this ability inflicts Slow for 3 turns on enemies within the zone who are at least _6 tiles_ away from Miyu.\n\n_+3:_ Activating this ability inflicts Slow for 3 turns on enemies within the zone who are at least _3 tiles_ away from Miyu.
actors.hero.talent.miyu_ex1_2.title=Optical Scope
actors.hero.talent.miyu_ex1_2.desc=_+1:_ Increases Miyu's base vision by _25%_.\n\n_+2:_ Increases Miyu's base vision by _50%_.\n\n_+3:_ Increases Miyu's base vision by _75%_.
actors.hero.talent.miyu_ex1_3.title=Prepared Marksman
actors.hero.talent.miyu_ex1_3.desc=_+1:_ Activating this ability chambers _1 round_ into your equipped firearm.\n\n_+2:_ Activating this ability chambers _2 rounds_ into your equipped firearm.\n\n_+3:_ Activating this ability chambers _3 rounds_ into your equipped firearm.\n\nCan exceed maximum ammo capacity.

actors.hero.talent.miyu_ex2_1.title=Gotta Hide Fast...!
actors.hero.talent.miyu_ex2_1.desc=_+1:_ Defeating an enemy has a _33%_ chance to make the Distraction Device ready to use immediately.\n\n_+2:_ Defeating an enemy has a _67%_ chance to make the Distraction Device ready to use immediately.\n\n_+3:_ Defeating an enemy has a _100%_ chance to make the Distraction Device ready to use immediately.
actors.hero.talent.miyu_ex2_2.title=Flawless Camouflage
actors.hero.talent.miyu_ex2_2.desc=_+1:_ This ability converts water tiles into _grass tiles_.\n\n_+2:_ This ability converts water tiles into _furrowed grass tiles_.\n\n_+3:_ This ability converts water tiles into _tall grass tiles_.
actors.hero.talent.miyu_ex2_3.title=Stealth Drills
actors.hero.talent.miyu_ex2_3.desc=_+1:_ Stepping on tall grass guarantees _dodging the next incoming attack_ within 3 turns.\n\n_+2:_ In addition to the +1 effect, _reduces reload time by 2 turns_ in furrowed grass, down to a minimum of 1 turn.\n\n_+3:_ In addition to the +2 effect, _doubles movement speed_ in furrowed grass.

actors.hero.talent.miyu_armor1_1.title=Sensory Disruption
actors.hero.talent.miyu_armor1_1.desc=_+1:_ Flashbangs have a _25%_ chance to inflict Vertigo and Dazed for 10 turns.\n\n_+2:_ Flashbangs have a _50%_ chance to inflict Vertigo and Dazed for 10 turns.\n\n_+3:_ Flashbangs have a _75%_ chance to inflict Vertigo and Dazed for 10 turns.\n\n_+4:_ Flashbangs have a _100%_ chance to inflict Vertigo and Dazed for 10 turns.
actors.hero.talent.miyu_armor1_2.title=Enhanced Shock
actors.hero.talent.miyu_armor1_2.desc=_+1:_ Flashbangs have a _25%_ chance to Stun all targets in a 3x3 area for 5 turns.\n\n_+2:_ Flashbangs have a _50%_ chance to Stun all targets in a 3x3 area for 5 turns.\n\n_+3:_ Flashbangs have a _75%_ chance to Stun all targets in a 3x3 area for 5 turns.\n\n_+4:_ Flashbangs have a _100%_ chance to Stun all targets in a 3x3 area for 5 turns.
actors.hero.talent.miyu_armor1_3.title=Securing Safety
actors.hero.talent.miyu_armor1_3.desc=_+1:_ Grants _3_ shielding per target affected by the flashbang.\n\n_+2:_ Grants _6_ shielding per target affected by the flashbang.\n\n_+3:_ Grants _9_ shielding per target affected by the flashbang.\n\n_+4:_ Grants _12_ shielding per target affected by the flashbang.\n\nCaps at 10 targets.

actors.hero.talent.miyu_armor2_1.title=Leg Shot
actors.hero.talent.miyu_armor2_1.desc=_+1:_ Bullets Root enemies for _2 turns_ and inflict Crippled for _4 turns_.\n\n_+2:_ Bullets Root enemies for _4 turns_ and inflict Crippled for _8 turns_.\n\n_+3:_ Bullets Root enemies for _6 turns_ and inflict Crippled for _12 turns_.\n\n_+4:_ Bullets Root enemies for _8 turns_ and inflict Crippled for _16 turns_.
actors.hero.talent.miyu_armor2_2.title=Incapacitation
actors.hero.talent.miyu_armor2_2.desc=_+1:_ Bullets inflict Weakened and Vulnerable on enemies for _2 turns_.\n\n_+2:_ Bullets inflict Weakened and Vulnerable on enemies for _3 turns_.\n\n_+3:_ Bullets inflict Weakened and Vulnerable on enemies for _5 turns_.\n\n_+4:_ Bullets inflict Weakened and Vulnerable on enemies for _6 turns_.
actors.hero.talent.miyu_armor2_3.title=Stopping Power
actors.hero.talent.miyu_armor2_3.desc=_+1:_ Increases bleeding applied by this ability by _10%_.\n\n_+2:_ Increases bleeding applied by this ability by _20%_.\n\n_+3:_ Increases bleeding applied by this ability by _30%_.\n\n_+4:_ Increases bleeding applied by this ability by _40%_.

actors.hero.talent.miyu_armor3_1.title=Kinetic Transfer
actors.hero.talent.miyu_armor3_1.desc=_+1:_ Increases knockback distance of enemies struck by bullets by _50%_.\n\n_+2:_ Increases knockback distance of enemies struck by bullets by _100%_.\n\n_+3:_ Increases knockback distance of enemies struck by bullets by _150%_.\n\n_+4:_ Increases knockback distance of enemies struck by bullets by _200%_.
actors.hero.talent.miyu_armor3_2.title=Gear Destruction
actors.hero.talent.miyu_armor3_2.desc=_+1:_ Bullets inflict Vulnerable on targets for _5 turns_.\n\n_+2:_ Bullets inflict Vulnerable on targets for _10 turns_.\n\n_+3:_ Bullets inflict Vulnerable on targets for _15 turns_.\n\n_+4:_ Bullets inflict Vulnerable on targets for _20 turns_.
actors.hero.talent.miyu_armor3_3.title=Abundant Supply
actors.hero.talent.miyu_armor3_3.desc=_+1:_ Anti-Tank SR chambers _+1 round with a 50% chance_, and your previously equipped firearm is _reloaded with a 50% chance_.\n\n_+2:_ Anti-Tank SR chambers _+1 round_, and your previously equipped firearm is _reloaded_.\n\n_+3:_ Anti-Tank SR chambers _+1 round (and +2 rounds with a 50% chance)_, and your previously equipped firearm is _reloaded plus chambers 1 extra round_.\n\n_+4:_ Anti-Tank SR chambers _+2 rounds_, and your previously equipped firearm is _reloaded plus chambers 2 extra rounds_.

actors.hero.abilities.miyu.flashbang.name=Flashbang Out!
actors.hero.abilities.miyu.flashbang.short_desc=Miyu throws a flashbang that _Blinds all targets_ around the blast area.\n
actors.hero.abilities.miyu.flashbang.desc=Miyu throws a flashbang, Blinding all targets within a 2-tile radius around the explosion point for 10 turns. Allies and Miyu herself can also be caught in the blast.
actors.hero.abilities.miyu.hpbullet.name=Load Stopping-Power Round
actors.hero.abilities.miyu.hpbullet.short_desc=Miyu chambers a stopping-power round, causing her next shot to deal _bleeding damage_ instead of normal damage.\n
actors.hero.abilities.miyu.hpbullet.desc=Miyu chambers a stopping-power round into her equipped firearm. Her next shot is guaranteed to hit, inflicting an equivalent amount of bleeding instead of regular damage. Bleed-immune enemies take no bleeding, nor do talents trigger.\n\nBosses and powerful foes will resist the bleeding effect.
actors.hero.abilities.miyu.hpbullet$hpbulletbuff.name=Stopping-Power Round
actors.hero.abilities.miyu.hpbullet$hpbulletbuff.desc=Your next shot fires a stopping-power round, inflicting an equivalent amount of bleeding damage instead of direct damage.\n\n_Deals only regular damage to bleed-immune enemies, and bosses or powerful foes will resist this effect._
actors.hero.abilities.miyu.antimaterialrifle.name=Anti-Materiel Rifle
actors.hero.abilities.miyu.antimaterialrifle.short_desc=Miyu deploys an Anti-Tank SR to _pierce walls and blow enemies away_.\n
actors.hero.abilities.miyu.antimaterialrifle.desc=Miyu equips an Anti-Tank SR while retaining her current firearm's upgrade level and enchantments.\n\nThe Anti-Tank SR pierces through 1-tile-thick walls and destroys them. If it doesn't penetrate a wall, it knocks hit enemies back by 4 tiles.\n\nThe Anti-Tank SR functions as a Tier-6 SR with a base strength requirement of 18. Depleting its ammo, reloading, or unequipping it switches back to your original firearm. The Anti-Tank SR cannot be thrown.


###Yuzu Sentences
actors.hero.heroclass.yuzu=Yuzu
actors.hero.heroclass.yuzu_desc_short=I'm Yuzu, president of the Game Development Department... Are you... really sure you want to bring me along?\n\nDifficulty: _Normal_
actors.hero.heroclass.yuzu_desc=Yuzu has a chance to deal _critical strike damage_ and starts with _Yuzu's Laptop_, which can spend credits to purchase extra game content.\n\nYuzu is proficient with GLs, requiring _1 less strength_ to handle them properly.\n\nYuzu marks 1 out of every 8 enemies as a quest target; defeating them yields _bonus experience and credits_. Yuzu also takes _75%_ reduced damage from firearm explosions.\n\nYuzu also enters the dungeon with a _Tier-1 GL_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nYuzu begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.yuzu_unlock=Defeat 1 enemy to unlock Yuzu.

actors.hero.herosubclass.avant_garde_kun=Board Avant-Garde-kun!
actors.hero.herosubclass.avant_garde_kun_short_desc=Yuzu can _board and pilot Avant-Garde-kun_.\n
actors.hero.herosubclass.avant_garde_kun_desc=Yuzu can deploy and pilot the robot, Avant-Garde-kun, firing up to 3 firearms from her inventory in a single turn. Melee attacks in the mech knock enemies back and reload equipped firearms. The mech absorbs damage on Yuzu's behalf, incurring a 200-turn cooldown if destroyed.
actors.hero.herosubclass.game_start=Game Start!
actors.hero.herosubclass.game_start_short_desc=Yuzu can _purchase and operate various game consoles_.\n
actors.hero.herosubclass.game_start_desc=Yuzu gains access to purchase Continue Consoles and can unlock new consoles through talents. Landing a critical strike spawns a small amount of extra credits at the enemy's location.\n\nFighter Console: Powerful melee strikes, limited mobility\n\nFantasy Console: Spell attacks that inflict debuffs on enemies, immobile\n\nSandbox Console: Alters terrain, immobile\n\n_Long-press action buttons to view detailed descriptions._

actors.hero.hero.yuzu_health_critical_1=It's fine... I can do this...!
actors.hero.hero.yuzu_health_critical_2=That hurts...!
actors.hero.hero.yuzu_health_critical_3=I'm... feeling a bit worn out...

actors.hero.hero.yuzu_health_warn_1=I-I'm okay...
actors.hero.hero.yuzu_health_warn_2=Th-This much is nothing...
actors.hero.hero.yuzu_health_warn_3=That stings a little...

actors.hero.hero.yuzu_die=Ah... No way...!

actors.hero.hero.yuzu_enemy_defeated_1=Next challenger, prepare yourself!
actors.hero.hero.yuzu_enemy_defeated_2=I'm glad I could be of help...
actors.hero.hero.yuzu_enemy_defeated_3=T-Target neutralized...!
actors.hero.hero.yuzu_enemy_defeated_4=This is... the agony of creation!
actors.hero.hero.yuzu_enemy_defeated_5=We managed somehow... I-I'll keep going!

actors.hero.hero.yuzu_levelup_1=I-I'm not strong at all, but... I'll give it everything! Because I care so much about everyone!
actors.hero.hero.yuzu_levelup_2=I want to become a more confident version of myself.
actors.hero.hero.yuzu_levelup_3=Power is... welling up inside me. Could this be... courage?
actors.hero.hero.yuzu_levelup_4=I may still fall short, but I will do my best.
actors.hero.hero.yuzu_levelup_5=Power is overflowing within me...!
actors.hero.hero.yuzu_levelup_rare=Did Aris level up in a place like this too... I wonder...?

actors.hero.hero.yuzu_no_available_guns=No ready guns to fire.
actors.hero.hero.yuzu_robot_cooldown=Cannot deploy the robot right now.
actors.hero.hero.yuzu_robot_ready=Robot sortie preparations complete... But do I really have to get in...?
actors.hero.hero.yuzu_robot_destroyed_1=All functions offline, ejecting now...!
actors.hero.hero.yuzu_robot_destroyed_2=Robot inoperable, initiating emergency ejection sequence...!
actors.hero.hero.yuzu_robot_destroyed_3=System malfunction, commencing ejection...!
actors.hero.hero.yuzu_no_active_console=There's no active game to continue right now.
actors.hero.hero.yuzu_need_to_be_adjacent=Can only target adjacent tiles.
actors.hero.hero.yuzu_cannot_break=I don't think I can break this wall.
actors.hero.hero.yuzu_cannot_do=그렇게는 할 수 없어요.
actors.hero.hero.yuzu_cabinet=I wanted to stay in here a bit longer...

actors.hero.talent.yuzu_t1_1.title=Next Time for Sure
actors.hero.talent.yuzu_t1_1.desc=_+1:_ Eating guarantees your next _2 attacks_ are critical hits.\n\n_+2:_ Eating guarantees your next _3 attacks_ are critical hits.\n\nGuaranteed critical hit stacks cap at 5.
actors.hero.talent.yuzu_t1_2.title=Grenade Launcher Specialist
actors.hero.talent.yuzu_t1_2.desc=_+1:_ Instantly identifies GLs _upon equipping_.\n\n_+2:_ Instantly identifies GLs _upon acquiring_.
actors.hero.talent.yuzu_t1_3.title=RNG Kusoge
actors.hero.talent.yuzu_t1_3.desc=_+1:_ Increases critical strike damage by _3_.\n\n_+2:_ Increases critical strike damage by _5_.
actors.hero.talent.yuzu_t1_4.title=Safety Mechanism
actors.hero.talent.yuzu_t1_4.desc=_+1:_ Taking self-damage from your own firearm or missing point-blank shots grants _5_ shielding.\n\n_+2:_ Taking self-damage from your own firearm or missing point-blank shots grants _8_ shielding.\n\nIncurs a 10-turn cooldown.

actors.hero.talent.yuzu_t2_1.title=Bug Fix
actors.hero.talent.yuzu_t2_1.desc=_+1:_ Eating takes only 1 turn and _cleanses negative effects_.\n\n_+2:_ Eating takes only 1 turn, _cleanses negative effects, and grants Immunity for 2 turns_. Does not alleviate hunger.
actors.hero.talent.yuzu_t2_2.title=Open Map
actors.hero.talent.yuzu_t2_2.desc=_+1:_ Reading a scroll searches a radius of _8 tiles_ around you.\n\n_+2:_ Reading a scroll searches a radius of _12 tiles_ around you.\n\nSearch range doubles when reading Scrolls of Upgrade, Scrolls of Transmutation, or using alchemy items crafted from them.\n\nFor crafted alchemy items that yield more outputs than scrolls consumed (e.g. spells), search distance scales based on the quantity produced.
actors.hero.talent.yuzu_t2_3.title=Buffering
actors.hero.talent.yuzu_t2_3.desc=_+1:_ Defers _44%_ of physical damage taken.\n\n_+2:_ Defers _55%_ of physical damage taken.\n\nStacks with the Glyph of Viscosity.
actors.hero.talent.yuzu_t2_4.title=Combo Chain
actors.hero.talent.yuzu_t2_4.desc=_+1:_ Landing a critical hit increases the critical strike chance of your next attack by _+10%_.\n\n_+2:_ Landing a critical hit increases the critical strike chance of your next attack by _+20%_.\n\nBonus critical strike chance does not stack.
actors.hero.talent.yuzu_t2_5.title=VIP Cashback
actors.hero.talent.yuzu_t2_5.desc=_+1:_ Grants _5%_ of credits spent when purchasing items from the laptop.\n\n_+2:_ Grants _10%_ of credits spent when purchasing items from the laptop.

actors.hero.talent.yuzu_t3_1.title=Gacha God
actors.hero.talent.yuzu_t3_1.desc=_+1:_ Chances of high-tier items appearing from Random Boxes are _slightly increased_, and equipment gacha pulls have a _5%_ chance to gain an extra +1 upgrade level.\n\n_+2:_ Chances of high-tier items appearing from Random Boxes are _increased_, and equipment gacha pulls have a _10%_ chance to gain an extra +1 upgrade level.\n\n_+3:_ Chances of high-tier items appearing from Random Boxes are _greatly increased_, and equipment gacha pulls have a _15%_ chance to gain an extra +1 upgrade level.
actors.hero.talent.yuzu_t3_2.title=UZQ Mode
actors.hero.talent.yuzu_t3_2.desc=_+1:_ Landing a critical hit has a _33%_ chance to dodge the next incoming attack.\n\n_+2:_ Landing a critical hit has a _67%_ chance to dodge the next incoming attack.\n\n_+3:_ Landing a critical hit has a _100%_ chance to dodge the next incoming attack.\n\nDodge charges do not stack.

actors.hero.talent.yuzu_ex1_1.title=Self-Repair
actors.hero.talent.yuzu_ex1_1.desc=_+1:_ Defeating an enemy restores _2_ HP to Avant-Garde-kun. If on cooldown, decreases the cooldown by _10 turns_ instead.\n\n_+2:_ Defeating an enemy restores _4_ HP to Avant-Garde-kun. If on cooldown, decreases the cooldown by _20 turns_ instead.\n\n_+3:_ Defeating an enemy restores _6_ HP to Avant-Garde-kun. If on cooldown, decreases the cooldown by _30 turns_ instead.
actors.hero.talent.yuzu_ex1_2.title=Firepower Augmentation
actors.hero.talent.yuzu_ex1_2.desc=_+1:_ Upgrade levels of firearms fired by Avant-Garde-kun increase by an additional _+2_, up to a maximum of _+4_.\n\n_+2:_ Upgrade levels of firearms fired by Avant-Garde-kun increase by an additional _+3_, up to a maximum of _+5_.\n\n_+3:_ Upgrade levels of firearms fired by Avant-Garde-kun increase by an additional _+3_, up to a maximum of _+6_.
actors.hero.talent.yuzu_ex1_3.title=Drill Excavation
actors.hero.talent.yuzu_ex1_3.desc=_+1:_ Avant-Garde-kun can spend _3 turns_ to destroy an adjacent wall.\n\n_+2:_ Avant-Garde-kun can spend _2 turns_ to destroy an adjacent wall.\n\n_+3:_ Avant-Garde-kun can spend _1 turn_ to destroy an adjacent wall.\n\nWalls cannot be destroyed on boss floors.

actors.hero.talent.yuzu_ex2_1.title=Fighter Console
actors.hero.talent.yuzu_ex2_1.desc=_+1:_ Unlocks the ability to purchase the _Fighter Console_.\n\n_+2:_ In addition to the +1 effect, Fighter Console melee attack power increases equivalent to a _Ring of Force +2_.\n\n_+3:_ In addition to the +1 effect, Fighter Console melee attack power increases equivalent to a _Ring of Force +4_.\n\nBase Fighter Console melee attack power is equivalent to equipping a Ring of Force +0.
actors.hero.talent.yuzu_ex2_2.title=Fantasy Console
actors.hero.talent.yuzu_ex2_2.desc=_+1:_ Unlocks the ability to purchase the _Fantasy Console_.\n\n_+2:_ In addition to the +1 effect, increases Fantasy Console base damage to _10-30_.\n\n_+3:_ In addition to the +1 effect, increases Fantasy Console base damage to _15-40_.\n\nFantasy Console base damage is _5-20_.
actors.hero.talent.yuzu_ex2_3.title=Sandbox Console
actors.hero.talent.yuzu_ex2_3.desc=_+1:_ Unlocks the ability to purchase the _Sandbox Console_.\n\n_+2:_ In addition to the +1 effect, grants _12_ tokens when using the Sandbox Console.\n\n_+3:_ In addition to the +1 effect, grants _15_ tokens when using the Sandbox Console.\n\nBase Sandbox Console grants 10 tokens.

actors.hero.talent.yuzu_armor1_1.title=Godlike Micro
actors.hero.talent.yuzu_armor1_1.desc=_+1:_ When initiating PVP, you have a 100% chance to dodge the next _0.5_ attacks.\n\n_+2:_ When initiating PVP, you have a 100% chance to dodge the next _1_ attack.\n\n_+3:_ When initiating PVP, you have a 100% chance to dodge the next _1.5_ attacks.\n\n_+4:_ When initiating PVP, you have a 100% chance to dodge the next _2_ attacks.\n\nFractional values apply as an equivalent percentage chance.
actors.hero.talent.yuzu_armor1_2.title=Breather
actors.hero.talent.yuzu_armor1_2.desc=_+1:_ Defeating an enemy before PVP ends restores HP equal to _30% + 5_ of total damage taken during PVP.\n\n_+2:_ Defeating an enemy before PVP ends restores HP equal to _50% + 10_ of total damage taken during PVP.\n\n_+3:_ Defeating an enemy before PVP ends restores HP equal to _65% + 15_ of total damage taken during PVP.\n\n_+4:_ Defeating an enemy before PVP ends restores HP equal to _75% + 20_ of total damage taken during PVP.
actors.hero.talent.yuzu_armor1_3.title=Battle Maniac
actors.hero.talent.yuzu_armor1_3.desc=_+1:_ Initiating PVP again within 3 turns after PVP ends reduces charge cost by _16%_.\n\n_+2:_ Initiating PVP again within 3 turns after PVP ends reduces charge cost by _30%_.\n\n_+3:_ Initiating PVP again within 3 turns after PVP ends reduces charge cost by _40%_.\n\n_+4:_ Initiating PVP again within 3 turns after PVP ends reduces charge cost by _50%_.

actors.hero.talent.yuzu_armor2_1.title=Hidden Snacks
actors.hero.talent.yuzu_armor2_1.desc=_+1:_ Activating this ability restores _25_ hunger and _3_ HP, with a _25%_ chance to trigger on-eat effects.\n\n_+2:_ Activating this ability restores _50_ hunger and _6_ HP, with a _50%_ chance to trigger on-eat effects.\n\n_+3:_ Activating this ability restores _75_ hunger and _9_ HP, with a _75%_ chance to trigger on-eat effects.\n\n_+4:_ Activating this ability restores _100_ hunger and _12_ HP, with a _100%_ chance to trigger on-eat effects.
actors.hero.talent.yuzu_armor2_2.title=Reorganization Time
actors.hero.talent.yuzu_armor2_2.desc=_+1:_ Activating this ability chambers _1 round_ into your equipped firearm.\n\n_+2:_ Activating this ability chambers _2 rounds_ into your equipped firearm.\n\n_+3:_ Activating this ability chambers _3 rounds_ into your equipped firearm.\n\n_+4:_ Activating this ability chambers _4 rounds_ into your equipped firearm.\n\nCan exceed maximum ammo capacity.
actors.hero.talent.yuzu_armor2_3.title=Run Away!
actors.hero.talent.yuzu_armor2_3.desc=_+1:_ If enemies are within line of sight when the effect ends, gains Super Haste for _2 turns_.\n\n_+2:_ If enemies are within line of sight when the effect ends, gains Super Haste for _4 turns_.\n\n_+3:_ If enemies are within line of sight when the effect ends, gains Super Haste for _6 turns_.\n\n_+4:_ If enemies are within line of sight when the effect ends, gains Super Haste for _8 turns_.

actors.hero.talent.yuzu_armor3_1.title=Invincibility
actors.hero.talent.yuzu_armor3_1.desc=_+1:_ Unlocks the ability to purchase _Invincibility_ from the laptop, granting _30_ shielding upon purchase.\n\n_+2:_ Unlocks the ability to purchase _Invincibility_ from the laptop, granting _60_ shielding upon purchase.\n\n_+3:_ Unlocks the ability to purchase _Invincibility_ from the laptop, granting _90_ shielding upon purchase.\n\n_+4:_ Unlocks the ability to purchase _Invincibility_ from the laptop, granting _120_ shielding upon purchase.\n\nInvincibility can only be purchased once per ability activation.
actors.hero.talent.yuzu_armor3_2.title=Infinite Ammo
actors.hero.talent.yuzu_armor3_2.desc=_+1:_ Unlocks the ability to purchase _Infinite Ammo_ from the laptop, granting Infinite Ammo for _5 turns_ upon purchase.\n\n_+2:_ Unlocks the ability to purchase _Infinite Ammo_ from the laptop, granting Infinite Ammo for _10 turns_ upon purchase.\n\n_+3:_ Unlocks the ability to purchase _Infinite Ammo_ from the laptop, granting Infinite Ammo for _15 turns_ upon purchase.\n\n_+4:_ Unlocks the ability to purchase _Infinite Ammo_ from the laptop, granting Infinite Ammo for _20 turns_ upon purchase.
actors.hero.talent.yuzu_armor3_3.title=Credit Conversion
actors.hero.talent.yuzu_armor3_3.desc=_+1:_ Unlocks the ability to purchase _Credit Conversion_ from the laptop, granting _100 Credits_ per remaining turn of VIP Membership upon purchase and ending the VIP Membership.\n\n_+2:_ Unlocks the ability to purchase _Credit Conversion_ from the laptop, granting _150 Credits_ per remaining turn of VIP Membership upon purchase and ending the VIP Membership.\n\n_+3:_ Unlocks the ability to purchase _Credit Conversion_ from the laptop, granting _200 Credits_ per remaining turn of VIP Membership upon purchase and ending the VIP Membership.\n\n_+4:_ Unlocks the ability to purchase _Credit Conversion_ from the laptop, granting _250 Credits_ per remaining turn of VIP Membership upon purchase and ending the VIP Membership.

actors.hero.abilities.yuzu.pvp.name=PVP
actors.hero.abilities.yuzu.pvp.prompt=Select an enemy for PVP
actors.hero.abilities.yuzu.pvp.already_dueling=You are already in a PVP match.
actors.hero.abilities.yuzu.pvp.ally_target=You can only initiate PVP with enemies.
actors.hero.abilities.yuzu.pvp.unreachable_target=You must be able to reach the target to initiate PVP.
actors.hero.abilities.yuzu.pvp.distant_target=That enemy is too far away for PVP.
actors.hero.abilities.yuzu.pvp.short_desc=Yuzu challenges a nearby enemy to _PVP_, temporarily freezing all other enemies in time.\n
actors.hero.abilities.yuzu.pvp.desc=Yuzu challenges a nearby enemy to PVP. That enemy must fight Yuzu while time stops for all other hostiles.\n\nThe target must be reachable and within 5 tiles of Yuzu. PVP lasts until 10 turns pass, the enemy dies, or the distance between Yuzu and the enemy exceeds 5 tiles.\n\nOther time-frozen enemies take no damage. Yuzu's allies are unaffected; however, minions summoned by a boss will also remain unaffected during a duel with that boss.
actors.hero.abilities.yuzu.pvp$duelparticipant.name=PVP Participant
actors.hero.abilities.yuzu.pvp$duelparticipant.desc=This target is participating in a PVP duel. While time is frozen for all other hostiles, only this target, their allies, or minions can act normally.\n\nPVP lasts until the time limit expires, one participant falls, or the distance between participants exceeds 5 tiles.\n\nTurns remaining: %d.
actors.hero.abilities.yuzu.cabinet.name=Hide in Locker
actors.hero.abilities.yuzu.cabinet.short_desc=Yuzu hides inside a _safe locker_ to pass the time completely undisturbed.\n
actors.hero.abilities.yuzu.cabinet.desc=Yuzu steps inside a locker for 20 turns, becoming invisible to enemies, invincible, and unable to move for the duration.
actors.hero.abilities.yuzu.vipmembership.name=VIP Membership
actors.hero.abilities.yuzu.vipmembership.short_desc=Yuzu temporarily gains access to _VIP Membership content_.\n
actors.hero.abilities.yuzu.vipmembership.desc=Yuzu gains Bless for 30 turns and 30 shielding, allowing her to purchase VIP Membership content for 10 turns. VIP Membership content can be unlocked and enhanced through talents.
actors.hero.abilities.yuzu.vipmembership$vipbuff.name=VIP Membership
actors.hero.abilities.yuzu.vipmembership$vipbuff.desc=You have gained access privileges to VIP content!\n\nTurns remaining: _%s_.

###Izuna Sentences
actors.hero.heroclass.izuna=Izuna
actors.hero.heroclass.izuna_desc_short=Izuna! Reporting for duty at Sensei's... no, My Lord's summons~! Nin-nin!\n\nDifficulty: _Normal_
actors.hero.heroclass.izuna_desc=Izuna begins with a _Ninja Cape_ that lets her blink a short distance and cloak in stealth.\n\nIzuna is proficient with thrown weapons, requiring _1 less strength_ to handle them properly.\n\nIzuna begins with the _Assassin's Kunai_, which deals heavy damage on sneak attacks.\n\nIzuna also enters the dungeon with a _Tier-1 SMG_, 3 Throwing Knives, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nIzuna begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.izuna_unlock=Defeat 1 enemy to unlock Izuna.

actors.hero.herosubclass.switching=Body Replacement Jutsu!
actors.hero.herosubclass.switching_short_desc=Izuna can summon a decoy _Fox Plushie_ upon using the Ninja Cape to lure enemies away.\n
actors.hero.herosubclass.switching_desc=Having mastered the Body Replacement Jutsu, Izuna's Ninja Cape recharge rate increases by 50%, and using the cape summons a decoy Fox Plushie at her original position to absorb attacks on her behalf.\n\nOnly 1 Fox Plushie can be maintained at a time. The Fox Plushie has 10 HP and 1-3 defense.
actors.hero.herosubclass.chase=Slice and Dice!
actors.hero.herosubclass.chase_short_desc=After landing a thrown weapon hit, Izuna can _close in instantly to deliver a melee strike_.\n
actors.hero.herosubclass.chase_desc=Izuna can teleport to an enemy struck by a thrown weapon within 4 + (thrown weapon upgrade level) turns and deliver a melee attack.

actors.hero.hero.izuna_health_critical_1=Ouch! This much is nothing...!
actors.hero.hero.izuna_health_critical_2=Kiyip! Whimper!
actors.hero.hero.izuna_health_critical_3=Even if it hurts a bit, a ninja doesn't cry...

actors.hero.hero.izuna_health_warn_1=I'm getting a little worn out...
actors.hero.hero.izuna_health_warn_2=My Lord, My Lord! How about we take a quick rest over there?
actors.hero.hero.izuna_health_warn_3=My Lord, by any chance have you seen any recovery items?

actors.hero.hero.izuna_die=Kyah! Everything's... spinning around...

actors.hero.hero.izuna_enemy_defeated_1=Mission start!
actors.hero.hero.izuna_enemy_defeated_2=Sprinting to the next operational zone!
actors.hero.hero.izuna_enemy_defeated_3=Izuna, moving out!
actors.hero.hero.izuna_enemy_defeated_4=Hah! This much is a breeze!
actors.hero.hero.izuna_enemy_defeated_5=That won't work on Izuna!

actors.hero.hero.izuna_levelup_1=Ninja Art! Level Up Jutsu!
actors.hero.hero.izuna_levelup_2=I can feel my shurikens getting stronger too!
actors.hero.hero.izuna_levelup_3=Ah, My Lord! I just leveled up!
actors.hero.hero.izuna_levelup_4=Izuna is advancing toward becoming the strongest!
actors.hero.hero.izuna_levelup_5=Leveling up doesn't seem to make me run any faster, though...
actors.hero.hero.izuna_levelup_rare=I heard that if Izuna levels up a whole lot, I'll be able to bake donuts!

actors.hero.hero.izuna_fov=Izuna can only blink to places she can see!
actors.hero.hero.izuna_enemy=Blinking there will make me crash into them...
actors.hero.hero.izuna_distance=That's too far...
actors.hero.hero.izuna_solid=I can't phase into walls!
actors.hero.hero.izuna_cannot_self=I definitely shouldn't throw this at myself!
actors.hero.hero.izuna_cannot_move=I can't move right now...

actors.hero.talent.izuna_t1_1.title=Meticulous Maintenance
actors.hero.talent.izuna_t1_1.desc=_+1:_ Increases thrown weapon durability by _+3_.\n\n_+2:_ Increases thrown weapon durability by _+5_.
actors.hero.talent.izuna_t1_2.title=Thrown Weapon Specialist
actors.hero.talent.izuna_t1_2.desc=_+1:_ Increases thrown weapon identification speed by _3x_.\n\n_+2:_ Landing a thrown weapon hit _instantly identifies_ it.
actors.hero.talent.izuna_t1_3.title=Izuna-Style Ninja Art! Stinging Jutsu!
actors.hero.talent.izuna_t1_3.desc=_+1:_ When Izuna takes damage, has a 50% chance to inflict _1_ bleeding on the attacker.\n\n_+2:_ When Izuna takes damage, has a 50% chance to inflict _1-2_ bleeding on the attacker.
actors.hero.talent.izuna_t1_4.title=Shadow Meld
actors.hero.talent.izuna_t1_4.desc=_+1:_ While invisible, grants 1 shielding _every 2 turns_, up to a maximum of _3_.\n\n_+2:_ While invisible, grants 1 shielding _every 1 turn_, up to a maximum of _5_.

actors.hero.talent.izuna_t2_1.title=Bento Time
actors.hero.talent.izuna_t2_1.desc=_+1:_ Eating takes only 1 turn and grants _artifact charging for 3 turns_.\n\n_+2:_ Eating takes only 1 turn and grants _artifact charging for 5 turns_.\n\nArtifact charge gained via the Horn of Plenty will not recharge the Horn itself.
actors.hero.talent.izuna_t2_2.title=Scroll of Protection
actors.hero.talent.izuna_t2_2.desc=_+1:_ Grants _10_ shielding after reading a scroll or casting a spell.\n\n_+2:_ Grants _15_ shielding after reading a scroll or casting a spell.\n\nShielding amount doubles when using Scrolls of Upgrade, Scrolls of Transmutation, or alchemy items crafted from them.\n\nFor crafted alchemy items that yield more outputs than scrolls consumed (e.g. spells), shielding amount scales based on the quantity produced.
actors.hero.talent.izuna_t2_3.title=Water Walking
actors.hero.talent.izuna_t2_3.desc=_+1:_ Increases Izuna's movement speed on water by _50%_.\n\n_+2:_ Increases Izuna's movement speed on water by _100%_.
actors.hero.talent.izuna_t2_4.title=Tiptoe
actors.hero.talent.izuna_t2_4.desc=_+1:_ Does not awaken sleeping enemies as long as they are _at least 3 tiles away_.\n\n_+2:_ Does not awaken sleeping enemies _unless adjacent to them_.
actors.hero.talent.izuna_t2_5.title=Vanish into Thin Air
actors.hero.talent.izuna_t2_5.desc=_+1:_ Defeating a non-adjacent enemy grants Super Haste for _3 turns_.\n\n_+2:_ Defeating a non-adjacent enemy grants Super Haste for _5 turns_.

actors.hero.talent.izuna_t3_1.title=Tracking
actors.hero.talent.izuna_t3_1.desc=_+1:_ Landing a thrown weapon hit grants Mind Vision for the target for _5 turns_.\n\n_+2:_ Landing a thrown weapon hit grants Mind Vision for the target for _10 turns_.\n\n_+3:_ Landing a thrown weapon hit grants Mind Vision for the target for _15 turns_.
actors.hero.talent.izuna_t3_2.title=Lightweight Cape
actors.hero.talent.izuna_t3_2.desc=_+1:_ Izuna can use the Ninja Cape without equipping it, but an unequipped cape recharges at _25%_ speed.\n\n_+2:_ Izuna can use the Ninja Cape without equipping it, but an unequipped cape recharges at _50%_ speed.\n\n_+3:_ Izuna can use the Ninja Cape without equipping it, but an unequipped cape recharges at _75%_ speed.

actors.hero.talent.izuna_ex1_1.title=Sturdy Plushie
actors.hero.talent.izuna_ex1_1.desc=_+1:_ Fox Plushie health increases to _20_, and defense increases to _2-6_.\n\n_+2:_ Fox Plushie health increases to _30_, and defense increases to _3-9_.\n\n_+3:_ Fox Plushie health increases to _40_, and defense increases to _3-12_.
actors.hero.talent.izuna_ex1_2.title=Feigned Opening
actors.hero.talent.izuna_ex1_2.desc=_+1:_ Whenever the Fox Plushie is attacked, the attacking enemy gains Vulnerable for _1 turn_.\n\n_+2:_ Whenever the Fox Plushie is attacked, the attacking enemy gains Vulnerable for _2 turns_.\n\n_+3:_ Whenever the Fox Plushie is attacked, the attacking enemy gains Vulnerable for _3 turns_.
actors.hero.talent.izuna_ex1_3.title=Vaulting Obstacles
actors.hero.talent.izuna_ex1_3.desc=_+1:_ Increases Ninja Cape maximum blink range by _1 tile_.\n\n_+2:_ In addition to the +1 effect, Ninja Cape can be used on explored tiles _without line of sight_.\n\n_+3:_ In addition to the +2 effect, using the Ninja Cape _grants Super Haste for 1 turn_.

actors.hero.talent.izuna_ex2_1.title=Catching Off-Guard
actors.hero.talent.izuna_ex2_1.desc=_+1:_ Throwing a weapon immediately after using the Ninja Cape consumes no turn. Incurs a _15-turn_ cooldown.\n\n_+2:_ Throwing a weapon immediately after using the Ninja Cape consumes no turn. Incurs a _10-turn_ cooldown.\n\n_+3:_ Throwing a weapon immediately after using the Ninja Cape consumes no turn. Incurs a _5-turn_ cooldown.
actors.hero.talent.izuna_ex2_2.title=Body Flicker Jutsu
actors.hero.talent.izuna_ex2_2.desc=_+1:_ Defeating an enemy with this ability grants Invisibility and Haste for _1 turn_.\n\n_+2:_ Defeating an enemy with this ability grants Invisibility and Haste for _2 turns_.\n\n_+3:_ Defeating an enemy with this ability grants Invisibility and Haste for _3 turns_.
actors.hero.talent.izuna_ex2_3.title=Thrown Weapon Master
actors.hero.talent.izuna_ex2_3.desc=_+1:_ Thrown weapon upgrade levels increase by the Assassin's Kunai's upgrade level, up to a maximum of _+2_.\n\n_+2:_ Thrown weapon upgrade levels increase by the Assassin's Kunai's upgrade level, up to a maximum of _+4_.\n\n_+3:_ Thrown weapon upgrade levels increase by the Assassin's Kunai's upgrade level, up to a maximum of _+6_.

actors.hero.talent.izuna_armor1_1.title=Swift Disengagement
actors.hero.talent.izuna_armor1_1.desc=_+1:_ Activating this ability grants Haste and Super Haste for _1 turn_.\n\n_+2:_ Activating this ability grants Haste and Super Haste for _2 turns_.\n\n_+3:_ Activating this ability grants Haste and Super Haste for _3 turns_.\n\n_+4:_ Activating this ability grants Haste and Super Haste for _4 turns_.
actors.hero.talent.izuna_armor1_2.title=Heavy Smoke Bomb
actors.hero.talent.izuna_armor1_2.desc=_+1:_ Increases smoke density by _25%_.\n\n_+2:_ Increases smoke density by _50%_.\n\n_+3:_ Increases smoke density by _75%_.\n\n_+4:_ Increases smoke density by _100%_.
actors.hero.talent.izuna_armor1_3.title=Rope Snare
actors.hero.talent.izuna_armor1_3.desc=_+1:_ Activating this ability Roots all enemies in a surrounding 3x3-tile area for _2 turns_.\n\n_+2:_ Activating this ability Roots all enemies in a surrounding 3x3-tile area for _4 turns_.\n\n_+3:_ Activating this ability Roots all enemies in a surrounding 3x3-tile area for _6 turns_.\n\n_+4:_ Activating this ability Roots all enemies in a surrounding 3x3-tile area for _8 turns_.

actors.hero.talent.izuna_armor2_1.title=Boosted Acceleration
actors.hero.talent.izuna_armor2_1.desc=_+1:_ Increases maximum range for using this ability by _1 tile_.\n\n_+2:_ Increases maximum range for using this ability by _2 tiles_.\n\n_+3:_ Increases maximum range for using this ability by _3 tiles_.\n\n_+4:_ Increases maximum range for using this ability by _4 tiles_.
actors.hero.talent.izuna_armor2_2.title=Flawless Assassination
actors.hero.talent.izuna_armor2_2.desc=_+1:_ Attacks that defeat an enemy within _1 turn_ of using this ability consume no turn.\n\n_+2:_ Attacks that defeat an enemy within _2 turns_ of using this ability consume no turn.\n\n_+3:_ Attacks that defeat an enemy within _3 turns_ of using this ability consume no turn.\n\n_+4:_ Attacks that defeat an enemy within _4 turns_ of using this ability consume no turn.
actors.hero.talent.izuna_armor2_3.title=Chain Movement
actors.hero.talent.izuna_armor2_3.desc=_+1:_ Reusing this ability within 5 turns after use consumes _15%_ less charge.\n\n_+2:_ Reusing this ability within 5 turns after use consumes _28%_ less charge.\n\n_+3:_ Reusing this ability within 5 turns after use consumes _39%_ less charge.\n\n_+4:_ Reusing this ability within 5 turns after use consumes _48%_ less charge.

actors.hero.talent.izuna_armor3_1.title=Chain Lightning
actors.hero.talent.izuna_armor3_1.desc=_+1:_ Landing a lightning hit generates chain lightning dealing _20%_ of damage dealt.\n\n_+2:_ Landing a lightning hit generates chain lightning dealing _40%_ of damage dealt.\n\n_+3:_ Landing a lightning hit generates chain lightning dealing _60%_ of damage dealt.\n\n_+4:_ Landing a lightning hit generates chain lightning dealing _80%_ of damage dealt.
actors.hero.talent.izuna_armor3_2.title=High-Voltage Current
actors.hero.talent.izuna_armor3_2.desc=_+1:_ Increases lightning damage by _25%_.\n\n_+2:_ Increases lightning damage by _50%_.\n\n_+3:_ Increases lightning damage by _75%_.\n\n_+4:_ Increases lightning damage by _100%_.
actors.hero.talent.izuna_armor3_3.title=Thunderbolt Strike
actors.hero.talent.izuna_armor3_3.desc=_+1:_ Enemies directly damaged by lightning have a _25%_ chance to be Paralyzed instead of Crippled.\n\n_+2:_ Enemies directly damaged by lightning have a _50%_ chance to be Paralyzed instead of Crippled.\n\n_+3:_ Enemies directly damaged by lightning have a _75%_ chance to be Paralyzed instead of Crippled.\n\n_+4:_ Enemies directly damaged by lightning have a _100%_ chance to be Paralyzed instead of Crippled.

actors.hero.abilities.izuna.smokespread.name=Smoke Dispersion
actors.hero.abilities.izuna.smokespread.short_desc=Izuna deploys a _smoke screen_ around herself to obscure enemy vision.\n
actors.hero.abilities.izuna.smokespread.desc=Izuna disperses smoke across a 3x3 area around herself to obscure enemy vision.
actors.hero.abilities.izuna.blink.name=Izuna-Style Secret Art! High-Speed Movement Jutsu!
actors.hero.abilities.izuna.blink.short_desc=Izuna teleports a short distance _without consuming a turn_.\n
actors.hero.abilities.izuna.blink.desc=Izuna instantly blinks to a location within line of sight up to 3 tiles away without consuming a turn. Does not break Invisibility.
actors.hero.abilities.izuna.blink$perfectassassination.name=Flawless Assassination
actors.hero.abilities.izuna.blink$perfectassassination.desc=Within the next _%s_ turns, 1 attack that defeats an enemy consumes no turn.
actors.hero.abilities.izuna.throwingthunder.name=Hurl Lightning
actors.hero.abilities.izuna.throwingthunder.short_desc=Izuna hurls a guaranteed-hit _lightning bolt_ to deal heavy damage to a foe.\n
actors.hero.abilities.izuna.throwingthunder.desc=Izuna hurls a guaranteed-hit lightning bolt at a targeted location, dealing 20-60 damage to an enemy at that spot and inflicting Crippled for 10 turns.

###Mika Sentences
actors.hero.heroclass.mika=Mika
actors.hero.heroclass.mika_desc_short=미소노 미카. 드디어 등장~☆ 그런 느낌일까?\n앗, 나와 선생님 사이니까, 아이스브레이킹은 없어도 되겠지?\n앞으로 잘 부탁해. 선생님.\n\n난이도: _쉬움_
actors.hero.heroclass.mika_desc=Mika begins with a _Scrunchie_ that smashes walls, knocks enemies back, and Stuns them.\n\nMika's unarmed attacks deal _damage scaling with her current strength and level_; even while wielding a firearm, she deals unarmed attack damage. Weapon augments and enchantments still apply.\n\nMika also enters the dungeon with a _Tier-1 SMG_, a Millennium Uniform, a Waterskin, and a Velvet Pouch.\n\nMika begins with the following items identified:\n_-_ Scroll of Identify\n_-_ Potion of Healing\n_-_ Scroll of Rage
actors.hero.heroclass.mika_unlock=Defeat 1 enemy to unlock Mika.

actors.hero.herosubclass.call_of_star=Call of the Stars
actors.hero.herosubclass.call_of_star_short_desc=Mika can drop a _meteor_ on a chosen location that grows stronger with every hit landed.\n
actors.hero.herosubclass.call_of_star_desc=Each physical attack Mika lands builds Call of the Stars charge. Expending all charge crashes a meteor down at a target location, dealing damage equal to (Current Strength * 20% * Expended Charge) to all enemies within range and demolishing all terrain in the blast area.\n\nThe base radius of the meteor explosion is 1 tile, expanding by 1 tile for every 10 charge spent, up to a maximum of +10 tiles.
actors.hero.herosubclass.little_angry=Getting a Little Angry, Maybe...☆
actors.hero.herosubclass.little_angry_short_desc=Mika creates a _shockwave_ at a chosen location to knock enemies back, consuming Paralyze to deal heavy damage.\n
actors.hero.herosubclass.little_angry_desc=Mika unleashes a shockwave at a chosen location, knocking surrounding enemies outward by 1 tile. In addition, physical attacks against Paralyzed enemies consume their paralysis to deal bonus damage equal to Current Strength * 4.

actors.hero.hero.mika_health_critical_1=Ouch, that actually hurts~☆
actors.hero.hero.mika_health_critical_2=Things are getting pretty dicey...☆
actors.hero.hero.mika_health_critical_3=Best not to push our luck.

actors.hero.hero.mika_health_warn_1=Getting a bit tired... I'd love to go rest somewhere.
actors.hero.hero.mika_health_warn_2=Hmph... I might just be getting a tiny bit mad here☆
actors.hero.hero.mika_health_warn_3=So that's how it's gonna be...☆

actors.hero.hero.mika_die=Looks like this is as far as I go...

actors.hero.hero.mika_enemy_defeated_1=You're in my way, mind stepping aside?☆
actors.hero.hero.mika_enemy_defeated_2=An easy victory~☆
actors.hero.hero.mika_enemy_defeated_3=Nothing to it!
actors.hero.hero.mika_enemy_defeated_4=Fufufu. The rest of you better brace yourselves~
actors.hero.hero.mika_enemy_defeated_5=Small fry should stay out of this☆

actors.hero.hero.mika_levelup_1=Whoaaa~ is it really okay for me to get this strong? Can you handle me, Sensei?
actors.hero.hero.mika_levelup_2=Ahaha☆ Still not satisfied with how things are? Well then, maybe I'll try living up to those expectations just a little bit more.
actors.hero.hero.mika_levelup_3=Gotten even stronger. This too... is all for you, Sensei.
actors.hero.hero.mika_levelup_4=I never really felt like I was lacking power, but... if it's for Sensei, getting stronger than I am now is totally fine by me.
actors.hero.hero.mika_levelup_5=This power... is going to be a huge help from here on out.
actors.hero.hero.mika_levelup_rare=Wa-ow. Just how strong am I gonna get, I wonder~☆

actors.hero.hero.mika_out_of_sight=Can only target somewhere within line of sight.
actors.hero.hero.mika_invalid=Can't do that.
actors.hero.hero.mika_supernova=Hmm... that one looks a bit dangerous...
actors.hero.hero.mika_supernova_positive=That one looks pretty good.
actors.hero.hero.mika_no_char=No target there.
actors.hero.hero.mika_no_enemy=Can only use this on enemies. ...You're not planning to use this on me or my friends, right? Surely not☆
actors.hero.hero.mika_already_have=Already in use.
actors.hero.hero.mika_cooldown=지금은 쓸 수 없어.

actors.hero.talent.mika_t1_1.title=Destructive Instinct
actors.hero.talent.mika_t1_1.desc=_+1:_ Demolishing a wall with the Scrunchie increases the damage of your next melee attack within 5 turns by _5_.\n\n_+2:_ Demolishing a wall with the Scrunchie increases the damage of your next melee attack within 5 turns by _8_.
actors.hero.talent.mika_t1_2.title=Favorite Dress
actors.hero.talent.mika_t1_2.desc=_+1:_ Instantly identifies armor _upon equipping_.\n\n_+2:_ Instantly identifies armor _upon acquiring_.
actors.hero.talent.mika_t1_3.title=I'm Getting Mad, You Know?
actors.hero.talent.mika_t1_3.desc=_+1:_ Taking physical damage grants Adrenaline for _3 turns_.\n\n_+2:_ Taking physical damage grants Adrenaline for _5 turns_.
actors.hero.talent.mika_t1_4.title=Delicate Maiden
actors.hero.talent.mika_t1_4.desc=_+1:_ Grants 10 shielding when taking damage that drops HP below _5%_.\n\n_+2:_ Grants 10 shielding when taking damage that drops HP below _10%_.\n\nIncurs a 100-turn cooldown.

actors.hero.talent.mika_t2_1.title=Me Time
actors.hero.talent.mika_t2_1.desc=_+1:_ Eating takes only 1 turn and grants a time bubble for _3 turns_.\n\n_+2:_ Eating takes only 1 turn and grants a time bubble for _5 turns_.
actors.hero.talent.mika_t2_2.title=Dessert After Dessert
actors.hero.talent.mika_t2_2.desc=_+1:_ Eating has a _20%_ chance to drop a Roll Cake.\n\n_+2:_ Eating has a _30%_ chance to drop a Roll Cake.
actors.hero.talent.mika_t2_3.title=Shoo, Go Away☆
actors.hero.talent.mika_t2_3.desc=_+1:_ Increases knockback distance when hitting enemies with the Scrunchie by _2 tiles_.\n\n_+2:_ Increases knockback distance when hitting enemies with the Scrunchie by _3 tiles_.
actors.hero.talent.mika_t2_4.title=Next.
actors.hero.talent.mika_t2_4.desc=_+1:_ Attacks that defeat an enemy _consume no turns_.\n\n_+2:_ In addition to the +1 effect, defeating an enemy _grants Super Haste for 3 turns_.
actors.hero.talent.mika_t2_5.title=Mind Coming Over Here for a Sec?
actors.hero.talent.mika_t2_5.desc=_+1:_ The first bullet hit against an enemy inflicts Charmed for _5 turns_.\n\n_+2:_ The first bullet hit against an enemy inflicts Charmed for _10 turns_.

actors.hero.talent.mika_t3_1.title=I'll Hold Back, Okay?
actors.hero.talent.mika_t3_1.desc=_+1:_ Increases Mika's strength by _8%_.\n\n_+2:_ Increases Mika's strength by _13%_.\n\n_+3:_ Increases Mika's strength by _18%_.
actors.hero.talent.mika_t3_2.title=Precious Keepsake
actors.hero.talent.mika_t3_2.desc=_+1:_ Mika can use the Scrunchie without equipping it, but an unequipped Scrunchie recharges at _25%_ speed.\n\n_+2:_ Mika can use the Scrunchie without equipping it, but an unequipped Scrunchie recharges at _50%_ speed.\n\n_+3:_ Mika can use the Scrunchie without equipping it, but an unequipped Scrunchie recharges at _75%_ speed.

actors.hero.talent.mika_ex1_1.title=Meteor Shower
actors.hero.talent.mika_ex1_1.desc=_+1:_ Defeating an enemy with Call of the Stars reduces its cooldown by _5%_ per enemy slain.\n\n_+2:_ Defeating an enemy with Call of the Stars reduces its cooldown by _10%_ per enemy slain.\n\n_+3:_ Defeating an enemy with Call of the Stars reduces its cooldown by _15%_ per enemy slain.
actors.hero.talent.mika_ex1_2.title=Meteor Strike
actors.hero.talent.mika_ex1_2.desc=_+1:_ Inflicts Paralyze for _2 turns_ on enemies struck by the meteor.\n\n_+2:_ Inflicts Paralyze for _4 turns_ on enemies struck by the meteor.\n\n_+3:_ Inflicts Paralyze for _6 turns_ on enemies struck by the meteor.
actors.hero.talent.mika_ex1_3.title=Colossal Meteor
actors.hero.talent.mika_ex1_3.desc=_+1:_ Increases Call of the Stars maximum charge cap by _+17%_.\n\n_+2:_ Increases Call of the Stars maximum charge cap by _+33%_.\n\n_+3:_ Increases Call of the Stars maximum charge cap by _+50%_.\n\nRadius cannot exceed +10 tiles.

actors.hero.talent.mika_ex2_1.title=Serious Mode
actors.hero.talent.mika_ex2_1.desc=_+1:_ Increases shockwave knockback distance by _1 tile_.\n\n_+2:_ Increases shockwave knockback distance by _2 tiles_.\n\n_+3:_ Increases shockwave knockback distance by _3 tiles_.
actors.hero.talent.mika_ex2_2.title=Cornered Maiden
actors.hero.talent.mika_ex2_2.desc=_+1:_ Bonus damage dealt by this ability increases proportional to missing HP, up to _+17%_.\n\n_+2:_ Bonus damage dealt by this ability increases proportional to missing HP, up to _+33%_.\n\n_+3:_ Bonus damage dealt by this ability increases proportional to missing HP, up to _+50%_.
actors.hero.talent.mika_ex2_3.title=Herbal Tea Time
actors.hero.talent.mika_ex2_3.desc=_+1:_ Defeating an enemy grants _2_ points of herbal healing.\n\n_+2:_ Defeating an enemy grants _4_ points of herbal healing.\n\n_+3:_ Defeating an enemy grants _6_ points of herbal healing.

actors.hero.talent.mika_armor1_1.title=Cream Aplenty
actors.hero.talent.mika_armor1_1.desc=_+1:_ Throwing a Roll Cake inflicts Blindness for _2 turns_ on the target.\n\n_+2:_ Throwing a Roll Cake inflicts Blindness for _4 turns_ on the target.\n\n_+3:_ Throwing a Roll Cake inflicts Blindness for _6 turns_ on the target.\n\n_+4:_ Throwing a Roll Cake inflicts Blindness for _8 turns_ on the target.
actors.hero.talent.mika_armor1_2.title=Sticky Cream
actors.hero.talent.mika_armor1_2.desc=_+1:_ Throwing a Roll Cake inflicts Caustic Ooze for _5 turns_ on the target.\n\n_+2:_ Throwing a Roll Cake inflicts Caustic Ooze for _10 turns_ on the target.\n\n_+3:_ Throwing a Roll Cake inflicts Caustic Ooze for _15 turns_ on the target.\n\n_+4:_ Throwing a Roll Cake inflicts Caustic Ooze for _20 turns_ on the target.
actors.hero.talent.mika_armor1_3.title=Sugar Rush
actors.hero.talent.mika_armor1_3.desc=_+1:_ Hitting a target with or eating a Roll Cake grants Haste for _2 turns_.\n\n_+2:_ Hitting a target with or eating a Roll Cake grants Haste for _4 turns_.\n\n_+3:_ Hitting a target with or eating a Roll Cake grants Haste for _6 turns_.\n\n_+4:_ Hitting a target with or eating a Roll Cake grants Haste for _8 turns_.

actors.hero.talent.mika_armor2_1.title=I'll Be Fine
actors.hero.talent.mika_armor2_1.desc=_+1:_ Mika and allies have a _25%_ chance to take no damage from Supernova Explosions.\n\n_+2:_ Mika and allies have a _50%_ chance to take no damage from Supernova Explosions.\n\n_+3:_ Mika and allies have a _75%_ chance to take no damage from Supernova Explosions.\n\n_+4:_ Mika and allies have a _100%_ chance to take no damage from Supernova Explosions.
actors.hero.talent.mika_armor2_2.title=Lure
actors.hero.talent.mika_armor2_2.desc=_+1:_ Pulls enemies toward the center of the Supernova Explosion every _4 turns_ before detonation.\n\n_+2:_ Pulls enemies toward the center of the Supernova Explosion every _3 turns_ before detonation.\n\n_+3:_ Pulls enemies toward the center of the Supernova Explosion every _2 turns_ before detonation.\n\n_+4:_ Pulls enemies toward the center of the Supernova Explosion every _1 turn_ before detonation.\n\nEnemies actively pursuing do not get lured.
actors.hero.talent.mika_armor2_3.title=Constellation Crafting
actors.hero.talent.mika_armor2_3.desc=_+1:_ Using this ability consecutively consumes _20%_ less charge.\n\n_+2:_ Using this ability consecutively consumes _36%_ less charge.\n\n_+3:_ Using this ability consecutively consumes _49%_ less charge.\n\n_+4:_ Using this ability consecutively consumes _59%_ less charge.

actors.hero.talent.mika_armor3_1.title=Slinking In
actors.hero.talent.mika_armor3_1.desc=_+1:_ Activating this ability has a _25%_ chance to grant Invisibility for 1 turn.\n\n_+2:_ Activating this ability has a _50%_ chance to grant Invisibility for 1 turn.\n\n_+3:_ Activating this ability has a _75%_ chance to grant Invisibility for 1 turn.\n\n_+4:_ Activating this ability has a _100%_ chance to grant Invisibility for 1 turn.
actors.hero.talent.mika_armor3_2.title=Broken Trust
actors.hero.talent.mika_armor3_2.desc=_+1:_ If this ability is dispelled by an attack, inflicts Amok for _2 turns_ on all enemies in line of sight.\n\n_+2:_ If this ability is dispelled by an attack, inflicts Amok for _4 turns_ on all enemies in line of sight.\n\n_+3:_ If this ability is dispelled by an attack, inflicts Amok for _6 turns_ on all enemies in line of sight.\n\n_+4:_ If this ability is dispelled by an attack, inflicts Amok for _8 turns_ on all enemies in line of sight.
actors.hero.talent.mika_armor3_3.title=Sabotage
actors.hero.talent.mika_armor3_3.desc=_+1:_ Activating this ability while active consumes _10%_ less charge and inflicts Doom on the targeted enemy.\n\n_+2:_ Activating this ability while active consumes _19%_ less charge and inflicts Doom on the targeted enemy.\n\n_+3:_ Activating this ability while active consumes _27%_ less charge and inflicts Doom on the targeted enemy.\n\n_+4:_ Activating this ability while active consumes _42%_ less charge and inflicts Doom on the targeted enemy.

actors.hero.abilities.mika.rollcakethrow.name=Throw Roll Cake!
actors.hero.abilities.mika.rollcakethrow.short_desc=Mika throws a Roll Cake to _slow enemies down_.\n
actors.hero.abilities.mika.rollcakethrow.desc=When Mika throws a Roll Cake at an enemy, it restores 10 HP to the hit target and inflicts Slow for 20 turns. Activating this ability throws a Roll Cake to a chosen location.\n\nTargeting your own tile eats the Roll Cake. Negative effects are not applied to allies.
actors.hero.abilities.mika.supermeteor.name=Supernova Explosion
actors.hero.abilities.mika.supermeteor.short_desc=Mika triggers a _colossal explosion_ at a chosen location.\n
actors.hero.abilities.mika.supermeteor.desc=Mika triggers a Supernova Explosion at a targeted location to cause a massive detonation. Mika herself and allies can also take damage from the blast.
actors.hero.abilities.mika.perfectdeception.name=Flawless Deception
actors.hero.abilities.mika.perfectdeception.short_desc=Mika _prevents enemies from detecting her first_ for an extended period.
actors.hero.abilities.mika.perfectdeception.desc=Mika completely deceives enemies for 100 turns, preventing them from noticing her first. Enemies already actively pursuing her will continue pursuit, but will stop once she breaks away from them.\n\nLanding a physical attack while Flawless Deception is active dispels the effect immediately; if the attack was a sneak attack, it instantly executes non-boss and non-elite hostiles.
actors.hero.abilities.mika.perfectdeception$deceptionbuff.name=Flawless Deception
actors.hero.abilities.mika.perfectdeception$deceptionbuff.desc=Shh, those guys totally think I'm on their side.\n\nI won't be spotted first for the next _%s_ turns☆


###Mika Sentences
actors.hero.heroclass.mari=마리
actors.hero.heroclass.mari_desc_short=모든 만남은 필연적인 것... 잘 부탁드립니다, 선생님.\n\n난이도: _어려움_
actors.hero.heroclass.mari_desc=마리는 총기를 재장전하거나 각종 기적을 일으킬 수 있는 _십자가 목걸이_를 가지고 시작합니다.\n\n마리는 신성력으로 만들어진 탄환을 발사하여 _적의 방어력을 무시합니다_. 또한 마리에게 공격하는 적들에게 _벼락이 내리치며 마리의 레벨에 비례한 피해를 입힙니다_.\n대신 총기를 재장전할 때 _십자가 목걸이의 충전량을 소모_해야 하며, 십자가 목걸이를 장착 중이지 않거나 충전량이 부족할 경우 탄환을 장전하지 못합니다.\n\n마리는 또한 _1티어 HG_, 천 교복, 가죽 물통, 벨벳 주머니를 가지고 던전에 입장합니다.\n\n마리는 다음 아이템을 감정한 채로 시작합니다.\n_-_ 감정의 주문서\n_-_ 정화의 물약\n_-_ 저주 해제의 주문서
actors.hero.heroclass.mari_unlock=마리가 해금되어 있지 않다면 개발자에게 이야기해 주세요.

actors.hero.herosubclass.devout_prayer=경건한 성자
actors.hero.herosubclass.devout_prayer_short_desc=마리는 _강력한 신성력_을 통해 적을 벌할 수 있습니다.
actors.hero.herosubclass.devout_prayer_desc=경건한 성자인 마리는 가호 기적의 방어력과 천벌 피해를 2만큼 강화하고 가호 효과 중 천벌이 발생할 때마다 빛의 탄창 효과를 1씩 얻습니다.\n\n마리는 또한 언데드와 악마에게 큰 피해를 입히고 적 처치 시 장착한 총기의 탄환을 완전히 재장전하는 성탄 기적을 얻습니다.
actors.hero.herosubclass.symbol_of_peace=평화의 상징
actors.hero.herosubclass.symbol_of_peace_short_desc=마리는 _대상을 치유_하고 방어막을 얻을 수 있습니다.
actors.hero.herosubclass.symbol_of_peace_desc=평화의 상징인 마리는 적들의 등장 속도를 1.2배 늦추고, 가호 기적을 물리 피해만이 아닌 굶주림을 제외한 모든 피해를 1만큼 줄이도록 강화합니다.\n\n마리는 또한 대상을 일시적으로 완전히 치유하고 방어막을 얻는 치유의 손길 기적을 얻습니다.

actors.hero.hero.mari_health_critical_1=이것이 제게 주어진 운명이라면...!
actors.hero.hero.mari_health_critical_2=이런 가혹한 시련도... 분명 이겨낼 수 있을 거예요.
actors.hero.hero.mari_health_critical_3=몸이 지쳐도... 믿음만큼은 지치지 않습니다.

actors.hero.hero.mari_health_warn_1=조금 힘에 부치네요...
actors.hero.hero.mari_health_warn_2=아주 잠깐이라면... 여기서 쉬었다 가도 괜찮을까요?
actors.hero.hero.mari_health_warn_3=...이렇게 피곤할 때에는 나태해지기 쉽죠...

actors.hero.hero.mari_die=면목... 없습니다...

actors.hero.hero.mari_enemy_defeated_1=그대에게 축복이 깃들기를 바랍니다.
actors.hero.hero.mari_enemy_defeated_2=길을 재촉합시다.
actors.hero.hero.mari_enemy_defeated_3=영원한 영광을 누리기를 기원합니다.
actors.hero.hero.mari_enemy_defeated_4=미움을 거두어 주시기를.
actors.hero.hero.mari_enemy_defeated_5=평화가 함께하길.

actors.hero.hero.mari_levelup_1=보내주신 믿음에 부응할 수 있도록, 성심성의껏 노력하겠습니다.
actors.hero.hero.mari_levelup_2=성스러운 힘이... 몸 속에서 넘쳐나서...
actors.hero.hero.mari_levelup_3=앞으로도 더욱 정진하겠습니다.
actors.hero.hero.mari_levelup_4=선생님의 응원과 함께한다면, 무엇이든 할 수 있을 것만 같은 기분이 듭니다.
actors.hero.hero.mari_levelup_5=지금이라면, 뭐든지 할 수 있을 것 같은 기분이 들어요.
actors.hero.hero.mari_levelup_rare=경기의 시작을 알리는 총성처럼, 부디 이 작은 무기도 평화를 위한 것이 되기를...

actors.hero.hero.mari_cursed=이 아이템에서 사악한 기운이 느껴지네요...
actors.hero.hero.mari_uncursed=이 아이템에서는 사악한 기운이 느껴지지 않아요.
actors.hero.hero.mari_guess_no_target=거기엔 적이 없는 것 같네요.
actors.hero.hero.mari_no_target=대상이 없어요.
actors.hero.hero.mari_not_enemy=그 대상은 우리의 적이 아니에요.
actors.hero.hero.mari_fov=그 위치는 제가 볼 수 없어요.
actors.hero.hero.mari_no_charge=충전량이 부족해요.
actors.hero.hero.mari_no_necklace=목걸이가 없다고 제 신앙심이 약해지는 건 아니지만, 그래도 기적을 발현하려면 목걸이가 필요해요.
actors.hero.hero.mari_cannot_cast=기적을 시전할 수 없어요...
actors.hero.hero.mari_already_full=그 대상은 더 이상 회복할 수 없어요.
actors.hero.hero.mari_not_adjacent=근접한 대상만 지정할 수 있어요.
actors.hero.hero.mari_need_gun=능력을 사용하려면 총이 필요해요.
actors.hero.hero.mari_already_loaded=이미 모든 탄환이 장전되어 있어요.
actors.hero.hero.mari_immune=그 대상은 영향을 받지 않을 거예요.

actors.hero.talent.mari_t1_1.title=풍요의 축복
actors.hero.talent.mari_t1_1.desc=_+1:_ 식사 후 다음 기적 사용 시 _3_의 방어막을 얻습니다.\n\n_+2:_ 식사 후 다음 기적 사용 시 _5_의 방어막을 얻습니다.
actors.hero.talent.mari_t1_2.title=부정 감지
actors.hero.talent.mari_t1_2.desc=_+1:_ 부정 감지 기적을 얻습니다. 지정한 아이템의 저주 여부를 확인합니다. _충전 소모량: 6_\n\n_+2:_ 부정 감지 기적을 얻습니다. 지정한 아이템의 저주 여부를 확인합니다. _충전 소모량: 5_
actors.hero.talent.mari_t1_3.title=성스러운 탄환
actors.hero.talent.mari_t1_3.desc=_+1:_ 빛의 탄창의 효과로 강화된 탄환이 입히는 피해량이 _3_ 증가합니다.\n\n_+2:_ 빛의 탄창의 효과로 강화된 탄환이 입히는 피해량이 _5_ 증가합니다.
actors.hero.talent.mari_t1_4.title=단호한 기도
actors.hero.talent.mari_t1_4.desc=_+1:_ 기도 중 받는 피해 감소량이 _1_ 증가합니다.\n\n_+2:_ 기도 중 받는 피해 감소량이 _2_ 증가합니다.

actors.hero.talent.mari_t2_1.title=성찬
actors.hero.talent.mari_t2_1.desc=_+1:_ 식사에 1턴만 소모하며, 식사 시 십자가 목걸이의 충전량을 _4_ 회복합니다.\n\n_+2:_ 식사에 1턴만 소모하며, 식사 시 십자가 목걸이의 충전량을 _6_ 회복합니다.
actors.hero.talent.mari_t2_2.title=기도문
actors.hero.talent.mari_t2_2.desc=_+1:_ 주문서 사용 시 장착 중인 총기를 즉시 재장전하고 장전한 탄환의 수의 _25%_만큼 빛의 탄창 효과를 얻습니다.\n\n_+2:_ 주문서 사용 시 장착 중인 총기를 즉시 재장전하고 장전한 탄환의 수의 _50%_만큼 빛의 탄창 효과를 얻습니다.\n\n빛의 탄창 효과는 강화의 주문서, 변환의 주문서 및 이 주문서를 재료로 사용하여 만든 연금술 아이템을 사용했을 때 획득량이 2배 증가합니다.\n\n사용한 주문서의 수보다 많은 양의 결과물을 제작하는 연금술 아이템(예: 주문)의 경우, 이 특성은 그 결과물의 개수에 따라 빛의 탄창 효과 획득량이 달라집니다.
actors.hero.talent.mari_t2_3.title=은탄
actors.hero.talent.mari_t2_3.desc=_+1:_ 은탄 기적을 얻습니다. 대상 하나에게 _6-10_의 피해를 입히며 _4턴_의 실명을 부여하는 탄환을 발사하고, 장착 중인 총기에 탄환을 한 발 재장전합니다. 충전 소모량: 3\n\n_+2:_ 은탄 기적을 얻습니다. 대상 하나에게 _8-12_의 피해를 입히며 _6턴_의 실명을 부여하는 탄환을 발사하고, 장착 중인 총기에 탄환을 한 발 재장전합니다. 충전 소모량: 3\n\n은탄을 사용한 실명은 적 하나 당 한 번씩만 부여할 수 있으며, 악마와 언데드는 항상 최대의 피해를 입습니다.
actors.hero.talent.mari_t2_4.title=정신의 결속
actors.hero.talent.mari_t2_4.desc=_+1:_ 정신의 결속 기적을 얻습니다. 대상 하나에 대한 _5턴_의 심안 효과를 얻습니다. 충전 소모량: 4\n\n_+2:_ 정신의 결속 기적을 얻습니다. 대상 하나에 대한 _10턴_의 심안 효과를 얻습니다. 충전 소모량: 4
actors.hero.talent.mari_t2_5.title=자애의 축복
actors.hero.talent.mari_t2_5.desc=_+1:_ 자애의 축복 기적을 얻습니다. 대상 하나가 10턴 동안 매 턴마다 중첩되지 않는 방어막을 _5_만큼 얻습니다. 충전 소모량: 3\n\n_+2:_ 자애의 축복 기적을 얻습니다. 대상 하나가 10턴 동안 매 턴마다 중첩되지 않는 방어막을 _8_만큼 얻습니다. 충전 소모량: 3

actors.hero.talent.mari_t3_1.title=정화의 세례
actors.hero.talent.mari_t3_1.desc=_+1:_ 정화의 세례 기적을 얻습니다. 마리와 주변 아군 전부가 가진 부정적인 효과를 제거하고 _10_의 방어막을 얻습니다. 충전 소모량: 5\n\n_+2:_ 정화의 세례 기적을 얻습니다. 마리와 주변 아군 전부가 가진 부정적인 효과를 제거하고 _2턴_의 디버프 면역 효과와 _20_의 방어막을 얻습니다. 충전 소모량: 5\n\n_+3:_ 정화의 세례 기적을 얻습니다. 마리와 주변 아군 전부가 가진 부정적인 효과를 제거하고 _4턴_의 디버프 면역 효과와 _30_의 방어막을 얻습니다. 충전 소모량: 5
actors.hero.talent.mari_t3_2.title=독실함
actors.hero.talent.mari_t3_2.desc=_+1:_ 마리는 십자가 목걸이를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 목걸이는 충전 속도가 _25%_로 감소합니다.\n\n_+2:_ 마리는 십자가 목걸이를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 목걸이는 충전 속도가 _50%_로 감소합니다.\n\n_+3:_ 마리는 십자가 목걸이를 착용하지 않고도 사용할 수 있지만, 착용하지 않은 목걸이는 충전 속도가 _75%_로 감소합니다.

actors.hero.talent.mari_ex1_1.title=단호한 결의
actors.hero.talent.mari_ex1_1.desc=_+1:_ 단호한 결의 기적을 얻습니다. 주변 8타일에 있는 모든 대상을 _1타일_ 바깥쪽으로 밀어냅니다. 충전 소모량: 4\n\n_+2:_ 단호한 결의 기적을 얻습니다. 주변 8타일에 있는 모든 대상을 _2타일_ 바깥쪽으로 밀어냅니다. 충전 소모량: 4\n\n_+3:_ 단호한 결의 기적을 얻습니다. 주변 8타일에 있는 모든 대상을 _3타일_ 바깥쪽으로 밀어냅니다. 충전 소모량: 4
actors.hero.talent.mari_ex1_2.title=뇌창
actors.hero.talent.mari_ex1_2.desc=_+1:_ 뇌창 기적을 얻습니다. _30-55_의 피해를 입히고 대상을 3턴 마비시키는 뇌창을 던집니다. 충전 소모량: 8\n\n_+2:_ 뇌창 기적을 얻습니다. _45-83_의 피해를 입히고 대상을 3턴 마비시키는 뇌창을 던집니다. 충전 소모량: 8\n\n_+3:_ 뇌창 기적을 얻습니다. _60-110_의 피해를 입히고 대상을 3턴 마비시키는 뇌창을 던집니다. 충전 소모량: 8
actors.hero.talent.mari_ex1_3.title=성스러운 보호막
actors.hero.talent.mari_ex1_3.desc=_+1:_ 성스러운 보호막 기적을 얻습니다. 턴을 소모하지 않으며, 다음에 입는 공격 피해를 1회 막습니다. 50턴의 재사용 대기 시간이 있습니다. 충전 소모량: _4_\n\n_+2:_ 성스러운 보호막 기적을 얻습니다. 턴을 소모하지 않으며, 다음에 입는 공격 피해를 1회 막습니다. 50턴의 재사용 대기 시간이 있습니다. 충전 소모량: _3_\n\n_+3:_ 성스러운 보호막 기적을 얻습니다. 턴을 소모하지 않으며, 다음에 입는 공격 피해를 1회 막습니다. 50턴의 재사용 대기 시간이 있습니다. 충전 소모량: _2_

actors.hero.talent.mari_ex2_1.title=세례
actors.hero.talent.mari_ex2_1.desc=_+1:_ 세례 기적을 얻습니다. 턴을 소모하지 않으며, 방어막을 모두 소모하고 소모한 방어막의 _50%_만큼의 신성 피해를 대상 하나에게 입힙니다. 충전 소모량: 2\n\n_+2:_ 세례 기적을 얻습니다. 턴을 소모하지 않으며, 방어막을 모두 소모하고 소모한 방어막의 _100%_만큼의 신성 피해를 대상 하나에게 입힙니다. 충전 소모량: 2\n\n_+3:_ 세례 기적을 얻습니다. 턴을 소모하지 않으며, 방어막을 모두 소모하고 소모한 방어막의 _150%_만큼의 신성 피해를 대상 하나에게 입힙니다. 충전 소모량: 2
actors.hero.talent.mari_ex2_2.title=구원
actors.hero.talent.mari_ex2_2.desc=_+1:_ 구원 기적을 얻습니다. 층 전체의 모든 대상에게 무적 효과를 _2턴_ 부여합니다. 충전 소모량: 6\n\n_+2:_ 구원 기적을 얻습니다. 층 전체의 모든 대상에게 무적 효과를 _3턴_ 부여합니다. 충전 소모량: 6\n\n_+3:_ 구원 기적을 얻습니다. 층 전체의 모든 대상에게 무적 효과를 _4턴_ 부여합니다. 충전 소모량: 6
actors.hero.talent.mari_ex2_3.title=회개
actors.hero.talent.mari_ex2_3.desc=_+1:_ 회개 기적을 얻습니다. 턴을 소모하지 않으며, 근접한 대상 하나를 _일정 확률_로 아군으로 만듭니다. 충전 소모량: 3\n\n_+2:_ 회개 기적을 얻습니다. 턴을 소모하지 않으며, 근접한 대상 하나를 _일정 확률+10%_로 아군으로 만듭니다. 충전 소모량: 3\n\n_+3:_ 회개 기적을 얻습니다. 턴을 소모하지 않으며, 근접한 대상 하나를 _일정 확률+20%_로 아군으로 만듭니다. 충전 소모량: 3\n\n기본 확률은 대상이 잃은 체력+지연된 피해의 최대 체력에 대한 비율입니다. 실패 시 대상을 10턴 약화시킵니다.

actors.hero.talent.mari_armor1_1.title=섬광 탄환
actors.hero.talent.mari_armor1_1.desc=_+1:_ 섬광 탄환 기적을 얻습니다. 다음에 발사하는 탄환이 적을 _1턴_ 실명시키고, 마리에게 _10턴_의 발광을 부여합니다. 충전 소모량: 3\n\n_+2:_ 섬광 탄환 기적을 얻습니다. 다음에 발사하는 탄환이 적을 _2턴_ 실명시키고, 마리에게 _20턴_의 발광을 부여합니다. 충전 소모량: 3\n\n_+3:_ 섬광 탄환 기적을 얻습니다. 다음에 발사하는 탄환이 적을 _3턴_ 실명시키고, 마리에게 _30턴_의 발광을 부여합니다. 충전 소모량: 3\n\n_+4:_ 섬광 탄환 기적을 얻습니다. 다음에 발사하는 탄환이 적을 _4턴_ 실명시키고, 마리에게 _40턴_의 발광을 부여합니다. 충전 소모량: 3
actors.hero.talent.mari_armor1_2.title=빛의 은혜
actors.hero.talent.mari_armor1_2.desc=_+1:_ 빛의 은혜 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 입히는 피해의 _10%_만큼 체력을 회복합니다. 충전 소모량: 3\n\n_+2:_ 빛의 은혜 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 입히는 피해의 _20%_만큼 체력을 회복합니다. 충전 소모량: 3\n\n_+3:_ 빛의 은혜 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 입히는 피해의 _30%_만큼 체력을 회복합니다. 충전 소모량: 3\n\n_+4:_ 빛의 은혜 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 입히는 피해의 _40%_만큼 체력을 회복합니다. 충전 소모량: 3
actors.hero.talent.mari_armor1_3.title=천벌의 탄환
actors.hero.talent.mari_armor1_3.desc=_+1:_ 천벌의 탄환 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 대상에게 _25%_ 확률로 벼락을 내리칩니다. 충전 소모량: 3\n\n_+2:_ 천벌의 탄환 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 대상에게 _50%_ 확률로 벼락을 내리칩니다. 충전 소모량: 3\n\n_+3:_ 천벌의 탄환 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 대상에게 _75%_ 확률로 벼락을 내리칩니다. 충전 소모량: 3\n\n_+4:_ 천벌의 탄환 기적을 얻습니다. 재장전하기 전까지 발사하는 탄환이 대상에게 _100%_ 확률로 벼락을 내리칩니다. 충전 소모량: 3


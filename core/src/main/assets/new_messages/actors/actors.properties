actors.buffs.rabbitsquadbuff$saki.name=Saki
actors.buffs.rabbitsquadbuff$saki.desc=RABBIT 2, Saki. Deployed on orders from Squad Leader Miyako.\n\nWeapon: _Tier-%1$d SMG +%2$d_\nAmmo: _%3$d/%4$d_\nReload turns required: _%5$s_\n\nI automatically engage hostiles in my line of sight, but I'll prioritize targets focused by Squad Leader Miyako.

actors.hero.abilities.miyako.wirehook$pointblankshot.desc=Miyako has sharpened her focus on nearby targets to the absolute limit, granting 3x bullet accuracy against adjacent enemies.\n\nTurns remaining: %s.
actors.hero.abilities.miyako.helicopter.name=Helicopter Extraction
actors.hero.abilities.miyako.helicopter.short_desc=Miyako boards a transport helicopter to _relocate to a chosen destination_.\n
actors.hero.abilities.miyako.helicopter.desc=Miyako calls in helicopter transport support to board and reach her destination instantly, taking 5 turns of recovery upon landing.\n\nCannot be used on unreachable areas or inside locked rooms.\nTargeting an unseen enemy or object outside line of sight reveals them with Mind Vision for 3 turns instead of moving, consuming charge.
actors.hero.abilities.miyako.helicopter.cannot_reach=Cannot travel to that location.
actors.hero.abilities.miyako.helicopter.already_char=Cannot land there because someone is in the way.
actors.hero.abilities.miyako.closeairsupport.name=Call In Close Air Support
actors.hero.abilities.miyako.closeairsupport.short_desc=Miyako calls in an airstrike to _carpet-bomb the path leading to the target location_.\n
actors.hero.abilities.miyako.closeairsupport.desc=Miyako calls in close air support, dropping high-explosive ordnance in a straight line from 1 tile ahead of her all the way to the designated target.
actors.hero.abilities.miyako.closeairsupport.prompt=Select target area
actors.hero.abilities.miyako.closeairsupport.does_nothing=No valid bombardment target in that direction.


actors.hero.abilities.ratmogrify.short_desc=The student can use _Ratmogrify_ to briefly transform an enemy into a harmless rat!
actors.hero.abilities.ratmogrify.desc=The student transforms an enemy into a rat for 6 turns! Bosses, allies, and rats cannot be transformed.\n\nRatmogrified enemies retain their base stats but lose all special abilities.
actors.buffs.revealedchar.desc=This target has been revealed to the student and remains visible wherever they go.\n\nTurns remaining: %s.
actors.buffs.magicimmune.desc=All magic loses its potency against you; you are completely immune to all magical effects.\n\nWhile magic immune, you are unaffected by all beneficial or harmful magical effects, including curses, enchantments, wands, scrolls, rings, and artifacts. Student uniform abilities are powerful enough to pierce this effect and remain usable.\n\nMagic immunity turns remaining: %s.
actors.buffs.magicalsleep.desc=This creature is in a deep magical slumber and cannot awaken naturally.\n\nMagical sleep functions much like regular sleep, but the creature can only be awakened by taking damage.\n\nMagical sleep cast on students and allies carries healing power, rapidly regenerating health while asleep.
actors.buffs.drowsy.desc=Magical power fogs the target's mind, putting them into a deep magical slumber after a few turns.\n\nStudents can resist drowsiness by taking damage or while at maximum health.\n\nTurns until falling asleep: %s.
actors.buffs.blindness.desc=Blindness shrouds everything around the target in a dark fog.\n\nWhile blinded, the creature's vision is reduced to a single tile; ranged attacks become useless, and distant enemies cannot be seen or tracked. In addition, a blinded student cannot read scrolls or books.\n\nBlindness turns remaining: %s.

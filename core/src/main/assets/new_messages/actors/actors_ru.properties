actors.buffs.supernovacharge.name=Зарядка аккумулятора: Сверхновая
actors.buffs.supernovacharge.desc=Зарядка аккумулятора увеличена! Его можно использовать для зарядки, а также для увеличения мощности следующего выстрела.\n\nТекущий бонусный урон: _%s%%_.
actors.buffs.supernovacharge.action_name=Зарядите аккумулятор!

actors.hero.talent.aris_t1_1.title=Начало приключения
actors.hero.talent.aris_t1_1.desc=_+1: Сила атаки в ближнем бою увеличивается на _+1_.\n\n_+2: Сила атаки в ближнем бою увеличивается на _+2_.
actors.hero.talent.aris_t1_2.title=Сканировать
actors.hero.talent.aris_t1_2.desc=_+1:_ Скорость оценки холодного оружия и школьной формы увеличивается в 2,5 раза.\n\n_+2:_ Мгновенно оценивает холодное оружие и школьную форму при экипировке.
actors.hero.talent.aris_t1_3.title=Любопытство
actors.hero.talent.aris_t1_3.desc=_+1: Оценка зелья или свитка приносит _5_ очков опыта.\n\n_+2: Оценка зелья или свитка приносит _8_ очков опыта.
actors.hero.talent.aris_t1_4.title=Надежная защита
actors.hero.talent.aris_t1_4.desc=_+1:_ Максимальная ценность щита, предоставляемого эмблемой Ариса, увеличивается на _1_\n.\n_+2:_ Максимальная ценность щита, предоставляемого эмблемой Ариса, увеличивается на _2_.

actors.hero.talent.aris_t2_1.title=Это обнадеживает!
actors.hero.talent.aris_t2_1.desc=_+1: Расходует всего 1 ход на прием пищи и снижает получаемый урон во время приема пищи на _75%.\n\n_+2: Расходует всего 1 ход на прием пищи и снижает получаемый урон во время приема пищи на _100%.
actors.hero.talent.aris_t2_2.title=Свет!
actors.hero.talent.aris_t2_2.desc=_+1: При первой атаке врага наложите эффект ослепления на _2 хода.\n\n_+2: При первой атаке врага наложите эффект ослепления на _3 хода.
actors.hero.talent.aris_t2_3.title=Активация памяти
actors.hero.talent.aris_t2_3.desc=_+1:_ Теперь глифы можно передавать так же, как и уровни улучшения эмблем Ариса._\n\n_+2:_ В дополнение к эффекту +1, глифы, полученные при улучшении брони, не удаляются._
actors.hero.talent.aris_t2_4.title=Чит-команда
actors.hero.talent.aris_t2_4.desc=_+1:_ Минимальный урон от Balance Break равен текущему HP противника с вероятностью _5%_.\n\n_+2:_ Минимальный урон от Balance Break равен текущему HP противника с вероятностью _10%_.
actors.hero.talent.aris_t2_5.title=Регулировка баланса
actors.hero.talent.aris_t2_5.desc=_+1:_ Время восстановления способности «Разрушение баланса» уменьшено на _20%.\n\n_+2:_ Время восстановления способности «Разрушение баланса» уменьшено на _30%.

actors.hero.talent.aris_t3_1.title=Робот-пылесос
actors.hero.talent.aris_t3_1.desc=_+1: Скорость передвижения увеличивается на _+5%\n.\n_+2: Скорость передвижения увеличивается на _+10%\n.\n_+3: Скорость передвижения увеличивается на _+15%.
actors.hero.talent.aris_t3_2.title=Пропустить историю
actors.hero.talent.aris_t3_2.desc=_+1: При первом входе на этаж кратчайший путь на следующий этаж открывается с вероятностью _33%_.\n\n_+2: При первом входе на этаж кратчайший путь на следующий этаж открывается с вероятностью _67%_.\n\n_+3: При первом входе на этаж кратчайший путь на следующий этаж открывается с вероятностью _100%_.

actors.hero.talent.aris_ex1_1.title=Главный дилер
actors.hero.talent.aris_ex1_1.desc=_+1:_ После завершения подготовки к «Краху баланса» уровень усиления Меча Света: Сверхновая увеличивается на _+1_.\n\n_+2:_ После завершения подготовки к «Краху баланса» уровень усиления Меча Света: Сверхновая увеличивается на _+2_.\n\n_+3:_ После завершения подготовки к «Краху баланса» уровень усиления Меча Света: Сверхновая увеличивается на _+3_.
actors.hero.talent.aris_ex1_2.title=Подготовка к обороне завершена.
actors.hero.talent.aris_ex1_2.desc=_+1:_ Защита увеличивается на _+1-4_ во время зарядки Balance Collapse.\n\n_+2:_ Защита увеличивается на _+2-8_ во время зарядки Balance Collapse.\n\n_+3:_ Защита увеличивается на _+3-12_ во время зарядки Balance Collapse.
actors.hero.talent.aris_ex1_3.title=Сверхновая — это пробуждение!
actors.hero.talent.aris_ex1_3.desc=_+1:_ Меч Света: При нанесении удара в ближнем бою с использованием Сверхновой, уменьшите время восстановления «Разрушения Баланса» на _1 ход_.\n\n_+2:_ Меч Света: При нанесении удара в ближнем бою с использованием Сверхновой, уменьшите время восстановления «Разрушения Баланса» на _2 хода_.\n\n_+3:_ Меч Света: При нанесении удара в ближнем бою с использованием Сверхновой, уменьшите время восстановления «Разрушения Баланса» на _3 хода_.

actors.hero.talent.aris_ex2_1.title=Баланс нарушен...
actors.hero.talent.aris_ex2_1.desc=_+1:_ Количество зарядов батареи, полученных от атак ближнего боя, увеличивается до _-1~+2_.\n\n_+2:_ Количество зарядов батареи, полученных от атак ближнего боя, увеличивается до _+0~+2_\n.\n_+3:_ Количество зарядов батареи, полученных от атак ближнего боя, увеличивается до _+1~+3_.
actors.hero.talent.aris_ex2_2.title=Скрытый триггер
actors.hero.talent.aris_ex2_2.desc=_+1: При атаке существует _10%-ная вероятность немедленно заблокировать атаку и контратаковать.\n\n_+2: При атаке существует _20%-ная вероятность немедленно заблокировать атаку и контратаковать.\n\n_+3: При атаке существует _30%-ная вероятность немедленно заблокировать атаку и контратаковать.
actors.hero.talent.aris_ex2_3.title=Поклонник главного героя
actors.hero.talent.aris_ex2_3.desc=_+1: Уровень улучшения кольца увеличивается на +1 за каждые _100_ зарядов батареи.\n\n_+2: Уровень улучшения кольца увеличивается на +1 за каждые _50_ зарядов батареи.\n\n_+3: Уровень улучшения кольца увеличивается на +1 за каждые _30_ зарядов батареи.\n\nДополнительные уровни улучшения могут быть получены до максимального значения +3.

actors.hero.talent.aris_armor1_1.title=Снижено перегрева
actors.hero.talent.aris_armor1_1.desc=_+1:_ После использования способности время восстановления Balance Breakdown уменьшается на _13%_.\n\n_+2:_ После использования способности время восстановления Balance Breakdown уменьшается на _25%_\n.\n_+3:_ После использования способности время восстановления Balance Breakdown уменьшается на _38%_.\n\n_+4:_ После использования способности время восстановления Balance Breakdown уменьшается на _50%_.
actors.hero.talent.aris_armor1_2.title=Энергетический щит
actors.hero.talent.aris_armor1_2.desc=_+1: Получите _2_ щита за каждого врага, получившего урон от Balance Break после использования способности.\n\n_+2: Получите _4_ щита за каждого врага, получившего урон от Balance Break после использования способности.\n\n_+3: Получите _6_ щита за каждого врага, получившего урон от Balance Break после использования способности.\n\n_+4: Получите _8_ щита за каждого врага, получившего урон от Balance Break после использования способности.\n\nПрименяется максимум к 8 целям.
actors.hero.talent.aris_armor1_3.title=Свет... ты...
actors.hero.talent.aris_armor1_3.desc=_+1: После использования способности существует _25%_ вероятность поджечь врагов, получивших урон от Balance Break.\n\n_+2: После использования способности существует _50%_ вероятность поджечь врагов, получивших урон от Balance Break.\n\n_+3: После использования способности существует _75%_ вероятность поджечь врагов, получивших урон от Balance Break.\n\n_+4: После использования способности существует _100%_ вероятность поджечь врагов, получивших урон от Balance Break.

actors.hero.talent.aris_armor2_1.title=Сила защиты
actors.hero.talent.aris_armor2_1.desc=_+1:_ Получите _8_ щитов при активации Divi:Sion.\n\n_+2:_ Получите _16_ щитов при активации Divi:Sion.\n\n_+3:_ Получите _24_ щитов при активации Divi:Sion.\n\n_+4:_ Получите _32_ щитов при активации Divi:Sion.
actors.hero.talent.aris_armor2_2.title=Поглощение жизненной силы
actors.hero.talent.aris_armor2_2.desc=_+1:_ Наложение на врага способности Диви:Сиона восстанавливает _2_ здоровья.\n\n_+2:_ Наложение на врага способности Диви:Сиона восстанавливает _4_ здоровья.\n\n_+3:_ Наложение на врага способности Диви:Сиона восстанавливает _6_ здоровья.\n\n_+4:_ Наложение на врага способности Диви:Сиона восстанавливает _8_ здоровья.
actors.hero.talent.aris_armor2_3.title=Непреходящая сила
actors.hero.talent.aris_armor2_3.desc=+1: Наложение на врага способности Диви:Сиона увеличивает длительность действия способности на 2 хода.\n\n+2: Наложение на врага способности Диви:Сиона увеличивает длительность действия способности на 4 хода.\n\n+3: Наложение на врага способности Диви:Сиона увеличивает длительность действия способности на 6 ходов.\n\n+4: Наложение на врага способности Диви:Сиона увеличивает длительность действия способности на 8 ходов.\n\nПрименяется максимум к 8 целям.

actors.hero.talent.aris_armor3_1.title=Высокоэффективная батарея
actors.hero.talent.aris_armor3_1.desc=_+1:_ Время восстановления способности Balance Break, срабатывающей после активации Battery Replacement, уменьшается на _10%_.\n\n_+2:_ Время восстановления способности Balance Break, срабатывающей после активации Battery Replacement, уменьшается на _20%_.\n\n_+3:_ Время восстановления способности Balance Break, срабатывающей после активации Battery Replacement, уменьшается на _30%_.\n\n_+4:_ Время восстановления способности Balance Break, срабатывающей после активации Battery Replacement, уменьшается на _40%_.
actors.hero.talent.aris_armor3_2.title=Высокопроизводительная батарея
actors.hero.talent.aris_armor3_2.desc=_+1: Урон от способности «Крах баланса», срабатывающей после замены батареи, увеличивается на _10%_.\n\n_+2: Урон от способности «Крах баланса», срабатывающей после замены батареи, увеличивается на _20%_.\n\n_+3: Урон от способности «Крах баланса», срабатывающей после замены батареи, увеличивается на _30%_.\n\n_+4: Урон от способности «Крах баланса», срабатывающей после замены батареи, увеличивается на _40%_.
actors.hero.talent.aris_armor3_3.title=Высокоскоростная замена
actors.hero.talent.aris_armor3_3.desc=_+1:_ 25%-ная вероятность того, что ход не будет потрачен при активации «Замены батареи».\n\n_+2:_ 50%-ная вероятность того, что ход не будет потрачен при активации «Замены батареи».\n\n_+3:_ 75%-ная вероятность того, что ход не будет потрачен при активации «Замены батареи».\n\n_+4:_ 100%-ная вероятность того, что ход не будет потрачен при активации «Замены батареи».

actors.hero.abilities.aris.extendedlaser.name=Расширительные детали
actors.hero.abilities.aris.extendedlaser.short_desc=Арис может оснастить Меч Света: Сверхновая одноразовой деталью, которая значительно улучшит _Нарушение Баланса_.
actors.hero.abilities.aris.extendedlaser.desc=Арис может улучшить следующий Balance Breakshot, утроив дальность горизонтальной атаки и удвоив максимальную дистанцию. Время перезарядки Balance Breakshot после использования дополнительной детали увеличивается вдвое.
actors.hero.abilities.aris.extendedlaser.cooldown=Меч Света: Невозможно прикрепить детали, если Сверхновая перегрелась.
actors.hero.abilities.aris.extendedlaser.already_used=Дополнительные компоненты уже установлены!
actors.hero.abilities.aris.extendedlaser$extendedlaserbuff.name=Расширительные детали
actors.hero.abilities.aris.extendedlaser$extendedlaserbuff.desc=Дополнительные детали готовы! Это опасно, поэтому, пожалуйста, спрячьтесь там на минутку.\n\nГоризонтальная дальность следующей атаки Balance Break увеличивается в 3 раза, а максимальная дистанция — в 2 раза.
actors.hero.abilities.aris.division.name=Диви:Сион
actors.hero.abilities.aris.division.short_desc=Арис пробуждает силу принцессы, позволяя ей на короткое время летать, а также развращать побежденных врагов.
actors.hero.abilities.aris.division.desc=Арис восстанавливает силу Принцессы Безымянных Богов на 20 ходов, что позволяет ей летать по воздуху. Кроме того, большинство врагов, побежденных во время действия эффекта, могут быть подвержены порче и превращены в союзников.
actors.hero.abilities.aris.division.already_activated=Не может быть использовано повторно в бодрствующем состоянии!
actors.hero.abilities.aris.division$divisionbuff.name=Безымянная принцесса богов
actors.hero.abilities.aris.division$divisionbuff.desc=Арис временно пробудила часть личности Кей. Она может летать по воздуху и превращать любого побежденного врага в союзника.\n\nОсталось ходов:%s
actors.hero.abilities.aris.batterychange.name=Замена батареи
actors.hero.abilities.aris.batterychange.short_desc=Арис может заменить батарею во время паузы между действиями Balance Break, чтобы немедленно подготовиться к его повторному использованию.
actors.hero.abilities.aris.batterychange.desc=Арис может немедленно подготовиться к нарушению баланса, заменив батарею Меча Света: Сверхновая.

###Nonomi sentences
actors.hero.heroclass.nonomi=Нономи
actors.hero.heroclass.nonomi_desc_short=Желаю вам прекрасного дня, учитель! Доверьте всё мне.\n\nУровень сложности: _Легкий_
actors.hero.heroclass.nonomi_desc=Нономи осознает магию сложных процентов, увеличивая количество своих кредитов на 1% каждый раз, когда побеждает врага, благодаря непрерывным инвестициям активов.\n\nНономи хорошо обращается с пулеметами и тратит на них на 1 меньше силы.\n\nНономи также входит в подземелье с пулеметом 1-го уровня, тканевой формой, кожаным кувшином для воды и бархатным мешочком.\n\nНономи начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.nonomi_unlock=Нономи разблокируется автоматически.

actors.hero.herosubclass.shoot_all=Полный залп
actors.hero.herosubclass.shoot_all_short_desc=Нономи может выстрелить одновременно всеми патронами, заряженными в её пистолет.
actors.hero.herosubclass.shoot_all_desc=Нономи может выстрелить всеми патронами из заряженного оружия одновременно.\n\nПосле того, как все патроны будут выпущены, наступает эффект перегрева, который не позволяет переключать оружие или стрелять в течение определенного времени.\n\nВы можете включить/выключить режим стрельбы очередями с помощью дополнительных элементов управления.
actors.hero.herosubclass.spread_shot=Пора получить выговор~
actors.hero.herosubclass.spread_shot_short_desc=Нономи может стрелять из своего оружия по большой площади, нанося урон врагам в пределах широкого радиуса действия.
actors.hero.herosubclass.spread_shot_desc=Нономи может стрелять из своего оружия веером, нанося урон нескольким врагам одновременно.\n\nЧем дальше вы целитесь, тем уже становится угол поражения; и наоборот, чем больше пуль попадает в цель, тем шире становится угол поражения.

actors.hero.hero.nonomi_push=Нет!
actors.hero.hero.nonomi_spread_no_gun=Ой, я забыл взять пистолет. Его нужно сначала экипировать.

actors.hero.hero.nonomi_health_critical_1=Не могли бы вы немного отдохнуть в безопасном месте? Я немного устал...
actors.hero.hero.nonomi_health_critical_2=Я достиг предела...
actors.hero.hero.nonomi_health_critical_3=Ты в порядке? Мне кажется, я в небольшой опасности...

actors.hero.hero.nonomi_health_warn_1=Это может быть немного опасно...
actors.hero.hero.nonomi_health_warn_2=Я немного устал. Думаю, мне нужно время, чтобы восстановиться.
actors.hero.hero.nonomi_health_warn_3=Думаю, лучше не перенапрягаться.

actors.hero.hero.nonomi_die=Уф... Простите...

actors.hero.hero.nonomi_enemy_defeated_1=Пришло время наказания.
actors.hero.hero.nonomi_enemy_defeated_2=Хе-хе~ Это была лучшая битва~
actors.hero.hero.nonomi_enemy_defeated_3=Это было великолепное дирижирование!
actors.hero.hero.nonomi_enemy_defeated_4=Вы получили какие-либо травмы?
actors.hero.hero.nonomi_enemy_defeated_5=Это проще простого!

actors.hero.hero.nonomi_levelup_1=Потому что я развиваюсь прямо сейчас!
actors.hero.hero.nonomi_levelup_2=Хе-хе, это шаг вперед!
actors.hero.hero.nonomi_levelup_3=Я постараюсь лучше!
actors.hero.hero.nonomi_levelup_4=Я чувствую себя сильнее.
actors.hero.hero.nonomi_levelup_5=Хе-хе, я в отличной форме!
actors.hero.hero.nonomi_levelup_rare=Да, да. Власть — это палка о двух концах, но я думаю, она необходима вам и всем остальным. Я буду использовать её мудро, поэтому, пожалуйста, присматривайте за мной, Учитель.

actors.buffs.shootallbuff.action_name_off=Отключить полный залп
actors.buffs.shootallbuff.action_name_on=Активировать полный залп
actors.buffs.shootallbuff$overheat.name=Перегрев
actors.buffs.shootallbuff$overheat.desc=Оружие перегрелось. В перегретом состоянии невозможно стрелять, перезаряжать или менять оружие.\n\nОсталось ходов:%d .
actors.buffs.spreadshotbuff.action_name=Широкомасштабная стрельба

actors.hero.talent.nonomi_t1_1.title=Перерыв
actors.hero.talent.nonomi_t1_1.desc=_+1: Восстанавливает _3_ HP, если оставшееся HP составляет менее 40% во время еды.\n\n_+2: Восстанавливает _5_ HP, если оставшееся HP составляет менее 40% во время еды.
actors.hero.talent.nonomi_t1_2.title=Эксперт по пулеметам
actors.hero.talent.nonomi_t1_2.desc=_+1: Оценивает пулемет сразу после его установки.\n\n_+2: Оценивает пулемет сразу после его получения.
actors.hero.talent.nonomi_t1_3.title=Шоковая пуля
actors.hero.talent.nonomi_t1_3.desc=_+1:_ Урон от пули увеличивается на _+0-1_.\n\n_+2:_ Урон от пули увеличивается на _+1_.
actors.hero.talent.nonomi_t1_4.title=Остров безопасности
actors.hero.talent.nonomi_t1_4.desc=_+1: При перезарядке оружия получает щит, равный количеству ходов, необходимых для перезарядки.\n\n_+2: При перезарядке оружия получает щит, равный количеству ходов, необходимых для перезарядки + 1.

actors.hero.talent.nonomi_t2_1.title=Время пикника
actors.hero.talent.nonomi_t2_1.desc=_+1:_ Затрачивает всего 1 ход на прием пищи и _перезаряжает экипированное оружие без затрат хода_ во время еды.\n\n_+2:_ Затрачивает всего 1 ход на прием пищи и _перезаряжает экипированное оружие без затрат хода и заряжает 1 дополнительный патрон_ во время еды.
actors.hero.talent.nonomi_t2_2.title=Золотая карта
actors.hero.talent.nonomi_t2_2.desc=_+1:_ На все товары в магазине действует скидка _20%_.\n\n_+2:_ На все товары в магазине действует скидка _40%_.
actors.hero.talent.nonomi_t2_3.title=Популярный человек
actors.hero.talent.nonomi_t2_3.desc=_+1: Получаемый урон снижается на _5% за каждого врага в поле зрения.\n\n_+2: Получаемый урон снижается на _7,5% за каждого врага в поле зрения.
actors.hero.talent.nonomi_t2_4.title=Сюрприз
actors.hero.talent.nonomi_t2_4.desc=_+1: Урон от пуль увеличивается на _+1_ во время внезапных атак.\n\n_+2: Урон от пуль увеличивается на _+2_ во время внезапных атак.
actors.hero.talent.nonomi_t2_5.title=Нет!
actors.hero.talent.nonomi_t2_5.desc=_+1: При первом рукопашном ударе по врагу отбросьте его на _2 клетки_.\n\n_+2: При первом рукопашном ударе по врагу отбросьте его на _3 клетки_\n.\nЭта атака не может сбрасывать врагов со скал.

actors.hero.talent.nonomi_t3_1.title=Эксклюзивное оружие
actors.hero.talent.nonomi_t3_1.desc=_+1: Получите эксклюзивную MG Нономи.\n\n_+2: Уровень улучшения эксклюзивной MG Нономи увеличивается на +1.\n\n_+3: Уровень улучшения эксклюзивной MG Нономи увеличивается на +2.
actors.hero.talent.nonomi_t3_2.title=Автоматическая подача боеприпасов
actors.hero.talent.nonomi_t3_2.desc=_+1:_ Каждый ход существует _5%-ная вероятность того, что в экипированное оружие будет заряжен 1 патрон.\n\n_+2:_ Каждый ход существует _10%-ная вероятность того, что в экипированное оружие будет заряжен 1 патрон\n.\n_+3:_ Каждый ход существует _15%-ная вероятность того, что в экипированное оружие будет заряжен 1 патрон.

actors.hero.talent.nonomi_ex1_1.title=Расширенный журнал
actors.hero.talent.nonomi_ex1_1.desc=_+1: Количество ходов, необходимых для перезарядки, увеличивается на 1 ход, а максимальная емкость магазина установленного оружия увеличивается на _1 патрон_.\n\n_+2: Количество ходов, необходимых для перезарядки, увеличивается на 1 ход, а максимальная емкость магазина установленного оружия увеличивается на _2 патрона_.\n\n_+3: Количество ходов, необходимых для перезарядки, увеличивается на 1 ход, а максимальная емкость магазина установленного оружия увеличивается на _3 патрона_.
actors.hero.talent.nonomi_ex1_2.title=Охлаждающее решение
actors.hero.talent.nonomi_ex1_2.desc=_+1:_ При атаке врага в ближнем бою во время перегрева существует _33%_ вероятность сократить продолжительность перегрева на дополнительный 1 ход.\n\n_+2:_ При атаке врага в ближнем бою во время перегрева существует _67%_ вероятность сократить продолжительность перегрева на дополнительный 1 ход.\n\n_+3:_ При атаке врага в ближнем бою во время перегрева существует _100%_ вероятность сократить продолжительность перегрева на дополнительный 1 ход.
actors.hero.talent.nonomi_ex1_3.title=Теплопроводность
actors.hero.talent.nonomi_ex1_3.desc=_+1:_ При атаке врага в ближнем бою при перегреве существует _10%-ная длительности перегрева_ вероятность поджога врага.\n\n_+2:_ При атаке врага в ближнем бою при перегреве существует _10%-ная (длительности перегрева + 1) вероятность поджога врага.\n\n_+3:_ При атаке врага в ближнем бою при перегреве существует 20%-ная (длительности перегрева + 2) вероятность поджога врага.

actors.hero.talent.nonomi_ex2_1.title=Время уборки
actors.hero.talent.nonomi_ex2_1.desc=_+1:_ Базовый угол диапазона сектора увеличивается на _+10º_.\n\n_+2:_ Базовый угол диапазона сектора увеличивается на _+20º_.\n\n_+3:_ Базовый угол диапазона сектора увеличивается на _+30º_.
actors.hero.talent.nonomi_ex2_2.title=Проникающий огонь
actors.hero.talent.nonomi_ex2_2.desc=_+1:_ Способность имеет _20%_ шанс пробить стены и нанести урон.\n\n_+2:_ Способность имеет _40%_ шанс пробить стены и нанести урон.\n\n_+3:_ Способность имеет _60%_ шанс пробить стены и нанести урон.
actors.hero.talent.nonomi_ex2_3.title=Выстрелы с отталкиванием
actors.hero.talent.nonomi_ex2_3.desc=_+1: У врагов, пораженных этой способностью, есть _10%_ шанс быть отброшенными на 1 клетку назад.\n\n_+2: У врагов, пораженных этой способностью, есть _20%_ шанс быть отброшенными на 1 клетку назад.\n\n_+3: У врагов, пораженных этой способностью, есть _30%_ шанс быть отброшенными на 1 клетку назад.

actors.hero.talent.nonomi_armor1_1.title=Большой подарок
actors.hero.talent.nonomi_armor1_1.desc=_+1:_ Длительность действия очарования увеличивается на _+33%_.\n\n_+2:_ Длительность действия очарования увеличивается на _+67%_.\n\n_+3:_ Длительность действия очарования увеличивается на _+100%_.\n\n_+4:_ Длительность действия очарования увеличивается на _+133%_.
actors.hero.talent.nonomi_armor1_2.title=Я не могу оторвать от него глаз.
actors.hero.talent.nonomi_armor1_2.desc=_+1:_ способность накладывает дополнительное ослепление на _1 ход_.\n\n_+2:_ способность накладывает дополнительное ослепление на _2 хода_.\n\n_+3:_ способность накладывает дополнительное ослепление на _3 хода_.\n\n_+4:_ способность накладывает дополнительное ослепление на _4 хода_.
actors.hero.talent.nonomi_armor1_3.title=Завораживающий подарок
actors.hero.talent.nonomi_armor1_3.desc=_+1: У врагов, на которых действует эта способность, есть _2%-ный шанс стать союзниками.\n\n_+2: У врагов, на которых действует эта способность, есть _4%-ный шанс стать союзниками.\n\n_+3: У врагов, на которых действует эта способность, есть _6%-ный шанс стать союзниками.\n\n_+4: У врагов, на которых действует эта способность, есть _8%-ный шанс стать союзниками.

actors.hero.talent.nonomi_armor2_1.title=Карта для взрослых
actors.hero.talent.nonomi_armor2_1.desc=_+1:_ Стоимость нанесения урона в 1 кредит снижается на _5_.\n\n_+2:_ Стоимость нанесения урона в 1 кредит снижается на _10_.\n\n_+3:_ Стоимость нанесения урона в 1 кредит снижается на _15_.\n\n_+4:_ Стоимость нанесения урона в 1 кредит снижается на _20_.
actors.hero.talent.nonomi_armor2_2.title=Возврат инвестиций
actors.hero.talent.nonomi_armor2_2.desc=_+1: Победите врага, потратив _20 кредитов_.\n\n_+2: Победите врага, потратив _40 кредитов_.\n\n_+3: Победите врага, потратив _60 кредитов_.\n\n_+4: Победите врага, потратив _80 кредитов_.
actors.hero.talent.nonomi_armor2_3.title=Сияющее золото
actors.hero.talent.nonomi_armor2_3.desc=_+1: _1 ход_ эффекта свечения за каждый 1 кредит, потраченный способностью.\n\n_+2: _2 хода_ эффекта свечения за каждый 1 кредит, потраченный способностью.\n\n_+3: _3 хода_ эффекта свечения за каждый 1 кредит, потраченный способностью.\n\n_+4: _4 хода_ эффекта свечения за каждый 1 кредит, потраченный способностью.

actors.hero.talent.nonomi_armor3_1.title=Раствор подачи боеприпасов
actors.hero.talent.nonomi_armor3_1.desc=_+1: Автоматически перезаряжает 1 патрон каждые _8 ходов во время использования способности.\n\n_+2: Автоматически перезаряжает 1 патрон каждые _7 ходов во время использования способности.\n\n_+3: Автоматически перезаряжает 1 патрон каждые _6 ходов во время использования способности.\n\n_+4: Автоматически перезаряжает 1 патрон каждые _5 ходов во время использования способности.
actors.hero.talent.nonomi_armor3_2.title=Стабильная стрельба
actors.hero.talent.nonomi_armor3_2.desc=_+1: Точность стрельбы увеличивается на _20%_ при использовании способности.\n\n_+2: Точность стрельбы увеличивается на _40%_ при использовании способности.\n\n_+3: Точность стрельбы увеличивается на _80%_ при использовании способности.\n\n_+4: Точность стрельбы увеличивается на _80%_ при использовании способности.
actors.hero.talent.nonomi_armor3_3.title=Регулировка положения
actors.hero.talent.nonomi_armor3_3.desc=_+1: Если вы используете способность в течение _1 хода_ после её разблокировки, она расходует на 50% меньше энергии.\n\n_+2: Если вы используете способность в течение _2 ходов_ после её разблокировки, она расходует на 50% меньше энергии.\n\n_+3: Если вы используете способность в течение _3 ходов_ после её разблокировки, она расходует на 50% меньше энергии.\n\n_+4: Если вы используете способность в течение _4 ходов_ после её разблокировки, она расходует на 50% меньше энергии.

actors.hero.abilities.nonomi.present.name=Подарок для всех
actors.hero.abilities.nonomi.present.short_desc=Нономи может дарить подарки всем видимым врагам, предотвращая их нападение на короткое время.
actors.hero.abilities.nonomi.present.desc=Нономи может подарить подарок всем, кто находится в поле её зрения, наложив на них эффект очарования на 5 ходов, из-за чего они не смогут атаковать Нономи.
actors.hero.abilities.nonomi.blackcard.name=Черная карта
actors.hero.abilities.nonomi.blackcard.short_desc=Нономи может потратить все свои кредиты, чтобы наносить бронебойный урон всем врагам в поле своего зрения.
actors.hero.abilities.nonomi.blackcard.desc=Нономи может использовать силу Чёрной карты, чтобы потратить все свои кредиты и нанести 1 единицу урона, игнорирующего броню, всем врагам в поле её зрения за каждые 30 потраченных кредитов.
actors.hero.abilities.nonomi.blackcard.no_gold=У меня недостаточно кредитной истории!
actors.hero.abilities.nonomi.bipod.name=Установка сошек
actors.hero.abilities.nonomi.bipod.short_desc=Нономи может установить сошки и избежать траты хода на стрельбу из оружия, пока не выполнит другое действие.
actors.hero.abilities.nonomi.bipod.desc=Нономи может установить сошки для стрельбы из своего оружия со стабильной отдачей, пока не переместится, не перезарядит оружие или не совершит рукопашную атаку, при этом ей не потребуется ход для стрельбы.
actors.hero.abilities.nonomi.bipod$bipodbuff.name=Сошки
actors.hero.abilities.nonomi.bipod$bipodbuff.desc=Нономи развернула сошки и прочно закрепилась на местности\n.\nПока Нономи держит сошки развёрнутыми, она не будет тратить ход на стрельбу из своего оружия, пока не совершит рукопашную атаку или не переместится.
actors.hero.abilities.nonomi.bipod$bipodtracker.name=Регулировка положения
actors.hero.abilities.nonomi.bipod$bipodtracker.desc=Нономи регулирует положение сошек!\n\nУстановка сошек обратно теперь потребляет на 50%% единиц энергии меньше.\n\nОсталось оборотов:%s.



###Miyako Sentences
actors.hero.heroclass.miyako=Мияко
actors.hero.heroclass.miyako_desc_short=Я Мияко Цукиюки из отряда «Кролик» Специальной академии SRT. Учитель, пожалуйста, дайте мне указания.\n\nСложность: _Нормальная_
actors.hero.heroclass.miyako_desc=Мияко начинает игру с двуручным мечом, наносящим урон по большой площади и замедляющим врагов на короткое время.\n\nМияко искусно владеет пистолетами-пулеметами и использует на 1 единицу меньше Силы, чтобы обращаться с ними обычным способом.\n\nМияко также входит в подземелье с пистолетом-пулеметом 1-го уровня, тканевой формой, кожаной флягой и бархатным мешочком.\n\nМияко начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.miyako_unlock=Нономи разблокируется автоматически.

actors.hero.herosubclass.rabbit_squad=Кроличий взвод, вылет!
actors.hero.herosubclass.rabbit_squad_short_desc=Мияко может вести боевые действия при поддержке членов отряда «Кролик».
actors.hero.herosubclass.rabbit_squad_desc=Каждый раз, когда Мияко использует свою способность, она получает поддержку от членов отряда в порядке Саки, Мию и Моэ.\n\nСаки: Саки направляется на помощь Мияко в бою.\nБоевые возможности Саки зависят от боевых возможностей Мияко.\nПерезарядка: 250 ходов\n\nМию: Выпускает мощный SR-пулю в указанное место, не тратя ход.\nУрон зависит от характеристик оружия, которым вооружена Мияко.\nПерезарядка: 50 ходов\n\nМоэ: Выпускает 6 мощных снарядов в случайных местах в области 3x3 рядом с указанной позицией.\nУрон зависит от текущего уровня и уровня Мияко.\nПерезарядка: 100 ходов
actors.hero.herosubclass.support_drone=Вспомогательные ударные дроны
actors.hero.herosubclass.support_drone_short_desc=Каждый раз, когда Мияко побеждает врага, она получает _боевой дрон поддержки, помогающий в бою_.
actors.hero.herosubclass.support_drone_desc=Каждый раз, когда Мияко побеждает врага, она получает один дополнительный атакующий дрон, максимум 3. Каждый дрон наносит слабый электрический урон при попадании во врага\n.\nКаждый раз, когда Мияко получает удар, 1 дополнительный атакующий дрон уничтожается, уменьшая получаемый урон на 50%.

actors.hero.hero.miyako_health_critical_1=Состояние опасное. Необходима реабилитация.
actors.hero.hero.miyako_health_critical_2=Уф... это кажется опасным.
actors.hero.hero.miyako_health_critical_3=Я... в... порядке... Нет, я не в порядке...

actors.hero.hero.miyako_health_warn_1=Я плохо себя чувствую... Лучше всего найти место, где можно немного отдохнуть.
actors.hero.hero.miyako_health_warn_2=Ключ к успешному выполнению миссии — поддержание хорошей физической формы. Думаю, лучше всего будет немного отдохнуть.
actors.hero.hero.miyako_health_warn_3=Думаю, было бы неплохо уделить немного времени реорганизации.

actors.hero.hero.miyako_die=Миссия... провалена...

actors.hero.hero.miyako_enemy_defeated_1=Это бессмысленное сопротивление.
actors.hero.hero.miyako_enemy_defeated_2=Миссия ещё не завершена.
actors.hero.hero.miyako_enemy_defeated_3=Где следующий враг?
actors.hero.hero.miyako_enemy_defeated_4=Боевой доклад получен, все в порядке. Мы наступаем.
actors.hero.hero.miyako_enemy_defeated_5=Проверка эффективности лечения. Необходимо всегда сохранять бдительность.

actors.hero.hero.miyako_levelup_1=Мне кажется, оно стало еще сильнее.
actors.hero.hero.miyako_levelup_2=Это тоже... рост?
actors.hero.hero.miyako_levelup_3=Так что рост — это такое приятное явление.
actors.hero.hero.miyako_levelup_4=Я сделаю все возможное, чтобы оправдать ожидания.
actors.hero.hero.miyako_levelup_5=Я обязательно оправдаю ваши ожидания.
actors.hero.hero.miyako_levelup_rare=Это незнакомое место, но, кажется, я довольно неплохо адаптируюсь. Постепенно становится лучше.

actors.hero.talent.miyako_t1_1.title=Фугасная граната
actors.hero.talent.miyako_t1_1.desc=_+1: Урон от гранаты увеличивается на _2.\n\n_+2: Урон от гранаты увеличивается на _3.
actors.hero.talent.miyako_t1_2.title=Эксперт по пистолетам-пулеметам
actors.hero.talent.miyako_t1_2.desc=_+1: Немедленно оценивает пистолет-пулемет при _наличии_.\n\n_+2: Немедленно оценивает пистолет-пулемет при _получении_.
actors.hero.talent.miyako_t1_3.title=CQC
actors.hero.talent.miyako_t1_3.desc=_+1:_ Урон от огнестрельного оружия в ближнем бою увеличивается на _1_.\n\n_+2:_ Урон от огнестрельного оружия в ближнем бою увеличивается на _1-2_.
actors.hero.talent.miyako_t1_4.title=Операция по срыву
actors.hero.talent.miyako_t1_4.desc=_+1: При первом внезапном нападении на врага наложите _2 хода головокружения.\n\n_+2: При первом внезапном нападении на врага наложите _3 хода головокружения.

actors.hero.talent.miyako_t2_1.title=Боевые пайки
actors.hero.talent.miyako_t2_1.desc=_+1:_ Затрачивает всего 1 ход на прием пищи и получает щит, равный _10%_ от максимального запаса здоровья при приеме пищи.\n\n_+2:_ Затрачивает всего 1 ход на прием пищи и получает щит, равный _15%_ от максимального запаса здоровья при приеме пищи.
actors.hero.talent.miyako_t2_2.title=Боевые припасы
actors.hero.talent.miyako_t2_2.desc=_+1:_ Максимальная грузоподъемность гранаты увеличивается на 1.\n\n_+2:_ В дополнение к эффекту +1, максимальная грузоподъемность мины «Малый Клеймор» увеличивается на 1.
actors.hero.talent.miyako_t2_3.title=Полученная разведывательная информация
actors.hero.talent.miyako_t2_3.desc=_+1: Эффект «Взгляд разума» накладывается на врагов в радиусе _2 клеток.\n\n_+2: Эффект «Взгляд разума» накладывается на врагов в радиусе _3 клеток.
actors.hero.talent.miyako_t2_4.title=Тактический маневр
actors.hero.talent.miyako_t2_4.desc=_+1:_ При каждом уклонении от атаки существует _25%_ вероятность перезарядки 1 патрона в ваше экипированное оружие.\n\n_+2:_ При каждом уклонении от атаки существует _50%_ вероятность перезарядки 1 патрона в ваше экипированное оружие.
actors.hero.talent.miyako_t2_5.title=Оснащён специальными пуленепробиваемыми пластинами.
actors.hero.talent.miyako_t2_5.desc=_+1: Максимальное количество HP увеличивается на _10%.\n\n_+2: Максимальное количество HP увеличивается на _20%.

actors.hero.talent.miyako_t3_1.title=Высокий бросок
actors.hero.talent.miyako_t3_1.desc=_+1: Граната проходит сквозь персонажей в пределах 3 клеток.\n\n_+2: Граната проходит сквозь персонажей и двери в пределах 3 клеток.\n\n_+3: Граната проходит сквозь персонажей, двери и стены в пределах 3 клеток.
actors.hero.talent.miyako_t3_2.title=Кролик, открой!
actors.hero.talent.miyako_t3_2.desc=_+1: Использование малой мины-ловушки по двери разрушает дверь и увеличивает дальность и урон мины на _100%_.\n\n_+2: Использование малой мины-ловушки по двери разрушает дверь и увеличивает дальность и урон мины на _200%_.\n\n_+3: Использование малой мины-ловушки по двери разрушает дверь и увеличивает дальность и урон мины на _300%_.

actors.hero.talent.miyako_ex1_1.title=Быстрое резервное копирование
actors.hero.talent.miyako_ex1_1.desc=_+1:_ Время перезарядки Саки уменьшено на _50 ходов.\n\n_+2:_ Время перезарядки Саки уменьшено на _100 ходов\n.\n_+3:_ Время перезарядки Саки уменьшено на _150 ходов.
actors.hero.talent.miyako_ex1_2.title=Идеальный снайпер
actors.hero.talent.miyako_ex1_2.desc=_+1:_ Точность снайперской стрельбы Мию увеличивается на _+100%_.\n\n_+2:_ Точность снайперской стрельбы Мию увеличивается на _+300%_.\n\n_+3:_ Точность снайперской стрельбы Мию увеличивается на _+500%_.
actors.hero.talent.miyako_ex1_3.title=Неизбирательные бомбардировки
actors.hero.talent.miyako_ex1_3.desc=_+1:_ Количество снарядов для режима «Сфокусированный огонь» увеличивается на _+3 выстрела.\n\n_+2:_ Количество снарядов для режима «Сфокусированный огонь» увеличивается на _+6 выстрелов.\n\n_+3:_ Количество снарядов для режима «Сфокусированный огонь» увеличивается на _+9 выстрелов.

actors.hero.talent.miyako_ex2_1.title=Порт расширения
actors.hero.talent.miyako_ex2_1.desc=_+1: _20%-ный шанс активировать 2 дрона после уничтожения врага.\n\n_+2: В дополнение к эффекту _+1, существует _20%-ный шанс не потерять дрон при атаке врага.\n\n_+3: В дополнение к эффекту _2, максимальное количество активных дронов увеличивается на 1.
actors.hero.talent.miyako_ex2_2.title=Удар высоким напряжением
actors.hero.talent.miyako_ex2_2.desc=_+1: Максимальный урон от электрического разряда дрона увеличивается на _+0,5_.\n\n_+2: Максимальный урон от электрического разряда дрона увеличивается на _+1_.\n\n_+3: Максимальный урон от электрического разряда дрона увеличивается на _+1,5_.\n\nУрон с десятичными знаками наносится с указанной вероятностью.
actors.hero.talent.miyako_ex2_3.title=Разведка с помощью дронов
actors.hero.talent.miyako_ex2_3.desc=_+1: За каждый имеющийся у вас дрон вы получаете эффект «Проницательность» на врагов в радиусе +1 клетки от стен. Применяется до _1_.\n\n_+2: За каждый имеющийся у вас дрон вы получаете эффект «Проницательность» на врагов в радиусе +1 клетки от стен. Применяется до _2_.\n\n_+3: За каждый имеющийся у вас дрон вы получаете эффект «Проницательность» на врагов в радиусе +1 клетки от стен. Применяется до _3_.\n\nЭтот эффект суммируется с другими эффектами «Проницательности».

actors.hero.talent.miyako_armor1_1.title=Проволочная обвязка
actors.hero.talent.miyako_armor1_1.desc=_+1: Привязывает врага проволочным крюком на _1 ход_.\n\n_+2: Привязывает врага проволочным крюком на _2 хода_.\n\n_+3: Привязывает врага проволочным крюком на _3 хода_.\n\n_+4: Привязывает врага проволочным крюком на _4 хода_.
actors.hero.talent.miyako_armor1_2.title=Множество крючков
actors.hero.talent.miyako_armor1_2.desc=_+1: Если вы используете проволочный крюк в течение 3 ходов после предыдущего использования, он расходует на _10%_ меньше энергии.\n\n_+2: Если вы используете проволочный крюк в течение 3 ходов после предыдущего использования, он расходует на _19%_ меньше энергии.\n\n_+3: Если вы используете проволочный крюк в течение 3 ходов после предыдущего использования, он расходует на _27%_ меньше энергии.\n\n_+4: Если вы используете проволочный крюк в течение 3 ходов после предыдущего использования, он расходует на _34%_ меньше энергии.\n\nЭто не относится к использованию проволочного крюка, когда потребление энергии снижается благодаря этому свойству.
actors.hero.talent.miyako_armor1_3.title=Прикрепить
actors.hero.talent.miyako_armor1_3.desc=_+1: После притягивания врага точность попадания по ближайшим врагам увеличивается на +200% на _4 хода_.\n\n_+2: После притягивания врага точность попадания по ближайшим врагам увеличивается на +200% на _8 ходов_.\n\n_+3: После притягивания врага точность попадания по ближайшим врагам увеличивается на +200% на _12 ходов_.\n\n_+4: После притягивания врага точность попадания по ближайшим врагам увеличивается на +200% на _16 ходов_.

actors.hero.talent.miyako_armor2_1.title=Тренировка по лестнице
actors.hero.talent.miyako_armor2_1.desc=_+1: Расход топлива после посадки снижается на _20%.\n\n_+2: Расход топлива после посадки снижается на _40%.\n\n_+3: Расход топлива после посадки снижается на _60%.\n\n_+4: Расход топлива после посадки снижается на _80%.
actors.hero.talent.miyako_armor2_2.title=Стрельба во время нахождения на борту
actors.hero.talent.miyako_armor2_2.desc=_+1: При использовании способности существует _25%-ная вероятность_ выстрела из текущего оружия по всем врагам на пройденном пути.\n\n_+2: При использовании способности существует _50%-ная вероятность_ выстрела из текущего оружия по всем врагам на пройденном пути.\n\n_+3: При использовании способности существует _75%-ная вероятность_ выстрела из текущего оружия по всем врагам на пройденном пути.\n\n_+4: При использовании способности существует _100%-ная вероятность_ выстрела из текущего оружия по всем врагам на пройденном пути.
actors.hero.talent.miyako_armor2_3.title=Предварительные исследования
actors.hero.talent.miyako_armor2_3.desc=_+1: Энергетические затраты при раскрытии местоположения врага с помощью способности снижаются на _25%.\n\n_+2: Энергетические затраты при раскрытии местоположения врага с помощью способности снижаются на _50%.\n\n_+3: Энергетические затраты при раскрытии местоположения врага с помощью способности снижаются на _75%.\n\n_+4: Энергетические затраты при раскрытии местоположения врага с помощью способности снижаются на _100%.

actors.hero.talent.miyako_armor3_1.title=Бомбардировка напалмом
actors.hero.talent.miyako_armor3_1.desc=_+1: Огонь на месте бомбардировки сохраняется в течение _2 ходов_.\n\n_+2: Огонь на месте бомбардировки сохраняется в течение _4 ходов_.\n\n_+3: Огонь на месте бомбардировки сохраняется в течение _6 ходов_.\n\n_+4: Огонь на месте бомбардировки сохраняется в течение _8 ходов_.
actors.hero.talent.miyako_armor3_2.title=Сброс припасов
actors.hero.talent.miyako_armor3_2.desc=_+1: Использование способности дает _1 гранату_.\n\n_+2: Использование способности дает _1-2 гранаты_.\n\n_+3: Использование способности дает _2 гранаты_.\n\n_+4: Использование способности дает _2 гранаты и 1 небольшую мину-ловушку_.
actors.hero.talent.miyako_armor3_3.title=Противоядие в виде бомбы
actors.hero.talent.miyako_armor3_3.desc=_+1: Урон от взрыва увеличивается на _25%.\n\n_+2: Урон от взрыва увеличивается на _50%.\n\n_+3: Урон от взрыва увеличивается на _75%.\n\n_+4: Урон от взрыва увеличивается на _100%.

actors.hero.abilities.miyako.wirehook.name=Проволочный крючок
actors.hero.abilities.miyako.wirehook.short_desc=Мияко может использовать проволочный крюк, чтобы подтягивать врагов на расстоянии.
actors.hero.abilities.miyako.wirehook.desc=Мияко бросает проволочный крюк, притягивая врага на расстоянии прямо перед собой и одновременно нанося цели урон, наносящий ей 5 ходов.
actors.hero.abilities.miyako.wirehook.prompt=Выберите целевую аудиторию для привлечения.
actors.hero.abilities.miyako.wirehook.no_char=Здесь нечего привлекать.
actors.hero.abilities.miyako.wirehook.failed=Попытка промахнуться не удалась.
actors.hero.abilities.miyako.wirehook.cant_pull=Этот объект не может быть притянут.
actors.hero.abilities.miyako.wirehook.does_nothing=Ничего не произошло.
actors.hero.abilities.miyako.wirehook$pointblankshot.name=Прикрепить
actors.hero.abilities.miyako.wirehook$pointblankshot.desc=В настоящее время Мияко максимально сосредоточила внимание на ближайших целях, что позволяет ей поражать врагов в 3 раза точнее, находясь в непосредственной близости.\n\nОсталось ходов:%s.
actors.hero.abilities.miyako.helicopter.name=Вертолётная поддержка
actors.hero.abilities.miyako.helicopter.short_desc=Мияко может сесть в вертолет и добраться до нужного места.
actors.hero.abilities.miyako.helicopter.desc=Мияко запрашивает вертолетную транспортировку и садится в вертолет. Она прибывает в нужное место, не тратя ход, после чего тратит 5 ходов.\n\nЭто нельзя использовать в недоступных местах или запертых комнатах.\nЕсли она выбирает место вне своей линии зрения, где присутствует враг или другая цель, вместо перемещения она получает эффект «Взгляд разума» на эту цель на 3 хода и расходует свой заряд.
actors.hero.abilities.miyako.helicopter.cannot_reach=Вы не можете переехать в это место.
actors.hero.abilities.miyako.helicopter.already_char=Я не могу переместиться, потому что кто-то находится в этом месте.
actors.hero.abilities.miyako.closeairsupport.name=Запрос на непосредственную авиационную поддержку
actors.hero.abilities.miyako.closeairsupport.short_desc=Мияко может вызвать взрыв на всем пути к указанному месту.
actors.hero.abilities.miyako.closeairsupport.desc=Мияко запрашивает непосредственную авиационную поддержку и сбрасывает бомбы по прямой траектории от клетки перед собой до указанной точки.
actors.hero.abilities.miyako.closeairsupport.prompt=Выберите целевую точку
actors.hero.abilities.miyako.closeairsupport.does_nothing=В этом направлении нет точек для бомбардировок.

actors.hero.hero.miyako_summon_saki=Это Кролик 1, он запрашивает подкрепление.
actors.hero.hero.miyako_attack_saki=Это Кролик 1, атакует эту цель!
actors.hero.hero.miyako_attack_miyu=Это Кролик 1, я прошу прикрыть огонь.
actors.hero.hero.miyako_attack_moe=Это Кролик 1, запрашиваю массированный огонь!
actors.hero.hero.miyako_cannot_see=Вы не можете запросить прикрытие огнём из невидимых мест.
actors.hero.hero.miyako_no_char=Там нельзя запросить прикрытие огнём.

actors.buffs.rabbitsquadbuff.name=Отряд кроликов отправлен!
actors.buffs.rabbitsquadbuff.desc=Объяснение
actors.buffs.rabbitsquadbuff.no_space=Места нет.
actors.buffs.rabbitsquadbuff.no_action=В настоящий момент вы не можете обратиться за поддержкой.
actors.buffs.rabbitsquadbuff.action_name_summon=Запрос на подкрепление
actors.buffs.rabbitsquadbuff.action_name_snipe=Запрос снайпера
actors.buffs.rabbitsquadbuff.action_name_airsupport=Запрос на концентрированное насыщение
actors.buffs.rabbitsquadbuff.action_name=Запрос невозможен
actors.buffs.rabbitsquadbuff.saki_reloading=Перезарядка!
actors.buffs.rabbitsquadbuff.saki_react=Это Кролик 2. Сначала я проверю цель и изменю цель.
actors.buffs.rabbitsquadbuff.miyu=Мию
actors.buffs.rabbitsquadbuff.miyu_react=Привет, это Кролик 4. Я снайпер...!
actors.buffs.rabbitsquadbuff.moe=Мо
actors.buffs.rabbitsquadbuff.moe_react=Итак, давайте выложимся по полной?
actors.buffs.rabbitsquadbuff$saki.name=Саки
actors.buffs.rabbitsquadbuff$saki.desc=КРОЛИК 2, Сакида. Командир отряда Мияко приказала мне оказать поддержку, и я отправлен на задание.\n\nОружие: _%1$dПистолет-пулемет +_%2$d_\nЕмкость магазина: _%3$d/%4$d_\nКоличество ходов, необходимых для перезарядки: __%5$s_\n\nЯ буду автоматически атаковать любых угрожающих врагов в пределах моей видимости, но в первую очередь буду атаковать цели, которые атакует командир отряда Мияко.
actors.buffs.rabbitsquadbuff$sakicooldown.name=Время восстановления: Саки
actors.buffs.rabbitsquadbuff$sakicooldown.desc=Саки отступила с поля боя и восстанавливается.\n\nОсталось ходов: %s.
actors.buffs.rabbitsquadbuff$miyucooldown.name=Перезарядка: Мию
actors.buffs.rabbitsquadbuff$miyucooldown.desc=Мию недавно обеспечивала прикрытие огнём и готовится к следующему выстрелу.\n\nОсталось ходов: %s.
actors.buffs.rabbitsquadbuff$moecooldown.name=Перезарядка: Мо
actors.buffs.rabbitsquadbuff$moecooldown.desc=Мо недавно начал массированный обстрел и готовится к следующей атаке.\n\nОсталось ходов:%s .

actors.buffs.supportdrone.name=Вспомогательные ударные дроны
actors.buffs.supportdrone.desc=Вторичный атакующий дрон кружит вокруг Мияко и автоматически атакует врагов, которых атакует Мияко!\n\nДрон активируется по одному после поражения врага, а получение физического урона от врага снижает урон на 50%% и уничтожает один дрон.\n\nОставшиеся дроны: %d.

###Hoshino Sentences
actors.hero.heroclass.hoshino=Хошино
actors.hero.heroclass.hoshino_desc_short=Зевок. Давайте будем умеренными. Потому что самообладание – вот что действительно важно.\n\nСложность: Легкая
actors.hero.heroclass.hoshino_desc=Хосино начинает игру с щитом «Железный Хорус», который обеспечивает дополнительную защиту до момента перемещения. При использовании щита защита уменьшается, но эффект не исчезает при перемещении.\n\nХосино искусно владеет пистолетами и тратит на них на 1 меньше Силы, чтобы обращаться с ними обычным образом.\n\nХосино может зарядить на 1 дополнительный патрон больше при перезарядке полностью заряженного пистолета.\n\nХосино также входит в подземелье с пистолетом 1-го уровня, тканевой формой, кожаным кувшином для воды и бархатным мешочком.\n\nХосино начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.hoshino_unlock=Хосино разблокируется автоматически.

actors.hero.herosubclass.shield_bash=Заряд щита
actors.hero.herosubclass.shield_bash_short_desc=Используя щит, Хосино может совершить короткий рывок, чтобы нанести урон и отбросить врагов.
actors.hero.herosubclass.shield_bash_desc=Хошино может использовать «Заряд щита», чтобы переместиться на небольшое расстояние за 1 ход. Если после перемещения она столкнется с противником, она нанесет урон, равный защите её щита, и отбросит цель назад. После использования способности она деактивирует свой щит.\n\nПри использовании оружия, отличного от пистолета-пулемета:\nРасстояние перемещения: 1 клетка, Расстояние отбрасывания: 4 клетки\n\nПри использовании пистолета-пулемета:\nРасстояние перемещения: 3 клетки, Расстояние отбрасывания: 2 клетки
actors.hero.herosubclass.swift_movement=Быстрое движение
actors.hero.herosubclass.swift_movement_short_desc=Хосино может мгновенно переместиться в ближайшее место и оставить после себя остаточное изображение, чтобы сбить с толку врагов.
actors.hero.herosubclass.swift_movement_desc=Хосино может перемещаться в любое желаемое место в пределах 1 клетки, оставляя за собой остаточное изображение. Враги в первую очередь атакуют это изображение, и если оно будет атаковано, функция слежения за врагами в пределах прямой видимости будет отключена. Способность активируется повторно при перезарядке оружия.

actors.hero.hero.hoshino_health_critical_1=Хе-хе, я привык драться, но, похоже, мое тело не в лучшей форме.
actors.hero.hero.hoshino_health_critical_2=Эй, а может, сходим куда-нибудь и немного поспим?
actors.hero.hero.hoshino_health_critical_3=Эй, послушай. Мне кажется, ты со мной слишком грубо обращаешься. Так больше не делай.

actors.hero.hero.hoshino_health_warn_1=Ты разве не устал? Давай пойдем туда и немного поспим.
actors.hero.hero.hoshino_health_warn_2=Давай немного поспим перед тем, как идти, хорошо?
actors.hero.hero.hoshino_health_warn_3=Я устала~ Я хочу спать~ Давай отдохнем~

actors.hero.hero.hoshino_die=Я не хотел этого делать...

actors.hero.hero.hoshino_enemy_defeated_1=Это бесполезно
actors.hero.hero.hoshino_enemy_defeated_2=Ура! Победа, победа!
actors.hero.hero.hoshino_enemy_defeated_3=Это бесполезно!
actors.hero.hero.hoshino_enemy_defeated_4=Зевок~ Я легко победил.
actors.hero.hero.hoshino_enemy_defeated_5=Фу, это такая морока.

actors.hero.hero.hoshino_levelup_1=Уф, ты стал сильнее?
actors.hero.hero.hoshino_levelup_2=Да, это приятно~
actors.hero.hero.hoshino_levelup_3=Ха~ Я стал ещё сильнее?
actors.hero.hero.hoshino_levelup_4=Хе-хе~ Благодаря этому я стал ещё сильнее.
actors.hero.hero.hoshino_levelup_5=А? Неплохо.
actors.hero.hero.hoshino_levelup_rare=Хм. Возможно, всё не так уж плохо. Верите или нет, я становлюсь всё сильнее и сильнее.

actors.hero.hero.hoshino_too_far=Вам нужно переехать куда-нибудь поближе. Это место слишком далеко.
actors.hero.hero.hoshino_rooted=Мои ноги связаны, поэтому я не могу двигаться.
actors.hero.hero.hoshino_bad_location=Вы не можете туда переехать.
actors.hero.hero.hoshino_shield_cooldown=Я ещё не готов.

actors.hero.talent.hoshino_t1_1.title=Первая помощь
actors.hero.talent.hoshino_t1_1.desc=_+1: При падении HP ниже 25% в результате атаки мгновенно восстанавливается _4_ HP.\n\n_+2: При падении HP ниже 25% в результате атаки мгновенно восстанавливается _6_ HP.\n\nВремя восстановления — 50 ходов.
actors.hero.talent.hoshino_t1_2.title=Эксперт по дробовикам
actors.hero.talent.hoshino_t1_2.desc=_+1: Мгновенно оценивает SG при _ношении_ него.\n\n_+2: Мгновенно оценивает SG при _приобретении_ него.
actors.hero.talent.hoshino_t1_3.title=Легковооруженный
actors.hero.talent.hoshino_t1_3.desc=_+1:_ Максимальная защита брони 3-го уровня или ниже увеличивается на _2_.\n\n_+2:_ Максимальная защита брони 3-го уровня или ниже увеличивается на _3_.
actors.hero.talent.hoshino_t1_4.title=Навыки перезарядки патронов
actors.hero.talent.hoshino_t1_4.desc=_+1: Когда вы израсходуете все патроны и перезарядите оружие, вы получите _3_ щита.\n\n_+2: Когда вы израсходуете все патроны и перезарядите оружие, вы получите _5_ щита.

actors.hero.talent.hoshino_t2_1.title=Меня клонит в сон после еды...
actors.hero.talent.hoshino_t2_1.desc=_+1: Расходует всего 1 ход на прием пищи и дает _200_ ходов сонливости после еды.\n\n_+2: Расходует всего 1 ход на прием пищи и дает _125_ ходов сонливости после еды.\n\nНе обновляет длительность, если у вас уже есть сонливость.
actors.hero.talent.hoshino_t2_2.title=Глаза, которые видят мир насквозь
actors.hero.talent.hoshino_t2_2.desc=+1: При использовании Свитка поиск осуществляется в радиусе 8 клеток.\n\n+2: При использовании Свитка поиск осуществляется в радиусе 12 клеток.\n\nДиапазон поиска удваивается при использовании Свиток Улучшения, Свиток Преобразования или алхимических предметов, созданных с использованием этих Свиток в качестве материалов.\n\nДля алхимических предметов (например, заклинаний), дающих больше результатов, чем количество использованных Свиток, дальность поиска этой характеристики изменяется в зависимости от количества результатов.
actors.hero.talent.hoshino_t2_3.title=Глаза, которые видят правду насквозь
actors.hero.talent.hoshino_t2_3.desc=_+1: Все персонажи в радиусе _2 клеток_ получают эффект «Взгляд разума».\n\n_+2: Все персонажи в радиусе _3 клеток_ получают эффект «Взгляд разума».
actors.hero.talent.hoshino_t2_4.title=Разверните щит
actors.hero.talent.hoshino_t2_4.desc=_+1: При использовании щита для подавления беспорядков, прибавляется магическая защита, равная _50%_ от защиты щита.\n\n_+2: При использовании щита для подавления беспорядков, прибавляется магическая защита, равная _75%_ от защиты щита.
actors.hero.talent.hoshino_t2_5.title=Перехватите инициативу.
actors.hero.talent.hoshino_t2_5.desc=_+1: При убийстве врага урон от следующих _2_ пуль увеличивается на 1.\n\n_+2: При убийстве врага урон от следующих _3_ пуль увеличивается на 1.\n\nКоличество выстрелов не суммируется, но урон от пуль может суммироваться до 10.\nКоличество выстрелов, полученных при убийстве врага, уменьшается на 1.
actors.hero.talent$intimidatebonusdamagebuff.name=Увеличенный урон от пуль
actors.hero.talent$intimidatebonusdamagebuff.desc=Временно увеличивает урон от пуль, а длительность эффекта уменьшается с каждым попаданием пули во врага.\n\nУвеличение урона: %1$d.\nОставшееся количество:%2$d .

actors.hero.talent.hoshino_t3_1.title=Тактическое подавление
actors.hero.talent.hoshino_t3_1.desc=_+1: Следующая рукопашная атака по врагу, пораженному пулей, мгновенно убивает врага, у которого осталось _7%_ или меньше здоровья.\n\n_+2: Следующая рукопашная атака по врагу, пораженному пулей, мгновенно убивает врага, у которого осталось _13%_ или меньше здоровья.\n\n_+3: Следующая рукопашная атака по врагу, пораженному пулей, мгновенно убивает врага, у которого осталось _20%_ или меньше здоровья.
actors.hero.talent.hoshino_t3_2.title=Умение подавлять
actors.hero.talent.hoshino_t3_2.desc=_+1: Точность пули на ближней дистанции увеличивается на _50%.\n\n_+2: Точность пули на ближней дистанции увеличивается на _100%.\n\n_+3: Точность пули на ближней дистанции увеличивается на _150%.

actors.hero.talent.hoshino_ex1_1.title=Сильное воздействие
actors.hero.talent.hoshino_ex1_1.desc=_+1: Накладывает эффект «Ошеломление» на отброшенную цель на _2 хода и снижает её защиту на _1.\n\n_+2: Накладывает эффект «Ошеломление» на отброшенную цель на _4 хода и снижает её защиту на _2.\n\n_+3: Накладывает эффект «Ошеломление» на отброшенную цель на _6 ходов и снижает её защиту на _3.
actors.hero.talent.hoshino_ex1_2.title=Заморозить
actors.hero.talent.hoshino_ex1_2.desc=_+1:_ Удар щитом наносит на _50%_ больше урона, но вы также получаете _4-10_ урона.\n\n_+2:_ Удар щитом наносит на _100% больше урона, но вы также получаете _8-20_ урона.\n\n_+3:_ Удар щитом наносит на _150% больше урона, но вы также получаете _12-30_ урона.\n\nУрон, наносимый самому себе, можно уменьшить с помощью защиты.
actors.hero.talent.hoshino_ex1_3.title=Кратковременная концентрация
actors.hero.talent.hoshino_ex1_3.desc=_+1:_ Точность следующей физической атаки, нанесенной в течение 5 ходов после отталкивания врага с помощью «Заряда», увеличивается на _x2_.\n\n_+2:_ Точность следующей физической атаки, нанесенной в течение 5 ходов после отталкивания врага с помощью «Заряда», увеличивается на _x5_.\n\n_+3:_ Следующая физическая атака, нанесенная в течение 5 ходов после отталкивания врага с помощью «Заряда», _должна попасть в цель._

actors.hero.talent.hoshino_ex2_1.title=Тактическое отступление
actors.hero.talent.hoshino_ex2_1.desc=_+1: Если в поле зрения находится _4_ или более врагов, остаточное изображение получает 5 ходов невидимости при атаке.\n\n_+2: Если в поле зрения находится _3_ или более врагов, остаточное изображение получает 5 ходов невидимости при атаке.\n\n_+3: Если в поле зрения находится _2_ или более врагов, остаточное изображение получает 5 ходов невидимости при атаке.
actors.hero.talent.hoshino_ex2_2.title=Выявление слабости
actors.hero.talent.hoshino_ex2_2.desc=_+1: При атаке врага, атаковавшего остаточное изображение, если здоровье этого врага упадет ниже _13%_, немедленно уничтожьте его.\n\n_+2: При атаке врага, атаковавшего остаточное изображение, если здоровье этого врага упадет ниже _27%_, немедленно уничтожьте его.\n\n_+3: При атаке врага, атаковавшего остаточное изображение, если здоровье этого врага упадет ниже _40%_, немедленно уничтожьте его.
actors.hero.talent.hoshino_ex2_3.title=Ловушка
actors.hero.talent.hoshino_ex2_3.desc=_+1:_ При атаке остаточного изображения оно взрывается, нанося _3_ урона ближайшим врагам.\n\n_+2:_ При атаке остаточного изображения оно взрывается, нанося _5_ урона ближайшим врагам.\n\n_+3:_ При атаке остаточного изображения оно взрывается, нанося _7_ урона ближайшим врагам.\n\nСоюзники не получают этот урон.

actors.hero.talent.hoshino_armor1_1.title=Сильная движущая сила
actors.hero.talent.hoshino_armor1_1.desc=_+1: Дальность преследования увеличивается на _+1 клетку_, и преследование мгновенно убивает врагов, у которых на _5_ больше здоровья, чем порог мгновенного убийства.\n\n_+2: Дальность преследования увеличивается на _+2 клетки, и преследование мгновенно убивает врагов, у которых на _10_ больше здоровья, чем порог мгновенного убийства.\n\n_+3: Дальность преследования увеличивается на _+3 клетки, и преследование мгновенно убивает врагов, у которых на _15_ больше здоровья, чем порог мгновенного убийства.\n\n_+4: Дальность преследования увеличивается на _+4 клетки, и преследование мгновенно убивает врагов, у которых на _20_ больше здоровья, чем порог мгновенного убийства.
actors.hero.talent.hoshino_armor1_2.title=Толкание
actors.hero.talent.hoshino_armor1_2.desc=_+1: Если вам не удаётся убить врага во время погони, оттолкните цель на _2 клетки_ назад и получите _5_ щита.\n\n_+2: Если вам не удаётся убить врага во время погони, оттолкните цель на _4 клетки_ назад и получите _10_ щита.\n\n_+3: Если вам не удаётся убить врага во время погони, оттолкните цель на _6 клеток_ назад и получите _15_ щита.\n\n_+4: Если вам не удаётся убить врага во время погони, оттолкните цель на _8 клеток_ назад и получите _20_ щита.
actors.hero.talent.hoshino_armor1_3.title=Последовательные погони
actors.hero.talent.hoshino_armor1_3.desc=_+1: Если вы мгновенно убиваете врага с помощью «Преследования», следующее «Преследование» расходует на _13%_ меньше заряда.\n\n_+2: Если вы мгновенно убиваете врага с помощью «Преследования», следующее «Преследование» расходует на _25%_ меньше заряда.\n\n_+3: Если вы мгновенно убиваете врага с помощью «Преследования», следующее «Преследование» расходует на _38%_ меньше заряда.\n\n_+4: Если вы мгновенно убиваете врага с помощью «Преследования», следующее «Преследование» расходует на _50%_ меньше заряда.

actors.hero.talent.hoshino_armor2_1.title=Острые шипы
actors.hero.talent.hoshino_armor2_1.desc=_+1:_ Урон от кровотечения, наносимый Шипованным щитом, увеличивается на _25%_.\n\n_+2:_ Урон от кровотечения, наносимый Шипованным щитом, увеличивается на _50%_.\n\n_+3:_ Урон от кровотечения, наносимый Шипованным щитом, увеличивается на _75%_.\n\n_+4:_ Урон от кровотечения, наносимый Шипованным щитом, увеличивается на _100%_.
actors.hero.talent.hoshino_armor2_2.title=Сторожить
actors.hero.talent.hoshino_armor2_2.desc=_+1:_ Пока эффект Шипованного щита активен, защита, обеспечиваемая Щитом для подавления беспорядков, увеличивается на _+2_.\n\n_+2:_ Пока эффект Шипованного щита активен, защита, обеспечиваемая Щитом для подавления беспорядков, увеличивается на _+4_.\n\n_+3:_ Пока эффект Шипованного щита активен, защита, обеспечиваемая Щитом для подавления беспорядков, увеличивается на _+6_.\n\n_+4:_ Пока эффект Шипованного щита активен, защита, обеспечиваемая Щитом для подавления беспорядков, увеличивается на _+8_.
actors.hero.talent.hoshino_armor2_3.title=Быстрая подготовка
actors.hero.talent.hoshino_armor2_3.desc=_+1: При использовании способности, когда Щит находится на перезарядке, используйте на _10% меньше заряда и снимите перезарядку.\n\n_+2: При использовании способности, когда Щит находится на перезарядке, используйте на _19% меньше заряда и снимите перезарядку.\n\n_+3: При использовании способности, когда Щит находится на перезарядке, используйте на _27% меньше заряда и снимите перезарядку.\n\n_+4: При использовании способности, когда Щит находится на перезарядке, используйте на _33% меньше заряда и снимите перезарядку.

actors.hero.talent.hoshino_armor3_1.title=Амортизация
actors.hero.talent.hoshino_armor3_1.desc=_+1: Восстанавливает _2_ здоровья при каждом блокировании атаки.\n\n_+2: Восстанавливает _4_ здоровья при каждом блокировании атаки.\n\n_+3: Восстанавливает _6_ здоровья при каждом блокировании атаки.\n\n_+4: Восстанавливает _8_ здоровья при каждом блокировании атаки.
actors.hero.talent.hoshino_armor3_2.title=Отражение удара
actors.hero.talent.hoshino_armor3_2.desc=_+1: _25%_ шанс парализовать атакующего при блокировании атаки.\n\n_+2: _50%_ шанс парализовать атакующего при блокировании атаки.\n\n_+3: _75%_ шанс парализовать атакующего при блокировании атаки.\n\n_+4: _100%_ шанс парализовать атакующего при блокировании атаки.
actors.hero.talent.hoshino_armor3_3.title=Связанные действия
actors.hero.talent.hoshino_armor3_3.desc=_+1: Блокирование атаки заряжает _0,5_ дополнительных пуль.\n\n_+2: Блокирование атаки заряжает _1_ дополнительных пуль.\n\n_+3: Блокирование атаки заряжает _1,5_ дополнительных пуль.\n\n_+4: Блокирование атаки заряжает _2_ дополнительных пуль.\n\nДесятичные знаки используются в качестве вероятностей.

actors.hero.abilities.hoshino.chase.name=Преследование
actors.hero.abilities.hoshino.chase.short_desc=Хосино может совершить небольшой прыжок, чтобы атаковать выбранного противника.
actors.hero.abilities.hoshino.chase.desc=Хосино может использовать «Преследование», чтобы прыгнуть и атаковать врага в пределах 2 клеток. Если у врага 25% или меньше от его максимального запаса здоровья, он мгновенно погибает; в противном случае он наносит 20 урона, игнорируя защиту.
actors.hero.abilities.hoshino.chase.too_far=Это слишком далеко, чтобы использовать эту способность.
actors.hero.abilities.hoshino.spikeshield.name=Шипованное щит
actors.hero.abilities.hoshino.spikeshield.short_desc=Используя свой щит, Хосино может наносить врагам урон, вызывающий кровотечение, всякий раз, когда на неё нападают.
actors.hero.abilities.hoshino.spikeshield.desc=Хосино может использовать Шиповый щит, одновременно используя Подавляющий щит «Железный Хорус». Пока эффект щита активен, всякий раз, когда она получает физический урон от врага, она наносит урон от кровотечения, пропорциональный максимальному запасу здоровья атакующего.\n\nИспользование Шипового щита не занимает ход, и его эффект исчезает при деактивации щита.
actors.hero.abilities.hoshino.spikeshield.no_shield=Для использования этой способности необходимо иметь при себе противоударный щит «Железный Хорус»!
actors.hero.abilities.hoshino.spikeshield.already_active=Я уже использую свои способности.
actors.hero.abilities.hoshino.spikeshield$spikeshieldbuff.name=Шипованное щит
actors.hero.abilities.hoshino.spikeshield$spikeshieldbuff.desc=Хе-хе, опасно приближаться. Держитесь подальше.\n\nЯ прикрепил шипы к своему щиту, когда развертывал Железного Гора. Любой, кто на него нападет, получит немало урона.
actors.hero.abilities.hoshino.shieldparry.name=Отклонение щита
actors.hero.abilities.hoshino.shieldparry.short_desc=Хосино может блокировать все атаки в течение 1 хода, используя щит.
actors.hero.abilities.hoshino.shieldparry.desc=Хосино может использовать «Отражение щитом», используя щит «Железный Хорус», и блокировать все входящие атаки, не получая урона в течение 1 хода.
actors.hero.abilities.hoshino.shieldparry.no_shield=Для использования этой способности необходимо иметь при себе противоударный щит «Железный Хорус»!

###Shiroko Sentences
actors.hero.heroclass.shiroko=Сирокко
actors.hero.heroclass.shiroko_desc_short=Меня зовут Широко Сунаоками, я студентка 2 курса и член Комитета по противодействию Абидосу. Приятно познакомиться.\n\nСложность: _Нормальная_
actors.hero.heroclass.shiroko_desc=Сирокко начинает игру с велосипедом, который позволяет ей преодолевать определённое расстояние с удвоенной скоростью.\n\nСирокко владеет штурмовыми винтовками и использует на 1 меньше Силы, чтобы обращаться с ними обычным образом.\n\nСирокко использует разрывные пули, наносящие небольшой дополнительный урон, пропорциональный текущему уровню этажа, при попадании.\n\nСирокко также входит в подземелье со штурмовой винтовкой 1-го уровня, тканевой формой, кожаным кувшином для воды и бархатным мешочком.\nСирокко начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.shiroko_unlock=Устройство Sirocco разблокируется автоматически.

actors.hero.herosubclass.professional_riding=Профессиональная верховая езда
actors.hero.herosubclass.professional_riding_short_desc=Scirocco учится профессиональному вождению и может выполнять различные действия, используя заряд батареи во время езды на мотоцикле.
actors.hero.herosubclass.professional_riding_desc=Сирокко может использовать дополнительные заряды для выполнения различных действий во время езды на мотоцикле.\n\nСкольжение (10 зарядов): Тратит 1 ход на рывок на расстояние до 3 клеток. Может перепрыгивать через обрывы и поджигает пройденный путь на 2 хода, за исключением обрывов.\nПерезарядка во время езды (10 зарядов): Перезаряжает текущее оружие без затрат хода.\nУдар с отягощением (15 зарядов): Отталкивает ближайших врагов на 3 клетки назад.\nМгновенное ускорение (20 зарядов): Перемещается на следующую 1 клетку без затрат хода и получает 3 хода ускорения после перемещения.\nДрифт (20 зарядов): Спешивается без перезарядки и затрат хода, и утраивает скорость зарядки мотоцикла на следующие 20 ходов.
actors.hero.herosubclass.bank_robber=Ограбление банка
actors.hero.herosubclass.bank_robber_short_desc=Сирокко становится грабителем банка и вселяет страх во всех окружающих.
actors.hero.herosubclass.bank_robber_desc=Сирокко использует свою способность «Ограбление банка», чтобы израсходовать все заряженные патроны и наложить на всех видимых врагов эффект «Страх», пропорциональный уровню оружия и количеству использованных пуль. Чем выше уровень здоровья врага, тем меньше страха он испытывает, а полностью здоровые враги практически невосприимчивы к эффекту «Страх».\n\nЕсли эффект «Страх» накапливается в течение 20 ходов или более при использовании этого метода, он превращается в эффект «Ужас», длящийся 20 ходов; пораженный враг уронит свою добычу, убежит от вас и полностью исчезнет из подземелья.\n\nКаждый раз, когда Сирокко атакует врага, пораженного эффектом «Страх» или «Ужас», она извлекает золото в зависимости от нанесенного урона.


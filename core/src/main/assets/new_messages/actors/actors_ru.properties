actors.hero.talent.heroic_energy.desc=_+1:_ Стоимость использования способности брони ученика снижается на _12%.\n\n_+2:_ Стоимость использования способности брони ученика снижается на _23%.\n\n_+3:_ Стоимость использования способности брони ученика снижается на _32%.\n\n_+4:_ Стоимость использования способности брони ученика снижается на _40%.
actors.hero.abilities.ratmogrify.short_desc=Ученик может использовать «Крысиную мутацию», которая на короткое время превращает врага в мышь, лишенную каких-либо способностей!
actors.hero.abilities.ratmogrify.desc=Ученик превращает одного врага в крысу на 6 ходов! Боссы, союзники и крысы не могут быть превращены в крыс.\n\nВраги, превращенные в крыс, сохраняют свои первоначальные характеристики, но теряют все особые способности.
actors.buffs.revealedchar.desc=Цель была показана ученику и будет видна независимо от его местоположения.\n\nОсталось ходов:%s
actors.buffs.magicimmune.desc=Вся магия перестаёт действовать на вас, и вы невосприимчивы к любым магическим воздействиям. \n\nВ состоянии магической невосприимчивости вы не подвержены воздействию каких-либо вредных или полезных магических воздействий, включая проклятия, заклинания, волшебные палочки, книги заклинаний, кольца, реликвии и т. д. Способность «Униформа ученика» достаточно сильна, чтобы игнорировать этот эффект, поэтому её можно использовать.\n\nОсталось ходов магической невосприимчивости:%s
actors.buffs.magicalsleep.desc=Этот персонаж погрузился в глубокий магический сон и не может проснуться естественным образом.\n\nМагический сон не сильно отличается от обычного сна, но его можно пробудить только получив урон.\n\nМагический сон, наложенный на учеников и союзников, наделяется целительными свойствами, быстро восстанавливая их здоровье во время сна.
actors.buffs.drowsy.desc=Магическая сила расширяет разум цели, заставляя её через несколько ходов погрузиться в глубокий магический сон.\n\nУченик может противостоять сонливости при получении урона или когда его здоровье находится на максимальном уровне.\n\nОсталось ходов до засыпания:%s
actors.buffs.blindness.desc=Магическая сила расширяет разум цели, заставляя её через несколько ходов погрузиться в глубокий магический сон.\n\nУченик может противостоять сонливости при получении урона или когда его здоровье находится на максимальном уровне.\n\nОсталось ходов до засыпания:%s

###Aris sentences
actors.hero.heroclass.aris=Арис
actors.hero.heroclass.aris_desc_short=В какое приключение вы отправитесь сегодня? Арис готов отправиться с вами.\n\nУровень сложности: _Особый_
actors.hero.heroclass.aris_desc=Арис начинает игру с Эмблемой Тысячелетия, которая создает щит. Эта драгоценная эмблема, сокровище Ариса, может переноситься между различными формами, а также можно перенести 1 улучшение, прикрепленное к эмблеме.\n\nКак герой, исследующий подземелья, Арис использует оружие ближнего боя, а не огнестрельное. В подземельях можно найти оружие ближнего боя, не являющееся огнестрельным.\n\nАрис также входит в подземелье со Старым коротким мечом, Тремя метательными камнями, Мечом Света: Сверхновая, Тканевой формой, Кожаным ведром и Бархатным мешочком\n.\nАрис начинает игру со следующими оцененными предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.aris_unlock=Арис разблокируется автоматически.

actors.hero.herosubclass.light_hero=воин света
actors.hero.herosubclass.light_hero_short_desc=Арис, взявший на себя миссию Воина Света, получает возможность использовать Меч Света: Сверхновая в качестве оружия ближнего боя.
actors.hero.herosubclass.light_hero_desc=Приняв задание Героя Света, Арис получает возможность использовать Меч Света: Сверхновая в качестве оружия ближнего боя.
actors.hero.herosubclass.battery_charge=Зарядка аккумулятора!
actors.hero.herosubclass.battery_charge_short_desc=Каждый раз, когда Арис наносит удар в ближнем бою, она накапливает заряд «Сверхновой», что позволяет ей быстро подготовиться к следующему удару «Разрушителя баланса» или увеличить его урон.
actors.hero.herosubclass.battery_charge_desc=Арис получает 1 заряд Сверхновой каждый раз, когда наносит удар в ближнем бою\n\nЗаряды можно использовать во время перезарядки «Балансового прорыва», чтобы уменьшить время перезарядки на количество использованных зарядов, а использование «Балансового прорыва» при активных зарядах наносит дополнительно +1% урона за каждый накопленный заряд.


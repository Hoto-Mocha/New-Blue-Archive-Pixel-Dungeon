actors.hero.hero.shiroko_enemy_defeated_5=Давайте двигаться.

actors.hero.hero.shiroko_levelup_1=Мне кажется, я немного повзрослел.
actors.hero.hero.shiroko_levelup_2=Видно, что оно растёт.

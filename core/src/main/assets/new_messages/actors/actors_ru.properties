actors.hero.hero.shiroko_levelup_rare=Хм... Похоже, здесь нет банка... Как жаль.

actors.hero.hero.shiroko_bicycle_charged=Мое состояние полностью улучшилось.
actors.hero.hero.shiroko_ride_cooldown=Я сейчас не могу ездить на велосипеде.
actors.hero.hero.shiroko_cannot_ride=Мне нужен небольшой отдых, чтобы покататься на велосипеде.
actors.hero.hero.shiroko_no_charge=...Сейчас уже невозможно ездить на велосипеде.
actors.hero.hero.shiroko_dash_bad_position=Я не могу сделать это таким образом.
actors.hero.hero.shiroko_cannot_slam=Я не могу этого сделать.
actors.hero.hero.shiroko_rooted=...Я думаю, это не сработает, поскольку мои ноги связаны...
actors.hero.hero.shiroko_need_gun=Хм... для этого вам понадобится пистолет.
actors.hero.hero.shiroko_low_str=Оружие слишком тяжёлое.
actors.hero.hero.shiroko_no_ammo=У меня нет патронов для стрельбы...
actors.hero.hero.shiroko_cant_find_path=Хм... Думаю, выхода нет.
actors.hero.hero.shiroko_found_path=Я нашёл дорогу. Давайте следовать по ней.

actors.hero.talent.shiroko_t1_1.title=Короткий перерыв...
actors.hero.talent.shiroko_t1_1.desc=_+1: Восстанавливает _1_ единиц здоровья при еде.\n\n_+2: Восстанавливает _2_ единиц здоровья при еде.
actors.hero.talent.shiroko_t1_2.title=Эксперт по штурмовым винтовкам
actors.hero.talent.shiroko_t1_2.desc=_+1: Оценивает штурмовую винтовку сразу после её экипировки.\n\n_+2: Оценивает штурмовую винтовку сразу после её получения.
actors.hero.talent.shiroko_t1_3.title=Усиление взрывных пуль
actors.hero.talent.shiroko_t1_3.desc=_+1: Дополнительный урон от пули увеличивается на _1.\n\n_+2: Дополнительный урон от пули увеличивается на _2.
actors.hero.talent.shiroko_t1_4.title=Защитная обратная связь
actors.hero.talent.shiroko_t1_4.desc=_+1: Получите _5_ щита после победы над врагом.\n\n_+2: Получите _8_ щита после победы над врагом.

actors.hero.talent.shiroko_t2_1.title=Снова энергично
actors.hero.talent.shiroko_t2_1.desc=_+1:_ Затрачивает всего 1 ход на прием пищи и получает _2 хода ускорения при еде.\n\n_+2:_ Затрачивает всего 1 ход на прием пищи и получает _3 хода ускорения при еде.
actors.hero.talent.shiroko_t2_2.title=Энергетический напиток
actors.hero.talent.shiroko_t2_2.desc=_+1: Восстанавливает _20_ заряда велосипеда при использовании зелья.\n\n_+2: Восстанавливает _30_ заряда велосипеда при использовании зелья.\n\nЭффект заряда велосипеда удваивается при использовании зелья силы, зелья опыта или алхимического предмета, созданного с использованием этих зелий в качестве ингредиентов.\n\nДля алхимических предметов, дающих больше результатов, чем количество использованных зелий (например, водная смесь), величина заряда этого свойства варьируется в зависимости от количества результатов.
actors.hero.talent.shiroko_t2_3.title=Дикий инстинкт
actors.hero.talent.shiroko_t2_3.desc=_+1: Находясь на травяной клетке, все персонажи в радиусе _3_ клеток получают эффект «Взгляд разума».\n\n_+2: Находясь на травяной клетке, все персонажи в радиусе _5_ клеток получают эффект «Взгляд разума».
actors.hero.talent.shiroko_t2_4.title=Взлом замков?
actors.hero.talent.shiroko_t2_4.desc=_+1:_ Запертые двери можно открыть взрывом._\n\n_+2:_ В дополнение к эффекту +1, _открывает область 3x3 вокруг запертых дверей при первом входе на этаж._\n\nКристаллические двери не подвержены этому эффекту.
actors.hero.talent.shiroko_t2_5.title=Самогенерация
actors.hero.talent.shiroko_t2_5.desc=_+1:_ Каждый раз, когда вы едете на велосипеде, вы добавляете _0,05_ к заряду Волшебной палочки.\n\n_+2:_ Каждый раз, когда вы едете на велосипеде, вы добавляете _0,08_ к заряду Волшебной палочки.

actors.hero.talent.shiroko_t3_1.title=Идеальное чувство равновесия
actors.hero.talent.shiroko_t3_1.desc=_+1:_ Коррекция точности при езде на велосипеде изменяется с существующих -50% на _-25%_.\n\n_+2:_ Коррекция точности при езде на велосипеде изменяется с существующих -50% на _0%_.\n\n_+3:_ Коррекция точности при езде на велосипеде изменяется с существующих -50% на _+25%_.
actors.hero.talent.shiroko_t3_2.title=Отслеживающая пуля
actors.hero.talent.shiroko_t3_2.desc=_+1: Получите _10 ходов эффекта «Взгляд разума» на врагов, пораженных пулями.\n\n_+2: Получите _20 ходов эффекта «Взгляд разума» на врагов, пораженных пулями.\n\n_+3: Получите _30 ходов эффекта «Взгляд разума» на врагов, пораженных пулями.

actors.hero.talent.shiroko_ex1_1.title=Быстрая зарядка
actors.hero.talent.shiroko_ex1_1.desc=_+1: Скорость зарядки велосипеда увеличивается на _17%.\n\n_+2: Скорость зарядки велосипеда увеличивается на _33%.\n\n_+3: Скорость зарядки велосипеда увеличивается на _50%.
actors.hero.talent.shiroko_ex1_2.title=Послеобраз
actors.hero.talent.shiroko_ex1_2.desc=_+1: При езде на велосипеде уклонение увеличивается на _17%_ от дополнительной скорости передвижения.\n\n_+2: При езде на велосипеде уклонение увеличивается на _33%_ от дополнительной скорости передвижения.\n\n_+3: При езде на велосипеде уклонение увеличивается на _50%_ от дополнительной скорости передвижения.\n\nУклонение не уменьшается, если скорость передвижения ниже обычной.
actors.hero.talent.shiroko_ex1_3.title=Эко-драйв
actors.hero.talent.shiroko_ex1_3.desc=_+1:_ Профессиональные действия при езде потребляют на _17%_ меньше заряда.\n\n_+2:_ Профессиональные действия при езде потребляют на _33%_ меньше заряда.\n\n_+3:_ Профессиональные действия при езде потребляют на _50%_ меньше заряда.

actors.hero.talent.shiroko_ex2_1.title=Кризис с заложниками
actors.hero.talent.shiroko_ex2_1.desc=_+1: Когда в поле вашего зрения находятся 2 или более врагов, использование способности вблизи врага оглушает всех ближайших врагов и имеет _20%_ шанс мгновенно наложить эффект страха на врагов, уже находящихся под его воздействием.\n\n_+2: Когда в поле вашего зрения находятся 2 или более врагов, использование способности вблизи врага оглушает всех ближайших врагов и имеет _40%_ шанс мгновенно наложить эффект страха на врагов, уже находящихся под его воздействием.\n\n_+3: Когда в поле вашего зрения находятся 2 или более врагов, использование способности вблизи врага оглушает всех ближайших врагов и имеет _60%_ шанс мгновенно наложить эффект страха на врагов, уже находящихся под его воздействием.
actors.hero.talent.shiroko_ex2_2.title=Да. Отдайте всё, что у вас есть.
actors.hero.talent.shiroko_ex2_2.desc=_+1: Вероятность выпадения предмета из испуганного врага увеличивается на _33%.\n\n_+2: Вероятность выпадения предмета из испуганного врага увеличивается на _67%.\n\n_+3: Вероятность выпадения предмета из испуганного врага увеличивается на _100%.
actors.hero.talent.shiroko_ex2_3.title=Специалист по ограблениям
actors.hero.talent.shiroko_ex2_3.desc=_+1: При использовании способности в магазине Сора убегает, все предметы становятся бесплатными, и с вероятностью 100% призываются 4 члена отряда FOX.\n\n_+2: При использовании способности в магазине Сора убегает, все предметы становятся бесплатными, и с вероятностью 80% призываются 4 члена отряда FOX.\n\n_+3: При использовании способности в магазине Сора убегает, все предметы становятся бесплатными, и с вероятностью 60% призываются 4 члена отряда FOX.

actors.hero.talent.shiroko_armor1_1.title=Проникающие препятствия
actors.hero.talent.shiroko_armor1_1.desc=_+1:_ Точность пули увеличивается на _25%_ и может пробить _2_ слоя твердой поверхности.\n\n_+2:_ Точность пули увеличивается на _50%_ и может пробить _4_ слоя твердой поверхности.\n\n_+3:_ Точность пули увеличивается на _75%_ и может пробить _6_ слоя твердой поверхности.\n\n_+4:_ Точность пули увеличивается на _100%_ и может пробить _8_ слоя твердой поверхности.
actors.hero.talent.shiroko_armor1_2.title=Уничтожение брони
actors.hero.talent.shiroko_armor1_2.desc=_+1:_ Пуля имеет _25%_ шанс игнорировать защиту противника и накладывать эффект уязвимости на 10 ходов.\n\n_+2:_ Пуля имеет _50%_ шанс игнорировать защиту противника и накладывать эффект уязвимости на 10 ходов.\n\n_+3:_ Пуля имеет _75%_ шанс игнорировать защиту противника и накладывать эффект уязвимости на 10 ходов.\n\n_+4:_ Пуля имеет _100%_ шанс игнорировать защиту противника и накладывать эффект уязвимости на 10 ходов.
actors.hero.talent.shiroko_armor1_3.title=Многоэтапный удар
actors.hero.talent.shiroko_armor1_3.desc=_+1:_ Урон от пуль снижен на _45%_ и количество попаданий увеличено в 2 раза.\n\n_+2:_ Урон от пуль снижен на _60%_ и количество попаданий увеличено в 3 раза.\n\n_+3:_ Урон от пуль снижен на _68%_ и количество попаданий увеличено в 4 раза.\n\n_+4:_ Урон от пуль снижен на _72%_ и количество попаданий увеличено в 5 раз.

actors.hero.talent.shiroko_armor2_1.title=Мощная граната
actors.hero.talent.shiroko_armor2_1.desc=_+1: Урон от гранаты увеличивается на _25%, а длительность эффекта ослабления увеличивается на _30%.\n\n_+2: Урон от гранаты увеличивается на _50%, а длительность эффекта ослабления увеличивается на _50%.\n\n_+3: Урон от гранаты увеличивается на _75%, а длительность эффекта ослабления увеличивается на _80%.\n\n_+4: Урон от гранаты увеличивается на _100%, а длительность эффекта ослабления увеличивается на _100%.
actors.hero.talent.shiroko_armor2_2.title=Световая граната
actors.hero.talent.shiroko_armor2_2.desc=_+1: Граната ослепляет врагов с вероятностью _30%.\n\n_+2: Граната ослепляет врагов с вероятностью _60%.\n\n_+3: Граната ослепляет врагов с вероятностью _90%.\n\n_+4: Граната ослепляет и оглушает врагов с вероятностью _20%.
actors.hero.talent.shiroko_armor2_3.title=Умелые движения
actors.hero.talent.shiroko_armor2_3.desc=_+1: При использовании способности перезаряжается _1 патрон с _25%-ной вероятностью, не расходуя ход.\n\n_+2: При использовании способности перезаряжается _2 патрона с _50%-ной вероятностью, не расходуя ход.\n\n_+3: При использовании способности перезаряжается _3 патрона с _75%-ной вероятностью, не расходуя ход.\n\n_+4: При использовании способности перезаряжается _4 патрона с _100%-ной вероятностью, не расходуя ход.\n\nПатроны можно заряжать сверх максимальной вместимости магазина, но дополнительные патроны не будут заряжаться, если максимальная вместимость уже превышена.

actors.hero.talent.shiroko_armor3_1.title=Важный этап
actors.hero.talent.shiroko_armor3_1.desc=_+1: Если вы используете способность повторно, пока существует активный путь, вы мгновенно телепортируетесь в место, где вы впервые использовали способность. При использовании способности на пути расходуется на _30% меньше заряда.\n\n_+2: Если вы используете способность повторно, пока существует активный путь, вы мгновенно телепортируетесь в место, где вы впервые использовали способность. При использовании способности на пути расходуется на _51% меньше заряда.\n\n_+3: Если вы используете способность повторно, пока существует активный путь, вы мгновенно телепортируетесь в место, где вы впервые использовали способность. При использовании способности на пути расходуется на _66% меньше заряда.\n\n_+4: Если вы используете способность повторно, пока существует активный путь, вы мгновенно телепортируетесь в место, где вы впервые использовали способность. При использовании способности на пути расходуется на _76% меньше заряда.
actors.hero.talent.shiroko_armor3_2.title=Льготный период для отклонения от маршрута
actors.hero.talent.shiroko_armor3_2.desc=_+1: Длительность пути увеличивается на _25%.\n\n_+2: Длительность пути увеличивается на _50%.\n\n_+3: Длительность пути увеличивается на _75%.\n\n_+4: Длительность пути увеличивается на _100%.
actors.hero.talent.shiroko_armor3_3.title=Ярлык
actors.hero.talent.shiroko_armor3_3.desc=_+1: При использовании способности показывает местоположение _Зелья Силы_.\n\n_+2: В дополнение к эффекту +1, при использовании способности показывает местоположение _Свитка Улучшения_.\n\n_+3: В дополнение к эффекту +2, при использовании способности показывает местоположение _Зелья Опыта_.\n\n_+4: В дополнение к эффекту +3, при использовании способности показывает местоположение _Свитка Преобразования_.

actors.hero.abilities.shiroko.penetrationshot.name=Проникающий огонь
actors.hero.abilities.shiroko.penetrationshot.short_desc=Сирокко может выстрелить пулей, наносящей урон всем врагам на своем пути.
actors.hero.abilities.shiroko.penetrationshot.desc=Сирокко использует «Проникающий выстрел», чтобы произвести один выстрел из своего экипированного оружия в указанное место, нанося урон всем врагам на пути пули.\n\nДля использования «Проникающего выстрела» необходимо иметь при себе оружие и как минимум 1 заряженный патрон.
actors.hero.abilities.shiroko.penetrationshot.prompt=Выберите место запуска
actors.hero.abilities.shiroko.penetrationshot.need_gun=Для использования этой способности необходимо экипировать оружие!
actors.hero.abilities.shiroko.penetrationshot.no_rounds=У меня закончились патроны.
actors.hero.abilities.shiroko.weakeninggrenade.name=Ослабляющая граната
actors.hero.abilities.shiroko.weakeninggrenade.short_desc=Сирокко может бросить гранату в нужное место, чтобы нанести урон.
actors.hero.abilities.shiroko.weakeninggrenade.desc=Во время езды на велосипеде Сирокко бросает гранату в выбранное место, которая всегда попадает в цель, нанося мгновенный урон небольшой области и вызывая слабость на 10 ходов. Гранату можно бросить мимо врагов.
actors.hero.abilities.shiroko.weakeninggrenade.cannot_self=Думаю, лучше не бросать это в себя.
actors.hero.abilities.shiroko.gpsroute.name=GPS-маршрутный исследователь
actors.hero.abilities.shiroko.gpsroute.short_desc=Сирокко может найти самый быстрый путь на следующий этаж и очень быстро переместиться по нему.
actors.hero.abilities.shiroko.gpsroute.desc=Сирокко использует GPS-навигатор для поиска и определения самого быстрого пути от текущего местоположения до следующего этажа.\n\nПуть длится 8 ходов, и нахождение на нём не расходует время, позволяя двигаться в 3 раза быстрее.\n\nЭту способность нельзя использовать повторно, пока активен путь.
actors.hero.abilities.shiroko.gpsroute.already_active=Уже существует активный путь.
actors.hero.abilities.shiroko.gpsroute.cannot_use=Вы не можете этого сделать.
actors.hero.abilities.shiroko.gpsroute$routebuff.name=GPS-навигация по маршруту
actors.hero.abilities.shiroko.gpsroute$routebuff.desc=Да, этот путь, который вы видите сейчас, похоже, является кратчайшим маршрутом на следующий этаж.\n\nЕсли вы будете следовать по этому пути, вы сможете двигаться гораздо быстрее. Если вы переместитесь в другую область или слишком долго будете отклоняться от пути, найденный вами маршрут исчезнет.\n\nДумаю, можно спокойно отклониться примерно на _%s_поворотов.

###Noa Sentences
actors.hero.heroclass.noa=Ной
actors.hero.heroclass.noa_desc_short=Я Ушио Ноа, секретарь семинара. С нетерпением жду сотрудничества с вами, Учитель. ...во многих отношениях.\n\nСложность: _Нормальная_
actors.hero.heroclass.noa_desc=Ной начинает игру с комплектом для переоборудования, который крепится к огнестрельному оружию для повышения его характеристик. Комплекты можно переставлять между разными видами оружия, а также можно перенести 1 улучшение, прикрепленное к комплекту.\n\nНой искусен в обращении с высокоточными пистолетами и использует на 1 меньше Силы, чтобы справиться с ними обычным способом.\n\nБлагодаря быстрой реакции Ной может обыскивать большую территорию за один раз.\n\nНой также входит в подземелье с высокоточным пистолетом 1-го уровня, тканевой формой, кожаной флягой для воды и бархатным мешочком.\n\nНой начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.noa_unlock=Ной разблокируется автоматически.

actors.hero.herosubclass.double_barrel=Двустволка
actors.hero.herosubclass.double_barrel_short_desc=Ной может использовать HG в качестве дополнительного оружия и стрелять из него сразу после попадания в цель.
actors.hero.herosubclass.double_barrel_desc=Ной может использовать пистолет HG в качестве дополнительного оружия.\n\nПри попадании пули вы можете выстрелить из дополнительного оружия по цели, не тратя ход, нанося 67% урона.\n\nПерезарядка дополнительного оружия вручную отнимает 1 дополнительный ход.
actors.hero.herosubclass.conversation=Рациональный и разумный разговор
actors.hero.herosubclass.conversation_short_desc=Ной может наложить случайный негативный эффект на выбранного врага или превратить его в союзника.
actors.hero.herosubclass.conversation_desc=Ной может ослаблять врагов, обращаясь к указанной цели и накладывая один из следующих негативных эффектов: слепота, сонливость, очарование, безумие или головокружение. Длительность действия негативного эффекта увеличивается с повышением уровня Ноя, а использование этой способности на ослабленном враге может очаровать его и превратить в союзника.

actors.hero.hero.noa_health_critical_1=Это может быть немного опасно... Я не уверен...
actors.hero.hero.noa_health_critical_2=Я достиг предела...
actors.hero.hero.noa_health_critical_3=А как насчет того, чтобы немного отдохнуть...?

actors.hero.hero.noa_health_warn_1=У меня начинают заканчиваться силы.
actors.hero.hero.noa_health_warn_2=Мне не хватает выносливости. Стоит ли мне это тоже записать?..
actors.hero.hero.noa_health_warn_3=Думаю, в таком состоянии записывать будет сложно.

actors.hero.hero.noa_die=Возможно, я был немного самоуверен...

actors.hero.hero.noa_enemy_defeated_1=На этом пока остановимся?
actors.hero.hero.noa_enemy_defeated_2=Какие факторы могут нас ожидать в будущем?
actors.hero.hero.noa_enemy_defeated_3=Понятно... значит, в этом и заключалась слабость.
actors.hero.hero.noa_enemy_defeated_4=Необходимо время от времени двигаться!
actors.hero.hero.noa_enemy_defeated_5=Я быстро это пресеку.

actors.hero.hero.noa_levelup_1=Узнавать что-то новое всегда интересно.
actors.hero.hero.noa_levelup_2=Хе-хе, это может быть немного весело.
actors.hero.hero.noa_levelup_3=Не могу быть уверена, но... возможно, я немного подросла по сравнению с тем, что было раньше, хе-хе.
actors.hero.hero.noa_levelup_4=Хотя внешне он выглядит так же, на самом деле он стал довольно прочным.
actors.hero.hero.noa_levelup_5=Хе-хе, взросление всегда приносит удовольствие, как и следовало ожидать.
actors.hero.hero.noa_levelup_rare=Это чувство тоже неплохое. Надо бы это записать...

actors.hero.hero.noa_trap_discover=Я зафиксировал структуру и расположение всех ловушек на этом этаже.
actors.hero.hero.noa_secondwep_no_ammo=У нас закончились патроны!
actors.hero.hero.noa_no_charge=Сейчас мне нечего сказать.
actors.hero.hero.noa_cannot_see=Я не из тех чудаков, кто стал бы заводить разговор в подобном месте.
actors.hero.hero.noa_no_target=Мне нет смысла разглагольствовать в одиночку.
actors.hero.hero.noa_unavailable_target=На этого парня это не подействует.
actors.hero.hero.noa_unreachable_target=Мои слова не дойдут до того парня.
actors.hero.hero.noa_debuff_drowsy_1=Позвольте представить вам часть интересной статьи, которую я получил от Хибики-сан (она содержит некоторые сложные для понимания баллистические сведения)... О? Вы, должно быть, устали...
actors.hero.hero.noa_debuff_drowsy_2=Харе-сан прислал мне кое-что интересное о дронах (сложные для понимания вещи из области аэронавтики)... Может, уже пора спать? Хе-хе.
actors.hero.hero.noa_debuff_drowsy_3=Вот что произошло, когда я поговорил с Химари о хакинге — (сложный для понимания контент, связанный с хакингом)... Хм, ещё столько всего можно обсудить. Жаль...
actors.hero.hero.noa_debuff_charm_1=Тсс, идите сюда... ♡
actors.hero.hero.noa_debuff_charm_2=Если вы пройдете мимо, я расскажу вам забавную историю... ♡
actors.hero.hero.noa_debuff_charm_3=(Улыбки и подмигивания)
actors.hero.hero.noa_debuff_vertigo_1=А вы знали? На самом деле... (шокирующий контент)
actors.hero.hero.noa_debuff_vertigo_2=Нет, ну... (шокирующее содержание)
actors.hero.hero.noa_debuff_vertigo_3=Я слышал слух о (шокирующем содержании), это правда?
actors.hero.hero.noa_debuff_blindness_1=Давайте заглянем в будущее? Закройте глаза. Что вы видите?
actors.hero.hero.noa_debuff_blindness_2=В прошлый раз мы изучали гипноз. Хотите закрыть глаза? ...Хе-хе.
actors.hero.hero.noa_debuff_blindness_3=(Достает ручное зеркальце и начинает его двигать)
actors.hero.hero.noa_debuff_amok_1=Я где-то слышал, что у Муцуки есть атрибут "мегаки".
actors.hero.hero.noa_debuff_amok_2=(Спойлер к фильму «Видение будущего»)
actors.hero.hero.noa_debuff_amok_3=(Спойлер к фильму)
actors.hero.hero.noa_debuff_daze_1=Теперь я расскажу вам о прелестях Ариса. (Начинает перечислять 154 причины, почему Арис милый)
actors.hero.hero.noa_debuff_daze_2=Есть одно стихотворение, которое мне очень нравится. (Начинает читать стихотворение)
actors.hero.hero.noa_debuff_daze_3=Недавно я прочитал отрывок, который меня очень впечатлил... (начинает декламировать строчку из стихотворения)
actors.hero.hero.noa_cannot_self=Хе-хе, стрелять в себя не стоит.
actors.hero.hero.noa_supernova_1=Зарядка началась!
actors.hero.hero.noa_supernova_2=В свете этой решимости...
actors.hero.hero.noa_supernova_3=О, Свет!!!
actors.hero.hero.noa_supernova_shoot_1=...Стрельба! Баланс нарушен!
actors.hero.hero.noa_supernova_shoot_2=Ну вот и началось! Полное разрушение равновесия!
actors.hero.hero.noa_supernova_shoot_3=...Так ты это делаешь, Арис?

actors.hero.talent.noa_t1_1.title=Устройство поддержки атаки
actors.hero.talent.noa_t1_1.desc=_+1: Сила атаки ближнего боя оружия, оснащенного комплектом для модернизации, увеличивается на _1-2_.\n\n_+2: Сила атаки ближнего боя оружия, оснащенного комплектом для модернизации, увеличивается на _2_.
actors.hero.talent.noa_t1_2.title=Эксперт по автоматическим пистолетам
actors.hero.talent.noa_t1_2.desc=_+1: Немедленно оценивает HG при _оснащении_.\n\n_+2: Немедленно оценивает HG при _приобретении_.
actors.hero.talent.noa_t1_3.title=Нулевая регулировка
actors.hero.talent.noa_t1_3.desc=_+1:_ Если пуля промахнется, точность следующей пули увеличится на _+3_.\n\n_+2:_ Если пуля промахнется, точность следующей пули увеличится на _+5_.\n\nУвеличение точности суммируется и исчезает после попадания пули.
actors.hero.talent.noa_t1_4.title=Тщательная подготовка
actors.hero.talent.noa_t1_4.desc=_+1: Когда в магазине останется 0 патронов, вы получите _2_ щита.\n\n_+2: Когда в магазине останется 0 патронов, вы получите _3_ щита.

actors.hero.talent.noa_t2_1.title=Отдых тоже является частью работы.
actors.hero.talent.noa_t2_1.desc=_+1:_ На прием пищи уходит всего 1 ход, и после еды восстанавливается 1 HP каждый ход в течение _5 ходов_.\n\n_+2:_ На прием пищи уходит всего 1 ход, и после еды восстанавливается 1 HP каждый ход в течение _8 ходов_.
actors.hero.talent.noa_t2_2.title=Копировальная бумага
actors.hero.talent.noa_t2_2.desc=_+1: При использовании свитка существует _20%_ вероятность получения пустого свитка.\n\n_+2: При использовании свитка существует _30%_ вероятность получения пустого свитка.\n\nВероятность активации этого свойства увеличивается вдвое при использовании свитков улучшения, свитков трансформации или алхимических предметов, созданных с использованием этих свитков в качестве материалов.\n\nДля алхимических предметов (например, заклинаний), которые дают больше результатов, чем количество использованных свитков, вероятность активации этого свойства варьируется в зависимости от количества результатов.
actors.hero.talent.noa_t2_3.title=Умелое исследование
actors.hero.talent.noa_t2_3.desc=_+1:_ Диапазон поиска увеличивается до кругового диапазона 7x7.\n\n_+2:_ Диапазон поиска увеличивается до прямоугольного диапазона 7x7.
actors.hero.talent.noa_t2_4.title=Этап перезарядки
actors.hero.talent.noa_t2_4.desc=_+1: При перезарядке с пустым магазином вы можете пройти расстояние, равное _1 ходу, не тратя ход.\n\n_+2: При перезарядке с пустым магазином вы можете пройти расстояние, равное _2 ходам, не тратя ход.
actors.hero.talent.noa_t2_5.title=Понимание структуры
actors.hero.talent.noa_t2_5.desc=_+1: При входе на этаж существует _30%_ вероятность обнаружения ловушки и её местоположения.\n\n_+2: При входе на этаж существует _50%_ вероятность обнаружения ловушки и её местоположения.

actors.hero.talent.noa_t3_1.title=Идеальная точность
actors.hero.talent.noa_t3_1.desc=_+1:_ Если пуля попадает в цель, точность следующего выстрела увеличивается в 3 раза.\n\n_+2:_ Если пуля попадает в цель, точность следующего выстрела увеличивается в 5 раз.\n\n_+3:_ Если пуля попадает в цель, следующий выстрел _гарантирует_ попадание.
actors.hero.talent.noa_t3_2.title=Расширенный журнал
actors.hero.talent.noa_t3_2.desc=_+1:_ Максимальная емкость магазина оружия увеличивается на _+1 патрон.\n\n_+2:_ Максимальная емкость магазина оружия увеличивается на _+2 патрона.\n\n_+3:_ Максимальная емкость магазина оружия увеличивается на _+3 патрона.

actors.hero.talent.noa_ex1_1.title=Одновременная перезарядка
actors.hero.talent.noa_ex1_1.desc=_+1: Перезарядка основного оружия заряжает _1 патрон_ для дополнительного оружия.\n\n_+2: Перезарядка основного оружия заряжает _2 патрона_ для дополнительного оружия.\n\n_+3: Перезарядка основного оружия заряжает _3 патрона_ для дополнительного оружия.\n\nНевозможно зарядить больше максимальной емкости.
actors.hero.talent.noa_ex1_2.title=Двойное усиление
actors.hero.talent.noa_ex1_2.desc=_+1:_ Если уровень оружия с более высоким уровнем улучшения среди двух установленных орудий на _2 уровня_ или выше, чем у другого оружия, уровень улучшения оружия с более низким уровнем становится уровнем улучшения оружия с более высоким уровнем.\n\n_+2:_ Если уровень оружия с более высоким уровнем улучшения среди двух установленных орудий на _1 уровень_ или выше, чем у другого оружия, уровень улучшения оружия с более низким уровнем становится уровнем улучшения оружия с более высоким уровнем.\n\n_+3:_ Если уровень оружия с более высоким уровнем улучшения среди двух установленных орудий на _равно или выше_, чем у другого оружия, уровень улучшения оружия с более низким уровнем становится уровнем улучшения оружия с более высоким уровнем.
actors.hero.talent.noa_ex1_3.title=Быстрое реагирование
actors.hero.talent.noa_ex1_3.desc=_+1:_ При попадании в цель при рукопашной атаке _активируется способность_.\n\n_+2:_ В дополнение к эффекту +1, пули, выпущенные с помощью этой способности, гарантированно _попадают в ближайшего врага_.\n\n_+3:_ В дополнение к эффекту +2, убийство ближайшего врага перезаряжает все экипированное оружие. Эффекты не срабатывают при перезарядке.

actors.hero.talent.noa_ex2_1.title=Источник вдохновения
actors.hero.talent.noa_ex2_1.desc=_+1: Использование свитка или заклинания восстанавливает _2_ вашего заряда. Количество восстанавливаемого заряда зависит от используемого предмета.\n\n_+2: В дополнение к эффекту +1, использование рунного камня восстанавливает _1_ вашего заряда.\n\n_+3: В дополнение к эффекту +2, количество восстанавливаемого заряда увеличивается на _+50%.
actors.hero.talent.noa_ex2_2.title=Скорострельный
actors.hero.talent.noa_ex2_2.desc=_+1:_ Способность не расходует ход с вероятностью _33%_.\n\n_+2:_ Способность не расходует ход с вероятностью _67%_.\n\n_+3:_ Способность не расходует ход с вероятностью _100%_.
actors.hero.talent.noa_ex2_3.title=Умиротворение
actors.hero.talent.noa_ex2_3.desc=_+1: Враги, очарованные Ноем, восстанавливают _33%_ потерянного здоровья.\n\n_+2: Враги, очарованные Ноем, восстанавливают _67%_ потерянного здоровья.\n\n_+3: Враги, очарованные Ноем, восстанавливают _100%_ потерянного здоровья.

actors.hero.talent.noa_armor1_1.title=Нейтрализовать ловушки
actors.hero.talent.noa_armor1_1.desc=_+1: При обезвреживании ловушки обезвредьте до _2_ окружающих ловушек размером 3x3.\n\n_+2: При обезвреживании ловушки обезвредьте до _4_ окружающих ловушек размером 3x3.\n\n_+3: При обезвреживании ловушки обезвредьте до _6_ окружающих ловушек размером 3x3.\n\n_+4: При обезвреживании ловушки обезвредьте до _8_ окружающих ловушек размером 3x3.
actors.hero.talent.noa_armor1_2.title=Добавить взрывчатку
actors.hero.talent.noa_armor1_2.desc=_+1: Вызывает взрыв, наносящий _4-12_ урона в месте использования ловушки.\n\n_+2: Вызывает взрыв, наносящий _6-24_ урона в месте использования ловушки.\n\n_+3: Вызывает взрыв, наносящий _8-36_ урона в месте использования ловушки.\n\n_+4: Вызывает взрыв, наносящий _10-48_ урона в месте использования ловушки.
actors.hero.talent.noa_armor1_3.title=Навыки применения
actors.hero.talent.noa_armor1_3.desc=_+1:_ После использования ловушки существует _10%_ вероятность того, что вы сможете использовать эту ловушку снова.\n\n_+2:_ После использования ловушки существует _20%_ вероятность того, что вы сможете использовать эту ловушку снова.\n\n_+3:_ После использования ловушки существует _30%_ вероятность того, что вы сможете использовать эту ловушку снова.\n\n_+4:_ После использования ловушки существует _40%_ вероятность того, что вы сможете использовать эту ловушку снова.

actors.hero.talent.noa_armor2_1.title=Репликация голограмм
actors.hero.talent.noa_armor2_1.desc=_+1:_ Способность призывает 2 голограммы с вероятностью _25%_.\n\n_+2:_ Способность призывает 2 голограммы с вероятностью _50%_.\n\n_+3:_ Способность призывает 2 голограммы с вероятностью _75%_.\n\n_+4:_ Способность призывает 2 голограммы с вероятностью _100%_.
actors.hero.talent.noa_armor2_2.title=Материализация
actors.hero.talent.noa_armor2_2.desc=_+1:_ Голограмма получает щит 15 и защиту 1-4.\n\n_+2:_ Голограмма получает щит 30 и защиту 2-8.\n\n_+3:_ Голограмма получает щит 45 и защиту 3-12.\n\n_+4:_ Голограмма получает щит 60 и защиту 4-16.
actors.hero.talent.noa_armor2_3.title=Размытая форма
actors.hero.talent.noa_armor2_3.desc=_+1: Голограмма точно уклонится от первых _2_ атак.\n\n_+2: Голограмма точно уклонится от первых _4_ атак.\n\n_+3: Голограмма точно уклонится от первых _6_ атак.\n\n_+4: Голограмма точно уклонится от первых _8 атак.

actors.hero.talent.noa_armor3_1.title=О, свет!
actors.hero.talent.noa_armor3_1.desc=_+1: Получите _50 ходов свечения при использовании способности.\n\n_+2: Получите _100 ходов свечения при использовании способности.\n\n_+3: Получите _150 ходов свечения при использовании способности.\n\n_+4: Получите _200 ходов свечения при использовании способности.
actors.hero.talent.noa_armor3_2.title=Увеличьте производительность
actors.hero.talent.noa_armor3_2.desc=_+1:_ Урон от способностей увеличивается на _25%.\n\n_+2:_ Урон от способностей увеличивается на _50%.\n\n_+3:_ Урон от способностей увеличивается на _75%.\n\n_+4:_ Урон от способностей увеличивается на _100%.
actors.hero.talent.noa_armor3_3.title=Переработка энергии
actors.hero.talent.noa_armor3_3.desc=_+1: Использует на 10% меньше заряда для применения способности в течение 5 ходов после её использования.\n\n_+2: Использует на 19% меньше заряда для применения способности в течение 5 ходов после её использования.\n\n_+3: Использует на 27% меньше заряда для применения способности в течение 5 ходов после её использования.\n\n_+4: Использует на 34% меньше заряда для применения способности в течение 5 ходов после её использования.

actors.hero.abilities.noa.trapduplicate.name=Репликация механизма
actors.hero.abilities.noa.trapduplicate.short_desc=Ной может обезвредить ловушку и использовать её в нужном месте.
actors.hero.abilities.noa.trapduplicate.desc=Ной может обезвреживать ловушки, находящиеся в поле его зрения, и использовать их в указанных местах. При использовании ловушки, если он выбирает собственное местоположение, он убирает спрятанную ловушку, и расходует ходы и заряды только при обезвреживании ловушки.
actors.hero.abilities.noa.trapduplicate.out_of_view=Места, находящиеся вне поля зрения, выбрать нельзя.
actors.hero.abilities.noa.trapduplicate.no_trap=Ловушек нет.
actors.hero.abilities.noa.trapduplicate.trap_preserved=Ловушка сохранилась!
actors.hero.abilities.noa.trapduplicate.trap_removed=Ловушка была убрана.
actors.hero.abilities.noa.hologram.name=Вызов голограммы
actors.hero.abilities.noa.hologram.short_desc=Ной может вызвать голограмму, которая воспроизводит и стреляет из имеющегося у него оружия.
actors.hero.abilities.noa.hologram.desc=Ной может вызвать голограмму, которая наносит урон пулями из имеющегося у него оружия. Голограмма также может совершать атаки на расстоянии.
actors.hero.abilities.noa.hologram.no_space=Нет места для вызова голограммы.
actors.hero.abilities.noa.hologram$hologramimage.name=Голографическое изображение
actors.hero.abilities.noa.hologram$hologramimage.desc=Эта голограмма — точная копия вашей внешности. Пока она не исчезнет, ​​голограмма наносит урон, равный урону от пуль вашего экипированного оружия, но обладает низкой прочностью.\n\nУрон голограммы — это произведение урона от пуль вашего экипированного оружия и количества попаданий этих пуль.
actors.hero.abilities.noa.supernovabeam.name=Арис, можешь ненадолго мне его одолжить?
actors.hero.abilities.noa.supernovabeam.short_desc=Ной может использовать Меч Света Ариса: Сверхновая.
actors.hero.abilities.noa.supernovabeam.desc=Ной может на мгновение одолжить и применить у Ариса «Световой меч: Сверхновая». «Световой меч: Сверхновая» наносит _20-100_ урона всем врагам на прямой линии в пределах 12 клеток.

###Miyu Sentences
actors.hero.heroclass.miyu=Мию
actors.hero.heroclass.miyu_desc_short=Я Касумидзава Мию из отряда «Кролик» в Специальной академии SRT… Эм… мне не стоит сейчас возвращаться… верно…?\n\nСложность: _Сложный_
actors.hero.heroclass.miyu_desc=Мию начинает игру с устройством невидимости, которое отвлекает преследующих её врагов.\n\nМию хорошо справляется с SR-заклинаниями и тратит на 1 меньше Силы, чтобы справиться с ними обычным способом.\n\nМию редко видят враги, и этот эффект усиливается по мере повышения её уровня. Она также не топчет заросшую траву.\n\nМию также входит в подземелье с SR-заклинанием 1-го уровня, 3 метательными кинжалами, тканевой формой, кожаным кувшином для воды и бархатным мешочком.\n\nМию начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.miyu_unlock=Мию разблокируется автоматически.

actors.hero.herosubclass.telescope=Наблюдение с помощью бинокля
actors.hero.herosubclass.telescope_short_desc=Мию может видеть узкую область вокруг обозначенного места и стрелять оттуда, игнорируя препятствия.
actors.hero.herosubclass.telescope_desc=Мию использует свою способность, чтобы открыть область размером 3x3 клетки вокруг указанного места на 10 ходов. Если она стреляет из своего оружия в это место, она совершает снайперский выстрел. Снайперский выстрел производит пулю из имеющегося у неё оружия, игнорирует препятствия и всегда достигает указанного места.
actors.hero.herosubclass.camouflage=Камуфляж для буша
actors.hero.herosubclass.camouflage_short_desc=Мию может видеть сквозь высокую траву, заслонять обзор врагам мусорным ведром и становиться гораздо менее заметной для противников.
actors.hero.herosubclass.camouflage_desc=Мию может видеть поверх высокой травы, а использование мусорного ведра позволяет размещать обрывки травы на ближайших пустых клетках, блокируя обзор противника. Кроме того, она получает дополнительный уровень/3 скрытности в дополнение к своим существующим 2 уровням скрытности.

actors.hero.hero.miyu_health_critical_1=Уф... становится немного рискованно.
actors.hero.hero.miyu_health_critical_2=Если бы я был снайпером, этого было бы достаточно... но...
actors.hero.hero.miyu_health_critical_3=Возможно, я достиг предела своих возможностей...

actors.hero.hero.miyu_health_warn_1=Ой... А вот это уже нормально...
actors.hero.hero.miyu_health_warn_2=Я немного поранился...
actors.hero.hero.miyu_health_warn_3=Мне бы хотелось спрятаться и немного отдохнуть...

actors.hero.hero.miyu_die=Мне это не нравится... Извините...

actors.hero.hero.miyu_enemy_defeated_1=Я пойду дальше.
actors.hero.hero.miyu_enemy_defeated_2=Я изменю свою позицию.
actors.hero.hero.miyu_enemy_defeated_3=Такое ощущение, что враги меня видят, но проходят мимо... Наверное, это просто мое воображение?
actors.hero.hero.miyu_enemy_defeated_4=Подтвердите нейтрализацию цели.
actors.hero.hero.miyu_enemy_defeated_5=Лечение подтверждено. Отклонений от нормы нет.

actors.hero.hero.miyu_levelup_1=Моё понимание тактики углубилось.
actors.hero.hero.miyu_levelup_2=По крайней мере, я сделаю все возможное, чтобы имя SRT не было опозорено...
actors.hero.hero.miyu_levelup_3=Я буду усердно работать над своим развитием... чтобы никого не сдерживать.
actors.hero.hero.miyu_levelup_4=Я всё делаю правильно...?
actors.hero.hero.miyu_levelup_5=Чувствую себя сильнее...
actors.hero.hero.miyu_levelup_rare=Как бы мне хотелось выпить чашечку горячего какао...

actors.hero.hero.miyu_bin_use_1=Я проведу операцию по дезорганизации.
actors.hero.hero.miyu_bin_use_2=Нарушает вражеское слежение...
actors.hero.hero.miyu_bin_use_3=Они... они ушли...?
actors.hero.hero.miyu_bin_cooldown=...пока не может быть использовано...
actors.hero.hero.miyu_cannot_see_wall=Я думаю, это место не подойдёт...
actors.hero.hero.miyu_need_gun=У вас должно быть при себе оружие.
actors.hero.hero.miyu_already_got=У меня уже есть один, которым я пользовался.
actors.hero.hero.miyu_switching_new=Оснащён системой RABBIT 4 и противотанковой системой SR.
actors.hero.hero.miyu_switching_original=RABBIT 4, использована винтовка. Я разблокирую...

actors.hero.talent.miyu_t1_1.title=Боевые пайки
actors.hero.talent.miyu_t1_1.desc=_+1:_ На следующих нескольких этажах, которые вы исследуете, вы сможете найти до _4_ сухарей, спрятанных в ящике.\n\n_+2:_ На следующих нескольких этажах, которые вы исследуете, вы сможете найти до _6_ сухарей, спрятанных в ящике.
actors.hero.talent.miyu_t1_2.title=Эксперт по снайперским винтовкам
actors.hero.talent.miyu_t1_2.desc=_+1: Оценивает SR-персонаж сразу после его экипировки.\n\n_+2: Оценивает SR-персонаж сразу после его получения.
actors.hero.talent.miyu_t1_3.title=Неожиданный пожар
actors.hero.talent.miyu_t1_3.desc=_+1:_ Первый выстрел, попавший во врага, наносит _2 дополнительного урона_.\n\n_+2:_ Первый выстрел, попавший во врага, наносит _3 дополнительного урона_.
actors.hero.talent.miyu_t1_4.title=Друзья природы
actors.hero.talent.miyu_t1_4.desc=_+1: Наступив на высокую траву, вы получаете _2_ щита.\n\n_+2: Наступив на высокую траву, вы получаете _3_ щита.

actors.hero.talent.miyu_t2_1.title=Одинокая трапеза
actors.hero.talent.miyu_t2_1.desc=_+1:_ Затрачивает всего 1 ход на еду и дарует _5 ходов невидимости во время еды.\n\n_+2:_ Затрачивает всего 1 ход на еду и дарует _8 ходов невидимости во время еды.\n\nСухари становятся съедобными немедленно.
actors.hero.talent.miyu_t2_2.title=Полив травы
actors.hero.talent.miyu_t2_2.desc=_+1: После того, как Мию выпьет или бросит зелье, смесь или эликсир, она создаст в окружающей области лужу размером до _4 клеток_ и свяжет ближайших врагов на _1 ход_.\n\n_+2: После того, как Мию выпьет или бросит зелье, смесь или эликсир, она создаст в окружающей области лужу размером до _6 клеток_ и свяжет ближайших врагов на _2 хода_.\n\nКоличество луж и длительность связывания удваиваются при использовании зелья силы, зелья опыта или алхимического предмета, созданного с использованием этих зелий в качестве ингредиентов.\n\nДля алхимических предметов, дающих больше результатов, чем количество использованных зелий (например, водная смесь), вероятность активации этого свойства зависит от количества результатов.
actors.hero.talent.miyu_t2_3.title=Технология маскировки
actors.hero.talent.miyu_t2_3.desc=_+1: Наступив на высокую траву, вы получаете _2 хода невидимости.\n\n_+2: Наступив на высокую траву, вы получаете _3 хода невидимости.
actors.hero.talent.miyu_t2_4.title=Отступите после снайперского выстрела.
actors.hero.talent.miyu_t2_4.desc=_+1: Если вы убиваете врага пулей, вы можете немедленно переместиться на _3 хода.\n\n_+2: Если вы убиваете врага пулей, вы можете немедленно переместиться на _5 ходов.
actors.hero.talent.miyu_t2_5.title=Приглушение
actors.hero.talent.miyu_t2_5.desc=_+1:_ Существует _50%_ вероятность того, что при выстреле из оружия не будет издаваться звуков прицеливания противника.\n\n_+2:_ Существует _100%_ вероятность того, что при выстреле из оружия не будет издаваться звуков прицеливания противника.

actors.hero.talent.miyu_t3_1.title=Смертельная пуля
actors.hero.talent.miyu_t3_1.desc=_+1:_ Минимальный урон от пуль, поражающих врагов из засады, увеличивается на _25%_ от разницы между максимальным и минимальным уроном.\n\n_+2:_ Минимальный урон от пуль, поражающих врагов из засады, увеличивается на _33%_ от разницы между максимальным и минимальным уроном.\n\n_+3:_ Минимальный урон от пуль, поражающих врагов из засады, увеличивается на _50%_ от разницы между максимальным и минимальным уроном.
actors.hero.talent.miyu_t3_2.title=Тип человека, который чувствует себя комфортно в одиночестве.
actors.hero.talent.miyu_t3_2.desc=_+1:_ Если враги не замечают Мию, уровень улучшения экипированного оружия увеличивается на _+1_.\n\n_+2:_ Если враги не замечают Мию, уровень улучшения экипированного оружия увеличивается на _+2_.\n\n_+3:_ Если враги не замечают Мию, уровень улучшения экипированного оружия увеличивается на _+3_.

actors.hero.talent.miyu_ex1_1.title=Замедленная съемка
actors.hero.talent.miyu_ex1_1.desc=+1: При использовании способности, если враг в пределах досягаемости находится на расстоянии _9 клеток_ или более от Мию, наложите на этого врага эффект замедления на 3 хода.\n\n+2: При использовании способности, если враг в пределах досягаемости находится на расстоянии _6 клеток_ или более от Мию, наложите на этого врага эффект замедления на 3 хода.\n\n+3: При использовании способности, если враг в пределах досягаемости находится на расстоянии _3 клеток_ или более от Мию, наложите на этого врага эффект замедления на 3 хода.
actors.hero.talent.miyu_ex1_2.title=Оптический прицел
actors.hero.talent.miyu_ex1_2.desc=_+1:_ Базовое зрение Мию увеличивается на _25%_.\n\n_+2:_ Базовое зрение Мию увеличивается на _50%_.\n\n_+3:_ Базовое зрение Мию увеличивается на _75%_.
actors.hero.talent.miyu_ex1_3.title=Готов к броску
actors.hero.talent.miyu_ex1_3.desc=_+1: При использовании способности в экипированное оружие заряжается 1 патрон.\n\n_+2: При использовании способности в экипированное оружие заряжается 2 патрона.\n\n_+3: При использовании способности в экипированное оружие заряжается 3 патрона.\n\nВы можете заряжать оружие сверх максимальной емкости магазина.

actors.hero.talent.miyu_ex2_1.title=Мне нужно быстро спрятаться...!
actors.hero.talent.miyu_ex2_1.desc=_+1: 33%-ный шанс немедленно использовать «Дезинтегратор» после победы над врагом.\n\n_+2: 67%-ный шанс немедленно использовать «Дезинтегратор» после победы над врагом.\n\n_+3: 100%-ный шанс немедленно использовать «Дезинтегратор» после победы над врагом.
actors.hero.talent.miyu_ex2_2.title=Идеальная маскировка
actors.hero.talent.miyu_ex2_2.desc=_+1:_ способность превращает водные клетки в клетки травы.\n\n_+2:_ способность превращает водные клетки в клетки травы-грязевика.\n\n_+3:_ способность превращает водные клетки в клетки высокой травы.
actors.hero.talent.miyu_ex2_3.title=Тренировка скрытности
actors.hero.talent.miyu_ex2_3.desc=_+1:_ Наступая на высокую траву, _гарантируется уклонение от 1 полученной атаки в течение 3 ходов.\n\n_+2:_ В дополнение к эффекту +1, _время перезарядки сокращается на 2 хода_ при прохождении через траву. С этим эффектом время перезарядки может быть сокращено как минимум на 1 ход.\n\n_+3:_ В дополнение к эффекту +2, _скорость передвижения удваивается_ при прохождении через траву.

actors.hero.talent.miyu_armor1_1.title=Сенсорное нарушение
actors.hero.talent.miyu_armor1_1.desc=_+1:_ Световая граната имеет _25%_ шанс вызвать головокружение и оглушение на 10 ходов.\n\n_+2:_ Световая граната имеет _50%_ шанс вызвать головокружение и оглушение на 10 ходов.\n\n_+3:_ Световая граната имеет _75%_ шанс вызвать головокружение и оглушение на 10 ходов.\n\n_+4:_ Световая граната имеет _100%_ шанс вызвать головокружение и оглушение на 10 ходов.
actors.hero.talent.miyu_armor1_2.title=Усиление удара
actors.hero.talent.miyu_armor1_2.desc=_+1:_ Световая граната имеет _25%_ шанс оглушить все цели в области 3x3 на 5 ходов.\n\n_+2:_ Световая граната имеет _50%_ шанс оглушить все цели в области 3x3 на 5 ходов.\n\n_+3:_ Световая граната имеет _75%_ шанс оглушить все цели в области 3x3 на 5 ходов.\n\n_+4:_ Световая граната имеет _100%_ шанс оглушить все цели в области 3x3 на 5 ходов.
actors.hero.talent.miyu_armor1_3.title=Обеспечение безопасности
actors.hero.talent.miyu_armor1_3.desc=_+1: Получите _3_ щита за каждую цель, пораженную светошумовой гранатой.\n\n_+2: Получите _6_ щитов за каждую цель, пораженную светошумовой гранатой.\n\n_+3: Получите _9_ щитов за каждую цель, пораженную светошумовой гранатой.\n\n_+4: Получите _12_ щитов за каждую цель, пораженную светошумовой гранатой.\n\nПрименяется максимум к 10 целям.

actors.hero.talent.miyu_armor2_1.title=Стрельба из ноги
actors.hero.talent.miyu_armor2_1.desc=_+1:_ Пули сковывают врага на _2 хода и наносят _4 хода урона.\n\n_+2:_ Пули сковывают врага на _4 хода и наносят _8 ходов урона.\n\n_+3:_ Пули сковывают врага на _6 ходов и наносят _12 ходов урона.\n\n_+4:_ Пули сковывают врага на _8 ходов и наносят _16 ходов урона.
actors.hero.talent.miyu_armor2_2.title=Нейтрализовать
actors.hero.talent.miyu_armor2_2.desc=_+1:_ Пуля накладывает на противника слабость и уязвимость на _2 хода.\n\n_+2:_ Пуля накладывает на противника слабость и уязвимость на _3 хода.\n\n_+3:_ Пуля накладывает на противника слабость и уязвимость на _5 ходов.\n\n_+4:_ Пуля накладывает на противника слабость и уязвимость на _6 ходов.
actors.hero.talent.miyu_armor2_3.title=Улучшенная тормозная способность
actors.hero.talent.miyu_armor2_3.desc=_+1:_ Увеличивает количество накладываемого способностью кровотечения на _10%_.\n\n_+2:_ Увеличивает количество накладываемого способностью кровотечения на _20%_.\n\n_+3:_ Увеличивает количество накладываемого способностью кровотечения на _30%_.\n\n_+4:_ Увеличивает количество накладываемого способностью кровотечения на _40%_.

actors.hero.talent.miyu_armor3_1.title=Передача кинетической энергии
actors.hero.talent.miyu_armor3_1.desc=_+1: Расстояние, на которое отбрасываются враги, пораженные пулями, увеличивается на _50%.\n\n_+2: Расстояние, на которое отбрасываются враги, пораженные пулями, увеличивается на _100%.\n\n_+3: Расстояние, на которое отбрасываются враги, пораженные пулями, увеличивается на _150%.\n\n_+4: Расстояние, на которое отбрасываются враги, пораженные пулями, увеличивается на _200%.
actors.hero.talent.miyu_armor3_2.title=Уничтожение оборудования
actors.hero.talent.miyu_armor3_2.desc=_+1: Пуля накладывает на цель _5 ходов_ уязвимости.\n\n_+2: Пуля накладывает на цель _10 ходов_ уязвимости.\n\n_+3: Пуля накладывает на цель _15 ходов_ уязвимости.\n\n_+4: Пуля накладывает на цель _20 ходов_ уязвимости.
actors.hero.talent.miyu_armor3_3.title=Достаточные запасы
actors.hero.talent.miyu_armor3_3.desc=_+1:_ Существует 50%-ная вероятность зарядить на +1 дополнительный снаряд в противотанковое СР и 50%-ная вероятность перезарядки установленного орудия.\n\n_+2:_ Существует на +1 дополнительный снаряд в противотанковое СР и _перезарядка_ установленного орудия.\n\n_+3:_ Существует на +1 дополнительный снаряд в противотанковое СР и 50%-ная вероятность зарядить на +2 дополнительных снаряда, а также _перезарядка_ установленного орудия и зарядка дополнительного +1 снаряда.\n\n_+4:_ _+3:_ Существует на +2 дополнительных снаряда в противотанковое СР и _перезарядка_ установленного орудия и зарядка дополнительных +2 снарядов.

actors.hero.abilities.miyu.flashbang.name=Бросьте светошумовую гранату!
actors.hero.abilities.miyu.flashbang.short_desc=Мию бросает светошумовую гранату, ослепляя все цели вокруг места взрыва.
actors.hero.abilities.miyu.flashbang.desc=Мию бросает светошумовую гранату, ослепляя все цели в радиусе 2 клеток от точки взрыва на 10 ходов. Это может включать союзников и её саму.
actors.hero.abilities.miyu.hpbullet.name=Зарядка противопехотных снарядов
actors.hero.abilities.miyu.hpbullet.short_desc=Мию заряжает пулю, останавливающую движение человека, в результате чего следующая пуля наносит _кровоточащий урон_ вместо обычного урона.
actors.hero.abilities.miyu.hpbullet.desc=Мию заряжает «Останавливающий выстрел», вставляя 1 патрон в своё оружие. Следующий выпущенный патрон попадёт в цель и нанесёт такое же количество урона от кровотечения вместо обычного урона. Враги, невосприимчивые к кровотечению, не будут затронуты, и способность не активируется.\n\nБоссы и сильные враги будут сопротивляться эффекту кровотечения.
actors.hero.abilities.miyu.hpbullet$hpbulletbuff.name=Противопехотные снаряды
actors.hero.abilities.miyu.hpbullet$hpbulletbuff.desc=Следующий выстрел выпустит оглушающую гранату, наносящую такое же количество урона от кровотечения, а не прямой урон.\n\n_Она наносит только обычный урон врагам, невосприимчивым к кровотечению, а боссы или сильные враги будут сопротивляться этому эффекту._
actors.hero.abilities.miyu.antimaterialrifle.name=Противотанковая снайперская винтовка
actors.hero.abilities.miyu.antimaterialrifle.short_desc=Мию может использовать противотанковую способность SR, чтобы пробивать стены и уничтожать врагов.
actors.hero.abilities.miyu.antimaterialrifle.desc=Мию экипирует противотанковое SR-оружие, сохраняя при этом улучшения и магию своего текущего оружия.\n\nПротивотанковое SR-оружие пробивает стены толщиной в 1 клетку и может разрушать стены, которые оно пробивает. Если оно не пробивает стену, то отбрасывает врагов, пораженных пулями, на 4 клетки.\n\nПротивотанковое SR-оружие обладает характеристиками SR 6-го уровня и требует базовой силы 18. Оно возвращается к исходному оружию, когда запас противотанкового SR-оружия исчерпан, перезаряжено или снято. Противотанковое SR-оружие нельзя метать.


###Yuzu Sentences
actors.hero.heroclass.yuzu=Юзу
actors.hero.heroclass.yuzu_desc_short=Я Юзу, руководитель отдела разработки игр. Эм, правда... вы бы взяли меня с собой?\n\nСложность: _Нормальная_
actors.hero.heroclass.yuzu_desc=Юз начинает игру с «Записной книжкой Юза», которая позволяет ему приобретать дополнительный контент за золото.\n\nЮз владеет гранатомётом и использует на 1 единицу меньше энергии для обычного использования гранатомёта.\n\nЮз назначает одного целевого монстра для выполнения задания на каждые 8 ​​врагов, и победа над этим врагом приносит _дополнительный опыт и золото_. Юз также получает _на 75% меньше урона от взрывов оружия.\n\nЮз также входит в подземелье с гранатомётом 1-го уровня, тканевой формой, кожаной флягой для воды и бархатным мешочком.\n\nЮз начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.yuzu_unlock=Чтобы разблокировать Юзу, победите одного врага.

actors.hero.herosubclass.avant_garde_kun=Авангардный армейский абордаж!
actors.hero.herosubclass.avant_garde_kun_short_desc=Юзу может подняться на борт и управлять _Авангардной армией_.
actors.hero.herosubclass.avant_garde_kun_desc=Юзу может призвать и взять на борт армию роботов-авангардистов, и, управляя роботом, может стрелять до 3 раз за ход. При атаке в ближнем бою робот отталкивает врагов и перезаряжает экипированное оружие. Робот получает урон от имени Юзу, и если робот уничтожен, наступает 200-ходовая перезарядка.
actors.hero.herosubclass.game_start=Начало игры!
actors.hero.herosubclass.game_start_short_desc=Юзу может приобретать и использовать различные игровые консоли.
actors.hero.herosubclass.game_start_desc=Юз может приобретать дополнительные консоли, а также покупать и использовать новые консоли с помощью характеристик.\n\nКонсоль бойца: Мощная атака ближнего боя, ограниченная подвижность\n\nКонсоль фэнтези: Магическая атака, наносящая негативные эффекты врагам, неподвижность\n\nКонсоль песочницы: Изменение ландшафта, неподвижность\n_Нажмите и удерживайте кнопку управления, чтобы просмотреть описание._

actors.hero.hero.yuzu_health_critical_1=Всё в порядке... Я справлюсь...!
actors.hero.hero.yuzu_health_critical_2=Это больно...!
actors.hero.hero.yuzu_health_critical_3=Джо, это довольно сложно...

actors.hero.hero.yuzu_health_warn_1=Я... я в порядке...
actors.hero.hero.yuzu_health_warn_2=Э-это вот это...
actors.hero.hero.yuzu_health_warn_3=Немного болит...

actors.hero.hero.yuzu_die=Ах... нет...!

actors.hero.hero.yuzu_enemy_defeated_1=Будьте готовы к встрече со следующим соперником!
actors.hero.hero.yuzu_enemy_defeated_2=Я рад, что это оказалось полезным...
actors.hero.hero.yuzu_enemy_defeated_3=Ну вот, лечение закончено...!
actors.hero.hero.yuzu_enemy_defeated_4=Это... муки творения!
actors.hero.hero.yuzu_enemy_defeated_5=Мне как-то это удалось... Ну, я продолжу.

actors.hero.hero.yuzu_levelup_1=Я... я совсем не сильная... но я постараюсь! Потому что все вокруг такие замечательные.
actors.hero.hero.yuzu_levelup_2=Я хочу стать более уверенной в себе версией себя.
actors.hero.hero.yuzu_levelup_3=Я чувствую, как внутри моего тела поднимается сила... Это... мужество?
actors.hero.hero.yuzu_levelup_4=Несмотря на мои недостатки, я сделаю все возможное.
actors.hero.hero.yuzu_levelup_5=Я переполнен энергией...!
actors.hero.hero.yuzu_levelup_rare=Арис тоже здесь повысил свой уровень...?

actors.hero.hero.yuzu_no_available_guns=У меня нет оружия, способного стрелять.
actors.hero.hero.yuzu_robot_cooldown=Я не могу сейчас позвонить роботу.
actors.hero.hero.yuzu_robot_ready=Робот готов к вылету... но действительно ли мне нужно на нём ехать...?
actors.hero.hero.yuzu_robot_destroyed_1=Все функции отключены, я сбегаю...!
actors.hero.hero.yuzu_robot_destroyed_2=Функции робота отключены, активируется аварийная последовательность эвакуации...!
actors.hero.hero.yuzu_robot_destroyed_3=Неисправность оборудования, попытка побега...!
actors.hero.hero.yuzu_no_active_console=В данный момент нет игр, в которые можно было бы продолжить играть.
actors.hero.hero.yuzu_need_to_be_adjacent=Вы можете указать только ближайшие местоположения.
actors.hero.hero.yuzu_cannot_do=Я не могу этого сделать.
actors.hero.hero.yuzu_cannot_do_boss=Я не могу сделать это здесь...
actors.hero.hero.yuzu_cabinet=Я хочу остаться еще немного...

actors.hero.talent.yuzu_t1_1.title=В следующий раз я обязательно это сделаю.
actors.hero.talent.yuzu_t1_1.desc=_+1: При употреблении пищи следующие _2_ атаки гарантированно будут критическими.\n\n_+2: При употреблении пищи следующие _3_ атаки гарантированно будут критическими.\n\nЭффект гарантированного критического удара может суммироваться до 5 раз.
actors.hero.talent.yuzu_t1_2.title=Эксперт по гранатометам
actors.hero.talent.yuzu_t1_2.desc=_+1:_ Оценивает GL немедленно при _ношении_ него.\n\n_+2:_ Оценивает GL немедленно при _получении_ него.
actors.hero.talent.yuzu_t1_3.title=Игра, основанная на удаче
actors.hero.talent.yuzu_t1_3.desc=_+1:_ Урон от критического удара увеличивается на _3_.\n\n_+2:_ Урон от критического удара увеличивается на _5_.
actors.hero.talent.yuzu_t1_4.title=Безопасность
actors.hero.talent.yuzu_t1_4.desc=_+1:_ Получайте _5_ щита, когда получаете урон от оружия или промахиваетесь при ближнем бою.\n\n_+2:_ Получайте _8_ щита, когда получаете урон от оружия или промахиваетесь при ближнем бою.\n\nВремя восстановления — 10 ходов.

actors.hero.talent.yuzu_t2_1.title=Удаление ошибок
actors.hero.talent.yuzu_t2_1.desc=_+1:_ Затрачивает всего 1 ход на прием пищи и снимает _негативные эффекты_ при еде.\n\n_+2:_ Затрачивает всего 1 ход на прием пищи и снимает _негативные эффекты и получает 2 хода очищения_ при еде. Не снимает голод.
actors.hero.talent.yuzu_t2_2.title=Посмотреть карту
actors.hero.talent.yuzu_t2_2.desc=_+1: При использовании свитка поиск осуществляется в радиусе _8 клеток_.\n\n_+2: При использовании свитка поиск осуществляется в радиусе _12 клеток_.\n\nДиапазон поиска удваивается при использовании свитков улучшения, свитков преобразования или алхимических предметов, созданных с использованием этих свитков в качестве материалов.\n\nДля алхимических предметов (например, заклинаний), дающих больше результатов, чем количество использованных свитков, дальность поиска этой характеристики изменяется в зависимости от количества результатов.
actors.hero.talent.yuzu_t2_3.title=Буферизация
actors.hero.talent.yuzu_t2_3.desc=_+1: Задерживает _44%_ урона при получении физического урона.\n\n_+2: Задерживает _55%_ урона при получении физического урона.\n\nСуммируется с «Глифом вязкости».
actors.hero.talent.yuzu_t2_4.title=Последовательные комбинации
actors.hero.talent.yuzu_t2_4.desc=_+1: При критическом попадании вероятность критического попадания следующей атаки увеличивается на _+10%_.\n\n_+2: При критическом попадании вероятность критического попадания следующей атаки увеличивается на _+20%_.\n\nУвеличение вероятности критического попадания не суммируется.
actors.hero.talent.yuzu_t2_5.title=VIP-возврат
actors.hero.talent.yuzu_t2_5.desc=_+1:_ Получите _5%_ от кредитов, использованных при покупке ноутбука.\n\n_+2:_ Получите _10%_ от кредитов, использованных при покупке ноутбука.

actors.hero.talent.yuzu_t3_1.title=Бог Гача
actors.hero.talent.yuzu_t3_1.desc=_+1:_ Вероятность получения хорошего предмета из случайного ящика немного увеличивается, и существует _5%_ вероятность того, что предмет, полученный из ящика снаряжения, будет улучшен на +1.\n\n_+2:_ Вероятность получения хорошего предмета из случайного ящика увеличивается, и существует _10%_ вероятность того, что предмет, полученный из ящика снаряжения, будет улучшен на +1.\n\n_+3:_ Вероятность получения хорошего предмета из случайного ящика значительно увеличивается, и существует _15%_ вероятность того, что предмет, полученный из ящика снаряжения, будет улучшен на +1.
actors.hero.talent.yuzu_t3_2.title=Режим UZQ
actors.hero.talent.yuzu_t3_2.desc=_+1:_ При критическом попадании существует _33%_ шанс уклониться от следующей атаки.\n\n_+2:_ При критическом попадании существует _67%_ шанс уклониться от следующей атаки.\n\n_+3:_ При критическом попадании существует _100%_ шанс уклониться от следующей атаки.\n\nУроны не суммируются.

actors.hero.talent.yuzu_ex1_1.title=Ремонт своими руками
actors.hero.talent.yuzu_ex1_1.desc=_+1: При победе над врагом восстанавливает _2_ HP армии авангарда. Если есть время перезарядки, уменьшите его на _10 ходов.\n\n_+2: При победе над врагом восстанавливает _4_ HP армии авангарда. Если есть время перезарядки, уменьшите его на _20 ходов.\n\n_+3: При победе над врагом восстанавливает _6_ HP армии авангарда. Если есть время перезарядки, уменьшите его на _30 ходов.
actors.hero.talent.yuzu_ex1_2.title=Повышение огневой мощи
actors.hero.talent.yuzu_ex1_2.desc=_+1:_ Уровень улучшения огнестрельного оружия, используемого Армией Авангарда, увеличивается на дополнительные _+2, до максимального значения _+4.\n\n_+2:_ Уровень улучшения огнестрельного оружия, используемого Армией Авангарда, увеличивается на дополнительные _+3, до максимального значения _+5.\n\n_+3:_ Уровень улучшения огнестрельного оружия, используемого Армией Авангарда, увеличивается на дополнительные _+3, до максимального значения _+6.
actors.hero.talent.yuzu_ex1_3.title=Бурение
actors.hero.talent.yuzu_ex1_3.desc=_+1: Вы можете разрушить соседнюю стену, потратив _3 хода_ на юнита Авангарда.\n\n_+2: Вы можете разрушить соседнюю стену, потратив _2 хода_ на юнита Авангарда.\n\n_+3: Вы можете разрушить соседнюю стену, потратив _1 ход_ на юнита Авангарда.\n\nСтены на этаже с боссом разрушать нельзя.

actors.hero.talent.yuzu_ex2_1.title=Консоль истребителя
actors.hero.talent.yuzu_ex2_1.desc=_+1:_ Вы можете приобрести _Консоль бойца_.\n\n_+2:_ В дополнение к эффекту _+1_, сила атаки в ближнем бою с помощью Консоли бойца увеличивается на _Кольцо Силы +2_.\n\n_+3:_ В дополнение к эффекту _+1_, сила атаки в ближнем бою с помощью Консоли бойца увеличивается на _Кольцо Силы +4_.\n\nСила атаки в ближнем бою с помощью Консоли бойца равна силе атаки с помощью Кольца Силы +0.
actors.hero.talent.yuzu_ex2_2.title=Фантастическая консоль
actors.hero.talent.yuzu_ex2_2.desc=_+1:_ Вы можете приобрести _Фантастическую консоль_.\n\n_+2:_ В дополнение к эффекту _+1, базовый урон Фантазийной консоли увеличивается до _10-30_.\n\n_+3:_ В дополнение к эффекту _+1, базовый урон Фантазийной консоли увеличивается до _15-40_.\n\nБазовый урон Фантазийной консоли составляет _5-20_.
actors.hero.talent.yuzu_ex2_3.title=Песочница-консоль
actors.hero.talent.yuzu_ex2_3.desc=_+1:_ Вы сможете приобрести _Консоль песочницы_.\n\n_+2:_ В дополнение к эффекту _+1, вы получаете _12_ жетонов при использовании Консоли песочницы.\n\n_+3:_ В дополнение к эффекту _+1, вы получаете _15_ жетонов при использовании Консоли песочницы.\n\nБазовое количество жетонов для Консоли песочницы составляет 10.

actors.hero.talent.yuzu_armor1_1.title=Божественный контроль
actors.hero.talent.yuzu_armor1_1.desc=_+1: При участии в PVP вам гарантировано уклонение от следующих _0,5_ атак.\n\n_+2: При участии в PVP вам гарантировано уклонение от следующей _1_ атаки.\n\n_+3: При участии в PVP вам гарантировано уклонение от следующих _1,5_ атак.\n\n_+4: При участии в PVP вам гарантировано уклонение от следующих _2_ атак.\n\nКоличество десятичных знаков соответствует вероятности.
actors.hero.talent.yuzu_armor1_2.title=Передохнуть
actors.hero.talent.yuzu_armor1_2.desc=_+1:_ Если вы победите врага до окончания PvP-сражения, вы восстановите _30% + 5_ от общего урона, полученного во время PvP.\n\n_+2:_ Если вы победите врага до окончания PvP-сражения, вы восстановите _50% + 10_ от общего урона, полученного во время PvP.\n\n_+3:_ Если вы победите врага до окончания PvP-сражения, вы восстановите _65% + 15_ от общего урона, полученного во время PvP.\n\n_+4:_ Если вы победите врага до окончания PvP-сражения, вы восстановите _75% + 20_ от общего урона, полученного во время PvP.
actors.hero.talent.yuzu_armor1_3.title=Боевой маньяк
actors.hero.talent.yuzu_armor1_3.desc=_+1: Если вы запросите PVP повторно в течение 3 ходов сразу после окончания PVP, потребление заряда снизится на _16%_.\n\n_+2: Если вы запросите PVP повторно в течение 3 ходов сразу после окончания PVP, потребление заряда снизится на _30%_.\n\n_+3: Если вы запросите PVP повторно в течение 3 ходов сразу после окончания PVP, потребление заряда снизится на _40%_.\n\n_+4: Если вы запросите PVP повторно в течение 3 ходов сразу после окончания PVP, потребление заряда снизится на _50%_.

actors.hero.talent.yuzu_armor2_1.title=Скрытые закуски
actors.hero.talent.yuzu_armor2_1.desc=_+1: При использовании способности восстанавливает _25_ единиц голода и _3_ единиц здоровья, и существует _25%-ная вероятность того, что эффект сработает при еде.\n\n_+2: При использовании способности восстанавливает _50_ единиц голода и _6_ единиц здоровья, и существует _50%-ная вероятность того, что эффект сработает при еде.\n\n_+3: При использовании способности восстанавливает _75_ единиц голода и _9_ единиц здоровья, и существует _75%-ная вероятность того, что эффект сработает при еде.\n\n_+4: При использовании способности восстанавливает _100_ единиц голода и _12_ единиц здоровья, и существует _100%-ная вероятность того, что эффект сработает при еде.
actors.hero.talent.yuzu_armor2_2.title=Время реорганизации
actors.hero.talent.yuzu_armor2_2.desc=_+1: При использовании способности заряжается _1 патрон_ из экипированного оружия.\n\n_+2: При использовании способности заряжается _2 патрона_ из экипированного оружия.\n\n_+3: При использовании способности заряжается _3 патрона_ из экипированного оружия.\n\n_+4: При использовании способности заряжается _4 патрона_ из экипированного оружия.\n\nВы можете заряжать оружие сверх максимальной емкости магазина.
actors.hero.talent.yuzu_armor2_3.title=Побег
actors.hero.talent.yuzu_armor2_3.desc=_+1: Когда эффект заканчивается, если в поле зрения находится враг, получите _2 хода_ сверхскорости.\n\n_+2: Когда эффект заканчивается, если в поле зрения находится враг, получите _4 хода_ сверхскорости.\n\n_+3: Когда эффект заканчивается, если в поле зрения находится враг, получите _6 ходов_ сверхскорости.\n\n_+4: Когда эффект заканчивается, если в поле зрения находится враг, получите _8 ходов_ сверхскорости.

actors.hero.talent.yuzu_armor3_1.title=Непобедимость
actors.hero.talent.yuzu_armor3_1.desc=_+1: Вы можете приобрести «Неуязвимость» на ноутбуке и получить 30 щитов после покупки.\n\n_+2: Вы можете приобрести «Неуязвимость» на ноутбуке и получить 60 щитов после покупки.\n\n_+3: Вы можете приобрести «Неуязвимость» на ноутбуке и получить 90 щитов после покупки.\n\n_+4: Вы можете приобрести «Неуязвимость» на ноутбуке и получить 120 щитов после покупки.\n\n«Неуязвимость» можно приобрести только один раз за использование способности.
actors.hero.talent.yuzu_armor3_2.title=Бесконечный боезапас
actors.hero.talent.yuzu_armor3_2.desc=_+1: Вы можете приобрести «Бесконечные патроны» на ноутбуке, и после покупки получите _5 ходов бесконечных патронов.\n\n_+2: Вы можете приобрести «Бесконечные патроны» на ноутбуке, и после покупки получите _10 ходов бесконечных патронов.\n\n_+3: Вы можете приобрести «Бесконечные патроны» на ноутбуке, и после покупки получите _15 ходов бесконечных патронов.\n\n_+4: Вы можете приобрести «Бесконечные патроны» на ноутбуке, и после покупки получите _20 ходов бесконечных патронов.
actors.hero.talent.yuzu_armor3_3.title=Конвертация кредита
actors.hero.talent.yuzu_armor3_3.desc=_+1: Вы можете приобрести _Конвертацию кредитов_ на ноутбуке. После покупки вы получаете _100 кредитов_ за каждый оставшийся ход вашего VIP-членства и завершаете свое VIP-членство.\n\n_+2: Вы можете приобрести _Конвертацию кредитов_ на ноутбуке. После покупки вы получаете _150 кредитов_ за каждый оставшийся ход вашего VIP-членства и завершаете свое VIP-членство.\n\n_+3: Вы можете приобрести _Конвертацию кредитов_ на ноутбуке. После покупки вы получаете _200 кредитов_ за каждый оставшийся ход вашего VIP-членства и завершаете свое VIP-членство.\n\n_+4: Вы можете приобрести _Конвертацию кредитов_ на ноутбуке. После покупки вы получаете _250 кредитов_ за каждый оставшийся ход вашего VIP-членства и завершаете свое VIP-членство.

actors.hero.abilities.yuzu.pvp.name=ПВП
actors.hero.abilities.yuzu.pvp.prompt=Выберите противника для PvP-боя.
actors.hero.abilities.yuzu.pvp.already_dueling=Вы уже участвуете в PvP.
actors.hero.abilities.yuzu.pvp.ally_target=Вы можете вызывать на поединок в PvP только врагов.
actors.hero.abilities.yuzu.pvp.unreachable_target=Чтобы запросить PvP-сражения, вы должны иметь возможность достичь цели.
actors.hero.abilities.yuzu.pvp.distant_target=Этот враг находится слишком далеко для PvP.
actors.hero.abilities.yuzu.pvp.short_desc=Юзу вызывает ближайшего врага на PvP-сражение, временно останавливая действия всех остальных противников.
actors.hero.abilities.yuzu.pvp.desc=Юзу вызывает ближайшего врага на PvP-сражение. Этот враг должен сражаться с Юзу, пока время для всех остальных врагов заморожено.\n\nЦель должна находиться в пределах досягаемости на расстоянии 5 клеток от Юзу. PvP продолжается до тех пор, пока не пройдет 10 ходов, враг не погибнет или расстояние между Юзу и врагом не превысит 5 клеток.\n\nДругие враги, время которых заморожено, не получают урона. Союзники Юзу остаются невредимыми, но если в PvP-сражении участвует босс, то и призванные им миньоны также остаются невредимыми.
actors.hero.abilities.yuzu.pvp$duelparticipant.name=Цели PVP
actors.hero.abilities.yuzu.pvp$duelparticipant.desc=Эта цель участвует в PvP-сражении. Пока время для всех остальных врагов заморожено, только цель и её союзники или подчинённые могут действовать нормально.\n\nPvP-сражения продолжаются до истечения отведённого времени, гибели одного из участников или увеличения расстояния между ними до 5 клеток.\n\nОсталось ходов: %d.
actors.hero.abilities.yuzu.cabinet.name=Спрятав шкаф
actors.hero.abilities.yuzu.cabinet.short_desc=Юзу может войти в сейф и провести там некоторое время в спокойной обстановке.
actors.hero.abilities.yuzu.cabinet.desc=Юзу заходит в шкаф на 20 ходов, в течение которых она становится невидимой для врагов, неуязвимой и не может двигаться.
actors.hero.abilities.yuzu.vipmembership.name=VIP-членство
actors.hero.abilities.yuzu.vipmembership.short_desc=Юзу сможет получить доступ к контенту для VIP-членов на короткий период времени.
actors.hero.abilities.yuzu.vipmembership.desc=Юзу получает 30 ходов благословения и 30 очков щита, а также может приобрести контент VIP-членства на 10 ходов. Контент VIP-членства можно разблокировать и улучшить с помощью характеристик.
actors.hero.abilities.yuzu.vipmembership$vipbuff.name=VIP-членство
actors.hero.abilities.yuzu.vipmembership$vipbuff.desc=Вы получили доступ к VIP-контенту!\n\nОсталось ходов: __%s.

###Izuna Sentences
actors.hero.heroclass.izuna=Изуна
actors.hero.heroclass.izuna_desc_short=Изуна! Я прибежал, услышав зов учителя... нет, господина! Нин-нин!\n\nСложность: _Нормальная_
actors.hero.heroclass.izuna_desc=Изуна начинает игру с плащом ниндзя, который позволяет ей передвигаться на короткие расстояния и действовать скрытно.\n\nИзуна искусно владеет метательным оружием и использует на 1 меньше Силы, чтобы обращаться с ним обычным способом.\n\nИзуна начинает игру с кунаем убийцы, который наносит большой урон при засаде на врагов.\n\nТакже Изуна входит в подземелье с пистолетом-пулеметом 1-го уровня, 3 метательными кинжалами, тканевой формой, кожаным ведром и бархатным мешочком.\n\nИзуна начинает игру со следующими предметами:\nСвиток оценки\nЗелье исцеления\nСвиток гнева
actors.hero.heroclass.izuna_unlock=Чтобы разблокировать Изуну, победите одного врага.

actors.hero.herosubclass.switching=Искусство замены!
actors.hero.herosubclass.switching_short_desc=Используя плащ ниндзя, Изуна может призвать куклу-лисицу, которая заманивает врагов.
actors.hero.herosubclass.switching_desc=Изуна, освоив технику Замещения, получает 50% увеличение скорости зарядки своего плаща ниндзя и призывает куклу-лисицу на своё первоначальное местонахождение, чтобы принимать на себя атаки врагов.\n\nОна может поддерживать максимум одну куклу-лисицу, у которой 10 HP и 1-3 защиты.
actors.hero.herosubclass.chase=Быстро и просто!
actors.hero.herosubclass.chase_short_desc=Изуна может мгновенно приблизиться к врагу и нанести удар в ближнем бою после попадания метательным оружием.
actors.hero.herosubclass.chase_desc=Изуна может телепортироваться к противнику, пораженному метательным оружием, в течение 4+(значение усиления метательного оружия) ходов и совершить рукопашную атаку.

actors.hero.hero.izuna_health_critical_1=Ой, это ещё пустяки...!
actors.hero.hero.izuna_health_critical_2=Канг! Канг!
actors.hero.hero.izuna_health_critical_3=Потому что ниндзя не плачут, даже если им немного больно...

actors.hero.hero.izuna_health_warn_1=Я немного устал...
actors.hero.hero.izuna_health_warn_2=Господин мой, господин мой, может, нам стоит отдохнуть вон там?
actors.hero.hero.izuna_health_warn_3=Ваше Величество, не видели ли вы каких-либо предметов, полезных для исцеления?

actors.hero.hero.izuna_die=Ааа! Всё... кружится...

actors.hero.hero.izuna_enemy_defeated_1=Миссия началась!
actors.hero.hero.izuna_enemy_defeated_2=Бегите в следующую оперативную зону!
actors.hero.hero.izuna_enemy_defeated_3=Изуна переезжает!
actors.hero.hero.izuna_enemy_defeated_4=Ура! Для меня это пустяк!
actors.hero.hero.izuna_enemy_defeated_5=С Изуной это не сработает!

actors.hero.hero.izuna_levelup_1=Ниндзюцу! Техника повышения уровня!
actors.hero.hero.izuna_levelup_2=Я тоже чувствую, как мои сюрикены становятся сильнее!
actors.hero.hero.izuna_levelup_3=Ах, мой господин! Я только что повысил свой уровень!
actors.hero.hero.izuna_levelup_4=Изуна приближается к тому, чтобы стать сильнейшим!
actors.hero.hero.izuna_levelup_5=Моя скорость бега не увеличивается даже после повышения уровня...
actors.hero.hero.izuna_levelup_rare=Я слышала, что если Изуна сильно прокачается, то сможет делать пончики!

actors.hero.hero.izuna_fov=Вы можете перемещаться только в те места, где Изуна сможет вас видеть!
actors.hero.hero.izuna_enemy=Если пойдёте этим путём, то обязательно на что-нибудь наткнётесь...
actors.hero.hero.izuna_distance=Это место слишком далеко...
actors.hero.hero.izuna_solid=В стену нельзя войти!
actors.hero.hero.izuna_cannot_self=Ты не сможешь бросить это в меня!
actors.hero.hero.izuna_cannot_move=Я сейчас не могу двигаться...

actors.hero.talent.izuna_t1_1.title=Тщательное управление
actors.hero.talent.izuna_t1_1.desc=_+1:_ Прочность метательного оружия увеличивается на _+3_.\n\n_+2:_ Прочность метательного оружия увеличивается на _+5_.
actors.hero.talent.izuna_t1_2.title=Эксперт по метательному оружию
actors.hero.talent.izuna_t1_2.desc=_+1:_ Скорость оценки метательного оружия увеличивается в _3_ раза.\n\n_+2:_ Мгновенно оценивает_ метательное оружие при попадании.
actors.hero.talent.izuna_t1_3.title=Изуна-рю Ниндзюцу! Жалящая техника!
actors.hero.talent.izuna_t1_3.desc=_+1:_ При атаке Изуны существует 50% вероятность нанести _1_ единицу кровотечения нападающему.\n\n_+2:_ При атаке Изуны существует 50% вероятность нанести _1-2_ единицы кровотечения нападающему.
actors.hero.talent.izuna_t1_4.title=Скрывая тени
actors.hero.talent.izuna_t1_4.desc=_+1: В режиме невидимости получайте 1 щит каждые 2 хода, максимум 3.\n\n_+2: В режиме невидимости получайте 1 щит каждые 1 ход, максимум 5.

actors.hero.talent.izuna_t2_1.title=Время обеда
actors.hero.talent.izuna_t2_1.desc=_+1:_ Затрачивает всего 1 ход на прием пищи и дает _3 хода заряда реликвии_ после еды.\n\n_+2:_ Затрачивает всего 1 ход на прием пищи и дает _5 ходов заряда реликвии_ после еды.\n\nЕсли вы получите эффект заряда реликвии с помощью Рога Изобилия, Рог Изобилия не будет заряжаться.
actors.hero.talent.izuna_t2_2.title=Свиток защиты
actors.hero.talent.izuna_t2_2.desc=_+1:_ Свиток, прибавка _10_ к щиту после применения.\n\n_+2:_ Свиток, прибавка _15_ к щиту после применения.\n\nКоличество щита удваивается при использовании Свиток усиления, Свиток преобразования и алхимических предметов, созданных с использованием этих свитков в качестве материалов.\n\nДля алхимических предметов (например, заклинаний), дающих больше результатов, чем количество использованных зелий, этот атрибут определяет количество щита в зависимости от количества результатов.
actors.hero.talent.izuna_t2_3.title=Бег по воде
actors.hero.talent.izuna_t2_3.desc=_+1:_ Скорость передвижения Изуны увеличивается на _50%_ на воде.\n\n_+2:_ Скорость передвижения Изуны увеличивается на _100%_ на воде.
actors.hero.talent.izuna_t2_4.title=Пробираясь незаметно
actors.hero.talent.izuna_t2_4.desc=_+1:_ Не будите спящих врагов, если они находятся на расстоянии _3 клеток или более.\n\n_+2:_ Не будите спящих врагов, если вы не находитесь в непосредственной близости от них.
actors.hero.talent.izuna_t2_5.title=Исчезновение в мгновение ока
actors.hero.talent.izuna_t2_5.desc=_+1: Победите врага, не находящегося в непосредственной близости, и получите _3 хода сверхскорости.\n\n_+2: Победите врага, не находящегося в непосредственной близости, и получите _5 ходов сверхскорости.

actors.hero.talent.izuna_t3_1.title=Отслеживание
actors.hero.talent.izuna_t3_1.desc=_+1: Получите _5 ходов «Взгляда разума» на врагов, пораженных метательным оружием.\n\n_+2: Получите _10 ходов «Взгляда разума» на врагов, пораженных метательным оружием.\n\n_+3: Получите _15 ходов «Взгляда разума» на врагов, пораженных метательным оружием.
actors.hero.talent.izuna_t3_2.title=Легкий плащ
actors.hero.talent.izuna_t3_2.desc=_+1:_ Изуну можно использовать без плаща ниндзя, но скорость зарядки снижается до _25%_, когда плащ не надет.\n\n_+2:_ Изуну можно использовать без плаща ниндзя, но скорость зарядки снижается до _50%_, когда плащ не надет.\n\n_+3:_ Изуну можно использовать без плаща ниндзя, но скорость зарядки снижается до _75%_, когда плащ не надет.

actors.hero.talent.izuna_ex1_1.title=Прочная кукла
actors.hero.talent.izuna_ex1_1.desc=_+1:_ У Лисицы увеличивается количество HP до _20_, а защита — до _2-6_.\n\n_+2:_ У Лисицы увеличивается количество HP до _30_, а защита — до _3-9_.\n\n_+3:_ У Лисицы увеличивается количество HP до _40_, а защита — до _3-12_.
actors.hero.talent.izuna_ex1_2.title=Внушение самоуспокоения
actors.hero.talent.izuna_ex1_2.desc=_+1: Каждый раз, когда Кукла-лиса подвергается атаке, атакующий противник получает _1 ход_ уязвимости.\n\n_+2: Каждый раз, когда Кукла-лиса подвергается атаке, атакующий противник получает _2 хода_ уязвимости.\n\n_+3: Каждый раз, когда Кукла-лиса подвергается атаке, атакующий противник получает _3 хода_ уязвимости.
actors.hero.talent.izuna_ex1_3.title=Преодоление препятствий
actors.hero.talent.izuna_ex1_3.desc=_+1:_ Максимальная дальность передвижения с помощью Плаща ниндзя увеличивается на _1 клетку_.\n\n_+2:_ В дополнение к эффекту +1, вы можете использовать Плащ ниндзя даже без _зрения_ в обнаруженных местах.\n\n_+3:_ В дополнение к эффекту +2, вы получаете _1 ход сверхбыстрого передвижения при использовании Плаща ниндзя._

actors.hero.talent.izuna_ex2_1.title=Внезапное нападение
actors.hero.talent.izuna_ex2_1.desc=_+1: Метание метательного оружия сразу после использования плаща ниндзя не расходует ход. Время восстановления — 15 ходов.\n\n_+2: Метание метательного оружия сразу после использования плаща ниндзя не расходует ход. Время восстановления — 10 ходов.\n\n_+3: Метание метательного оружия сразу после использования плаща ниндзя не расходует ход. Время восстановления — 5 ходов.
actors.hero.talent.izuna_ex2_2.title=Вино Сансина
actors.hero.talent.izuna_ex2_2.desc=_+1: При победе над врагом с _ способностью вы получаете _1 ход_ невидимости и ускорения.\n\n_+2: При победе над врагом с _ способностью вы получаете _2 хода_ невидимости и ускорения.\n\n_+3: При победе над врагом с _ способностью вы получаете _3 хода_ невидимости и ускорения.
actors.hero.talent.izuna_ex2_3.title=Мастер метательного оружия
actors.hero.talent.izuna_ex2_3.desc=_+1:_ Уровень улучшения метательного оружия увеличивается на уровень улучшения кунаев убийцы. Применяется до максимального значения _+2_.\n\n_+2:_ Уровень улучшения метательного оружия увеличивается на уровень улучшения кунаев убийцы. Применяется до максимального значения _+4_.\n\n_+3:_ Уровень улучшения метательного оружия увеличивается на уровень улучшения кунаев убийцы. Применяется до максимального значения _+6_.

actors.hero.talent.izuna_armor1_1.title=Быстрый побег
actors.hero.talent.izuna_armor1_1.desc=_+1: При использовании способности получите _1 ход_ скорости и сверхбыстроты.\n\n_+2: При использовании способности получите _2 хода_ скорости и сверхбыстроты.\n\n_+3: При использовании способности получите _3 хода_ скорости и сверхбыстроты.\n\n_+4: При использовании способности получите _4 хода_ скорости и сверхбыстроты.
actors.hero.talent.izuna_armor1_2.title=Дымовая граната большой емкости
actors.hero.talent.izuna_armor1_2.desc=_+1:_ Количество дыма увеличивается на _25%_.\n\n_+2:_ Количество дыма увеличивается на _50%_.\n\n_+3:_ Количество дыма увеличивается на _75%_.\n\n_+4:_ Количество дыма увеличивается на _100%_.
actors.hero.talent.izuna_armor1_3.title=Вревочная ловушка
actors.hero.talent.izuna_armor1_3.desc=_+1: При использовании способности, свяжите всех врагов в радиусе 3x3 клеток на _2 хода_.\n\n_+2: При использовании способности, свяжите всех врагов в радиусе 3x3 клеток на _4 хода_.\n\n_+3: При использовании способности, свяжите всех врагов в радиусе 3x3 клеток на _6 ходов_.\n\n_+4: При использовании способности, свяжите всех врагов в радиусе 3x3 клеток на _8 ходов_.

actors.hero.talent.izuna_armor2_1.title=Улучшение ускорения
actors.hero.talent.izuna_armor2_1.desc=_+1:_ Максимальное расстояние, на котором можно использовать способность, увеличивается на _1 клетку.\n\n_+2:_ Максимальное расстояние, на котором можно использовать способность, увеличивается на _2 клетки.\n\n_+3:_ Максимальное расстояние, на котором можно использовать способность, увеличивается на _3 клетки.\n\n_+4:_ Максимальное расстояние, на котором можно использовать способность, увеличивается на _4 клетки.
actors.hero.talent.izuna_armor2_2.title=Идеальное убийство
actors.hero.talent.izuna_armor2_2.desc=_+1: Атаки, побеждающие врага в течение _1 хода_ после использования способности, не расходуют ход.\n\n_+2: Атаки, побеждающие врага в течение _2 ходов_ после использования способности, не расходуют ход.\n\n_+3: Атаки, побеждающие врага в течение _3 ходов_ после использования способности, не расходуют ход.\n\n_+4: Атаки, побеждающие врага в течение _4 ходов_ после использования способности, не расходуют ход.
actors.hero.talent.izuna_armor2_3.title=Непрерывное движение
actors.hero.talent.izuna_armor2_3.desc=_+1: Если вы используете способность повторно в течение 5 ходов после её применения, она расходует на _15%_ меньше заряда.\n\n_+2: Если вы используете способность повторно в течение 5 ходов после её применения, она расходует на _28%_ меньше заряда.\n\n_+3: Если вы используете способность повторно в течение 5 ходов после её применения, она расходует на _39%_ меньше заряда.\n\n_+4: Если вы используете способность повторно в течение 5 ходов после её применения, она расходует на _48%_ меньше заряда.

actors.hero.talent.izuna_armor3_1.title=Цепная молния
actors.hero.talent.izuna_armor3_1.desc=_+1: При попадании молнии создаётся цепная молния, наносящая _20%_ от нанесённого урона.\n\n_+2: При попадании молнии создаётся цепная молния, наносящая _40%_ от нанесённого урона.\n\n_+3: При попадании молнии создаётся цепная молния, наносящая _60%_ от нанесённого урона.\n\n_+4: При попадании молнии создаётся цепная молния, наносящая _80%_ от нанесённого урона.
actors.hero.talent.izuna_armor3_2.title=Ток высокого напряжения
actors.hero.talent.izuna_armor3_2.desc=_+1:_ Урон от молнии увеличивается на _25%.\n\n_+2:_ Урон от молнии увеличивается на _50%.\n\n_+3:_ Урон от молнии увеличивается на _75%.\n\n_+4:_ Урон от молнии увеличивается на _100%.
actors.hero.talent.izuna_armor3_3.title=Громовой удар
actors.hero.talent.izuna_armor3_3.desc=_+1: _25%-ный шанс наложить паралич вместо калечения на врагов, непосредственно пораженных молнией.\n\n_+2: _50%-ный шанс наложить паралич вместо калечения на врагов, непосредственно пораженных молнией.\n\n_+3: _75%-ный шанс наложить паралич вместо калечения на врагов, непосредственно пораженных молнией.\n\n_+4: _100%-ный шанс наложить паралич вместо калечения на врагов, непосредственно пораженных молнией.

actors.hero.abilities.izuna.smokespread.name=Распыление дыма
actors.hero.abilities.izuna.smokespread.short_desc=Изуна может рассеивать дым вокруг себя, чтобы заслонить обзор врагам.
actors.hero.abilities.izuna.smokespread.desc=Изуна может блокировать обзор врагов, рассеивая дым в области 3x3.
actors.hero.abilities.izuna.blink.name=Секретная техника стиля Изуна! Техника высокоскоростных движений!
actors.hero.abilities.izuna.blink.short_desc=Изуна может телепортироваться на небольшое расстояние, не тратя ход.
actors.hero.abilities.izuna.blink.desc=Изуна может мгновенно переместиться в точку на расстоянии до 3 клеток в пределах своей прямой видимости, не тратя ход. При этом она не теряет невидимость.
actors.hero.abilities.izuna.blink$perfectassassination.name=Идеальное убийство
actors.hero.abilities.izuna.blink$perfectassassination.desc=Одна атака, которая уничтожит врага в течение следующих1 _%s_ ходов, не отнимает ход.
actors.hero.abilities.izuna.throwingthunder.name=Удар молнии
actors.hero.abilities.izuna.throwingthunder.short_desc=Изуна может наносить врагам значительный урон, выпуская _молнию_, которая всегда попадает в цель.
actors.hero.abilities.izuna.throwingthunder.desc=Изуна выпускает молнию, которая всегда попадает в указанное место, нанося 20-60 урона врагам в этом месте и вызывая 10 ходов замедления.



###npcs
actors.mobs.npcs.blacksmith.name=Черино
actors.mobs.npcs.blacksmith.intro_quest_all=Иди сюда! У меня для тебя заказ.
actors.mobs.npcs.blacksmith.intro_quest_start=Видишь ту лестницу вон там? Возьми эту кирку и иди добывать синий самоцвет. Если не принесешь 40 штук, тебя уничтожат! Ты можешь разрушить стену внизу, так что попробуй.\n\nЧто, ремонт? Э... этот парень...\n\n...Хорошо. Я предоставлю тебе особое разрешение пользоваться услугами кузнецов нашего Красного Зимнего Офиса.
actors.mobs.npcs.blacksmith.intro_quest_crystal=Я лично дам вам подсказку, чтобы обеспечить успех вашей миссии. Там, внизу, в изобилии растут кристаллы; они могут выглядеть красиво, потому что сверкают, но они слабые и бесполезные, а что еще хуже, они представляют собой реальную угрозу. Они даже используют какую-то странную магию для самозащиты. Хм-хм. В общем, независимо от того, где вы будете добывать ресурсы, лучше всего для вашей безопасности не терять бдительность. В противном случае вы привлечете их внимание.\n\nВ шахте должен быть где-то большой кристалл, и поскольку он гораздо опаснее, убедитесь, что вы полностью готовы, если собираетесь его уничтожить. После его уничтожения другие кристаллы замедлятся, поэтому, если вам это удастся, я лично дам вам дополнительную награду.
actors.mobs.npcs.blacksmith.intro_quest_fungi=Лучше будь осторожен. Эта мина представляет угрозу для такого маленького человека, как ты. Там растёт какое-то грибное чудовище. К нему даже прикреплены грибные турели, так что, если тебя поймают, это будет очень опасно. Они, может, и не смогут встать, но, по крайней мере, смогут тебя выследить, так что, если хочешь выжить, лучше держись от них подальше, насколько это возможно.\n\nЕсли тебе удастся уничтожить самый большой гриб, я дам тебе более высокую награду. Только не волнуйся, это будет очень сложно. Он соединён с бесчисленными мицелиальными узлами, спрятанными внутри стен, поэтому, чтобы нанести урон, тебе придётся разбить их все.
actors.mobs.npcs.blacksmith.intro_quest_gnoll=Я лично дам вам подсказку, чтобы обеспечить успех вашей миссии. Какие-то негодяи сошли с ума из-за моего Синего Камня и начали его крушить. Поскольку они простодушны и глупы, они добывают его таким образом, вызывая всевозможные обрушения. Вам придётся добывать Синий Камень среди них. Поэтому внимательно осмотрите недавно упавшие камни.\n\nИ, похоже, один из них особенно опасен. Вероятно, это маг-земледелец или кто-то подобный. Если вы найдёте его и разберётесь с ним, я лично дам вам дополнительную награду. Однако я гарантирую, что он не умрёт легко.
actors.mobs.npcs.blacksmith.reminder=Я сказал: "Спускайся скорее и принеси мне синий драгоценный камень! Если будешь медлить, это будет чистка, чистка!"
actors.mobs.npcs.blacksmith.lost_pick=Где ты продал свою кирку?! Если ты её быстро не найдёшь, тебя выгонят!
actors.mobs.npcs.blacksmith.quest_start_prompt=Вы готовы? Не забудьте оставить достаточно места в сумке для голубого драгоценного камня.\n\n_Я отправляю вас вниз только один раз!_
actors.mobs.npcs.blacksmith.enter_yes=Я готов
actors.mobs.npcs.blacksmith.enter_no=Ещё ничего не кончено.
actors.mobs.npcs.blacksmith.exit_warn_none=Ты уже закончил? Ты быстрый. Как и ожидалось, моя внимательность к деталям... Что? У тебя нет ни одного Синего Самоцвета! Если ты не принесешь 40, это будет чистка, чистка!\n\nЕсли ты сдашься, я ничего не смогу сделать, но я тебя больше не пущу!
actors.mobs.npcs.blacksmith.exit_warn_low=Ты уже закончила? Не похоже, что у тебя так много лазурного цвета. Я же сказала, принеси мне 40!\n\nЕсли ты решишь сдаться, я ничего не смогу сделать, но я тебя обратно не пущу!
actors.mobs.npcs.blacksmith.exit_warn_med=Всё кончено? Похоже, у вас есть хотя бы немного синего пироксена, но в шахте его наверняка ещё много осталось... Впрочем, я же сказал, принесите _40_!\n\n_Если вы сдадитесь, я ничего не смогу сделать, но я вас обратно не пущу!_
actors.mobs.npcs.blacksmith.exit_warn_high=Всё кончено? Похоже, вы принесли довольно много синего сланца, но я мог бы привезти ещё _40_ штук...\n\n_Если вы решите сдаться, я ничего не смогу сделать, но больше вас не впущу!_
actors.mobs.npcs.blacksmith.exit_warn_full=Всё кончено? Хе-хе... Хорошо, хорошо. Твоя сумка полна синих драгоценных камней. Убедись, что ничего не забыла, прежде чем выходить.\n\n_Я не впущу тебя обратно, когда ты поднимешься, поэтому проверь всё внимательно!_
actors.mobs.npcs.blacksmith.exit_warn_crystal=Тот гигантский кристалл всё ещё там, внизу! Если ты его разобьёшь, я дам тебе ещё награды.
actors.mobs.npcs.blacksmith.exit_warn_fungi=Тот гигантский гриб всё ещё там, внизу. Если ты с ним разберёшься, я дам тебе более высокую награду.
actors.mobs.npcs.blacksmith.exit_warn_gnoll=Гадалка с Земли Нол все еще там, внизу! Если ты с этим разберешься, я дам тебе дополнительную плату.
actors.mobs.npcs.blacksmith.exit_yes=Все кончено
actors.mobs.npcs.blacksmith.exit_no=Ещё ничего не кончено.
actors.mobs.npcs.blacksmith.get_lost=Если вы закончили свои дела, можете уходить!
actors.mobs.npcs.blacksmith.entrance_blocked=Дорога вниз перекрыта.
actors.mobs.npcs.blacksmith.cant_enter_old=В этой игре вы больше не сможете попасть в эту область. Начните новую игру и попробуйте новые задания!
actors.mobs.npcs.blacksmith.def_verb="Лучше этого не делать!"
actors.mobs.npcs.blacksmith.desc=Я — Черино, генеральный секретарь Академии Красной Зимы. Я — грозная фигура, удерживающая власть посредством многочисленных чисток на фоне бесчисленных кризисов, связанных с государственными переворотами, но поскольку чистка для меня — это всего лишь вопрос наведения на неё пистолета и крика «Чистка!», то от меня это мало пользы.
actors.mobs.npcs.blacksmith.reminder_crystal=Я сказал, принеси как можно больше синего пироклазы! ...И заодно было бы неплохо разбить большой кристалл.
actors.mobs.npcs.blacksmith.reminder_gnoll=Возьмите с собой как можно больше синего пироксена! ...А заодно не помешает позаботиться и о глиняной гадалке.
actors.mobs.npcs.blacksmith.reminder_fungi=Принесите мне как можно больше синей пирокластики! ...А заодно не помешает позаботиться и о гигантских грибах.

actors.mobs.npcs.shopkeeper.name=Сора
actors.mobs.npcs.shopkeeper.thief=Ах, это вор!
actors.mobs.npcs.shopkeeper.warn=Эй, это доставляет немало хлопот, если ты устраиваешь такой шум...!
actors.mobs.npcs.shopkeeper.yell=Аааах!
actors.mobs.npcs.shopkeeper.flee=Сора в панике убежал.
actors.mobs.npcs.shopkeeper.flee_warning=Сора нажала кнопку вызова службы безопасности и убежала!
actors.mobs.npcs.shopkeeper.sell=Выберите товары для продажи
actors.mobs.npcs.shopkeeper.talk=Я говорю
actors.mobs.npcs.shopkeeper.buyback=Сора: "Вот, я тебе верну. Пожалуйста, будь осторожнее при продаже в следующий раз..."
actors.mobs.npcs.shopkeeper.talk_prison_intro=(Серьезно, я отвлекаюсь на работу, глядя в телефон.)
actors.mobs.npcs.shopkeeper.talk_prison_aris=О, привет, Арис! Эта эмблема прекрасна! Символ Тысячелетия тебе очень идёт.
actors.mobs.npcs.shopkeeper.talk_prison_nonomi=Ах, привет, Нономи! Хм, эта открытка...
actors.mobs.npcs.shopkeeper.talk_prison_miyako=О, здравствуйте, госпожа Мияко! Вы случайно не пришли помочь? Ах, подождите...
actors.mobs.npcs.shopkeeper.talk_prison_hoshino=Ах, здравствуйте... Ах, вам нельзя здесь спать, Хосино-сан!
actors.mobs.npcs.shopkeeper.talk_prison_shiroko=Добро пожаловать... Ого! (Дрожь) Здесь не так уж много дорогих вещей (дрожь)... Так что, пойдем куда-нибудь в другое место...
actors.mobs.npcs.shopkeeper.talk_prison_noa=(Поспешно пряча телефон) Э-э, добро пожаловать! Что вам нужно, мистер Ной?
actors.mobs.npcs.shopkeeper.talk_prison_miyu=Мне скучно... О, Мию, как давно ты здесь?
actors.mobs.npcs.shopkeeper.talk_prison_yuzu=Ах, Юзу! Приятно познакомиться. Пожалуйста, покупайте товары и здесь, а не онлайн.
actors.mobs.npcs.shopkeeper.talk_prison_izuna=Ах, Изуна-сан! Бегать по магазину — это целая проблема! Кяяя!
actors.mobs.npcs.shopkeeper.talk_caves=Ах, добро пожаловать обратно! Рады вас снова видеть! Пожалуйста, осмотритесь, прежде чем уйти.
actors.mobs.npcs.shopkeeper.talk_city=О, вы проделали такой долгий путь! Наверняка вам здесь что-то нужно.
actors.mobs.npcs.shopkeeper.talk_halls=О, здравствуйте! Это последний магазинчик. Если вам что-нибудь понадобится, лучше подготовиться заранее.
actors.mobs.npcs.shopkeeper.talk_ascent=Что вы вообще делали? Падают бомбы! Немедленно эвакуируйтесь!
actors.mobs.npcs.shopkeeper.desc=Я работаю неполный рабочий день в магазине Angel 24, расположенном в здании, где раньше находился офис Федерального бюро расследований. Поскольку там обычно тихо, я часто отлыниваю от работы.

actors.mobs.fox.fox.stats_desc=Члены отряда FOX невосприимчивы к негативным эффектам «Страх», «Ужас», «Безумие», «Целенаправленность» и «Сон», и не могут быть превращены в союзников. Члены отряда FOX держатся вместе и попытаются вернуться на свое первоначальное место появления, если не найдут врага.
actors.mobs.fox.yukino.name=Юкино
actors.mobs.fox.yukino.desc=Я — СИТИДО Юкино, студентка 3-го курса Специальной академии SRT и командир 1 отряда «Лисы».\nЮкино носит автомат.\nЮкино способна атаковать на большом расстоянии, а также может атаковать в непосредственной близости.
actors.mobs.fox.yukino.show=FOX 1, операция готова. Мы начнём.
actors.mobs.fox.yukino.hit=Телеканал FOX 1 подвергся нападению. Требуется поддержка.
actors.mobs.fox.yukino.die=...FOX 1, ...отступает.
actors.mobs.fox.yukino.kill=Оружие, утратившее свою полезность, следует выбросить.
actors.mobs.fox.yukino.aggro=FOX 1, впереди замечен противник. Ведется преследование.
actors.mobs.fox.niko.name=Нико
actors.mobs.fox.niko.desc=Это Йошино Нико, FOX 2 из отряда FOX, студентка 3-го курса Специальной академии SRT.\n\nНико одета в SG.\nНико может использовать только атаки ближнего боя.\nНико обладает высокой точностью и уроном от атак.\nНико может двигаться очень быстро.\nУ Нико относительно низкий уровень здоровья.
actors.mobs.fox.niko.show=Выход на канал FOX 2.
actors.mobs.fox.niko.hit=О боже, это действительно так опасно, как я слышала. Придётся быть осторожнее...
actors.mobs.fox.niko.die=Операция... Неудачная...
actors.mobs.fox.niko.kill=FOX 2, миссия выполнена.
actors.mobs.fox.niko.aggro=Телеканал FOX 2 обнаружил врага.
actors.mobs.fox.kurumi.name=Куруми
actors.mobs.fox.kurumi.desc=Это Такакура Куруми, лисица 3-го класса отряда «Лисы», студентка 3-го курса Специальной академии SRT.\n\nКуруми вооружена пистолетом-пулеметом, но, судя по всему, она из него не стреляет.\nКуруми способна только к атакам ближнего боя.\nУ Куруми низкая уклоняемость и низкий урон от атак.\nУ Куруми относительно высокий уровень здоровья и защиты.
actors.mobs.fox.kurumi.show=FOX 3, вперёд!
actors.mobs.fox.kurumi.hit=Значит, вы действительно собираетесь попробовать!
actors.mobs.fox.kurumi.die=Как... такое могло случиться...
actors.mobs.fox.kurumi.kill=Вы хоть немного осознавали мощь спецназа?
actors.mobs.fox.kurumi.aggro=Телеканал FOX 3 обнаружил врага! Сюда!
actors.mobs.fox.otogi.name=Автоги
actors.mobs.fox.otogi.desc=Это Тэндзиньяма Отоги, FOX 4 из отряда FOX, студент 3-го курса Специальной академии SRT.\n\nОтоги экипирован _SR_.\nОтоги может совершать только _дальние атаки_.\nОтоги обладает высокой _точностью_ и _уроном_ от атак.\nОтоги имеет относительно низкий _HP_.
actors.mobs.fox.otogi.show=FOX 4, вход.
actors.mobs.fox.otogi.hit=Уф, на меня напали! Запрашиваю подкрепление!
actors.mobs.fox.otogi.die=Полагаю, мне придётся пока отступить...
actors.mobs.fox.otogi.kill=Команда FOX одержала победу! Ура!
actors.mobs.fox.otogi.aggro=FOX 4, Враг там!

###buffs
actors.buffs.armorbreak.name=Сокращение оборонных расходов
actors.buffs.armorbreak.desc=Защита этой цели снижена, поэтому она получает больше физического урона.\n\nСнижение защиты: %1$d.\nОсталось ходов: %2$s.

actors.hero.talent$instantfocusingtracker.name=Кратковременная концентрация
actors.hero.talent$instantfocusingtracker.desc=Ваша следующая обычная рукопашная атака получает бонус к шансу попадания.\n\nОсталось ходов: %s.

actors.buffs.swiftmovement.action_name=Быстрое движение

actors.buffs.bankrobber.action_name=Массовая стрельба

actors.hero.talent$firstaidcooldown.name=Охлаждение: Первая помощь
actors.hero.talent$firstaidcooldown.desc=Вы недавно использовали эту способность, поэтому вам нужно время, чтобы использовать её снова.\n\nОсталось ходов: %s.

actors.hero.talent$perfectprecisiontracker.name=Идеальная точность
actors.hero.talent$perfectprecisiontracker.desc=Следующая атака пулей получает дополнительный шанс попадания.\n\nОсталось ходов: .%s

actors.buffs.doublebarrelmark.name=Двустволка
actors.buffs.doublebarrelmark.desc=Я сосредоточен на враге, которого только что подстрелил. При желании вы можете быстро вытащить пистолет из кобуры и выстрелить, но это не нанесет обычного урона.\n\nПеред выстрелом убедитесь, что в магазине остались патроны.
actors.buffs.doublebarrelmark.action_name=Используйте дополнительное оружие!

actors.buffs.conversation.action_name=Болтовня
actors.buffs.conversation.prompt=Выберите собеседника.

actors.buffs.snipe.action_name=Бинокулярная разведка
actors.buffs.snipe.prompt=Выберите место для разведки.
actors.buffs.snipe$scopedarea.name=Бинокулярная разведка
actors.buffs.snipe$scopedarea.desc=...Ах, я сосредоточен...\n\nСейчас я внимательно слежу за этим местом. Если замечу там врага, смогу очень точно выстрелить... и попасть в него, избегая препятствий.\n\nТеперь я смогу видеть примерно на _%sоборотов дальше...

actors.buffs.questenemy.name=Цель задания
actors.buffs.questenemy.desc=Этот враг назначен целью задания Юза, и за его победу вы получите двойные очки опыта и дополнительное золото.
actors.buffs.questenemy.warn=Похоже, целевой враг для выполнения задания где-то появился.

actors.buffs.yuzustatus$uzqmode.name=режим UZQ
actors.buffs.yuzustatus$uzqmode.desc=...\n\n(Похоже, он находится в состоянии крайней концентрации. Он определённо сможет уклониться от _%s_следующей атаки.)
actors.buffs.yuzustatus$certaincritbuff.name=Гарантированный критический удар
actors.buffs.yuzustatus$certaincritbuff.desc=Сейчас удача здесь ни при чём!\n\nСледующая атака_%s_ определённо станет смертельным ударом.

actors.buffs.avantgardekunbuff.action_onboard=Авангардный армейский абордаж!
actors.buffs.avantgardekunbuff.action_name=Авангардное манипулирование армией
actors.buffs.avantgardekunbuff.prompt=Пожалуйста, выберите местоположение.
actors.buffs.avantgardekunbuff$onboard.name=Авангардный армейский абордаж!
actors.buffs.avantgardekunbuff$onboard.desc=Уф... Никогда не думал, что буду управлять таким роботом... Ах, управление написано здесь.\n\nИспользование способности на _дальней дистанции_ позволяет произвести до 3 выстрелов одновременно из вашего экипированного оружия в этом месте.\nИспользование способности на _ближней дистанции_ оттолкнет врагов и перезарядит все ваше экипированное оружие.\nИспользование способности в _моем текущем местоположении_ позволяет слезть с робота.\n\nВ интерфейсе текущего состояния отображается моя текущая прочность как _%1$d/%2$d_.
actors.buffs.avantgardekunbuff$robotcooldown.name=Время восстановления: Авангардная армия
actors.buffs.avantgardekunbuff$robotcooldown.desc=Робот взорвался, поэтому нам придётся подождать, пока его можно будет снова использовать.\n\nРобот будет готов через _%s_ ходов.

actors.hero.talent$safetytriggercooldown.name=Время охлаждения при повторном использовании: защитное устройство
actors.hero.talent$safetytriggercooldown.desc=Вы недавно использовали эту способность, поэтому вам нужно время, чтобы использовать её снова.\n\nОсталось ходов: %s.

###Yuzu shop contents
actors.hero.shops.yuzushopcontent.credit_cost=Потрачено кредитов: _ %dКредит_

actors.hero.shops.randomconsumable.name=Случайная коробка
actors.hero.shops.randomconsumable.short_desc=Расходный материал
actors.hero.shops.randomconsumable.desc=Выбирает случайный расходный предмет.

actors.hero.shops.randomequipment.name=Выдача оборудования
actors.hero.shops.randomequipment.short_desc=Оружие, розыгрыш школьной формы
actors.hero.shops.randomequipment.desc=Выберите один из следующих вариантов: случайное оружие или школьную форму.

actors.hero.shops.sellitem.name=Утилизация
actors.hero.shops.sellitem.short_desc=Продажа товаров
actors.hero.shops.sellitem.desc=Продает все товары, находящиеся в текущем местоположении.
actors.hero.shops.sellitem.desc_value=Продайте все товары в текущем местоположении, чтобы заработать _ %dКредиты _.

actors.hero.shops.buycritchance.name=Повышена вероятность критического удара.
actors.hero.shops.buycritchance.short_desc=Шанс критического удара +%s%%
actors.hero.shops.buycritchance.desc=Повышает вероятность+%1$s%% критического попадания. Макс +%2$s%%\nТекущая вероятность критического удара: %3$s%%_+%4$s%%_

actors.hero.shops.buycritdmgmulti.name=Увеличен урон от критических попаданий
actors.hero.shops.buycritdmgmulti.short_desc=Урон от критического удара +%s%%
actors.hero.shops.buycritdmgmulti.desc=Увеличивает урон от критических ударов на +.%1$s%% Максимальный +%2$s%% текущий множитель урона от критических ударов:%3$s%% _+%4$s%%_

actors.hero.shops.buycreditmulti.name=Увеличение объемов привлечения кредитов
actors.hero.shops.buycreditmulti.short_desc=Начисленные кредиты +%s%%
actors.hero.shops.buycreditmulti.desc=Увеличивает прирост кредитного рейтинга на +%1$s%%. Максимальный +%2$s%% текущий множитель прироста кредитного рейтинга:%3$s%% _+%4$s%%_

actors.hero.shops.buydropmulti.name=Увеличена вероятность выпадения предметов.
actors.hero.shops.buydropmulti.short_desc=Вероятность выпадения предметов +%s%%
actors.hero.shops.buydropmulti.desc=Увеличивает вероятность выпадения предметов на +%1$s%%. Максимальный %2$s%%+ текущий множитель вероятности выпадения предметов: %3$s%%_+%4$s%%_

actors.hero.shops.buysearchchance.name=Повышена вероятность автоматического поиска
actors.hero.shops.buysearchchance.short_desc=Автоматическая вероятность поиска +%s%%
actors.hero.shops.buysearchchance.desc=Повышает вероятность обнаружения +%1$s%% скрытых предметов. Макс +%2$s%%\nТекущий бонус к вероятности автоматического поиска: _+%3$s%%_

actors.hero.shops.paytowin.name=Плати, чтобы выиграть
actors.hero.shops.paytowin.short_desc=Шанс критического попадания следующей атаки 100%, урон от критического попадания +20%.
actors.hero.shops.paytowin.desc=Увеличивает количество гарантированных критических попаданий на 1 и увеличивает критический урон следующего критического попадания на +20%. Этот эффект не суммируется.

actors.hero.shops.questtracker.name=Отслеживание местоположения
actors.hero.shops.questtracker.short_desc=Найдите врага, являющегося целью задания.
actors.hero.shops.questtracker.desc=В течение 10 ходов отображает местоположение целевых врагов задания на текущем этаже.
actors.hero.shops.questtracker.no_quest=Похоже, целей для выполнения задания нет.

actors.hero.shops.buycontinueconsole.name=Продолжить работу консоли
actors.hero.shops.buycontinueconsole.short_desc=Продолжить покупку консоли
actors.hero.shops.buycontinueconsole.desc=Вы получаете одну _Консоль продолжения_, которая позволяет продолжить игру, в которую вы играли.

actors.hero.shops.buyfighterconsole.name=Консоль истребителя
actors.hero.shops.buyfighterconsole.short_desc=Покупка консоли истребителя
actors.hero.shops.buyfighterconsole.desc=Получите 10 жетонов «Консоль бойца» и одну «Консоль бойца», которая открывает экран управления игрой «Боец».

actors.hero.shops.buyfantasyconsole.name=Фантастическая консоль
actors.hero.shops.buyfantasyconsole.short_desc=Фантастическая покупка консоли
actors.hero.shops.buyfantasyconsole.desc=Получите 10 жетонов Fantasy Console и одну консоль Fantasy Console, которая открывает экран управления для фэнтези-игр.

actors.hero.shops.buysandboxconsole.name=Песочница-консоль
actors.hero.shops.buysandboxconsole.short_desc=Покупка консоли-песочницы
actors.hero.shops.buysandboxconsole.desc=Получите 10 жетонов «Консоль песочницы» и одну «Консоль песочницы», которая открывает экран управления для игр в режиме песочницы.

actors.hero.shops.invulnerable.name=Активировать щит
actors.hero.shops.invulnerable.short_desc=Получите большое количество щита
actors.hero.shops.invulnerable.desc=Мгновенно получите щит _%d_. Можно приобрести только один раз за использование способности VIP-членства.

actors.hero.shops.infiniteammo.name=Бесконечный боезапас
actors.hero.shops.infiniteammo.short_desc=Не употребляйте патроны в течение короткого времени.
actors.hero.shops.infiniteammo.desc=Мгновенно получите _%d_ ходов бесконечного боеприпаса. Многократная покупка не суммирует длительность действия и обновляет эффект.
actors.hero.shops.infiniteammo$infiniteammobuff.name=Бесконечный боезапас
actors.hero.shops.infiniteammo$infiniteammobuff.desc=Теперь вы можете стрелять из своего оружия, не расходуя патроны в течение короткого времени!\n\nОсталось ходов: _%s_.

actors.hero.shops.creditduplicate.name=Конвертация кредита
actors.hero.shops.creditduplicate.short_desc=Превратите VIP-членство в кредит.
actors.hero.shops.creditduplicate.desc=Немедленно аннулируйте свое VIP-членство и получите _%d_ кредитов.

###Yuzu Console Contents
actors.hero.console.yuzuconsolecontent.prompt=Пожалуйста, выберите местоположение.

actors.hero.console.fighter.fighterconsolecontent$fighterconsolebuff.name=Консоль истребителя
actors.hero.console.fighter.fighterconsolecontent$fighterconsolebuff.desc=У вас осталось _%d_ жетонов для боевой консоли.\n\nВы можете использовать игровую консоль, чтобы использовать новую консоль, или использовать кнопку «Продолжить использование консоли», чтобы снова использовать боевую консоль, сохранив при этом свои жетоны.

actors.hero.console.fantasy.fantasyconsolecontent$fantasyconsolebuff.name=Фантастическая консоль
actors.hero.console.fantasy.fantasyconsolecontent$fantasyconsolebuff.desc=У вас осталось _%d_ жетонов Fantasy Console.\n\nВы можете использовать игровую консоль, чтобы использовать новую консоль, или использовать кнопку «Продолжить использование консоли», чтобы снова использовать Fantasy Console, сохранив при этом свои жетоны.

actors.hero.console.sandbox.sandboxconsolecontent$sandboxconsolebuff.name=Песочница-консоль
actors.hero.console.sandbox.sandboxconsolecontent$sandboxconsolebuff.desc=У вас осталось _%d_ токенов для консоли песочницы.\n\nВы можете использовать игровую консоль, чтобы использовать новую консоль, или использовать кнопку «Продолжить использование консоли», чтобы снова использовать консоль песочницы, сохранив при этом свои токены.

actors.hero.console.yuzuconsolecontent.token_cost=Используемый токен: _%d_

actors.hero.console.fighter.moveup.name=Желудок
actors.hero.console.fighter.moveup.desc=Переместитесь на 1 клетку вверх. Расходует _33%_ ходов, затраченных на перемещение.
actors.hero.console.fighter.moveup.desc_enhanced=Переместитесь на 1 клетку вверх. _Не расходует ход._

actors.hero.console.fighter.movedown.name=Под
actors.hero.console.fighter.movedown.desc=Переместитесь на 1 клетку вниз. Затратит _33%_ ходов, затраченных на перемещение.
actors.hero.console.fighter.movedown.desc_enhanced=Переместитесь на 1 клетку вниз. _Не расходует ход._

actors.hero.console.fighter.moveleft.name=Левый
actors.hero.console.fighter.moveleft.desc=Переместитесь на 1 клетку влево. Затратит _33%_ ходов, затраченных на перемещение.
actors.hero.console.fighter.moveleft.desc_enhanced=Переместитесь на 1 клетку влево. Это не отнимает ход.

actors.hero.console.fighter.moveright.name=Верно
actors.hero.console.fighter.moveright.desc=Переместитесь на 1 клетку вправо. Затратит _33%_ ходов, затраченных на перемещение.
actors.hero.console.fighter.moveright.desc_enhanced=Переместитесь на 1 клетку вправо. Это не отнимает ход.

actors.hero.console.fighter.charge.name=Накопление энергии
actors.hero.console.fighter.charge.desc=Для улучшения следующей нажимаемой кнопки требуется 1 ход.
actors.hero.console.fighter.charge.desc_enhanced=Потратьте 1 ход, чтобы _улучшить следующую кнопку и получить 1 дополнительный жетон._

actors.hero.console.fighter.weakattack.name=Слабая атака
actors.hero.console.fighter.weakattack.desc=Потратьте 0,5 хода, нанеся _50%_ урона случайному ближайшему врагу. Улучшите кнопку следующей атаки.
actors.hero.console.fighter.weakattack.desc_enhanced=Потратьте 0,5 хода, нанеся _100%_ урона случайному ближайшему врагу. Улучшите кнопку следующей атаки.

actors.hero.console.fighter.strongattack.name=Сильная атака
actors.hero.console.fighter.strongattack.desc=Потратьте 1 ход на нанесение 150% урона ближайшему врагу.
actors.hero.console.fighter.strongattack.desc_enhanced=Потратьте 1 ход на нанесение 150% урона ближайшему врагу и отбрасывание его на 3 клетки назад.

actors.hero.console.fantasy.fireball.name=Огненный шар
actors.hero.console.fantasy.fireball.desc=Запускает огненный шар в указанное место, нанося 100% урона огнем в области в радиусе 1 клетки и поджигая её.
actors.hero.console.fantasy.fireball.desc_enhanced=Запускает огненный шар в указанное место, нанося 100% урона огнем в области в радиусе 3 клеток и поджигая её.

actors.hero.console.fantasy.hydropump.name=Гидронасос
actors.hero.console.fantasy.hydropump.desc=Взорвите воду в указанном месте в пределах прямой видимости, нанеся 50% урона от воды врагам в этом месте, отбросив ближайших врагов и разбрызгав воду.\nПри использовании на пустом колодце...
actors.hero.console.fantasy.hydropump.desc_enhanced=Взорвите воду в указанном месте в пределах прямой видимости, нанеся 50% урона от воды врагам в этом месте, отбросив ближайших врагов и разбрызгав воду.\nПри использовании на пустом колодце...

actors.hero.console.fantasy.thunder.name=Громовой удар
actors.hero.console.fantasy.thunder.desc=Поражает местоположение противника, нанося 40% электрического урона и активируя Цепную молнию 3 раза, нанося 16% урона ближайшим врагам.\nЕсли цель находится на водной клетке, максимальное расстояние, на которое распространяется Цепная молния, увеличивается до 2 клеток.
actors.hero.console.fantasy.thunder.desc_enhanced=Поражает цель, нанося 40% электрического урона и генерируя 5 цепных молний, ​​которые наносят 16% урона ближайшим врагам.\nЕсли цель находится на водной клетке, максимальное расстояние, на которое распространяется действие цепной молнии, увеличивается до 2 клеток.

actors.hero.console.fantasy.icelance.name=Ледяное копье
actors.hero.console.fantasy.icelance.desc=Метает ледяное копье в указанное место, нанося _200%_ урона от льда и замораживая врагов.
actors.hero.console.fantasy.icelance.desc_enhanced=Метает ледяное копье в указанное место, нанося _400%_ урона льдом и замораживая врагов.

actors.hero.console.fantasy.blackhole.name=Черная дыра
actors.hero.console.fantasy.blackhole.desc=Переносит все цели в радиусе 3 клеток от указанного места на следующий этаж через 1 ход. Вы также можете упасть.\nНе может быть использовано на этажах с боссами.
actors.hero.console.fantasy.blackhole.desc_enhanced=Переносит все цели в радиусе 3 клеток от указанного места на следующий этаж через 1 ход. _Получает 2 хода эффекта «Парение» при применении._\nНе может быть использовано на этажах с боссами.

actors.hero.console.sandbox.farming.name=Сельское хозяйство
actors.hero.console.sandbox.farming.desc=Превратите пустые клетки в клетки с водой, а клетки с водой — в клетки с высокой травой.

actors.hero.console.sandbox.barricadebuild.name=Строительство препятствий
actors.hero.console.sandbox.barricadebuild.desc=Постройте статую на пустой клетке и баррикаду у ворот.

actors.hero.console.sandbox.bridgebuild.name=Строительство моста
actors.hero.console.sandbox.bridgebuild.desc=Постройте подвижную клетку на обрыве.

actors.hero.console.sandbox.walldig.name=Снос стены
actors.hero.console.sandbox.walldig.desc=Разрушает твердые плитки.\nНе может использоваться на этажах с боссами.

actors.hero.console.sandbox.welldig.name=Копание колодца
actors.hero.console.sandbox.welldig.desc=Постройте пустой колодец на пустой клетке. Для чего он нужен?

actors.buffs.chasemark.name=Отслеживание цели
actors.buffs.chasemark.desc=Ах, мой господин! Изуна прямо сейчас выслеживает врага! Она идеально предсказывает, где находится враг, которого я недавно поразил метательным оружием!\nЯ могу подойти и атаковать его прямо сейчас, но через некоторое время я больше не смогу преследовать врага.\n\nЯ смогу преследовать и атаковать врага напрямую до следующего _%sхода_.
actors.buffs.chasemark.action_name=Смахните это!
actors.buffs.chasemark.no_target=Стирать нечего.

actors.hero.talent$instantthrowtracker.name=Внезапное нападение
actors.hero.talent$instantthrowtracker.desc=Изуна нашла лазейку! Броски не отнимают ход в течение короткого времени.

actors.hero.talent$instantthrowcooldown.name=Перезарядка: Внезапная атака
actors.hero.talent$instantthrowcooldown.desc=Вы недавно использовали эту способность, поэтому вам нужно подождать, пока вы сможете использовать её снова.\n\nОсталось ходов: _%s._

actors.mobs.npcs.sandbag.name=Боксерская груша
actors.mobs.npcs.sandbag.desc=Это мешок с песком, который не порвётся, как бы сильно вы по нему ни били. При атаке вы можете видеть нанесённый ущерб.
actors.mobs.npcs.sandbag.damage=Урон, нанесенный этой атакой:%s

actors.mobs.gnollsapper.desc=Небольшие и слабые, но при этом умные гноллы обладают светлой шерстью и носят сумки, наполненные различными инструментами. Вероятно, они прибыли сюда, чтобы помогать в добыче и исследовании голубого камня, и находятся под защитой ближайших охранников. Хотя они способны сражаться, их атаки не сильнее, чем у гноллов-разведчиков.\n\nВместо прямого боя сапёры предпочитают использовать свои различные инструменты, чтобы заставлять скалистую местность наносить им удары. Однако, поскольку они не могут напрямую использовать магию телепортации на Землю, они, скорее всего, будут использовать свои инструменты безрассудно. Вероятно, найдётся способ обратить их атаки против них самих или против их охранников.

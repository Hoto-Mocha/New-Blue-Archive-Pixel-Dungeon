### new challenges
challenges.chaotic_scent=Запах хаоса
challenges.chaotic_scent_desc=Откуда-то доносится странный запах...\n\n- Выпускает вредный газ в местах нахождения врагов примерно каждые _30_ ходов.\n- Газ может быть выпущен только тогда, когда враги находятся поблизости.\n- Эффект этого амулета не активируется, даже если у вас есть _Благовоние Хаоса_.
challenges.angry_enemies=Разъяренные враги
challenges.angry_enemies_desc=Всё, что нарушает сладкий сон, неизбежно раздражает! Если это про вас, стрелы ярости, естественно, будут направлены на вас...\n\n- Получаете _10 ходов_ адреналина, когда враг просыпается.\n- _Магический сон_ не применяется.
challenges.nutrition_lack=Недоедание
challenges.nutrition_lack_desc=Раны плохо заживают при недостатке питательных веществ.\n\n— Если вы получили физические повреждения во время голодания, существует вероятность возникновения _слабого кровотечения_.\n— Это кровотечение можно немедленно остановить с помощью _приема пищи_.
challenges.no_healing_desc=Лечебные зелья очень удобны, но, к сожалению, у вас аллергия на лечебные зелья!\n\n- Лечебные зелья, предметы, изготовленные из лечебных зелий, и подсолнух действуют как яды, а не лечат игрока.\n- Нестабильные смеси не могут случайным образом лечить учеников или действовать как яды.\n- Эти предметы по-прежнему действуют так же на других персонажей.
challenges.champion_enemies_desc=Вы не единственный, кто может повышать уровень!\n\nОбычные враги появляются с вероятностью получения особого усиления. Вероятность начинается с 1/8 на 1-м этаже, постепенно увеличивается и становится 1/6 на 21-м этаже.\n- Улучшенные сущности появляются, пока находятся в бодрствующем состоянии.\n- Ученики могут обнаружить появление улучшенных сущностей.\n- Улучшенные сущности не становятся союзниками.\n\nСуществует 6 типов улучшенных сущностей.\n_Усиленная сущность «Горение» (оранжевая):_ Урон от атаки ближнего боя +25%, поджигает цель при атаке, невосприимчива к огню и распространяет огонь по окружающим клеткам, кроме воды, после смерти.\n_Усиленная сущность «Дальность» (фиолетовая):_ Урон от атаки ближнего боя +25%, увеличивает дальность атаки ближнего боя на 3 клетки.\n_Усиленная сущность «Антимагиция» (зеленая):_ Получаемый урон -50%, невосприимчива ко всем магическим эффектам.\n\n_Усиленное гигантское существо (синее):_ Получаемый урон снижен на -80%, дальность атаки ближнего боя увеличена на +1 клетку, но не может проходить через узкие проходы.\n_Усиленное благословенное существо (желтое):_ Точность и уклонение увеличены в 4 раза.\n_Усиленное растущее существо (красное):_ Точность, уклонение, сила атаки, максимальное количество HP +20%, эффекты увеличиваются на 1% каждые 4 хода.

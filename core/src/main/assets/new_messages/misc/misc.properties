### new challenges
challenges.chaotic_scent=Chaotic Scent
challenges.chaotic_scent_desc=A disorienting scent drifts from somewhere...\n\n- Erupts harmful gas at enemy locations roughly every _30_ turns.\n- Gas only erupts when enemies are nearby.\n- Even if you possess the _Chaotic Censer_, the trinket's effects will not trigger.
challenges.angry_enemies=Hostile Awakening
challenges.angry_enemies_desc=Disturbing a sweet slumber is always irritating! And since it was you, their wrath is naturally directed right at you...\n\n- Enemies gain _10 turns_ of Adrenaline upon waking up.\n- Does not apply to _magical sleep_.
challenges.nutrition_lack=Malnutrition
challenges.nutrition_lack_desc=When you're running low on nutrients, wounds just don't heal properly.\n\n- Taking physical damage while starving has a chance to cause _minor bleeding_.\n- This bleeding damage can be cured immediately by _eating food_.
challenges.no_healing_desc=Potions of healing are quite convenient, but unfortunately, you're allergic to them!\n\n- Potions of healing, items crafted from them, and sungrass will poison the player instead of healing.\n- Unstable brews will not randomly heal students or act as a poison.\n- These items still function normally on other creatures.
challenges.champion_enemies_desc=You aren't the only one who can level up!\n\nRegular enemies have a chance to spawn with special champion buffs, starting at a 1/8 chance on floor 1 and gradually increasing to 1/6 on floor 21.\n- Champions always spawn awake.\n- Students can sense when a champion appears.\n- Champions cannot become allies.\n\nThere are 6 types of champions:\n_Blazing Champion (Orange):_ +25% melee damage, ignites targets on hit, immune to fire, spreads flames across surrounding dry tiles upon defeat.\n_Projecting Champion (Purple):_ +25% melee damage, melee attack range increased by 3 tiles.\n_Anti-Magic Champion (Green):_ -50% damage taken, immune to all magical effects.\n_Giant Champion (Blue):_ -80% damage taken, +1 melee attack range, but cannot pass through narrow corridors.\n_Blessed Champion (Yellow):_ 4x increased accuracy and evasion.\n_Growing Champion (Red):_ +20% accuracy, evasion, attack power, and max health; effects increase by 1% every 4 turns.

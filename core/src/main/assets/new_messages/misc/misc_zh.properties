### new challenges
challenges.chaotic_scent=혼돈의 향기
challenges.chaotic_scent_desc=어디선가 혼란스러운 향기가 풍겨옵니다...\n\n- 대략 _30_턴마다 적이 있는 위치에 해로운 가스를 분출합니다.\n- 가스는 적들이 주변에 있을 때만 분출할 수 있습니다.\n- _혼돈의 향로_를 가지고 있어도 해당 장신구의 효과는 발동하지 않습니다.
challenges.angry_enemies=분노한 적들
challenges.angry_enemies_desc=달콤한 잠을 방해하는 건 뭐든지 짜증나는 법이죠! 그게 당신이라면 분노의 화살은 당연히 당신에게 향할 것입니다...\n\n- 적이 잠에서 깨어날 때 _10턴_의 아드레날린을 얻습니다.\n- _마법의 수면_은 해당하지 않습니다.
challenges.nutrition_lack=영양 부족
challenges.nutrition_lack_desc=영양분이 부족하면 상처도 잘 낫지 않는 법입니다.\n\n- 굶주림 상태에서 물리 피해를 받으면 확률적으로 _약한 출혈_이 발생합니다.\n- 이 출혈 피해는 _식사_로 즉시 해제할 수 있습니다.
challenges.no_healing_desc=치유 물약은 정말 편리합니다만, 불행히도 치유 물약 알러지가 있군요!\n\n- 치유 물약, 그리고 치유 물약으로 만드는 아이템들, 그리고 태양과가 플레이어를 치유하는 대신 독성으로 작용합니다.\n- 불안정한 혼합물은 무작위로 학생을 치료하거나 독성으로 작용할 수 없습니다.\n- 여전히 이 아이템들은 다른 캐릭터들에게는 동일하게 작용합니다.
challenges.champion_enemies_desc=당신만 레벨 업을 할 수 있는 게 아닙니다!\n\n보통 적들이 확률적으로 특별한 강화 개체 버프를 얻은 채 등장하며, 확률은 1층에서 1/8로 시작해 점진적으로 증가하다가 21층에서 1/6이 됩니다.\n- 강화 개체는 깨어 있는 상태로 등장합니다.\n- 학생은 강화 개체의 등장을 알 수 있습니다.\n- 강화 개체는 아군이 되지 않습니다.\n\n강화 개체에는 6가지의 종류가 있습니다.\n_불타는 강화 개체 (주황색):_ 근접 공격 데미지 +25%, 공격 시 대상에게 불을 붙이며, 불에 면역이고, 죽을 때 물 위를 제외한 주변 타일에 불을 흩뿌립니다.\n_도달의 강화 개체 (보라색):_ 근접 공격 데미지 +25%, 근접 공격 범위가 3타일 증가합니다.\n_항마의 강화 개체 (초록색):_ 받는 데미지 -50%, 모든 마법 효과에 대해 면역입니다.\n_거대한 강화 개체 (파란색):_ 받는 데미지-80%, 근접 공격 범위가 +1 타일 증가하지만, 좁은 통로를 지날 수 없습니다.\n_축복받은 강화 개체 (노란색):_ 정확성 및 회피가 4배 증가합니다.\n_성장하는 강화 개체 (붉은색):_ 정확성, 회피, 공격력, 최대 체력 +20%, 4턴마다 효과가 1%씩 증가합니다.
